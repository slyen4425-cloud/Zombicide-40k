name: Deploy Zombicide 40K

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer le site
        run: |
          rm -rf _site
          mkdir -p _site

          unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site

          echo "=== REMPLACEMENT PAR LES FICHIERS ACTUELS ==="

          cp -f index.html _site/index.html
          cp -f manifest.webmanifest _site/manifest.webmanifest
          cp -f service-worker.js _site/service-worker.js

          mkdir -p _site/icons
          cp -f icon-192.png _site/icons/icon-192.png
          cp -f icon-512.png _site/icons/icon-512.png

          echo "=== INDEX RACINE ==="
          grep -o "Version [^<]*" index.html | head -1 || true

          echo "=== INDEX QUI SERA PUBLIE ==="
          grep -o "Version [^<]*" _site/index.html | head -1 || true

          echo "=== SITE PRET ==="

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Publier GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
