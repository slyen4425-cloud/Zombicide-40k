name: Diagnose exact Dungeon traps
on:
  push:
    branches:
      - work/dungeon-exact-trap-fix-2026-09-05
jobs:
  diag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dungeon-exact-trap-fix-2026-09-05
      - name: Inspect exact trap scene paths
        run: |
          echo '=== trap definitions ==='
          sed -n '24905,24940p' index.html
          echo '=== tactical map scene marker renderer ==='
          sed -n '35170,35220p' index.html
          echo '=== current tactical handleCell ==='
          sed -n '39635,39670p' index.html
          echo '=== later scene trap authority ==='
          sed -n '40165,40225p' index.html
          echo '=== detected trap rendering ==='
          sed -n '40790,40820p' index.html
          echo '=== scene trap movement hooks ==='
          sed -n '41145,41210p' index.html
