name: GenSrpG Phase 9 Capture seed retirement one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-dungeon-style-retirement-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-seed-retirement-oneshot.yml'

permissions:
  contents: write

jobs:
  retire-seed-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(wc -c < index.html)" = "8167138"
          test "$(git hash-object index.html)" = "09b1e19c04777da82fd0ad355adc7eb82532db29"

      - name: Apply exact Monster Capture seed seam
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='id="builtinMonsterCapture162"'
          start=s.find(marker)
          assert start>0, "builtinMonsterCapture162 missing"
          end=s.find("</script>",start)
          assert end>start, "builtinMonsterCapture162 end missing"
          block=s[start:end]
          old='"gameStyle":"dungeon",'
          assert block.count(old)==2, f"expected 2 seed/factory occurrences, got {block.count(old)}"
          block2=block.replace(old,"")
          assert '"gameStyle":"dungeon"' not in block2
          assert 'const MC162_ID="gp_mt7ker7t_m2iw9"' in block2
          assert 'name":"Monster Capture"' in block2
          assert 'controllableCreatures":true' in block2
          p.write_text(s[:start]+block2+s[end:],encoding="utf-8")
          PY

      - name: Repin exact runtime fingerprints
        run: |
          python - <<'PY'
          from pathlib import Path
          old_blob="09b1e19c04777da82fd0ad355adc7eb82532db29"
          new_blob="4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          old_size="8167138"
          new_size="8167094"
          changed=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))
          for p in [
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
          ]:
              if not p.exists(): continue
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))
          print("repinned",len(changed),"files")
          for x in changed: print(x)
          PY

      - name: Verify exact runtime result
        run: |
          test "$(wc -c < index.html)" = "8167094"
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.find('id="builtinMonsterCapture162"')
          end=s.find("</script>",start)
          b=s[start:end]
          assert '"gameStyle":"dungeon"' not in b
          assert 'const MC162_ID="gp_mt7ker7t_m2iw9"' in b
          assert 'name":"Monster Capture"' in b
          assert 'controllableCreatures":true' in b
          PY

      - name: Run dedicated Phase 9 contracts
        run: |
          node tests/gens_phase9_capture_seed_dungeon_style_retirement_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_identity_coupling_preaudit_v1.test.cjs
          node tests/gens_phase9_capture_public_entry_ownership_preaudit_v1.test.cjs

      - name: Remove one-shot transport
        run: rm .github/workflows/gensrpg-phase9-capture-seed-retirement-oneshot.yml

      - name: Verify diff scope
        run: |
          git diff --check
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          git status --short

      - name: Commit GREEN candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(phase9): retire Dungeon style from Capture seed"
          git push origin "HEAD:$GITHUB_REF_NAME"
