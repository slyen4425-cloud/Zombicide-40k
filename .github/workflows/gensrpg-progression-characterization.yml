name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-3-2026-09-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core053-fallback-one-shot:
    if: github.ref == 'refs/heads/work/gensrpg-combat-callsite-migration-3-2026-09-16' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-combat-callsite-migration-3-2026-09-16
          fetch-depth: 0

      - name: Prove Core 0.53 Bridge fallback test is red before migration
        run: |
          if node tests/gens_core053_bridge_fallback_lot3.test.cjs; then
            echo 'Expected Core 0.53 Bridge fallback test to fail before migration.'
            exit 1
          fi

      - name: Apply exact Core 0.53 fallback migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          start='<script id="dungeonCore053Stability">'
          if html.count(start)!=1:
            raise SystemExit(f'Core 0.53 marker count must be 1, got {html.count(start)}')
          a=html.index(start)
          b=html.find('</script>',a)
          if b<0:
            raise SystemExit('Core 0.53 closing script marker missing')
          block=html[a:b]
          if block.count('openDungeonCombatSetup')!=2:
            raise SystemExit(f'Core 0.53 must contain exactly 2 openDungeonCombatSetup occurrences, got {block.count("openDungeonCombatSetup")}')
          old='''if(typeof dc030EngageCombat==="function")dc030EngageCombat();\n        else if(typeof openDungeonCombatSetup==="function")openDungeonCombatSetup();'''
          new='''if(typeof dc030EngageCombat==="function")dc030EngageCombat();\n        else if(typeof window.GensRpgTacticalCombatV2Bridge?.requestCombat==="function")window.GensRpgTacticalCombatV2Bridge.requestCombat(window,{reason:"manual-setup",entry:"dc053MainActionFallback"});'''
          if block.count(old)!=1:
            raise SystemExit(f'Exact Core 0.53 fallback precondition failed: {block.count(old)} matches')
          newblock=block.replace(old,new)
          if 'openDungeonCombatSetup' in newblock:
            raise SystemExit('Core 0.53 still contains openDungeonCombatSetup after exact replacement')
          html=html[:a]+newblock+html[b:]
          index.write_text(html,encoding='utf-8')

          inv=Path('tests/gens_combat_callsite_inventory_v11411.test.cjs')
          text=inv.read_text(encoding='utf-8')
          oldinv='const expected={dc200StartCombat:13,openDungeonCombatSetup:13,launchCombat200:2,startCombat:6};'
          newinv='const expected={dc200StartCombat:13,openDungeonCombatSetup:11,launchCombat200:2,startCombat:6};'
          if text.count(oldinv)!=1:
            raise SystemExit('Combat inventory test precondition failed')
          inv.write_text(text.replace(oldinv,newinv),encoding='utf-8')

          doc=Path('docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md')
          text=doc.read_text(encoding='utf-8')
          oldrow='| `openDungeonCombatSetup` | 13 | ancien setup de combat, embuscade et bridges Core historiques ; 2 boutons UI natifs migrés et le Core 0.99 désactivé retiré |'
          newrow='| `openDungeonCombatSetup` | 11 | ancien setup de combat, embuscade et bridges Core historiques ; boutons UI migrés, Core 0.99 retiré et fallback Core 0.53 routé vers le Bridge |'
          if text.count(oldrow)!=1:
            raise SystemExit('Combat inventory documentation row precondition failed')
          text=text.replace(oldrow,newrow)
          marker='## Contrat cible déjà disponible\n'
          note='''## Migration validée — lot 3, fallback Core 0.53\n\nLe chemin normal du bouton principal reste `dc030EngageCombat()`. Uniquement si cette entrée historique est absente, le fallback de Core 0.53 appelle maintenant `GensRpgTacticalCombatV2Bridge.requestCombat(window,{reason:"manual-setup",entry:"dc053MainActionFallback"})`. Les gardes `combatOn53()` et `coreCanAct53()` restent en amont.\n\nAucun appel d'embuscade, wrapper `dc030`, définition native de `openDungeonCombatSetup` ou règle de mouvement n'est modifié dans ce lot.\n\n'''
          if marker not in text:
            raise SystemExit('Combat inventory insertion marker missing')
          doc.write_text(text.replace(marker,note+marker,1),encoding='utf-8')
          PY

      - name: Validate migrated fallback and protected normal path
        run: |
          node tests/gens_core053_bridge_fallback_lot3.test.cjs
          node tests/gens_combat_callsite_inventory_v11411.test.cjs
          node tests/gens_bridge_single_entry_contract_v11411.test.cjs
          node tests/gens_combat_authority_characterization_v11411.test.cjs

      - name: Commit exact Core 0.53 fallback migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/gens_combat_callsite_inventory_v11411.test.cjs docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md
          git diff --cached --check
          git commit -m 'refactor: route Core 0.53 fallback through Bridge'
          git push origin HEAD:work/gensrpg-combat-callsite-migration-3-2026-09-16

  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native manual XP runtime
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Characterize native progression and rewards
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Verify Tactical victory rewards summary
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Execute Tactical victory to Dungeon XP and loot
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Characterize manual level authority
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
