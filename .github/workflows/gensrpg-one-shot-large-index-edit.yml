name: GenSrpG one-shot large index edit

on:
  push:
    branches:
      - work/gensrpg-phase5-startconfiguredgame-capture131-retirement-2026-09-22

permissions:
  contents: write

jobs:
  retire-capture131-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Retire only captureFix131 startConfiguredGame wrapper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          source = path.read_text(encoding="utf-8")

          old = """const oldStartCfg=window.startConfiguredGame;
          if(oldStartCfg){
           window.startConfiguredGame=async function(){
             return await oldStartCfg.apply(this,arguments);
           };
          }
          """

          count = source.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one captureFix131 wrapper block, found {count}")

          source = source.replace(old, "", 1)

          if old in source:
              raise SystemExit("captureFix131 wrapper still present after edit")

          path.write_text(source, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gensrpg-one-shot-large-index-edit.yml
          git add index.html
          git commit -m "refactor: retire captureFix131 startConfiguredGame wrapper"
          git push origin HEAD:"$GITHUB_REF_NAME"
