name: GenSrpG Phase 5 Capture resume all Dungeon owners one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase5-capture-resume-routing-fix-2026-09-23'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict legacy Dungeon Resume owners and realign exact fingerprints
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object index.html)"
          test "$before" = "0aaafb2eaf42b7bce6520efa633b6b6a6ffbe92a"
          python3 - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          replacements=[
          (
          '''  const core=readCore100();
            const looksDungeon=Array.isArray(core.participants)&&core.participants.length>0;

            if(looksDungeon && window.DungeonCore01){''',
          '''  const core=readCore100();
            const looksDungeon=Array.isArray(core.participants)&&core.participants.length>0;
            const capture=typeof isCaptureContext138==="function"&&isCaptureContext138();
            const dungeon=typeof isDungeonMode==="function"&&isDungeonMode()&&!capture;

            if(dungeon&&looksDungeon && window.DungeonCore01){'''
          ),
          (
          '''  const dungeonSession=Array.isArray(runtime?.participants)&&runtime.participants.length>0;
            if((typeof hasActiveSession!=="function"||hasActiveSession())&&dungeonSession&&window.DungeonCore01){''',
          '''  const dungeonSession=Array.isArray(runtime?.participants)&&runtime.participants.length>0;
            const capture=typeof isCaptureContext138==="function"&&isCaptureContext138();
            const dungeon=typeof isDungeonMode==="function"&&isDungeonMode()&&!capture;
            if(dungeon&&(typeof hasActiveSession!=="function"||hasActiveSession())&&dungeonSession&&window.DungeonCore01){'''
          )
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f"unexpected resume-owner match count: {s.count(old)}")
              s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
          after="$(git hash-object index.html)"
          test "$after" = "ef8a0ac77019ed08f166a97389dd5bdf4a692841"

          python3 - <<'PY'
          from pathlib import Path
          old_blob="0aaafb2eaf42b7bce6520efa633b6b6a6ffbe92a"
          new_blob="ef8a0ac77019ed08f166a97389dd5bdf4a692841"
          old_size="8174315"
          new_size="8174649"

          # Active tests that deliberately lock the exact current index baseline.
          for p in Path("tests").glob("*.cjs"):
              s=p.read_text(encoding="utf-8")
              if old_blob not in s:
                  continue
              s=s.replace(old_blob,new_blob).replace(old_size,new_size)
              p.write_text(s,encoding="utf-8")

          # Current Phase 2 cartography fingerprints only; historical narrative docs are untouched.
          for name in [
              "GENSRPG_PHASE2_INLINE_OWNERS.json",
              "GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv",
              "GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json",
              "GENSRPG_PHASE2_STORAGE_OWNERS.json",
              "GENSRPG_PHASE2_TIMER_CLASSIFICATION.json",
          ]:
              p=Path("docs")/name
              s=p.read_text(encoding="utf-8")
              if old_blob not in s:
                  raise SystemExit(f"expected current fingerprint missing in {p}")
              p.write_text(s.replace(old_blob,new_blob),encoding="utf-8")
          PY

      - name: Commit restricted authority and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json
          git rm .github/workflows/gensrpg-phase5-capture-resume-all-owners-one-shot.yml
          git commit -m "fix: restrict legacy Dungeon Resume owners from Capture"
          git push origin HEAD:work/gensrpg-phase5-capture-resume-routing-fix-2026-09-23
