name: GenSrpG Phase5 S3 Capture provider one-shot

on:
  push:
    branches:
      - work/gensrpg-phase5-module-launch-s3-capture-provider-2026-09-24
    paths:
      - .github/workflows/gensrpg-phase5-apply-s3-capture-provider.yml

permissions:
  contents: write

jobs:
  apply-s3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact S3 RED branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Capture139-owned provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          OLD_SIZE=8171879
          OLD_BLOB="7601760f7a635094d4f687b725a639b5728e93b4"
          NEW_SIZE=8172204
          NEW_BLOB="6c95e3f6ca4bf8e34003776e7e43e44192aafb16"

          def git_blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()

          p=Path("index.html")
          raw=p.read_bytes()
          assert len(raw)==OLD_SIZE, len(raw)
          assert git_blob(raw)==OLD_BLOB, git_blob(raw)
          s=raw.decode("utf-8")
          assert 'GensShellModuleLaunchV1.register("capture"' not in s

          marker='''    },1200);
            }
          };

          /* Le Shell garde l’unique frontière globale goMenu.
          '''
          replacement='''    },1200);
            }
          };
          const gensCaptureStartConfiguredGame139V1=window.startConfiguredGame;
          const gensCaptureStartModuleSessionV1=async()=>{
            if(gensShellActiveModuleV1()!=="capture")return false;
            await gensCaptureStartConfiguredGame139V1();
            return true;
          };
          window.GensShellModuleLaunchV1.register("capture",gensCaptureStartModuleSessionV1);

          /* Le Shell garde l’unique frontière globale goMenu.
          '''
          assert s.count(marker)==1, s.count(marker)
          s=s.replace(marker,replacement,1)
          out=s.encode("utf-8")
          assert len(out)==NEW_SIZE, len(out)
          assert git_blob(out)==NEW_BLOB, git_blob(out)
          p.write_bytes(out)

          # Retarget exact-current-runtime sentinels/cartographies only.
          for path in Path("tests").glob("*.cjs"):
              text=path.read_text()
              if OLD_BLOB not in text:
                  continue
              text=text.replace(OLD_BLOB,NEW_BLOB)
              text=text.replace(str(OLD_SIZE),str(NEW_SIZE))
              path.write_text(text)

          for path in Path("docs").glob("GENSRPG_PHASE2_*"):
              if not path.is_file():
                  continue
              try:
                  text=path.read_text()
              except Exception:
                  continue
              if OLD_BLOB in text:
                  text=text.replace(OLD_BLOB,NEW_BLOB)
                  text=text.replace(str(OLD_SIZE),str(NEW_SIZE))
                  path.write_text(text)

          # S1 still forbids provider logic in every historical owner except
          # the explicitly approved Capture139 S3 owner.
          p1=Path("tests/gens_phase5_module_launch_s1_shell_registry_v1.test.cjs")
          t=p1.read_text()
          old="  assert.doesNotMatch(body,/GensShellModuleLaunchV1/,'S1 must not route a module through the new registry yet: '+id);"
          new="  if(id!=='captureFix139')assert.doesNotMatch(body,/GensShellModuleLaunchV1/,'historical owner must not host module-launch provider logic: '+id);"
          assert old in t
          p1.write_text(t.replace(old,new,1))

          # S2 remains a Survival invariant while later S3 may legitimately add Capture.
          p2=Path("tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs")
          t=p2.read_text()
          old="for(const id of ['capture','dungeon','pvp']){"
          new="for(const id of ['dungeon','pvp']){"
          assert old in t
          p2.write_text(t.replace(old,new,1))

          # The S3 preaudit becomes a post-raccord invariant after the RED/GREEN proof.
          p3=Path("tests/gens_phase5_module_launch_s3_capture_provider_preaudit_v1.test.cjs")
          t=p3.read_text()
          old='''assert.doesNotMatch(index,/GensShellModuleLaunchV1\.register\(["']capture["']/,
            'Capture provider must still be absent before S3 runtime raccord');'''
          new='''assert.equal((index.match(/GensShellModuleLaunchV1\.register\(["']capture["']/g)||[]).length,1,
            'Capture provider must be registered exactly once after S3 runtime raccord');'''
          assert old in t
          p3.write_text(t.replace(old,new,1))

          # Sanity: production launch route and historical wrappers are untouched.
          s=p.read_text()
          assert len(re.findall(r"window\.startConfiguredGame\s*=\s*async\s+function",s))==5
          assert len(re.findall(r"async\s+function\s+startConfiguredGame\s*\(\)",s))==1
          assert s.count('GensShellModuleLaunchV1.register("survival"')==1
          assert s.count('GensShellModuleLaunchV1.register("capture"')==1
          assert s.count('GensShellModuleLaunchV1.register("dungeon"')==0
          assert s.count('GensShellModuleLaunchV1.register("pvp"')==0
          PY

      - name: Prove S3 static contracts before commit
        shell: bash
        run: |
          node tests/gens_phase5_user_regression_rollback_guard_v1.test.cjs
          node tests/gens_phase2_inline_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_inline_global_last_owner_v11411.test.cjs
          node tests/gens_phase5_module_launch_contract_preaudit_v1.test.cjs
          node tests/gens_phase5_module_launch_raccord_runtime_preaudit_v1.test.cjs
          node tests/gens_phase5_module_launch_s1_shell_registry_v1.test.cjs
          node tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs
          node tests/gens_phase5_module_launch_s3_capture_provider_preaudit_v1.test.cjs
          node tests/gens_phase5_module_launch_s3_capture_provider_v1.test.cjs

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase5-apply-s3-capture-provider.yml

      - name: Commit exact S3 runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_* .github/workflows/gensrpg-phase5-apply-s3-capture-provider.yml
          git diff --cached --check
          git commit -m "feat: register Phase 5 module-launch S3 Capture provider"
          git push origin HEAD:work/gensrpg-phase5-module-launch-s3-capture-provider-2026-09-24
