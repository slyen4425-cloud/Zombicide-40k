name: Phase 9 Capture139 base-profile retirement one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ github.event.head_commit.message == 'phase9 apply Capture139 base profile retirement once' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04
          fetch-depth: 0

      - name: Apply exact Capture139 retirement seam and advance exact fingerprints
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');

          const oldSize='8167091';
          const oldBlob='8a42d15ed218895690a3b8490bbe636d9d2d27c6';
          const newSize='8167048';
          const newBlob='3438e75b607d0b9bb68eb1d3edc2d97b3bd662ed';

          function gitBlob(bytes){
            return crypto.createHash('sha1')
              .update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes]))
              .digest('hex');
          }

          const indexPath='index.html';
          let src=fs.readFileSync(indexPath,'utf8');
          let bytes=Buffer.from(src,'utf8');
          if(String(bytes.length)!==oldSize)throw new Error('unexpected base size '+bytes.length);
          if(gitBlob(bytes)!==oldBlob)throw new Error('unexpected base blob '+gitBlob(bytes));

          const blockMatch=src.match(/<script\b[^>]*\bid=["']captureFix139["'][^>]*>([\s\S]*?)<\/script>/i);
          if(!blockMatch)throw new Error('missing captureFix139');
          const oldLine='    try{ensureBaseGameProfile()}catch(e){}\n';
          if((blockMatch[1].split('ensureBaseGameProfile()').length-1)!==1)
            throw new Error('Capture139 ensureBaseGameProfile occurrence not unique');
          if((src.split(oldLine).length-1)!==1)
            throw new Error('exact Capture139 base-profile line not unique');
          src=src.replace(oldLine,'');
          fs.writeFileSync(indexPath,src,'utf8');

          bytes=fs.readFileSync(indexPath);
          const blob=gitBlob(bytes);
          if(String(bytes.length)!==newSize)throw new Error('unexpected target size '+bytes.length);
          if(blob!==newBlob)throw new Error('unexpected target blob '+blob);

          const c139=src.match(/<script\b[^>]*\bid=["']captureFix139["'][^>]*>([\s\S]*?)<\/script>/i)?.[1]||'';
          if(/ensureBaseGameProfile\(\)/.test(c139))throw new Error('Capture139 still calls ensureBaseGameProfile');
          for(const invariant of [
            'saveActiveEnemies([])',
            'captureEnsureStarterKitsForParticipants()',
            'captureWorldState()',
            'applyPregameGoldToParticipants(participants)'
          ]){
            if(!c139.includes(invariant))throw new Error('missing protected Capture139 invariant '+invariant);
          }

          const changed=[];
          function walk(dir){
            if(!fs.existsSync(dir))return;
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())walk(p);
              else if(ent.isFile() && /\.cjs$/.test(ent.name)){
                let c=fs.readFileSync(p,'utf8');
                if(c.includes(oldBlob) && c.includes(oldSize)){
                  const next=c.split(oldBlob).join(newBlob).split(oldSize).join(newSize);
                  if(next!==c){fs.writeFileSync(p,next,'utf8');changed.push(p);}
                }
              }
            }
          }
          walk('tests');

          for(const p of [
            'docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv',
            'docs/GENSRPG_PHASE2_INLINE_OWNERS.json',
            'docs/GENSRPG_PHASE2_STORAGE_OWNERS.json',
            'docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json'
          ]){
            if(!fs.existsSync(p))continue;
            let c=fs.readFileSync(p,'utf8');
            if(c.includes(oldBlob)){
              c=c.split(oldBlob).join(newBlob);
              fs.writeFileSync(p,c,'utf8');
              changed.push(p);
            }
          }

          console.log(JSON.stringify({
            runtime:{oldSize:Number(oldSize),oldBlob,newSize:Number(newSize),newBlob},
            fingerprintFiles:changed.sort()
          },null,2));
          NODE

      - name: Commit exact runtime diff
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json
          git diff --cached --quiet && { echo "No change to commit"; exit 1; }
          git commit -m "runtime(phase9): retire Capture139 Base Dungeon profile preparation"
          git push origin HEAD:work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04
