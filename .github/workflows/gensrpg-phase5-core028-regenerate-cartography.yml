name: GenSrpG Phase5 Core028 regenerate cartography

on:
  push:
    branches:
      - work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-core028-regenerate-cartography.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
          fetch-depth: 0

      - name: Verify exact Core028-retired runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "d9ee34d47fa888795db68cdc244d0c73d30ee523"
          test "$(wc -c < index.html)" = "8170726"

      - name: Regenerate Phase 2 cartography
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const blob='d9ee34d47fa888795db68cdc244d0c73d30ee523';
          const source=fs.readFileSync('index.html','utf8');
          const disabled=new Set([
            'dungeonCore081TacticalMovementDisabled','dungeonCore084MovementRuntimeFixDisabled',
            'dungeonCore086MovementStabilityDisabled','dungeonCore087InteractionRulesDisabled',
            'dungeonCore087ChestGuardDisabled','dungeonCore089TacticalInteractionsDisabled',
            'dungeonCore090MovementV2Disabled','dungeonCore094EndTurnFinalDisabled',
            'dungeonCore095SoloTurnFinalDisabled','dungeonCore097StabilityRollbackDisabled'
          ]);
          const blockRe=/<script\b[^>]*\bid=["']([^"']+)["'][^>]*>([\s\S]*?)<\/script>/gi;
          const blocks=[...source.matchAll(blockRe)].map((m,i)=>({id:m[1],source:m[2],order:i+1}));
          if(blocks.some(b=>b.id==='dungeonCore028HeroExploreGuard'))throw new Error('Core028 still present');
          const active=blocks.filter(b=>!disabled.has(b.id));

          // Inline owner manifest: preserve metadata, remove retired block, renumber exact runtime order.
          {
            const file='docs/GENSRPG_PHASE2_INLINE_OWNERS.json';
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            delete data.blocks.dungeonCore028HeroExploreGuard;
            const next={};
            for(const b of blocks){
              const rec=data.blocks[b.id];
              if(!rec)throw new Error('missing owner metadata for '+b.id);
              rec.order=b.order;
              rec.status=disabled.has(b.id)?'disabled':'active';
              next[b.id]=rec;
            }
            data.blocks=next;
            data.sourceIndexBlob=blob;
            data.expected={total:blocks.length,active:active.length,disabled:blocks.length-active.length};
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }

          // Exact inline-global table, intentionally keeping the historic assignment regex.
          const assignmentRe=/\bwindow\.([A-Za-z_$][\w$]*)\s*=/g;
          const chains=new Map();
          for(const b of active){
            for(const hit of b.source.matchAll(assignmentRe)){
              const name=hit[1];
              if(!chains.has(name))chains.set(name,[]);
              chains.get(name).push(b.id);
            }
          }
          const distinctGlobals=chains.size;
          const assignments=[...chains.values()].reduce((sum,c)=>sum+c.length,0);
          const multiOwnerGlobals=[...chains.values()].filter(c=>c.length>1).length;
          const table=[
            '# GenSrpG Phase 2 — inline global last owners',
            '# sourceIndexBlob='+blob,
            '# scope=explicit window.<name> assignments in '+active.length+' active inline blocks',
            '# distinctGlobals='+distinctGlobals+' assignments='+assignments+' multiOwnerGlobals='+multiOwnerGlobals,
            '# name\tassignmentCount\tlastOwner',
            ...[...chains.keys()].sort().map(name=>{
              const c=chains.get(name);return name+'\t'+c.length+'\t'+c.at(-1);
            })
          ].join('\n')+'\n';
          fs.writeFileSync('docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv',table);

          // Timer manifest: external graph unchanged, inline totals recomputed from exact runtime.
          {
            const file='docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json';
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            const count=s=>({
              setTimeouts:(s.match(/\bsetTimeout\s*\(/g)||[]).length,
              setIntervals:(s.match(/\bsetInterval\s*\(/g)||[]).length
            });
            const timers=active.map(b=>({id:b.id,...count(b.source)})).filter(x=>x.setTimeouts||x.setIntervals);
            data.sourceIndexBlob=blob;
            data.expected.activeInlineBlocks=active.length;
            data.expected.inlineTimerSources=timers.length;
            data.expected.inlineSetTimeoutSyntax=timers.reduce((n,x)=>n+x.setTimeouts,0);
            data.expected.inlineSetIntervalSyntax=timers.reduce((n,x)=>n+x.setIntervals,0);
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }

          // Source fingerprint only: their described domains remain unchanged.
          for(const file of [
            'docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json',
            'docs/GENSRPG_PHASE2_STORAGE_OWNERS.json'
          ]){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.sourceIndexBlob=blob;
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }

          console.log(JSON.stringify({
            blocks:{total:blocks.length,active:active.length,disabled:blocks.length-active.length},
            globals:{distinctGlobals,assignments,multiOwnerGlobals,openChar:chains.get('openChar')||null},
            timers:JSON.parse(fs.readFileSync('docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json','utf8')).expected
          },null,2));
          NODE

      - name: Commit regenerated cartography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenSrpG Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GENSRPG_PHASE2_INLINE_OWNERS.json \
                  docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv \
                  docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json \
                  docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json \
                  docs/GENSRPG_PHASE2_STORAGE_OWNERS.json
          git commit -m "docs: regenerate Phase 2 cartography after Core 0.28 retirement"
          git push origin HEAD:work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
