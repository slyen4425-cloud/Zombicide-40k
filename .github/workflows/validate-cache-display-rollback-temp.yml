name: Validate cache display rollback
on:
  push:
    branches:
      - work/dungeon-cache-display-rollback-2026-09-06
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-authored-cache-ux-167853.js
          node --check assets/dungeon/dungeon-authored-bootstrap-167849.js
      - name: Cache UX rollback regression
        run: node tests/dungeon_authored_cache_ux_v167853.test.cjs
      - name: Authored Dungeon regressions
        run: |
          node tests/dungeon_authored_cache_visual_v167852.test.cjs
          node tests/dungeon_zone_links_v167846.test.cjs
          node tests/dungeon_authored_bootstrap_v167849.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
