name: GenSrpG Phase9 Capture C shutdown owner E2E
on:
  push:
    branches:
      - work/gensrpg-phase9-capture-axis-c-shutdown-owner-2026-10-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-shutdown-owner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright for real browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture UI Save Quit -> resume -> second shutdown
        run: node tests/gens_phase9_capture_axis_c_shutdown_owner_browser_v1.test.cjs
