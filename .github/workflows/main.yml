name: Deploy GenSrpG to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Tester le créateur de pièces Dungeon
        run: node tests/dungeon_room_creator_v1.test.cjs

      - name: Préparer le site
        run: |
          rm -rf _site
          mkdir -p _site

          # Ancien pack principal, s'il existe encore
          if [ -f "Z40K_GITHUB_PAGES_READY.zip" ]; then
            unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site
          fi

          # Application principale
          cp -f index.html _site/index.html

          # Manifest
          if [ -f "manifest.webmanifest" ]; then
            cp -f manifest.webmanifest _site/manifest.webmanifest
          fi

          if [ -f "manifest.json" ]; then
            cp -f manifest.json _site/manifest.json
          fi

          # Service Worker
          if [ -f "service-worker.js" ]; then
            cp -f service-worker.js _site/service-worker.js
          fi

          # Icônes PWA
          mkdir -p _site/icons

          if [ -f "icon-192.png" ]; then
            cp -f icon-192.png _site/icons/icon-192.png
          fi

          if [ -f "icon-512.png" ]; then
            cp -f icon-512.png _site/icons/icon-512.png
          fi

          # Sons
          for file in sound_*.mp3; do
            if [ -f "$file" ]; then
              cp -f "$file" _site/
            fi
          done

          # Assets GenSrpG
          # IMPORTANT :
          # on copie le CONTENU de assets/
          # et non le dossier assets lui-même,
          # sinon on obtient assets/assets/
          if [ -d "assets" ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi

          echo ""
          echo "========================================="
          echo " CONTENU DU SITE À PUBLIER"
          echo "========================================="
          find _site -maxdepth 6 -type f | sort

          echo ""
          echo "========================================="
          echo " ASSETS DUNGEON"
          echo "========================================="
          find _site/assets/dungeon -type f 2>/dev/null | sort || true

          echo ""
          echo "========================================="
          echo " SONS"
          echo "========================================="
          ls -lh _site/sound_*.mp3 2>/dev/null || true

      - name: Charger les modules Dungeon externes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("_site/index.html")
          module = Path("_site/assets/dungeon/dungeon-room-creator-100.js")
          if not module.exists():
              raise SystemExit("Room Creator asset missing")
          html = index.read_text(encoding="utf-8")
          tag = '<script src="assets/dungeon/dungeon-room-creator-100.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Cannot inject Room Creator: </body> missing")
              html = html.replace("</body>", tag + "\n</body>")
              index.write_text(html, encoding="utf-8")
          PY

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site comme artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
