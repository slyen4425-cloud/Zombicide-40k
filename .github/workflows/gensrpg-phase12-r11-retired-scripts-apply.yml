name: GenSrpG Phase12 R11 guarded collective inactive-script retirement
on:
  push:
    branches:
      - 'work/gensrpg-phase12-r11-disabled-script-retirement-2026-10-19'
    paths:
      - '.github/workflows/gensrpg-phase12-r11-retired-scripts-apply.yml'
permissions:
  contents: write
jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source and absence of disabled-script dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase12-r11-disabled-script-retirement-2026-10-19'
          test "$(git hash-object index.html)" = 'b8ef8dcb497cad94c91094ed008136a5d9800155'
          node tools/gensrpg_phase12_r11_retired_scripts.cjs --audit
      - name: Remove only disabled tags, verify exact active scripts and backward chain
        shell: bash
        run: |
          set -euo pipefail
          node tools/gensrpg_phase12_r11_retired_scripts.cjs --apply
          node tools/gensrpg_phase12_r11_retired_scripts.cjs --verify
          node tests/gensrpg_phase12_r11_retired_scripts_sentinel.test.cjs
          node tests/gensrpg_phase12_r10_capture_sentinel.test.cjs
          node tests/gensrpg_phase12_r09_wave_sentinel.test.cjs
          git -c core.whitespace=-blank-at-eof diff --check
      - name: Commit exclusively HTML and PWA cache on R11 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js
          git -c core.whitespace=-blank-at-eof diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" = '2'
          git commit -m 'refactor(phase12 R11): retire 17 inactive scripts and preserve exact R10 rollback'
          git push origin "HEAD:$GITHUB_REF_NAME"
