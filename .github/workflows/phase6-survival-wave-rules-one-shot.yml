name: Phase 6 Survival wave rules one-shot

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-wave-rules-entry-2026-09-25

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche exacte
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-wave-rules-entry-2026-09-25
          fetch-depth: 0

      - name: Vérifier et raccorder l'entrée Survie
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path=Path("index.html")
          raw=path.read_bytes()

          def blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()

          before=blob(raw)
          expected_before="97f0e060d8bffcde2baaf5aa42c1e16b8544263f"
          expected_after="7663392f163aac32c4c3b918cbce67472856b3b6"

          if before!=expected_before:
              raise SystemExit(f"index.html inattendu avant patch: {before}")

          html=raw.decode("utf-8")

          tag='<script src="assets/gensrpg/survival/entry-v1.js?v=1"></script>\n'
          anchor='<script src="assets/gensrpg/core/asset-resolver-v1.js"></script>\n'
          if html.count(anchor)!=1:
              raise SystemExit("ancre asset-resolver absente ou dupliquée")
          if "assets/gensrpg/survival/entry-v1.js" in html:
              raise SystemExit("entrée Survie déjà raccordée")
          html=html.replace(anchor,anchor+tag,1)

          collect_start=html.index("function collectEnemyIdsFromProfile(p){")
          collect_end=html.index("\nfunction normalizeWaveReserveForProfile",collect_start)
          html=html[:collect_start]+html[collect_end+1:]

          default_start=html.index("function defaultWaveProfile(){")
          default_end=html.index("\nfunction loadWaveProfile(){",default_start)
          html=html[:default_start]+html[default_end+1:]

          if html.count("defaultWaveProfile(")!=6:
              raise SystemExit(f"compte defaultWaveProfile inattendu: {html.count('defaultWaveProfile(')}")
          if html.count("collectEnemyIdsFromProfile(")!=2:
              raise SystemExit(f"compte collectEnemyIdsFromProfile inattendu: {html.count('collectEnemyIdsFromProfile(')}")

          html=html.replace("defaultWaveProfile()","GensSurvivalV1.waveRules.defaultProfile()")
          html=html.replace("collectEnemyIdsFromProfile(","GensSurvivalV1.waveRules.collectEnemyIds(")

          if "function defaultWaveProfile(" in html or "function collectEnemyIdsFromProfile(" in html:
              raise SystemExit("ancien propriétaire inline encore présent")
          if html.count("GensSurvivalV1.waveRules.defaultProfile()")!=6:
              raise SystemExit("les 6 consommateurs defaultProfile ne sont pas raccordés")
          if html.count("GensSurvivalV1.waveRules.collectEnemyIds(")!=2:
              raise SystemExit("les 2 consommateurs collectEnemyIds ne sont pas raccordés")

          out=html.encode("utf-8")
          after=blob(out)
          if len(out)!=8170730:
              raise SystemExit(f"taille index après patch inattendue: {len(out)}")
          if after!=expected_after:
              raise SystemExit(f"blob index après patch inattendu: {after}")

          path.write_bytes(out)
          print("index before",before)
          print("index after ",after)
          PY

      - name: Supprimer le mécanisme one-shot
        run: rm -f .github/workflows/phase6-survival-wave-rules-one-shot.yml

      - name: Committer le raccord exact
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/phase6-survival-wave-rules-one-shot.yml
          git diff --cached --check
          git commit -m "refactor: connect Survival wave rules entry"
          git push origin HEAD:work/gensrpg-phase6-survival-wave-rules-entry-2026-09-25
