name: GenSrpG temporary Capture139 non-workflow realignment

on:
  push:
    branches:
      - work/gensrpg-phase5-capture139-openchar-retirement-2026-09-24

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Realign active tests and Phase 2 maps
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "97f0e060d8bffcde2baaf5aa42c1e16b8544263f"
          python - <<'PY'
          from pathlib import Path
          import re

          OLD_BLOB="198207e3f52730498831f196caa35c4a0283e934"
          NEW_BLOB="97f0e060d8bffcde2baaf5aa42c1e16b8544263f"
          OLD_SIZE="8172118"
          NEW_SIZE="8171854"
          root=Path(".")

          active=set()
          for wf in (root/".github/workflows").glob("*.yml"):
              txt=wf.read_text(encoding="utf-8")
              active.update(re.findall(r'tests/[A-Za-z0-9_./-]+\.test\.cjs',txt))
          for wf in (root/".github/workflows").glob("*.yaml"):
              txt=wf.read_text(encoding="utf-8")
              active.update(re.findall(r'tests/[A-Za-z0-9_./-]+\.test\.cjs',txt))
          active.discard("tests/gens_phase5_capture139_openchar_retirement_preaudit_v1.test.cjs")
          active.discard("tests/gens_phase5_capture139_openchar_retirement_browser_characterization_v1.test.cjs")
          active.add("tests/gens_phase5_capture139_openchar_retirement_v1.test.cjs")

          baseline_changed=[]
          for rel in sorted(active):
              p=root/rel
              if not p.exists():
                  continue
              s=p.read_text(encoding="utf-8")
              n=s.replace(OLD_BLOB,NEW_BLOB).replace(OLD_SIZE,NEW_SIZE)
              if n!=s:
                  p.write_text(n,encoding="utf-8",newline="")
                  baseline_changed.append(rel)

          def replace_once(rel,old,new):
              p=root/rel
              s=p.read_text(encoding="utf-8")
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f"{rel}: expected one semantic anchor, found {count}")
              p.write_text(s.replace(old,new,1),encoding="utf-8",newline="")

          replace_once("tests/gens_phase5_exit_audit_v1.test.cjs",
          '''assert.deepEqual(openCharChain,['captureFix139'],
            'Phase 5 exit blocker must remain exactly the Capture139 global openChar wrapper');

          const capture139=blocks.find(x=>x.id==='captureFix139')?.body||'';
          assert.match(capture139,/const openChar139=window\.openChar/);
          assert.match(capture139,/window\._captureStarting139 && isCaptureContext138\(\)/,
            'Capture139 wrapper must be limited to Capture startup suppression');
          assert.match(capture139,/return openChar139\.apply\(this,arguments\)/,
            'Capture139 wrapper must delegate normal hero-sheet calls');
          ''',
          '''assert.deepEqual(openCharChain,[],
            'Phase 5 exit requires zero inline global openChar wrapper');

          const capture139=blocks.find(x=>x.id==='captureFix139')?.body||'';
          assert.ok(capture139,'Capture139 launch block must remain present');
          assert.doesNotMatch(capture139,/const openChar139=window\.openChar/);
          assert.doesNotMatch(capture139,/window\.openChar\s*=(?!=)/);
          assert.doesNotMatch(capture139,/return openChar139\.apply\(this,arguments\)/);
          ''')

          replace_once("tests/gens_phase5_exit_audit_v1.test.cjs",
          '''  heroSheet:{
              nativeOwner:'function openChar(id)',
              remainingGlobalWrappers:openCharChain,
              blocker:'captureFix139'
            },
            phase5ExitReady:false,
            nextRequiredMicroLot:'retire only Capture139 global openChar wrapper after dedicated TDD/browser proof'
          ''',
          '''  heroSheet:{
              nativeOwner:'function openChar(id)',
              remainingGlobalWrappers:openCharChain,
              blocker:null
            },
            phase5ExitReady:true,
            nextRequiredMicroLot:null
          ''')

          replace_once("tests/gens_phase5_openchar_authority_preaudit_v1.test.cjs",
          '''assert.deepEqual(chain.map(x=>x.id),['captureFix139'],
            'after Core 0.28 retirement, Capture 139 must be the only strict openChar wrapper');
          assert.equal(chain.reduce((n,x)=>n+x.count,0),1,
            'openChar must have exactly one true window assignment after Core 0.28 retirement');

          const capture=chain.find(x=>x.id==='captureFix139')?.body||'';
          assert.match(capture,/window\._captureStarting139=false/);
          assert.match(capture,/if\(window\._captureStarting139 && isCaptureContext138\(\)\)/,
            'Capture wrapper must only suppress sheet opening during active Capture startup');
          assert.match(capture,/return openChar139\.apply\(this,arguments\)/,
            'Capture wrapper must delegate every non-startup openChar call');
          ''',
          '''assert.deepEqual(chain.map(x=>x.id),[],
            'Phase 5 final authority must leave zero strict global openChar wrapper');
          assert.equal(chain.reduce((n,x)=>n+x.count,0),0,
            'openChar must have zero true window assignment after Capture139 retirement');

          const capture=blocks.find(x=>x.id==='captureFix139')?.body||'';
          assert.ok(capture,'Capture139 launch block must remain present');
          assert.match(capture,/window\._captureStarting139=false/);
          assert.doesNotMatch(capture,/const openChar139=window\.openChar/);
          assert.doesNotMatch(capture,/window\.openChar\s*=(?!=)/);
          assert.doesNotMatch(capture,/return openChar139\.apply\(this,arguments\)/);
          ''')

          replace_once("tests/gens_phase5_openchar_authority_preaudit_v1.test.cjs",
          '''  scenario:'Phase 5 openChar authority after Core 0.28 retirement',
            runtime:{size:bytes.length,blob:gitBlob(bytes)},
            nativeOwner:'function openChar(id)',
            strictWrapperChain:chain.map(x=>x.id),
            historicalCartographyWarning:'window.openChar===function comparisons must not count as assignments',
            retiredOwner:'dungeonCore028HeroExploreGuard',
            capture139RetirementCandidate:false
          ''',
          '''  scenario:'Phase 5 final openChar authority after Capture139 retirement',
            runtime:{size:bytes.length,blob:gitBlob(bytes)},
            nativeOwner:'function openChar(id)',
            strictWrapperChain:chain.map(x=>x.id),
            historicalCartographyWarning:'window.openChar===function comparisons must not count as assignments',
            retiredOwners:['dungeonCore028HeroExploreGuard','captureFix139 global openChar'],
            capture139Retired:true
          ''')

          replace_once("tests/gens_phase5_openchar_core028_retirement_v1.test.cjs",
          '''assert.deepEqual(strictChain('openChar'),['captureFix139'],
            'after Core 0.28 retirement, Capture 139 must be the only global openChar wrapper');

          const capture=blocks.find(b=>b.id==='captureFix139')?.body||'';
          assert.match(capture,/const openChar139=window\.openChar/);
          assert.match(capture,/window\._captureStarting139 && isCaptureContext138\(\)/);
          assert.match(capture,/return openChar139\.apply\(this,arguments\)/,
            'Capture 139 must keep delegating non-startup openChar calls');
          ''',
          '''assert.deepEqual(strictChain('openChar'),[],
            'after Core 0.28 and Capture139 retirements, no global openChar wrapper may remain');

          const capture=blocks.find(b=>b.id==='captureFix139')?.body||'';
          assert.ok(capture,'Capture139 launch block must remain present');
          assert.doesNotMatch(capture,/const openChar139=window\.openChar/);
          assert.doesNotMatch(capture,/window\.openChar\s*=(?!=)/);
          assert.doesNotMatch(capture,/return openChar139\.apply\(this,arguments\)/);
          ''')

          replace_once("tests/gens_phase5_openchar_core028_retirement_v1.test.cjs",
          '''  remainingWrapper:'captureFix139',
            retired:'dungeonCore028HeroExploreGuard'
          ''',
          '''  remainingWrapper:null,
            retired:['dungeonCore028HeroExploreGuard','captureFix139 global openChar']
          ''')

          p=root/"tests/gens_phase5_openchar_core028_browser_characterization_v1.test.cjs"
          s=p.read_text(encoding="utf-8")
          s=s.replace("remainingOpenCharOwner:'Capture 139 over native Shell openChar'","remainingOpenCharOwner:'native Shell openChar'")
          p.write_text(s,encoding="utf-8",newline="")

          replace_once("tests/gens_phase2_inline_global_last_owner_v11411.test.cjs",
          "assert.equal(distinctGlobals,436,'distinct explicit inline globals drifted');",
          "assert.equal(distinctGlobals,435,'distinct explicit inline globals drifted');")
          replace_once("tests/gens_phase2_inline_global_last_owner_v11411.test.cjs",
          "assert.equal(assignments,758,'explicit inline global assignments drifted');",
          "assert.equal(assignments,757,'explicit inline global assignments drifted');")

          for rel in [
              "docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json",
              "docs/GENSRPG_PHASE2_INLINE_OWNERS.json",
              "docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"
          ]:
              p=root/rel
              s=p.read_text(encoding="utf-8")
              if OLD_BLOB not in s:
                  raise SystemExit(f"{rel}: old source blob missing")
              p.write_text(s.replace(OLD_BLOB,NEW_BLOB),encoding="utf-8",newline="")

          tsv=root/"docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"
          s=tsv.read_text(encoding="utf-8")
          s=s.replace("# sourceIndexBlob="+OLD_BLOB,"# sourceIndexBlob="+NEW_BLOB)
          s=s.replace("# distinctGlobals=436 assignments=758 multiOwnerGlobals=119",
                      "# distinctGlobals=435 assignments=757 multiOwnerGlobals=119")
          row="openChar\t1\tcaptureFix139\n"
          if s.count(row)!=1:
              raise SystemExit("openChar last-owner row mismatch")
          s=s.replace(row,"",1)
          tsv.write_text(s,encoding="utf-8",newline="")

          current=root/"docs/GENSRPG_CURRENT_WORK.md"
          old=current.read_text(encoding="utf-8")
          prefix='''# RUNTIME APPLIQUÉ — Phase 5 / retrait dernier wrapper global openChar Capture139 — 2026-09-24

          Validation de la source utilisateur :
          - fichier fourni via ZIP vérifié contre le blob Git attendu ;
          - source : 8 172 118 octets ;
          - blob source : `198207e3f52730498831f196caa35c4a0283e934`.

          Patch runtime :
          - commit : `68d807b9b8b63a9ceab88f6c3331b43c106607b8` ;
          - seul `index.html` est modifié ;
          - 0 ajout / 8 lignes supprimées ;
          - retrait uniquement de `const openChar139=window.openChar` et du wrapper `window.openChar=function(id){...}` ;
          - taille : 8 171 854 octets ;
          - blob : `97f0e060d8bffcde2baaf5aa42c1e16b8544263f`.

          Préservé sans modification :
          - `captureFix139` et son lancement Capture ;
          - `window._captureStarting139` ;
          - chaîne `startConfiguredGame` :
            `captureFix138 -> captureFix139 -> gensDungeonCore01Js` ;
          - provider public Capture ;
          - Shell final `startConfiguredGame` ;
          - navigation / goMenu / Dungeon / Survival / Tactical / Builder / Stats.

          Autorité fiche héros attendue après ce retrait :
          - propriétaire natif : `function openChar(id)` ;
          - wrappers globaux inline : **0**.

          Sentinelles actives et cartographie Phase 2 réalignées sur cette nouvelle empreinte.
          Les pré-audits historiques Capture139 restent conservés comme preuve du chantier.

          '''
          current.write_text(prefix+old,encoding="utf-8",newline="")

          print("active baseline files realigned:",len(baseline_changed))
          for rel in baseline_changed:
              print(" -",rel)
          PY

      - name: Commit non-workflow realignment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests docs
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No non-workflow changes to commit"
            exit 0
          fi
          git commit -m "test: realign guards after Capture139 openChar retirement"
          git push origin "HEAD:${GITHUB_REF_NAME}"
