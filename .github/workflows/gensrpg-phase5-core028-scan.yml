name: GenSrpG Phase5 Core028 scan stale references

on:
  push:
    branches:
      - work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-core028-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
          fetch-depth: 0
      - name: Scan stale S2 fingerprints and Core028 references
        shell: bash
        run: |
          set -euo pipefail
          echo "=== S2 BLOB ==="
          grep -RIl --exclude='index.html' '7b586e9fb14b7a93a0edb069e115fd6d48cbda97' tests docs assets .github || true
          echo "=== S2 SIZE ==="
          grep -RIl --exclude='index.html' '8172500' tests docs assets .github || true
          echo "=== CORE028 REFERENCES ==="
          grep -RIl --exclude='index.html' 'dungeonCore028HeroExploreGuard\|dc028RemoveHeroExplore' tests docs assets .github || true
