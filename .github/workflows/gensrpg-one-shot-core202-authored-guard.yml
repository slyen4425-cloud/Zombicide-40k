name: GenSrpG one-shot Core202 authored guard

on:
  push:
    branches:
      - 'work/gensrpg-authored-cache-trap-runtime-2026-09-18'

permissions:
  contents: write

jobs:
  patch-exact-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-authored-cache-trap-runtime-2026-09-18
          fetch-depth: 0

      - name: Verify exact source blob and apply authored-only Core 2.02 guard
        run: |
          set -euo pipefail
          before="$(git hash-object index.html)"
          test "$before" = "917c1a38fa605d53de9a8a9f03b8b76a96b379e3"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          replacements=[
          ('''function rt202(){try{return JSON.parse(localStorage.getItem(RT_KEY)||"null")}catch(e){return null}}
          function save202(x)''',
           '''function rt202(){try{return JSON.parse(localStorage.getItem(RT_KEY)||"null")}catch(e){return null}}
          function authored202(x){return !!x?.last?.authoredRuntime167839}
          function save202(x)'''),
          ('''function ensureEncounter202(x){
            if(!x||!["enemy","ambush","boss"].includes(String(x.last?.kind||"")))return;''',
           '''function ensureEncounter202(x){
            if(authored202(x)||!x||!["enemy","ambush","boss"].includes(String(x.last?.kind||"")))return;'''),
          ('''function ensureTrap202(x){
            if(!x||String(x.last?.kind)!=="trap")return;''',
           '''function ensureTrap202(x){
            if(authored202(x)||!x||String(x.last?.kind)!=="trap")return;'''),
          ('''function ensurePuzzle202(x){
            if(!x||!x.last?.map||x.last.kind==="boss"||x.last.exitLocked)return;''',
           '''function ensurePuzzle202(x){
            if(authored202(x)||!x||!x.last?.map||x.last.kind==="boss"||x.last.exitLocked)return;'''),
          ('''function maybeForceCombatRoom202(x){
            if(!x||x.room<=1||x.last?.kind==="boss")return false;''',
           '''function maybeForceCombatRoom202(x){
            if(authored202(x)||!x||x.room<=1||x.last?.kind==="boss")return false;'''),
          ('''    const x=rt202();
              const transition=x?.dc313LastTransition;''',
           '''    const x=rt202();
              if(authored202(x))return r;
              const transition=x?.dc313LastTransition;'''),
          ('''function decorate202(){
            const x=rt202();if(!x)return;
            try{
              recordRoom202(x);''',
           '''function decorate202(){
            const x=rt202();if(!x)return;
            try{
              if(authored202(x)){paintTrap202();return}
              recordRoom202(x);''')
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f"marker count {s.count(old)} for {old[:60]!r}")
              s=s.replace(old,new)
          p.write_text(s,encoding="utf-8")
          PY
          after="$(git hash-object index.html)"
          test "$after" = "55453138449d07bde731ff6934acc442f56bae32"

      - name: Commit exact patch and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/gensrpg-one-shot-core202-authored-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/gensrpg-one-shot-core202-authored-guard.yml
          git commit -m "fix: disable Core 2.02 random density in authored worlds"
          git push origin HEAD:work/gensrpg-authored-cache-trap-runtime-2026-09-18
