name: GenSrpG Survival asset restore one-shot

on:
  push:
    branches:
      - 'work/gensrpg-survival-search-art-repair-2026-09-20'

permissions:
  contents: write

jobs:
  restore-survival-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current work branch
        uses: actions/checkout@v4

      - name: Recover exact historical Survival assets
        shell: bash
        run: |
          set -euo pipefail
          if [ -f assets/img_01_53b38c99.png ] && [ -f assets/img_32_29232d11.jpg ]; then
            echo "Survival assets already restored."
            exit 0
          fi

          git fetch --no-tags --depth=1 origin 2d1d405006b8e3ec7e3c05fc8beda3e040451108
          git show 2d1d405006b8e3ec7e3c05fc8beda3e040451108:Z40K_GITHUB_PAGES_READY.zip > /tmp/z40k-pages.zip
          rm -rf /tmp/z40k-pages
          mkdir -p /tmp/z40k-pages assets
          unzip -q /tmp/z40k-pages.zip -d /tmp/z40k-pages

          files=(
            img_01_53b38c99.png img_02_289f15e8.png img_03_de27e5a7.png
            img_04_25156b9a.jpg img_05_184ce6b8.jpg img_06_a737b5eb.jpg
            img_07_1390c30b.png img_08_8a4a46dc.png img_09_00b03dce.png
            img_10_e940d82d.png img_11_d5bcb253.png img_12_3cb0d253.png
            img_13_dc98a4bc.png img_14_48aa449f.png img_15_450056b8.png
            img_16_948b8374.png img_17_dac8fa45.png img_18_f09add3b.jpg
            img_19_bf3fd8f3.jpg img_20_35f03b5e.jpg img_21_f4f05222.jpg
            img_22_65b48717.jpg img_23_0095840d.jpg img_24_5ab892ea.jpg
            img_25_4d75c641.jpg img_26_ff05a090.png img_27_f3d5c020.png
            img_28_1395802a.png img_29_f102b709.png img_30_e02b021c.png
            img_31_a7de1a50.jpg img_32_29232d11.jpg
          )

          for name in "${files[@]}"; do
            src="$(find /tmp/z40k-pages -type f -name "$name" -print -quit)"
            if [ -z "$src" ]; then
              echo "Missing historical asset: $name" >&2
              exit 1
            fi
            cp "$src" "assets/$name"
          done

          cat > /tmp/survival-assets.sha256 <<'EOF'
          cbfa3953446d96f6fa598169f256126c2ce12d56d8d537211e2711bdc4d1fd68  assets/img_01_53b38c99.png
          4dd1c8efa454c46882f5fa732791c950d82f8814468b69ec55479043066deaae  assets/img_02_289f15e8.png
          cee9f1cc2b56ded3c14b5519b3233dc93c0f6eb043ea6b5c953b9d24cc277a36  assets/img_03_de27e5a7.png
          3544e6b3b6ea041d74703a317d6959bc12761c31f89357b16fdbc13efd8380c5  assets/img_04_25156b9a.jpg
          16c2b32c414b91a4bd66d98ca2d06948fcd77866bb12ba606d2460a744829c3e  assets/img_05_184ce6b8.jpg
          61c7f70be7d60c45dbf558a112a7d25612583e41838a2366fcc832ea09f73382  assets/img_06_a737b5eb.jpg
          830f8522047786857d89db66b3ed85ede4a6585408bff43dab4735d569dd8899  assets/img_07_1390c30b.png
          320058076dddbc13ee0645c5c16a0cf6822c149eb51f53c64bb5e6cc4d8a2fe1  assets/img_08_8a4a46dc.png
          629899ea486b8d7e16f8f8c132c9fb113ffcbfa4548e5e384dbef98adcd2e2ca  assets/img_09_00b03dce.png
          4d46555f7d8d78e09a922c7a1d03dea856753aae4399df8d3b57fca52bcc2407  assets/img_10_e940d82d.png
          1ca3389497573cc77c14437b802e80b877ba0761429fc7934d1436d3897af633  assets/img_11_d5bcb253.png
          8d96866e73c3179d985810a4ade79452c6bd19dab846a598f5223d75dce47f55  assets/img_12_3cb0d253.png
          eaba3a5c2e5bf0d12e3c87e1f2aa9b7a0a985d34891f2ca2be78ce025af0671f  assets/img_13_dc98a4bc.png
          f2d04cda18f8bfbd978a8a90cee5b0a4c55124e5c81d76e59f5b6fb6358499b9  assets/img_14_48aa449f.png
          574ae0498f04f58cd0f930bb37ab7cce9aee0c1517dbbe803aad4a8bee6bbaf4  assets/img_15_450056b8.png
          8bfa9a08bdeb8ba3cf28cdfd79b2348e052652dd44e7db5d663b868ae4f241a6  assets/img_16_948b8374.png
          4350672ff9f59127f38a1f4ee3013b6a619d3b659b5c09a72d8c754a9b4ff8d8  assets/img_17_dac8fa45.png
          117a93bf09cf2be41343865ccdf193e9fae2c7cbba79686aea9b02fd4790a6d3  assets/img_18_f09add3b.jpg
