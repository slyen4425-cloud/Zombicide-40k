name: GenSrpG temporary Capture139 stale baseline scan

on:
  push:
    branches:
      - work/gensrpg-phase5-capture139-openchar-retirement-2026-09-24

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Scan stale Capture139 baselines
        shell: bash
        run: |
          set -euo pipefail
          echo '=== OLD BLOB REFERENCES ==='
          grep -R -n --exclude-dir=.git '198207e3f52730498831f196caa35c4a0283e934' tests docs .github || true
          echo '=== OLD SIZE REFERENCES ==='
          grep -R -n --exclude-dir=.git '8172118' tests docs .github || true
          echo '=== OPENCHAR CAPTURE139 EXPECTATIONS ==='
          grep -R -n --exclude-dir=.git -E 'openChar.*captureFix139|captureFix139.*openChar|remainingWrapper.*captureFix139|remainingOpenCharOwner.*Capture 139|blocker.*captureFix139' tests docs .github || true
