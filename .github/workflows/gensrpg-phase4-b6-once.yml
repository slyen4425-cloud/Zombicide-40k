name: GenSrpG Phase 4 B6 one-shot raccord

on:
  push:
    branches:
      - 'work/gensrpg-phase4-asset-resolver-loot-paths-2026-09-19'
    paths:
      - '.github/workflows/gensrpg-phase4-b6-once.yml'

permissions:
  contents: write

jobs:
  raccord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: 'work/gensrpg-phase4-asset-resolver-loot-paths-2026-09-19'
          fetch-depth: 0

      - name: Verify source blob and apply exact B6 raccord
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "207353f408d8c60213b512f73184bb9ec666b75d"
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text("utf-8")
          old='''const DC023_LOOT_ART={
            dloot_old_coin:"dloot_old_coin.png",dloot_silver_idol:"dloot_silver_idol.png",
            dloot_beast_fang:"dloot_beast_fang.png",dloot_runic_shard:"dloot_runic_shard.png",
            dloot_black_pearl:"dloot_black_pearl.png",dloot_dragon_scale:"dloot_dragon_scale.png",
            dloot_royal_relic:"dloot_royal_relic.png",dloot_void_gem:"dloot_void_gem.png"
          };
          const DC023_ASSET_ROOT="assets/dungeon/creatures/";
          if(typeof window.dungeonLootCatalog160==="function"){
            const oldCatalog=window.dungeonLootCatalog160;
            window.dungeonLootCatalog160=function(){return (oldCatalog.apply(this,arguments)||[]).map(it=>{const f=DC023_LOOT_ART[String(it?.id||"")];return f?{...it,image_data:it.image_data||DC023_ASSET_ROOT+f}:it})};
          }
          '''
          new='''if(typeof window.dungeonLootCatalog160==="function"){
            const oldCatalog=window.dungeonLootCatalog160;
            window.dungeonLootCatalog160=function(){return (oldCatalog.apply(this,arguments)||[]).map(it=>{const canonical=window.GensAssetResolverV1.dungeonItemPath(String(it?.id||""));return canonical?{...it,image_data:it.image_data||canonical}:it})};
          }
          '''
          count=s.count(old)
          if count!=1:
              raise SystemExit(f"unexpected B6 anchor count: {count}")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8",newline="")
          PY
          test "$(git hash-object index.html)" = "ff11682d74be7921a591a9b76080eaf337c071be"
          git add index.html
          test "$(git rev-parse :index.html)" = "ff11682d74be7921a591a9b76080eaf337c071be"

      - name: Commit raccord and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gensrpg-phase4-b6-once.yml
          git add -A
          git commit -m "refactor: route Dungeon loot paths through Core resolver"
          git push origin HEAD:work/gensrpg-phase4-asset-resolver-loot-paths-2026-09-19
