name: GenSrpG combat lot 4M cell

on:
  push:
    branches:
      - 'work/gensrpg-combat-callsite-migration-4m-cell-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cell-characterization:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Caractériser le déclenchement cell Runtime 2.00
        run: node tests/gens_core200_cell_entry_characterization_lot4m.test.cjs

      - name: Vérifier le contrat cible Bridge du lot 4M
        run: node tests/gens_core200_cell_bridge_contract_lot4m.test.cjs

      - name: Figer l'inventaire des anciens points d'entrée combat
        run: node tests/gens_combat_callsite_inventory_v11411.test.cjs

      - name: Vérifier le contrat Bridge vers V113
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113_bridge.test.cjs
