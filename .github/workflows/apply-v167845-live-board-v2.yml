name: Apply V16.78.45 live board correction v2
on:
  push:
    branches:
      - work/dungeon-v16.78.45-live-board-fix-2026-09-05
    paths:
      - .github/workflows/apply-v167845-live-board-v2.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authored live board authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def rep(s,a,b,label):
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1, got {n}')
              return s.replace(a,b)
          p='assets/dungeon/dungeon-zone-content-167824.js'; s=load(p)
          s=rep(s,'const VERSION="1.2.0";\nconst APP_VERSION="16.78.44";','const VERSION="1.3.0";\nconst APP_VERSION="16.78.45";','zone version')
          s=rep(s,'const APPLIED_VERSION=1;','const APPLIED_VERSION=2;','applied version')
          marker='function contentStore(){const x=readJson(CONTENT_KEY,{});return x&&typeof x==="object"&&!Array.isArray(x)?x:{}}'
          helper='function contentSignature(content){const c=normalizeContent(content);return JSON.stringify({mode:c.mode,enemies:c.enemies,chests:c.chests,traps:c.traps,puzzles:c.puzzles,npcs:c.npcs,items:c.items,templateRoomId:c.templateRoomId,templateLinked:c.templateLinked})}\n'
          s=rep(s,marker,helper+marker,'content signature')
          old='function applyCurrentZone(options){const opts=options||{},ctx=currentContext();if(!ctx||ctx.content.mode==="inherit")return false;const {x,dungeonId,nodeId,content}=ctx;if(x.last?.worldContentApplied167824&&!opts.force)return false;const room=Number(x.room)||0;'
          new='function applyCurrentZone(options){const opts=options||{},ctx=currentContext();if(!ctx||ctx.content.mode==="inherit")return false;const {x,dungeonId,nodeId,content}=ctx,signature=contentSignature(content),applied=x.last?.worldContentApplied167824;if(applied&&Number(applied.version)>=APPLIED_VERSION&&String(applied.signature||"")===signature&&!opts.force)return false;const room=Number(x.room)||0;'
          s=rep(s,old,new,'versioned apply gate')
          s=rep(s,'x.last.worldContentApplied167824={version:APPLIED_VERSION,dungeonId,nodeId,updatedAt:content.updatedAt||"",mode:content.mode};','x.last.worldContentApplied167824={version:APPLIED_VERSION,dungeonId,nodeId,updatedAt:content.updatedAt||"",mode:content.mode,signature};','applied signature')
          anchor='function authoredActive(x){const rt=x||readRuntime();return !!rt?.last?.authoredRuntime167839}\n'
          helper='function installSceneFilter(){const old=ROOT.loadDungeonSceneElements;if(typeof old!=="function")return false;if(old.__dzc167845)return true;const wrapped=function(){const list=old.apply(this,arguments);if(!authoredActive())return list;return (Array.isArray(list)?list:[]).filter(e=>!(String(e?.kind||"")==="chest"&&e?.branch200!==true))};wrapped.__dzc167845=true;wrapped.__dzc167845Original=old;ROOT.loadDungeonSceneElements=wrapped;return true}\n'
          s=rep(s,anchor,anchor+helper,'scene filter')
          old='function wrapCore(){const core=ROOT.DungeonCore01;if(!core)return false;if(typeof core.explore==="function"&&!core.explore.__dzc167824){const old=core.explore.bind(core),w=function(){const out=old(...arguments);try{applyCurrentZone()}catch(e){console.warn("Zone content apply",e)}try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core.explore=w}for(const name of ["render","show"]){const old=core[name];if(typeof old!=="function"||old.__dzc167824)continue;const w=function(){const out=old.apply(this,arguments);try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core[name]=w}return true}'
          new='function wrapCore(){const core=ROOT.DungeonCore01;if(!core)return false;if(typeof core.explore==="function"&&!core.explore.__dzc167824){const old=core.explore.bind(core),w=function(){const out=old(...arguments);try{applyCurrentZone()}catch(e){console.warn("Zone content apply",e)}try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core.explore=w}for(const name of ["render","show"]){const old=core[name];if(typeof old!=="function"||old.__dzc167824)continue;const w=function(){try{applyCurrentZone()}catch(e){console.warn("Zone content reconcile",e)}const out=old.apply(this,arguments);try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core[name]=w}return true}'
          s=rep(s,old,new,'pre-render reconcile')
          s=rep(s,'function install(){if(installing)return false;installing=true;try{ROOT.GENSRPG_VERSION=APP_VERSION;scrubLegacyEnemyHp();ensureStyles();ensureModal();ensureLauncher();wrapCore();cleanLegacyChestCards();return true}finally{installing=false}}','function install(){if(installing)return false;installing=true;try{ROOT.GENSRPG_VERSION=APP_VERSION;scrubLegacyEnemyHp();installSceneFilter();ensureStyles();ensureModal();ensureLauncher();wrapCore();cleanLegacyChestCards();return true}finally{installing=false}}','install scene filter')
          s=rep(s,'ROOT.DungeonZoneContent167824={VERSION,APP_VERSION,CONTENT_KEY,normalizeContent,scrubLegacyEnemyHp,getZoneContent,saveZoneContent,applyCurrentZone,openChest,pickItem,triggerTrap,solvePuzzle,talkNpc,puzzleTargetCell,blockingPuzzleAt,cleanLegacyChestCards,parseRewardItems,rewardItemsText,open,close,install,renderEditor,addEnemy,addChest,addTrap,addPuzzle,addItem,addNpc,remove};','ROOT.DungeonZoneContent167824={VERSION,APP_VERSION,CONTENT_KEY,normalizeContent,contentSignature,scrubLegacyEnemyHp,getZoneContent,saveZoneContent,applyCurrentZone,openChest,pickItem,triggerTrap,solvePuzzle,talkNpc,puzzleTargetCell,blockingPuzzleAt,installSceneFilter,cleanLegacyChestCards,parseRewardItems,rewardItemsText,open,close,install,renderEditor,addEnemy,addChest,addTrap,addPuzzle,addItem,addNpc,remove};','zone exports')
          save(p,s)
          for p in ['tests/dungeon_zone_content_v167824.test.cjs','tests/dungeon_authored_content_v167844.test.cjs']:
              s=load(p).replace("assert.equal(api.APP_VERSION,'16.78.44');","assert.equal(api.APP_VERSION,'16.78.45');").replace("assert.equal(zone.APP_VERSION,'16.78.44');","assert.equal(zone.APP_VERSION,'16.78.45');")
              save(p,s)
          p='service-worker.js'; s=load(p)
          s=rep(s,'const CACHE_NAME = "gensrpg-cache-16.78.44-authored-content";','const CACHE_NAME = "gensrpg-cache-16.78.45-live-board";\n// Compatibility marker: gensrpg-cache-16.78.44-authored-content','cache bump')
          save(p,s)
          PY
          cat > tests/dungeon_live_board_v167845.test.cjs <<'JS'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');const path=require('node:path');const vm=require('node:vm');
          const root=path.join(__dirname,'..'),src=fs.readFileSync(path.join(root,'assets','dungeon','dungeon-zone-content-167824.js'),'utf8');
          const RT='gensrpg_dungeon_runtime_v2',CONTENT='gensrpg_zone_instance_content_v1';
          function storage(initial={}){const m=new Map(Object.entries(initial));return {getItem(k){return m.has(k)?m.get(k):null},setItem(k,v){m.set(k,String(v))},removeItem(k){m.delete(k)}}}
          const clone=v=>JSON.parse(JSON.stringify(v));function node(text=''){return {id:'',textContent:text,innerHTML:'',style:{},classList:{add(){},remove(){}},parentNode:null,remove(){this.removed=true},appendChild(){},insertBefore(){},addEventListener(){},setAttribute(){}}}
          const cards=[node('Coffre Rare'),node('Coffre Commun'),node('Coffre Épique')],document={readyState:'complete',head:{appendChild(){}},body:{appendChild(){}},documentElement:{},createElement(){return node()},getElementById(){return null},querySelector(){return null},querySelectorAll(sel){return sel==='#dc200Scene .dc200SceneCard'?cards:[]},addEventListener(){}};
          const map={size:3,width:3,height:3,cells:['entry','floor','floor','enemy','floor','chest','trap','floor','exit'],entryIdx:0,exitIdx:8};
          const runtime={participants:['hero'],index:0,room:1,positions:{hero:0},remaining:{hero:3},enemyCells:{},roomStates:{},last:{authoredRuntime167839:true,worldRuntime167823:true,worldDungeonId:'d1',worldNodeId:'n1',worldContentApplied167824:{version:1,mode:'fixed'},map:clone(map)}};
          const content={d1:{n1:{mode:'fixed',enemies:[{id:'enemy-spec',enemyId:'dng_skeleton',qty:1,cell:3,role:'enemy'}],chests:[{id:'exact-chest',cell:5,rarity:'rare',gold:7,items:[{itemId:'potion_heal',qty:1}]}],traps:[{id:'exact-trap',cell:6,trapType:'reference',refId:'dtrap_rune',once:true}],puzzles:[],npcs:[],items:[]}}};
          const store=storage({[RT]:JSON.stringify(runtime),[CONTENT]:JSON.stringify(content)});let enemies=[],spawnCount=0,trapOpened='',enemiesSeenByBaseRender=0;
          const legacyScenes=[{id:'old1',kind:'chest',room:1},{id:'old2',kind:'chest',room:1},{id:'secret',kind:'chest',room:1,branch200:true},{id:'merchant',kind:'merchant',room:1}];
          const core={render(){enemiesSeenByBaseRender=enemies.filter(e=>e.hp>0&&e.dungeonRoom===1).length;return true},show(){return this.render()},explore(){return true}};
          const context={console,Math,Date,document,localStorage:store,setTimeout(){return 1},DungeonCore01:core,loadDungeonSceneElements(){return clone(legacyScenes)},DungeonWorldBuilder167821:{findDungeon(){return {nodes:[{id:'n1',roomId:'room1'}]}},loadLibrary(){return []}},DungeonRoomCreator100:{findRoom(){return {id:'room1',width:3,height:3,cells:Array(9).fill({terrain:'floor'})}}},DungeonWorldRuntime167823:{},DungeonSpatial313:{ensure(x){return x},persist(x){return x}},loadActiveEnemies(){return enemies},saveActiveEnemies(v){enemies=v},trackSpawnedEnemyInstances(type,qty,room){const ids=[];for(let i=0;i<qty;i++){const id='spawn-'+(++spawnCount);ids.push(id);enemies.push({id,enemyId:type,hp:5,maxHp:5,dungeonRoom:Number(room)||1})}return ids},loadState(){return {inventory:[],gold:0,wounds:0}},key(){return 'hero-state'},makeInventoryEntry(id){return {itemId:id}},gensHeroGold(){return 0},openDungeonTrap(id){trapOpened=id;return true},showToast(){},modal(){}};
          context.window=context;context.globalThis=context;vm.createContext(context);vm.runInContext(src,context);
          const api=context.DungeonZoneContent167824;assert.equal(api.APP_VERSION,'16.78.45');assert.deepEqual(context.loadDungeonSceneElements().map(x=>x.id),['secret','merchant']);
          core.render();let x=JSON.parse(store.getItem(RT));assert.equal(spawnCount,1);assert.equal(enemiesSeenByBaseRender,1);assert.equal(enemies[0].hp,5);assert.equal(x.enemyCells[enemies[0].id],3);assert.equal(x.last.map.cells[3],'enemy');assert.equal(x.last.map.cells[6],'floor');assert.equal(x.last.worldContentApplied167824.version,2);assert.ok(x.last.worldContentApplied167824.signature);
          core.render();assert.equal(spawnCount,1);enemies[0].hp=0;context.saveActiveEnemies(enemies);core.render();assert.equal(spawnCount,1,'un ennemi vaincu ne doit pas respawn');
          x=JSON.parse(store.getItem(RT));x.positions.hero=6;store.setItem(RT,JSON.stringify(x));core.render();assert.equal(trapOpened,'dtrap_rune');x=JSON.parse(store.getItem(RT));x.last.authoredRuntime167839=false;store.setItem(RT,JSON.stringify(x));assert.equal(context.loadDungeonSceneElements().filter(e=>e.kind==='chest').length,3);
          assert.doesNotMatch(src,/new\s+MutationObserver/);console.log('Dungeon live board V16.78.45: OK');
          JS
      - name: Syntax and focused regressions
        run: |
          node --check assets/dungeon/dungeon-zone-content-167824.js
          node --check tests/dungeon_live_board_v167845.test.cjs
          git diff --check
          node tests/dungeon_live_board_v167845.test.cjs
          node tests/dungeon_authored_content_v167844.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_enemy_room_scope_v318.test.cjs
          node tests/gens_ui_recovery_v167843.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
