name: Apply V114.7 Single Authority Patch

on:
  push:
    branches:
      - work/v16.78.114.7-single-authority

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v1147-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V114.7 consolidation
        run: node tools/apply-v1147-single-authority.cjs
      - name: Commit patched runtime
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add assets/gensrpg service-worker.js tests .github/workflows/v1678114-tactical-hotfix.yml
          git commit -m "GenSrpG V16.78.114.7: single authority wall dice stats [v1147-patched]"
          git push origin HEAD:work/v16.78.114.7-single-authority
