name: GenSrpG cancel superseded validation runs once

on:
  push:
    branches:
      - 'work/gensrpg-dungeon-after-survival-start-state-2026-09-18'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-dungeon-after-survival-start-state-2026-09-18
          fetch-depth: 0

      - name: Cancel superseded sentinels on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          repo=os.environ['REPO']
          token=os.environ['GH_TOKEN']
          current=int(os.environ['CURRENT_RUN'])
          branch='work/gensrpg-dungeon-after-survival-start-state-2026-09-18'
          names={
            'GenSrpG Firefox wall sentinel',
            'GenSrpG architecture sentinels',
            'GenSrpG Tactical dock sentinel',
          }
          url=f'https://api.github.com/repos/{repo}/actions/runs?branch={urllib.parse.quote(branch, safe="")}&per_page=100'
          req=urllib.request.Request(url,headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
          })
          with urllib.request.urlopen(req) as r:
            runs=json.load(r).get('workflow_runs',[])
          targets=[x for x in runs if x.get('id')!=current and x.get('name') in names and x.get('status') in {'queued','in_progress'}]
          print('cancelling',[(x['id'],x['name'],x['status'],x.get('head_sha','')[:8]) for x in targets])
          for x in targets:
            cancel=f'https://api.github.com/repos/{repo}/actions/runs/{x["id"]}/cancel'
            creq=urllib.request.Request(cancel,method='POST',headers={
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
            })
            try:
              with urllib.request.urlopen(creq) as r:
                print('cancelled',x['id'],r.status)
            except Exception as e:
              print('cancel failed',x['id'],repr(e))
          PY

      - name: Remove one-shot cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/gensrpg-cancel-superseded-validation-once.yml
          git commit -m 'chore: remove one-shot validation cleanup workflow'
          git push origin HEAD:work/gensrpg-dungeon-after-survival-start-state-2026-09-18
