name: GenSrpG Capture139 openChar characterization

on:
  push:
    branches:
      - work/gensrpg-phase5-capture139-openchar-retirement-2026-09-24
  workflow_dispatch:

jobs:
  capture139-openchar-characterization:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Pré-audit statique Capture139 openChar
        run: node tests/gens_phase5_capture139_openchar_retirement_preaudit_v1.test.cjs

      - name: Caractériser Capture sans wrapper openChar Capture139
        run: node tests/gens_phase5_capture139_openchar_retirement_browser_characterization_v1.test.cjs
