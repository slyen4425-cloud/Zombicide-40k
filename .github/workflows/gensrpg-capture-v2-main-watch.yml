# Single certified-main observer with isolated candidate + DRAFT publisher PR.
# Only minimal pinned manifests are proposed: never merge or deploy.
name: Capture V2 watch certified Combat and Exploration main
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/watch_capture_v2_official_main.mjs'
      - 'tests/gens_capture_v2_upstream_watch_v1.test.mjs'
      - 'tests/gens_capture_v2_certified_autopropose_20261107.test.mjs'
      - '.github/workflows/gensrpg-capture-v2-main-watch.yml'
      - '.github/workflows/gensrpg-capture-combat-main-autosync.yml'
      - 'tests/gens_capture_combat_autosync_workflow_20261030.test.cjs'
  schedule:
    - cron: '31 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: capture-v2-official-main-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch-certified-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify certified draft proposal and immutable single-owner boundaries
        run: |
          node --test tests/gens_capture_v2_upstream_watch_v1.test.mjs
          node --test tests/gens_capture_v2_certified_autopropose_20261107.test.mjs
          node --test tests/gens_capture_combat_autosync_workflow_20261030.test.cjs
      - name: Detect certified Lab mains; stage draft publisher PR or fallback review issue (never merge or deploy)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/watch_capture_v2_official_main.mjs
