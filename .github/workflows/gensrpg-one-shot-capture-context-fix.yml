name: GenSrpG one-shot Capture context fix

on:
  push:
    branches:
      - work/gensrpg-dungeon-after-survival-start-state-2026-09-18

permissions:
  contents: write

jobs:
  patch-capture-context:
    if: ${{ !contains(github.event.head_commit.message, '[capture-context-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Corriger uniquement le propriétaire Capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='return fam==="creature" || !!p?.rpgUniverse?.captureCombat || !!p?.modules?.capture;'
          new='return fam==="creature";'
          count=s.count(old)
          if count != 1:
              raise SystemExit(f"capture context owner count={count}, expected 1")
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --numstat -- index.html | awk '{print $1":"$2}')" = "1:1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: use canonical Capture family for start routing [capture-context-fixed]"
          git push origin HEAD:"$GITHUB_REF_NAME"
