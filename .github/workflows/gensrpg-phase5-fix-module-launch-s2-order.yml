name: GenSrpG fix module-launch S2 Survival registration order

on:
  push:
    branches:
      - work/gensrpg-phase5-module-launch-s2-survival-provider-2026-09-24
    paths:
      - .github/runtime-patches/gens_phase5_module_launch_s2_survival_registration_order.patch

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout S2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact broken S2 candidate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          b=Path("index.html").read_bytes()
          s=b.decode("utf-8")
          blob=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          assert len(b)==8171879, len(b)
          assert blob=="cacee0bb95d8c046264668c1ccc721fc88bbed2d", blob
          assert s.index('window.GensShellModuleLaunchV1.register("survival",gensSurvivalStartModuleSessionV1);') < s.index('window.GensShellModuleLaunchV1=Object.freeze({')
          assert len(re.findall(r"window\.startConfiguredGame\s*=\s*async\s+function",s))==5
          PY

      - name: Apply S2 registration-order patch
        shell: bash
        run: |
          git apply --check .github/runtime-patches/gens_phase5_module_launch_s2_survival_registration_order.patch
          git apply .github/runtime-patches/gens_phase5_module_launch_s2_survival_registration_order.patch

      - name: Verify exact corrected S2 runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re
          b=Path("index.html").read_bytes()
          s=b.decode("utf-8")
          blob=hashlib.sha1(f"blob {len(b)}\0".encode()+b).hexdigest()
          assert len(b)==8171879, len(b)
          assert blob=="7601760f7a635094d4f687b725a639b5728e93b4", blob
          reg=s.index('window.GensShellModuleLaunchV1.register("survival",gensSurvivalStartModuleSessionV1);')
          expose=s.index('window.GensShellModuleLaunchV1=Object.freeze({')
          gomenu=s.index('function goMenu(){',expose)
          assert expose < reg < gomenu
          assert len(re.findall(r"window\.startConfiguredGame\s*=\s*async\s+function",s))==5
          PY

      - name: Retarget S2 exact fingerprint and prove GREEN
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs")
          s=p.read_text()
          assert s.count("cacee0bb95d8c046264668c1ccc721fc88bbed2d")==1
          s=s.replace("cacee0bb95d8c046264668c1ccc721fc88bbed2d","7601760f7a635094d4f687b725a639b5728e93b4",1)
          p.write_text(s)
          PY
          node tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs

      - name: Remove one-shot mechanism
        shell: bash
        run: |
          rm .github/runtime-patches/gens_phase5_module_launch_s2_survival_registration_order.patch
          rm .github/workflows/gensrpg-phase5-fix-module-launch-s2-order.yml

      - name: Commit corrected S2 runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs .github/runtime-patches/gens_phase5_module_launch_s2_survival_registration_order.patch .github/workflows/gensrpg-phase5-fix-module-launch-s2-order.yml
          git diff --cached --check
          git commit -m "fix: order Phase 5 S2 Survival provider registration"
          git push origin HEAD:work/gensrpg-phase5-module-launch-s2-survival-provider-2026-09-24
