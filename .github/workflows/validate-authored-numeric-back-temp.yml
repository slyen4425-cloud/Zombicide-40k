name: Validate authored numeric back fix
on:
  push:
    branches:
      - work/dungeon-authored-numeric-back-fix-2026-09-06
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Targeted authored numeric back regression
        run: node tests/dungeon_authored_branch_nav_cleanup_v167863.test.cjs
      - name: Authored zone links regression
        run: node tests/dungeon_zone_links_v167846.test.cjs
      - name: Authored runtime regression
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Cache return persistence regression
        run: node tests/dungeon_authored_return_persist_v167862.test.cjs
      - name: Full Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
