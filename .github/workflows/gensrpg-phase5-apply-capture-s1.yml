name: GenSrpG Phase5 apply Capture S1 runtime

on:
  push:
    branches:
      - work/gensrpg-phase5-module-screen-return-raccord-2026-09-23
    paths:
      - .github/runtime-patches/gens_phase5_capture_s1.patch
      - .github/workflows/gensrpg-phase5-apply-capture-s1.yml

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-module-screen-return-raccord-2026-09-23
          fetch-depth: 0

      - name: Verify exact Rule 26 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "0c15b1dba66ce83f2b27ed99e371885fb1d0ed75"
          test "$(wc -c < index.html)" = "8170961"

      - name: Apply deterministic Capture S1 change
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/runtime-patches/gens_phase5_capture_s1.patch
          git apply .github/runtime-patches/gens_phase5_capture_s1.patch
          test "$(git hash-object index.html)" = "c17460335b2deb5e5916dbf91448b0706c38d0df"
          test "$(wc -c < index.html)" = "8172505"

      - name: Commit runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenSrpG Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: route Capture screen return through Shell"
          git push origin HEAD:work/gensrpg-phase5-module-screen-return-raccord-2026-09-23
