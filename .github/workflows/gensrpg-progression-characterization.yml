name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-3-2026-09-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  open-dungeon-setup-retirement-one-shot:
    if: github.ref == 'refs/heads/work/gensrpg-combat-callsite-migration-3-2026-09-16' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-combat-callsite-migration-3-2026-09-16
          fetch-depth: 0

      - name: Prove retirement target is red before cleanup
        run: |
          if node tests/gens_open_dungeon_setup_retirement_lot3.test.cjs; then
            echo 'Expected openDungeonCombatSetup retirement target to fail before cleanup.'
            exit 1
          fi

      - name: Retire active openDungeonCombatSetup dependencies exactly
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index=Path('index.html')
          html=index.read_text(encoding='utf-8')
          if html.count('openDungeonCombatSetup') != 11:
            raise SystemExit(f'Expected 11 openDungeonCombatSetup occurrences before lot 3 cleanup, got {html.count("openDungeonCombatSetup")}')

          # 1) Ambush: keep dc030 normal path, replace only exceptional legacy fallback.
          old_ambush="""if(typeof dc030EngageCombat==='function')dc030EngageCombat();
    else if(typeof openDungeonCombatSetup==='function')openDungeonCombatSetup();"""
          new_ambush="""if(typeof dc030EngageCombat==='function')dc030EngageCombat();
    else if(typeof window.GensRpgTacticalCombatV2Bridge?.requestCombat==='function')window.GensRpgTacticalCombatV2Bridge.requestCombat(window,{enemyIds:living.map(e=>String(e.id)),reason:'embuscade',entry:'dc076AmbushFallback'});"""
          if html.count(old_ambush) != 1:
            raise SystemExit(f'Ambush fallback precondition failed: {html.count(old_ambush)} matches')
          html=html.replace(old_ambush,new_ambush,1)

          def script_block(source, marker):
            start=f'<script id="{marker}">'
            if source.count(start)!=1:
              raise SystemExit(f'{marker} marker count must be 1, got {source.count(start)}')
            a=source.index(start)
            b=source.find('</script>',a)
            if b<0: raise SystemExit(f'{marker} closing script missing')
            return a,b,source[a:b]

          # 2) Core 0.30: retire the earlier overwritten combat owner, keep navigation/button refresh.
          a,b,block=script_block(html,'dungeonCore030HeroReturnFix')
          if block.count('openDungeonCombatSetup')!=2 or block.count('window.dc030EngageCombat=function(){')!=1:
            raise SystemExit('Core 0.30 exact combat-owner precondition failed')
          fa=block.index('window.dc030EngageCombat=function(){')
          marker='\n\nfunction dc030RefreshCombatButton()'
          fb=block.find(marker,fa)
          if fb<0: raise SystemExit('Core 0.30 refresh marker missing')
          newblock=block[:fa]+block[fb+2:]
          if 'openDungeonCombatSetup' in newblock or 'window.dc030EngageCombat=function(){' in newblock:
            raise SystemExit('Core 0.30 combat owner survived cleanup')
          html=html[:a]+newblock+html[b:]

          # 3) Core 0.34: preserve Dungeon trigger/UI gate, delegate resolution directly to Tactical Bridge.
          a,b,block=script_block(html,'dungeonCore034NavigationAndCombatHostFix')
          if block.count('openDungeonCombatSetup')!=2 or block.count('window.dc030EngageCombat=function(){')!=1:
            raise SystemExit('Core 0.34 exact trigger precondition failed')
          fa=block.index('/* Entrée combat : le Core reste l\'écran de fond et le host doit toujours être visible. */')
          fb=block.find('\n\n/* Si une ancienne récupération a laissé le host masqué',fa)
          if fb<0: raise SystemExit('Core 0.34 post-trigger marker missing')
          replacement='''/* Entrée combat Dungeon : préparation minimale, résolution exclusivement Tactical. */
window.dc030EngageCombat=function(){
  try{
    const living=(typeof dungeonLivingEnemies==="function"?dungeonLivingEnemies():[])
      .filter(e=>e&&!e.defeated&&Number(e.hp)>0);
    if(!living.length){
      DungeonCore01.modal?.("⚔️ Combat","Aucun ennemi vivant dans cette salle.");
      return;
    }

    const sheet=document.getElementById("sheet");
    if(sheet)sheet.style.display="none";
    const menu=document.getElementById("menu");
    if(menu)menu.style.display="none";
    const core=document.getElementById("gensDungeonCore01");
    if(core)core.style.display="block";
    document.getElementById("dc01Modal")?.classList.remove("open");
    document.getElementById("specialDiceModal")?.classList.remove("open");
    document.body.style.overflow="";

    if(typeof window.GensRpgTacticalCombatV2Bridge?.requestCombat==="function"){
      return window.GensRpgTacticalCombatV2Bridge.requestCombat(window,{enemyIds:living.map(e=>String(e.id)),reason:"manual-setup",entry:"dc030EngageCombat"});
    }
    DungeonCore01.modal?.("⚠️ Combat","Le moteur de combat tactique est introuvable.");
  }catch(e){
    console.error("Core 0.34 engage",e);
    try{DungeonCore01.modal("⚠️ Combat","Erreur : "+String(e?.message||e))}catch(_){}
  }
};'''
          newblock=block[:fa]+replacement+block[fb:]
          if 'openDungeonCombatSetup' in newblock or 'renderDungeonCombatSetup' in newblock:
            raise SystemExit('Core 0.34 historical setup/render survived cleanup')
          html=html[:a]+newblock+html[b:]

          # 4) Core 0.45: dc030 gate remains; obsolete openDungeon wrapper is removed.
          a,b,block=script_block(html,'dungeonCore045HeroCombatModule')
          old045='''if(typeof window.openDungeonCombatSetup==="function"){
  const prev=window.openDungeonCombatSetup;
  window.openDungeonCombatSetup=function(){
    if(!dc045HeroCombatEnabled())return;
    return prev.apply(this,arguments);
  };
}
'''
          if block.count(old045)!=1:
            raise SystemExit(f'Core 0.45 openDungeon wrapper precondition failed: {block.count(old045)} matches')
          newblock=block.replace(old045,'',1)
          if 'openDungeonCombatSetup' in newblock:
            raise SystemExit('Core 0.45 still references historical setup')
          html=html[:a]+newblock+html[b:]

          # 5) Flow 171: remove the later legacy engine reinstall; keep all access/victory/flow rules.
          a,b,block=script_block(html,'gensrpgDungeonFlowFix171')
          if block.count('window.openDungeonCombatSetup=function(){')!=1:
            raise SystemExit('Flow 171 legacy engine precondition failed')
          fa=block.index('/* Combat : les héros ont déjà été choisis pour la partie.')
          fb=block.find('\n\n/* Victoire :',fa)
          if fb<0: raise SystemExit('Flow 171 victory marker missing')
          newblock=block[:fa]+block[fb+2:]
          if 'openDungeonCombatSetup' in newblock:
            raise SystemExit('Flow 171 legacy setup reinstall survived cleanup')
          html=html[:a]+newblock+html[b:]

          if html.count('openDungeonCombatSetup') != 1:
            raise SystemExit(f'Expected rollback-only openDungeonCombatSetup count 1, got {html.count("openDungeonCombatSetup")}')
          if html.count('function openDungeonCombatSetup(') != 1:
            raise SystemExit('The single historical rollback definition must remain')
          index.write_text(html,encoding='utf-8')

          inv=Path('tests/gens_combat_callsite_inventory_v11411.test.cjs')
          text=inv.read_text(encoding='utf-8')
          old='const expected={dc200StartCombat:13,openDungeonCombatSetup:11,launchCombat200:2,startCombat:6};'
          new='const expected={dc200StartCombat:13,openDungeonCombatSetup:1,launchCombat200:2,startCombat:6};'
          if text.count(old)!=1: raise SystemExit('Inventory precondition failed')
          inv.write_text(text.replace(old,new,1),encoding='utf-8')

          doc=Path('docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md')
          text=doc.read_text(encoding='utf-8')
          oldrow='| `openDungeonCombatSetup` | 11 | ancien setup de combat, embuscade et bridges Core historiques ; boutons UI migrés, Core 0.99 retiré et fallback Core 0.53 routé vers le Bridge |'
          newrow='| `openDungeonCombatSetup` | 1 | définition historique conservée uniquement comme rollback capturé par le Bridge ; aucun Core actif ne l’appelle ou ne la réinstalle |'
          if text.count(oldrow)!=1: raise SystemExit('Inventory documentation row precondition failed')
          text=text.replace(oldrow,newrow,1)
          marker='## Contrat cible déjà disponible\n'
          note='''## Migration validée — lot 3, retrait des dépendances actives à `openDungeonCombatSetup`\n\nLes consommateurs actifs ne dépendent plus de l’ancien setup : Core 0.34 délègue à `Bridge.requestCombat`, l’embuscade conserve son chemin `dc030` et dispose d’un fallback Bridge explicite avec `reason: "embuscade"`, Core 0.45 ne wrappe plus l’ancien setup, et l’autorité Core 0.30 écrasée ainsi que la réinstallation Flow 171 sont retirées.\n\nUne unique définition historique de `openDungeonCombatSetup` reste dans le monolithe uniquement comme rollback capturé par le Bridge. Aucun chemin Dungeon actif ne l’appelle.\n\n'''
          if marker not in text: raise SystemExit('Documentation insertion marker missing')
          doc.write_text(text.replace(marker,note+marker,1),encoding='utf-8')
          PY

      - name: Validate exact migration target
        run: |
          node tests/gens_open_dungeon_setup_retirement_lot3.test.cjs
          node tests/gens_core053_bridge_fallback_lot3.test.cjs
          node tests/gens_combat_callsite_inventory_v11411.test.cjs
          node tests/gens_bridge_single_entry_contract_v11411.test.cjs
          node tests/gens_combat_authority_characterization_v11411.test.cjs
          node tests/gens_bridge_v113_explicit_scope_v11411.test.cjs
          node tests/gens_bridge_v113_detection_parity_v11411.test.cjs

      - name: Commit exact active setup retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/gens_combat_callsite_inventory_v11411.test.cjs docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md
          git diff --cached --check
          git commit -m 'refactor: retire active legacy Dungeon combat setup paths'
          git push origin HEAD:work/gensrpg-combat-callsite-migration-3-2026-09-16

  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native manual XP runtime
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Characterize native progression and rewards
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Verify Tactical victory rewards summary
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Execute Tactical victory to Dungeon XP and loot
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Characterize manual level authority
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
