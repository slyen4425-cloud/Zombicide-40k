name: GenSrpG Phase 9 Dungeon setup entry transfer one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-dungeon-setup-entry-owner-transfer-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-dungeon-setup-entry-apply.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply-native-entry-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact dedicated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen main and exact Rule 26 source
        run: |
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase9-capture-dungeon-setup-entry-owner-transfer-2026-10-05'
          test "$(git rev-parse origin/main)" = 'e8681f9823573ced8aec59c8ddc47a72b02bc663'
          test "$(git hash-object index.html)" = '37056722bb0a27f96e26b3ef3b05e9543dc5a223'
          test "$(wc -c < index.html)" = '8166377'

      - name: Verify dedicated RED on untouched runtime
        run: |
          if node tests/gens_phase9_capture_dungeon_setup_entry_owner_transfer_v1.test.cjs > /tmp/gens-phase9-entry-red.log 2>&1; then
            cat /tmp/gens-phase9-entry-red.log
            echo 'Expected ownership RED did not occur'
            exit 1
          fi
          grep -F 'RED: native owner must preserve the complete V151 entry predicate' /tmp/gens-phase9-entry-red.log
          grep -F 'historical Capture with Dungeon style' /tmp/gens-phase9-entry-red.log
          grep -F 'built-in Dungeon id without style' /tmp/gens-phase9-entry-red.log
          sed -n '1,180p' /tmp/gens-phase9-entry-red.log

      - name: Apply exact native guard transfer and obsolete baseline adaptations
        run: python3 tools/gensrpg_phase9_dungeon_setup_entry_apply.py

      - name: Verify GREEN native entry, parity and protected pregame
        run: |
          test "$(git hash-object index.html)" = '1e3398755beb751786d825047bc60fe1a7179d79'
          test "$(wc -c < index.html)" = '8165906'
          node tests/gens_phase9_capture_dungeon_setup_entry_owner_transfer_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_setup_entry_ownership_characterization_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_button_owner_transfer_v1.test.cjs
          node tests/gens_phase9_capture_pregame_ownership_raccord_v1.test.cjs

      - name: Remove one-shot transport and review exact scope
        run: |
          git rm .github/workflows/gensrpg-phase9-dungeon-setup-entry-apply.yml tools/gensrpg_phase9_dungeon_setup_entry_apply.py
          git diff --check
          git diff --stat
          git diff -- index.html

      - name: Commit native ownership on exact branch head
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          test "$(git rev-parse "origin/$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests docs
          git diff --cached --check
          git commit -m 'refactor(phase9): move Dungeon setup entry guards to native pregame owner'
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Validate committed inventories
        run: |
          node tests/gens_phase2_inline_global_last_owner_v11411.test.cjs
          node tests/gens_phase2_inline_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_layered_responsibilities_v11411.test.cjs

      - name: Dispatch required triple CI on exact runtime commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gensrpg-architecture-sentinels.yml --ref "$GITHUB_REF_NAME"
          gh workflow run gensrpg-firefox-wall-sentinel.yml --ref "$GITHUB_REF_NAME"
          gh workflow run gensrpg-tactical-dock-sentinel.yml --ref "$GITHUB_REF_NAME"
