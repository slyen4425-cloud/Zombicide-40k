name: GenSrpG Phase 7 generated branch type one-shot

on:
  push:
    branches:
      - work/gensrpg-phase7-dungeon-generated-branch-plan-2026-09-27
    paths:
      - .github/workflows/gensrpg-phase7-branch-type-oneshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch exact Phase 7 branch weighting seam
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()

          index_path=Path("index.html")
          raw=index_path.read_bytes()
          assert len(raw)==8170213, len(raw)
          assert git_blob(raw)=="efcc459c9bade0e35bf123d100e499b3ce7d4eca", git_blob(raw)
          text=raw.decode("utf-8")
          old="function maybeSpecialBranch(x){const c=cfg(),m=x?.last?.map;if(!m||!Array.isArray(m.cells)||Math.random()*100>=Math.max(0,Number(c.specialBranchChance)||0))return null;const i=nearestFree(x);if(i<0)return null;const w={treasure:45,boss:25,secret:30,...(c.specialBranchWeights||{})},a=Object.entries(w).map(([k,v])=>[k,Math.max(0,Number(v)||0)]),tot=a.reduce((n,z)=>n+z[1],0)||1;let r=Math.random()*tot,type='treasure';for(const [k,v] of a){r-=v;if(r<=0){type=k;break}}const el="
          new="function maybeSpecialBranch(x){const c=cfg(),m=x?.last?.map;if(!m||!Array.isArray(m.cells)||Math.random()*100>=Math.max(0,Number(c.specialBranchChance)||0))return null;const i=nearestFree(x);if(i<0)return null;const type=GensDungeonV1.exploration.pickWeightedGeneratedBranchType(c.specialBranchWeights,Math.random());const el="
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          index_path.write_text(text,encoding="utf-8")

          entry_path=Path("assets/gensrpg/dungeon/entry-v1.js")
          entry=entry_path.read_text(encoding="utf-8")
          marker='''  function buildGeneratedRoomTransition(heroId,fromRoom,toRoom,created,at){
            return {heroId,from:fromRoom,to:toRoom,created,at};
          }
          '''
          addition='''  function pickWeightedGeneratedBranchType(branchWeights,roll){
            const weights={treasure:45,boss:25,secret:30,...(branchWeights||{})};
            const entries=Object.entries(weights).map(([type,value])=>[type,Math.max(0,Number(value)||0)]);
            const total=entries.reduce((sum,[,value])=>sum+value,0)||1;
            let remaining=Number(roll)*total;
            for(const [type,value] of entries){
              remaining-=value;
              if(remaining<=0)return type;
            }
            return "treasure";
          }

          '''
          assert entry.count(marker)==1, entry.count(marker)
          entry=entry.replace(marker,addition+marker)
          export_old='''      planGeneratedAdvance,
                pickWeightedGeneratedRoomKind,
                buildGeneratedRoomTransition
          '''
          export_new='''      planGeneratedAdvance,
                pickWeightedGeneratedRoomKind,
                buildGeneratedRoomTransition,
                pickWeightedGeneratedBranchType
          '''
          assert entry.count(export_old)==1, entry.count(export_old)
          entry=entry.replace(export_old,export_new)
          entry_path.write_text(entry,encoding="utf-8")

          contract_path=Path("assets/gensrpg/dungeon/module-contract-v1.json")
          contract=json.loads(contract_path.read_text(encoding="utf-8"))
          old_inv="the connected Phase 7 exploration slices are the pure generated advance planner weighted room-kind selector and generated room transition descriptor"
          new_inv="the connected Phase 7 exploration slices are the pure generated advance planner weighted room-kind selector generated room transition descriptor and weighted generated branch-type selector"
          assert old_inv in contract["invariants"]
          contract["invariants"][contract["invariants"].index(old_inv)]=new_inv
          anchor="the weighted room-kind selector receives its random roll explicitly and never owns random generation"
          idx=contract["invariants"].index(anchor)+1
          contract["invariants"].insert(idx,"the weighted generated branch-type selector receives its random roll explicitly after the Core 2.00 nearest-free gate and never owns random generation or branch materialization")
          contract_path.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          out=index_path.read_bytes()
          assert len(out)==8170062, len(out)
          assert git_blob(out)=="74e223b2c9877e6a88b6ad6726290d230f1f616e", git_blob(out)
          PY

      - name: Run targeted Phase 7 guards
        shell: bash
        run: |
          node tests/gens_phase7_dungeon_generated_advance_plan_v1.test.cjs
          node tests/gens_phase7_dungeon_generated_room_transition_v1.test.cjs
          node tests/gens_phase7_dungeon_generated_branch_type_weighting_v1.test.cjs
          node tests/dungeon_room_runtime_v167822.test.cjs
          git diff --check

      - name: Commit runtime and remove one-shot
        shell: bash
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git rm .github/workflows/gensrpg-phase7-branch-type-oneshot.yml
          git add index.html assets/gensrpg/dungeon/entry-v1.js assets/gensrpg/dungeon/module-contract-v1.json
          git commit -m "runtime: isolate generated branch type weighting"
          git push origin HEAD:work/gensrpg-phase7-dungeon-generated-branch-plan-2026-09-27
