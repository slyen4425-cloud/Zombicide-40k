name: Validate V16.78.102.1 Combat Cache
on:
  push:
    branches:
      - work/v16.78.102-combat-equipment-cache
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax equipment cache bridge
        run: node --check assets/gensrpg/gens-equipment-stat-cleanup-1678102.js
      - name: Equipment combat cache regression
        run: node tests/gens_equipment_combat_cache_v1678102hf1.test.cjs
      - name: Equipment canonical stats regression
        run: node tests/gens_equipment_stat_cleanup_v1678102.test.cjs
      - name: Canonical stats consolidation regression
        run: node tests/gens_canonical_stats_consolidation_v1678101.test.cjs
      - name: Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
