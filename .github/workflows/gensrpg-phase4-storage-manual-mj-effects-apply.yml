name: GenSrpG temporary Manual MJ storage micro-diff

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-manual-mj-effects-2026-09-20
    paths:
      - .github/workflows/gensrpg-phase4-storage-manual-mj-effects-apply.yml

permissions:
  contents: write

jobs:
  apply-exact-index-micro-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche exacte
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-manual-mj-effects-2026-09-20
          fetch-depth: 0

      - name: Vérifier puis appliquer uniquement le raccord Manual MJ Effects
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path=Path("index.html")
          raw=path.read_bytes()

          def blob_sha(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          source_sha=blob_sha(raw)
          expected_source="739ca52610308d085ecf2635c5bc748f70c79a11"
          expected_target="a070af09f9cb1fcda78987e83bc117d7544d1b6c"

          if source_sha==expected_target:
              print("Micro-diff déjà appliqué exactement.")
              raise SystemExit(0)
          if source_sha!=expected_source:
              raise SystemExit(f"REFUS: blob index.html inattendu: {source_sha}")

          text=raw.decode("utf-8")
          old_read='function loadEffects(){try{const a=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(a)?a:[]}catch(e){return[]}}'
          new_read='function loadEffects(){const a=GensStorageV1.readJson(localStorage,KEY,[]);return Array.isArray(a)?a:[]}'
          old_write='function saveEffects(a){localStorage.setItem(KEY,JSON.stringify(a||[]))}'
          new_write='function saveEffects(a){GensStorageV1.writeJson(localStorage,KEY,a||[])}'

          if text.count(old_read)!=1:
              raise SystemExit(f"REFUS: anciennes lectures Manual MJ: {text.count(old_read)}")
          if text.count(old_write)!=1:
              raise SystemExit(f"REFUS: anciennes écritures Manual MJ: {text.count(old_write)}")

          text=text.replace(old_read,new_read).replace(old_write,new_write)
          target=text.encode("utf-8")
          target_sha=blob_sha(target)

          if len(target)!=8174580:
              raise SystemExit(f"REFUS: taille cible inattendue: {len(target)}")
          if target_sha!=expected_target:
              raise SystemExit(f"REFUS: blob cible inattendu: {target_sha}")
          if text.count("localStorage.getItem(KEY)") < 0:
              raise SystemExit("REFUS: vérification impossible")
          block_start=text.index('<script id="dungeonCore046ManualMjAssist">')
          block_end=text.index('</script>',block_start)
          block=text[block_start:block_end]
          if "localStorage.getItem(KEY)" in block or "localStorage.setItem(KEY" in block:
              raise SystemExit("REFUS: accès direct Manual MJ restant")
          if block.count("GensStorageV1.readJson(localStorage,KEY,[])")!=1:
              raise SystemExit("REFUS: nombre de lectures Core Manual MJ incorrect")
          if block.count("GensStorageV1.writeJson(localStorage,KEY,a||[])")!=1:
              raise SystemExit("REFUS: nombre d'écritures Core Manual MJ incorrect")
          if "gensrpg_dungeon_runtime_v2" in block:
              raise SystemExit("REFUS: runtime_v2 est hors périmètre")

          path.write_bytes(target)
          print("Micro-diff Manual MJ vérifié:", target_sha)

      - name: Vérifier le diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html

      - name: Committer uniquement index.html si nécessaire
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "refactor: route Manual MJ effects JSON through Core storage"
          git push origin HEAD:work/gensrpg-phase4-storage-manual-mj-effects-2026-09-20
