name: GenSrpG Phase 9 Capture public-entry one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-public-entry-raccord-2026-10-03'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-public-entry-raccord-apply.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply-public-entry-raccord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "02a052bc231728eb383e17c83e61a958be0ac58c"
          test "$(wc -c < index.html)" = "8169555"

      - name: Apply exact Capture public-entry seam
        run: python tools/gensrpg_phase9_capture_public_entry_apply.py

      - name: Verify exact runtime result
        run: |
          test "$(git hash-object index.html)" = "f523410e175ee4946059da8e8ee8519295fb63c5"
          test "$(wc -c < index.html)" = "8169430"
          test "$(grep -o 'assets/gensrpg/capture/entry-v1.js' index.html | wc -l)" = "1"
          test "$(grep -o 'GensShellModuleLaunchV1.register("capture"' index.html | wc -l)" = "0"
          test "$(grep -o 'GensCaptureV1.install' index.html | wc -l)" = "1"

      - name: Run dedicated TDD target
        run: node tests/gens_phase9_capture_public_entry_raccord_v1.test.cjs

      - name: Review diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html assets/gensrpg/capture/entry-v1.js assets/gensrpg/capture/module-contract-v1.json | sed -n '1,220p'
          echo "Historical exact-blob sentinels still mentioning old baseline:"
          grep -RIl --exclude-dir=.git '02a052bc231728eb383e17c83e61a958be0ac58c\|8169555' tests || true

      - name: Commit exact runtime seam
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gensrpg/capture/entry-v1.js assets/gensrpg/capture/module-contract-v1.json
          test "$(git diff --cached --name-only | wc -l)" = "3"
          git commit -m "refactor: route Capture provider through public entry"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Dispatch required validation on runtime SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run gensrpg-architecture-sentinels.yml --ref "$GITHUB_REF_NAME"
          gh workflow run gensrpg-firefox-wall-sentinel.yml --ref "$GITHUB_REF_NAME"
          gh workflow run gensrpg-tactical-dock-sentinel.yml --ref "$GITHUB_REF_NAME"
