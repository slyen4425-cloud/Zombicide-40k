name: Validate V16.78.114.4 Combat Session Recovery + Tactical UX

on:
  push:
    branches:
      - work/v16.78.114-wall-detection-dice
      - work/v16.78.114.1-keep-vision-revert-wall-dice
      - work/v16.78.114.2-builder-wall-survival-dice
      - work/v16.78.114.3-wall-dice-transition-menu
      - work/v16.78.114.4-combat-session-recovery
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax tactical hotfix chain
        run: |
          node --check assets/gensrpg/gens-rpg-tactical-session-guard-16781144.js
          node --check assets/gensrpg/gens-rpg-tactical-hotfix-1678114.js
          node --check assets/gensrpg/gens-rpg-tactical-visual-dice-16781142.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-integration.js
          node --check assets/gensrpg/gens-rpg-tactical-runtime-authority-1678113.js
      - name: Exact V114.4 menu recovery and no-legacy scenarios
        run: node tests/gens_rpg_tactical_session_guard_v16781144.test.cjs
      - name: Exact V114.3 live-vision wall fast-dice transition and menu scenarios
        run: node tests/gens_rpg_tactical_hotfix_v1678114.test.cjs
      - name: Preserve V113 room and sub-room scoping
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113.test.cjs
      - name: Preserve V112 combat coherence and result explanations
        run: node tests/gens_rpg_tactical_combat_coherence_v1678112.test.cjs
      - name: Preserve weapon dice and tactical runtime fixes
        run: node tests/gens_rpg_tactical_runtime_fixes_v1678111.test.cjs
      - name: Preserve canonical tactical stats
        run: node tests/gens_rpg_tactical_combat_v2_stats_v1678110.test.cjs
      - name: Preserve mobile combat performance
        run: node tests/gens_mobile_combat_performance_v16781022.test.cjs
      - name: Preserve Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Preserve Survival isolation
        run: node tests/gens_survival_mode_isolation_v1678104.test.cjs