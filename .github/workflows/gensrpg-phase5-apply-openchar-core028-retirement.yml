name: GenSrpG Phase5 apply Core028 openChar retirement

on:
  push:
    branches:
      - work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
    paths:
      - .github/runtime-patches/gens_phase5_openchar_core028_retirement.patch
      - .github/workflows/gensrpg-phase5-apply-openchar-core028-retirement.yml

permissions:
  contents: write

jobs:
  apply-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
          fetch-depth: 0

      - name: Verify exact S2 base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "7b586e9fb14b7a93a0edb069e115fd6d48cbda97"
          test "$(wc -c < index.html)" = "8172500"

      - name: Apply deterministic Core 0.28 retirement
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/runtime-patches/gens_phase5_openchar_core028_retirement.patch
          git apply .github/runtime-patches/gens_phase5_openchar_core028_retirement.patch
          test "$(git hash-object index.html)" = "d9ee34d47fa888795db68cdc244d0c73d30ee523"
          test "$(wc -c < index.html)" = "8170726"

      - name: Commit runtime only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenSrpG Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: retire Dungeon Core 0.28 openChar wrapper"
          git push origin HEAD:work/gensrpg-phase5-openchar-core028-retirement-2026-09-23
