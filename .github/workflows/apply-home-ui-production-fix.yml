name: Apply home UI editor observer fix
on:
  push:
    branches:
      - fix/home-ui-observers-2026-09-05
    paths:
      - .github/workflows/apply-home-ui-production-fix.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Dungeon editor UI refresh event-driven
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          changes={
          'assets/dungeon/dungeon-room-creator-100.js': [
            ('if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();if(typeof MutationObserver==="function")new MutationObserver(()=>ensureLauncher()).observe(DOC.documentElement,{childList:true,subtree:true})}',
             'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(ensureLauncher,0),true)}')],
          'assets/dungeon/dungeon-room-creator-v2-167819.js': [
            ('if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();if(typeof MutationObserver==="function")new MutationObserver(()=>{ensureCacheTool();ensurePanel()}).observe(DOC.documentElement,{childList:true,subtree:true})}else install();',
             'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(()=>{ensureCacheTool();ensurePanel()},0),true)}else install();')],
          'assets/dungeon/dungeon-world-builder-167821.js': [
            ('if(typeof MutationObserver==="function")new MutationObserver(()=>{ensureLauncher();ensureModal()}).observe(DOC.documentElement,{childList:true,subtree:true});',
             'DOC.addEventListener("click",()=>setTimeout(()=>{ensureLauncher();ensureModal()},0),true);')],
          'assets/dungeon/dungeon-room-runtime-167822.js': [
            ('if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();if(typeof MutationObserver==="function")new MutationObserver(()=>{installExploreWrapper();ensureConfigPanel()}).observe(DOC.documentElement,{childList:true,subtree:true})}',
             'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(()=>{installExploreWrapper();ensureConfigPanel()},0),true)}')],
          'assets/dungeon/dungeon-zone-content-167824.js': [
            ('if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();if(typeof MutationObserver==="function")new MutationObserver(()=>{ensureLauncher();wrapCore();ensureInteractionPanel()}).observe(DOC.documentElement,{childList:true,subtree:true})}else wrapCore();',
             'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(()=>{ensureLauncher();wrapCore();ensureInteractionPanel()},0),true)}else wrapCore();')],
          'assets/dungeon/dungeon-room-visual-config-167826.js': [
            ('if(DOC&&typeof MutationObserver==="function")new MutationObserver(()=>{hideLegacyLauncher();ensurePanel();wrapRoomApi();decorateGrid()}).observe(DOC.documentElement,{childList:true,subtree:true});',
             'if(DOC)DOC.addEventListener("click",()=>setTimeout(()=>{hideLegacyLauncher();ensurePanel();wrapRoomApi();decorateGrid()},0),true);')],
          'assets/dungeon/dungeon-set-editor-167818.js': [
            ('try{new ROOT.MutationObserver(()=>{ensureSection();addNewButton()}).observe(DOC.documentElement||DOC.body,{childList:true,subtree:true})}catch(e){}',
             'try{DOC.addEventListener("click",()=>setTimeout(()=>{ensureSection();addNewButton()},0),true)}catch(e){}')],
          }
          for name,repls in changes.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              for old,new in repls:
                  n=text.count(old)
                  if n!=1: raise SystemExit(f'{name}: expected one observer block, found {n}')
                  text=text.replace(old,new)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Static guards
        shell: bash
        run: |
          files=(
            assets/dungeon/dungeon-room-creator-100.js
            assets/dungeon/dungeon-room-creator-v2-167819.js
            assets/dungeon/dungeon-world-builder-167821.js
            assets/dungeon/dungeon-room-runtime-167822.js
            assets/dungeon/dungeon-zone-content-167824.js
            assets/dungeon/dungeon-room-visual-config-167826.js
            assets/dungeon/dungeon-set-editor-167818.js
          )
          for f in "${files[@]}"; do node --check "$f"; done
          for f in "${files[@]}"; do
            ! grep -Eq 'MutationObserver.*observe\(DOC\.(documentElement|body)|observe\(DOC\.documentElement' "$f"
          done
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/dungeon/dungeon-room-creator-100.js assets/dungeon/dungeon-room-creator-v2-167819.js assets/dungeon/dungeon-room-runtime-167822.js assets/dungeon/dungeon-room-visual-config-167826.js assets/dungeon/dungeon-set-editor-167818.js assets/dungeon/dungeon-world-builder-167821.js assets/dungeon/dungeon-zone-content-167824.js "
      - name: Run affected Dungeon regressions
        shell: bash
        run: |
          node tests/dungeon_room_creator_v1.test.cjs
          node tests/dungeon_room_creator_v2_v167819.test.cjs
          node tests/dungeon_world_builder_v167821.test.cjs
          node tests/dungeon_room_runtime_v167822.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
      - name: Validate final assembled load contract
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -f index.html _site/index.html
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          index=Path('_site/index.html')
          modules=[
            '<script src="assets/dungeon/dungeon-core-318.js"></script>',
            '<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-100.js"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>',
            '<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>',
            '<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>',
            '<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>',
            '<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>',
            '<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167840"></script>',
            '<script src="assets/dungeon/dungeon-equipment-ui.js"></script>',
            '<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>',
            '<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>',
            '<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>',
          ]
          html=index.read_text(encoding='utf-8')
          for tag in modules:
              if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          index.write_text(html,encoding='utf-8')
          PY
          node tests/dungeon_final_load_regression.test.cjs _site/index.html
      - name: Commit only production fix and remove temporary diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _site
          git rm -f .github/workflows/apply-home-ui-production-fix.yml .github/workflows/bisect-home-dom-load.yml .github/workflows/isolate-home-browser-freeze.yml
          git add assets/dungeon/dungeon-room-creator-100.js assets/dungeon/dungeon-room-creator-v2-167819.js assets/dungeon/dungeon-world-builder-167821.js assets/dungeon/dungeon-room-runtime-167822.js assets/dungeon/dungeon-zone-content-167824.js assets/dungeon/dungeon-room-visual-config-167826.js assets/dungeon/dungeon-set-editor-167818.js
          git diff --cached --check
          git commit -m "Make Dungeon editor UI refresh event-driven"
          git push
