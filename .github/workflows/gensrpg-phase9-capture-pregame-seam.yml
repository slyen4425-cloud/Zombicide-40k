name: GenSrpG Phase 9 Capture pregame seam

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-post-shell-dungeon-identity-preaudit-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-pregame-seam.yml'

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "99d7784676669b629cae6070df8c02606d67002f"
          test "$(wc -c < index.html)" = "8167187"

      - name: Apply minimal Capture pregame identity seam
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='const captureFamily=!!active && active.gameStyle==="dungeon" && typeof gensCurrentContentFamily==="function" && gensCurrentContentFamily()==="creature";'
          new='const captureFamily=!!active && typeof gensCapturePregameMode==="function" && gensCapturePregameMode();'
          assert s.count(old)==1, f"expected exactly one old seam, found {s.count(old)}"
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
          test "$(git hash-object index.html)" = "09b1e19c04777da82fd0ad355adc7eb82532db29"
          test "$(wc -c < index.html)" = "8167138"

      - name: Repin exact runtime fingerprints only
        run: |
          python - <<'PY'
          from pathlib import Path
          old_blob="99d7784676669b629cae6070df8c02606d67002f"
          new_blob="09b1e19c04777da82fd0ad355adc7eb82532db29"
          old_size="8167187"
          new_size="8167138"

          changed=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          for p in [
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
          ]:
              if not p.exists():
                  continue
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          print("REPinned",len(changed),"files")
          for p in changed:
              print(p)
          PY

      - name: Verify scope and exact seam
        run: |
          test "$(git hash-object index.html)" = "09b1e19c04777da82fd0ad355adc7eb82532db29"
          test "$(wc -c < index.html)" = "8167138"
          grep -F 'const captureFamily=!!active && typeof gensCapturePregameMode==="function" && gensCapturePregameMode();' index.html
          ! grep -F 'const captureFamily=!!active && active.gameStyle==="dungeon" && typeof gensCurrentContentFamily==="function" && gensCurrentContentFamily()==="creature";' index.html
          grep -F 'document.body.classList.toggle("gensAdventurePregame",!!active&&active.gameStyle==="dungeon");' index.html
          git diff --check

      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Re-run Capture pregame sentinel
        run: node tests/gens_phase9_capture_post_shell_without_dungeon_style_browser_characterization_v1.test.cjs

      - name: Re-run Shell routing sentinel
        run: node tests/gens_phase9_capture_seed_without_dungeon_style_browser_characterization_v1.test.cjs

      - name: Remove temporary transport workflows
        run: |
          rm -f .github/workflows/gensrpg-phase9-capture-pregame-red-check.yml
          rm -f .github/workflows/gensrpg-phase9-capture-pregame-seam.yml

      - name: Commit candidate GREEN
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(phase9): decouple Capture pregame identity from Dungeon style"
          git push origin "HEAD:$GITHUB_REF_NAME"
