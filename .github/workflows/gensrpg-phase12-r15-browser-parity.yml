name: GenSrpG Phase12 R15 real Builders editor Chromium/Firefox parity
on:
  push:
    branches:
      - 'work/gensrpg-phase12-r15-builders-character-entity-editors-2026-10-20'
permissions:
  contents: read
  statuses: write
jobs:
  browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install isolated Playwright browser environment
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/gensrpg-r15-playwright playwright@1.56.1
          /tmp/gensrpg-r15-playwright/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: R14-to-R15 real hero/creature save/reload and R13-to-R14 RPG parity
        shell: bash
        env:
          R15_PLAYWRIGHT_DIR: /tmp/gensrpg-r15-playwright
          R14_PLAYWRIGHT_DIR: /tmp/gensrpg-r15-playwright
          R15_TEST_URL: http://127.0.0.1:8879/index.html
          R14_TEST_URL: http://127.0.0.1:8879/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8879 --bind 127.0.0.1 > /tmp/gensrpg_r15_server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null 'http://127.0.0.1:8879/index.html'; then break; fi
            sleep 1
          done
          curl -fIs 'http://127.0.0.1:8879/assets/gensrpg/builders/legacy-character-entity-editors-v1.js'
          node tests/gensrpg_phase12_r15_builders_browser_parity.cjs
          node tests/gensrpg_phase12_r14_rpg_editor_browser_parity.cjs
      - name: Legacy Survival/Dungeon enemy customization browser invariant
        shell: bash
        env:
          NODE_PATH: /tmp/gensrpg-r15-playwright/node_modules
        run: |
          set -euo pipefail
          legacy_pkg="$(node -p 'require.resolve("playwright/package.json",{paths:[process.cwd()+"/tests"]})')"
          node "$(dirname "$legacy_pkg")/cli.js" install chromium
          node tests/gens_phase6_survival_builtin_boundary_browser_characterization_v1.test.cjs
      - name: Report browser status on immutable commit SHA
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          payload="$(jq -nc --arg state "$state" --arg context 'gensrpg/r15/browser-parity' --arg description "R15 Chromium/Firefox hero, creature, RPG and Survival save/reload - $JOB_RESULT" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$url}')"
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
