name: GenSrpG Phase 9 old runtime fingerprint audit

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture139-active-enemies-retirement-2026-10-04'
    paths:
      - '.github/workflows/gensrpg-phase9-old-fingerprint-audit.yml'

permissions:
  contents: read

jobs:
  audit-old-runtime-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
      - name: List remaining old runtime fingerprint references
        run: |
          echo "OLD_BLOB_FILES"
          grep -RIl --exclude-dir=.git '3438e75b607d0b9bb68eb1d3edc2d97b3bd662ed' tests docs .github tools 2>/dev/null | sort || true
          echo "OLD_BLOB_COUNT"
          grep -RIl --exclude-dir=.git '3438e75b607d0b9bb68eb1d3edc2d97b3bd662ed' tests docs .github tools 2>/dev/null | wc -l
