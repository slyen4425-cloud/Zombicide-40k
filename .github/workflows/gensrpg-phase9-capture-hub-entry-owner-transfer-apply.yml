name: GenSrpG Phase 9 Capture Hub UI owner exact apply one-shot v3

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-hub-entry-owner-transfer-2026-10-09'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-hub-entry-owner-transfer-apply.yml'

permissions:
  contents: write

jobs:
  apply-hub-owner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dedicated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "26421e0347305437fe2b1dc149b3e4fb8b3761bd"
          test "$(wc -c < index.html)" = "8165823"

      - name: Verify TDD RED on legacy owner
        run: |
          if node tests/gens_phase9_capture_hub_entry_owner_transfer_v1.test.cjs >/tmp/hub-red.log 2>&1; then
            echo "Expected RED on legacy runtime; test unexpectedly passed"
            exit 1
          fi
          grep -q "exact Hub owner extraction must be applied" /tmp/hub-red.log || (cat /tmp/hub-red.log && exit 1)
          echo "Verified TDD RED before runtime change"

      - name: Apply only approved Hub visual transition seam
        run: python tools/gensrpg_phase9_capture_hub_entry_owner_transfer_apply.py

      - name: Verify exact result and GREEN parity
        run: |
          test "$(git hash-object index.html)" = "18627cc0c5fc7945732c8a910504c59ef823b6ae"
          test "$(wc -c < index.html)" = "8165398"
          node tests/gens_phase9_capture_hub_entry_owner_transfer_v1.test.cjs
          node tests/gens_phase9_capture_hub_world_owner_characterization_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_setup_entry_owner_transfer_v1.test.cjs
          node tests/gens_phase5_module_screen_return_capture_raccord_v1.test.cjs
          node tests/gens_phase5_gomenu_core01_retirement_v1.test.cjs

      - name: Verify bounded diff, no unrelated runtime edits
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html | sed -n '1,170p'
          ! git diff --name-only | grep -E '^assets/gensrpg/|^preview.html$|^service-worker.js$'
          test "$(git diff --name-only | grep -c '^index.html$')" = "1"

      - name: Commit exact transfer without main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json
          git commit -m "refactor(phase9): transfer Capture Hub visual entry ownership with exact rollback"
          git push origin "HEAD:$GITHUB_REF_NAME"
