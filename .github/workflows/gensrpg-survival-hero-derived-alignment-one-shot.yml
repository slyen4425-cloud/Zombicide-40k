name: GenSrpG Survival hero derived alignment one-shot

on:
  push:
    branches:
      - 'work/gensrpg-survival-hero-availability-regression-2026-09-23'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime and align derived fingerprints
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "6e76a99af5fb839db5ffb20a2e67fd1572bf13ea"
          test "$(wc -c < index.html | tr -d ' ')" = "8171571"

          python3 - <<'PY'
          from pathlib import Path

          OLD_BLOB="6a9392e667881f2087e4df931645cada4201cb3c"
          NEW_BLOB="6e76a99af5fb839db5ffb20a2e67fd1572bf13ea"
          OLD_SIZE="8171079"
          NEW_SIZE="8171571"

          changed=[]

          # Exact runtime fingerprints in tests are derived from index.html.
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(OLD_BLOB,NEW_BLOB).replace(OLD_SIZE,NEW_SIZE)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          # Phase 2 maps keep the same ownership/counts; only their source blob moves.
          derived=[
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
          ]
          for p in derived:
              s=p.read_text(encoding="utf-8")
              if s.count(OLD_BLOB)!=1:
                  raise SystemExit(f"{p}: expected exactly one old source blob, got {s.count(OLD_BLOB)}")
              p.write_text(s.replace(OLD_BLOB,NEW_BLOB,1),encoding="utf-8")
              changed.append(str(p))

          # No current test may still lock the superseded exact runtime fingerprint.
          stale=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              if OLD_BLOB in s or OLD_SIZE in s:
                  stale.append(str(p))
          if stale:
              raise SystemExit("stale runtime fingerprints remain: "+", ".join(stale))

          print("aligned files:")
          for x in changed: print(x)
          PY

      - name: Commit derived alignment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv                   docs/GENSRPG_PHASE2_INLINE_OWNERS.json                   docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json                   docs/GENSRPG_PHASE2_STORAGE_OWNERS.json                   docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json                   tests
          git rm .github/workflows/gensrpg-survival-hero-derived-alignment-one-shot.yml
          git commit -m "test: align Survival hero repair derivatives"
          git push origin HEAD:work/gensrpg-survival-hero-availability-regression-2026-09-23
