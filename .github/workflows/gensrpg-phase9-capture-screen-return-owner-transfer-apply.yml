name: GenSrpG Phase 9 Capture screen-return owner transfer one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-screen-return-owner-transfer-2026-10-08'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-screen-return-owner-transfer-apply.yml'

permissions:
  contents: write

jobs:
  transfer-capture-screen-return:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 source supplied by user
        run: |
          test "$(git hash-object index.html)" = "462abc969e7ac636f8ac4ee54c0d14fe51b83e7d"
          test "$(wc -c < index.html)" = "8165794"

      - name: Prove RED before owner transfer
        run: |
          if node tests/gens_phase9_capture_screen_return_owner_transfer_v1.test.cjs > /tmp/capture-red.log 2>&1; then
            echo "Expected RED guard unexpectedly passed"; exit 1
          fi
          grep -q 'Capture screen-return owner must be loaded exactly once' /tmp/capture-red.log
          echo "RED verified: physical owner still Capture139"

      - name: Apply byte-exact seam and mechanical metadata/test repin
        run: python tools/gensrpg_phase9_capture_screen_return_owner_transfer_apply.py

      - name: Verify exact target and focused GREEN
        run: |
          test "$(git hash-object index.html)" = "26421e0347305437fe2b1dc149b3e4fb8b3761bd"
          test "$(wc -c < index.html)" = "8165823"
          node tests/gens_phase9_capture_screen_return_owner_transfer_v1.test.cjs
          node tests/gens_phase5_module_screen_return_capture_raccord_v1.test.cjs
          node tests/gens_phase5_module_screen_return_dungeon_s2_v1.test.cjs
          node tests/gens_phase9_capture_screen_return_ownership_preaudit_v1.test.cjs
          node tests/gens_phase3_target_structure_contracts_v1.test.cjs

      - name: Check owner diff without gameplay changes
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html | head -n 120

      - name: Commit owner transfer to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gensrpg/capture/module-contract-v1.json docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json tests
          git commit -m "refactor(phase9): transfer sole Capture screen-return provider to module owner"
          git push origin "HEAD:$GITHUB_REF_NAME"
