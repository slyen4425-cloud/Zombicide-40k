name: One-shot Phase 6 custom enemy without Dungeon ensure

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-custom-enemy-dungeon-ensure-2026-09-25
    paths:
      - .github/workflows/oneshot-phase6-survival-custom-enemy-dungeon-ensure-characterization.yml

permissions:
  contents: write

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-custom-enemy-dungeon-ensure-2026-09-25

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Characterize refresh without ensureDungeonEnemies
        run: node tests/gens_phase6_survival_custom_enemy_without_dungeon_ensure_browser_characterization_v1.test.cjs

      - name: Remove temporary workflow
        if: success()
        run: |
          rm .github/workflows/oneshot-phase6-survival-custom-enemy-dungeon-ensure-characterization.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneshot-phase6-survival-custom-enemy-dungeon-ensure-characterization.yml
          git commit -m "ci: remove custom enemy Dungeon ensure characterization workflow"
          git push origin HEAD:work/gensrpg-phase6-survival-custom-enemy-dungeon-ensure-2026-09-25
