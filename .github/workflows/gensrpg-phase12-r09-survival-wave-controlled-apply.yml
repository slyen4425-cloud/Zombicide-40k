name: GenSrpG Phase12 R09 guarded Survival wave extraction
on:
  push:
    branches:
      - 'work/gensrpg-phase12-r09-survival-wave-spawn-2026-10-18'
    paths:
      - 'tools/gensrpg_phase12_r09_wave_extract_apply.cjs'
permissions:
  contents: write
jobs:
  guarded-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify user supplied exact d7 R08 GREEN index
        run: |
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase12-r09-survival-wave-spawn-2026-10-18'
          test "$(git hash-object index.html)" = '6eeed45a0a12085c1b107ee6c24b49040277ca54'
          test ! -e assets/gensrpg/survival/legacy-wave-presets-spawn-v1.js
          node tools/gensrpg_phase12_r09_wave_extract_apply.cjs --check-source
      - name: Extract original Survie functions and verify bit-exact rollback
        run: |
          node tools/gensrpg_phase12_r09_wave_extract_apply.cjs --apply
          node tools/gensrpg_phase12_r09_wave_extract_apply.cjs --verify
          node --check assets/gensrpg/survival/legacy-wave-presets-spawn-v1.js
          git -c core.whitespace=-blank-at-eof diff --check
      - name: Commit only on R09 work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/gensrpg/survival/legacy-wave-presets-spawn-v1.js service-worker.js docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json
          git -c core.whitespace=-blank-at-eof diff --cached --check
          git commit -m 'refactor(phase12): extract 72 Survival wave and spawn functions with byte-exact rollback'
          git push origin "HEAD:$GITHUB_REF_NAME"
