name: GenSrpG storage audit 10 probe

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-next-audit-10-2026-09-20

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute Dungeon Scene target blob
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const b=fs.readFileSync('index.html');
          const s=b.toString('utf8');
          const sourceRead='JSON.parse(localStorage.getItem(GENS_DUNGEON_SCENE_KEY)||"[]")';
          const targetRead='GensStorageV1.readJson(localStorage,GENS_DUNGEON_SCENE_KEY,[])';
          const sourceWrite='localStorage.setItem(GENS_DUNGEON_SCENE_KEY,JSON.stringify(a||[]))';
          const targetWrite='GensStorageV1.writeJson(localStorage,GENS_DUNGEON_SCENE_KEY,a||[])';
          const count=(hay,needle)=>hay.split(needle).length-1;
          console.log({sourceRead:count(s,sourceRead),sourceWrite:count(s,sourceWrite)});
          if(count(s,sourceRead)!==1||count(s,sourceWrite)!==1) throw new Error('unexpected Dungeon Scene source count');
          const t=s.replace(sourceRead,targetRead).replace(sourceWrite,targetWrite);
          const blob=x=>crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob '+Buffer.byteLength(x)+'\0'),Buffer.from(x)])).digest('hex');
          console.log(JSON.stringify({
            sourceSize:b.length,
            sourceBlob:blob(s),
            targetSize:Buffer.byteLength(t),
            targetBlob:blob(t),
            targetReadCount:count(t,targetRead),
            targetWriteCount:count(t,targetWrite)
          },null,2));
          NODE
