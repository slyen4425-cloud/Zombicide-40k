name: GenSrpG Phase 9 Capture seed retirement apply

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-dungeon-style-retirement-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-seed-retirement-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "09b1e19c04777da82fd0ad355adc7eb82532db29"
          test "$(wc -c < index.html)" = "8167138"

      - name: Apply exact Monster Capture seed retirement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          start=s.index('<script id="builtinMonsterCapture162">')
          end=s.index('</script>',start)
          block=s[start:end]
          needle='"gameStyle":"dungeon",'
          assert block.count(needle)==2, f"expected exactly 2 Capture seed/factory occurrences, got {block.count(needle)}"
          newblock=block.replace(needle,'')
          assert needle not in newblock
          out=s[:start]+newblock+s[end:]
          p.write_text(out,encoding="utf-8")
          assert 'gameStyle:"dungeon"' in out, "generic RPG constructor Dungeon style must remain"
          PY

      - name: Repin cumulative runtime fingerprints only
        run: |
          python - <<'PY'
          from pathlib import Path

          old_blob="09b1e19c04777da82fd0ad355adc7eb82532db29"
          new_blob="4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          old_size="8167138"
          new_size="8167094"

          changed=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          manifests=[
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
          ]
          for p in manifests:
              if not p.exists():
                  continue
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          print("repinned",len(changed),"files")
          for p in changed:
              print(p)
          PY

      - name: Verify exact runtime result
        run: |
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          test "$(wc -c < index.html)" = "8167094"
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          start=s.index('<script id="builtinMonsterCapture162">')
          end=s.index('</script>',start)
          block=s[start:end]
          assert '"gameStyle":"dungeon"' not in block
          assert 'gameStyle:"dungeon"' in s
          PY
          git diff --check

      - name: Run Phase 9 seed and compatibility sentinels
        run: |
          node tests/gens_phase9_capture_seed_dungeon_style_retirement_v1.test.cjs
          node tests/gens_phase9_capture_seed_without_dungeon_style_browser_characterization_v1.test.cjs
          node tests/gens_phase9_capture_post_shell_without_dungeon_style_browser_characterization_v1.test.cjs
          node tests/gens_phase9_capture_persisted_profile_without_dungeon_style_resume_characterization_v1.test.cjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/gensrpg-phase9-capture-seed-retirement-apply.yml

      - name: Verify final scope
        run: |
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          test "$(wc -c < index.html)" = "8167094"
          test ! -e .github/workflows/gensrpg-phase9-capture-seed-retirement-apply.yml
          git diff --check
          git status --short

      - name: Commit exact GREEN candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(phase9): retire Dungeon style from Capture seed"
          git push origin "HEAD:$GITHUB_REF_NAME"
