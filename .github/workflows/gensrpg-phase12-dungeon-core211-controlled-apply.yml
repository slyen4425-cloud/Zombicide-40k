name: GenSrpG Phase 12 Dungeon Core211 D3 controlled apply

on:
  push:
    branches:
      - 'work/gensrpg-phase12-dungeon-core211-d3-extraction-2026-10-13'
    paths:
      - '.github/workflows/gensrpg-phase12-dungeon-core211-controlled-apply.yml'
      - 'tools/gensrpg_phase12_dungeon_core211_extract_apply.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pinned D3 single-owner extraction
        run: |
          test "$GITHUB_REF_NAME" = "work/gensrpg-phase12-dungeon-core211-d3-extraction-2026-10-13"
          test "$(git hash-object index.html)" = "e5f8895495f969597a6c209fcc29afd66b7a0636"
          python3 tools/gensrpg_phase12_dungeon_core211_extract_apply.py --apply
          python3 tools/gensrpg_phase12_dungeon_core211_extract_apply.py --verify
          node --check assets/gensrpg/dungeon/core211-consolidation-v1.js
          node tests/gens_phase12_dungeon_core211_extraction_v1.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs
          node tests/gens_phase3_target_structure_contracts_v1.test.cjs
          node tests/gens_phase2_global_owner_inventory_v11411.test.cjs
          node tests/gens_runtime_composition_guard_v11411.test.cjs
      - name: Publish D3 only to its own branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gensrpg/dungeon/core211-consolidation-v1.js tests/ docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json tools/gensrpg_phase12_dungeon_core01_extract_apply.py tools/gensrpg_phase12_dungeon_core051_extract_apply.py
          git diff --cached --check
          git commit -m "refactor(phase12): extract active Dungeon Core211 owner byte-exact"
          git push origin "HEAD:$GITHUB_REF_NAME"
