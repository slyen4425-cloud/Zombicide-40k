name: Validate V16.78.113 Authoritative Runtime

on:
  push:
    branches:
      - work/v16.78.107.1-tactical-readability-roll-walls
      - work/v16.78.108-detection-texture-pawn-actions
      - work/v16.78.109-timeline-range-wall-ux
      - work/v16.78.110-full-stat-tactical
      - work/v16.78.111-tactical-runtime-fixes
      - work/v16.78.112-combat-coherence
      - work/v16.78.113-authoritative-runtime-fixes
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax tactical routing and UI modules
        run: |
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-bridge.js
          node --check assets/gensrpg/gens-rpg-runtime-repair-1678106.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-polish-1678108.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-polish-1678109.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-stats-1678110.js
          node --check assets/gensrpg/gens-rpg-tactical-runtime-fixes-1678111.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-coherence-1678112.js
          node --check assets/gensrpg/gens-rpg-tactical-runtime-authority-1678113.js
          node --check assets/gensrpg/gens-mobile-combat-performance-16781022.js
      - name: Test global Dungeon combat entry routing
        run: node tests/gens_rpg_tactical_combat_v2_entry_v1678105.test.cjs
      - name: Test real Runtime 2.00 renderer seam and Dungeon dedupe
        run: node tests/gens_rpg_runtime_repair_v1678106.test.cjs
      - name: Test tactical portraits persistent dice roll rule and walls
        run: node tests/gens_rpg_tactical_combat_v2_ui_v1678107.test.cjs
      - name: Test V16.78.108 detection texture pawn framing and action selectors
        run: node tests/gens_rpg_tactical_combat_v2_polish_v1678108.test.cjs
      - name: Test V16.78.109 timeline compact HUD quick attack unarmed range and walls
        run: node tests/gens_rpg_tactical_combat_v2_polish_v1678109.test.cjs
      - name: Test V16.78.110 cached canonical stats combat rules and fixed action dock
        run: node tests/gens_rpg_tactical_combat_v2_stats_v1678110.test.cjs
      - name: Test V16.78.111 runtime walls fixed dock weapon dice and detection
        run: node tests/gens_rpg_tactical_runtime_fixes_v1678111.test.cjs
      - name: Test V16.78.112 room perception vision sheets dice and walls
        run: node tests/gens_rpg_tactical_combat_coherence_v1678112.test.cjs
      - name: Test V16.78.113 branch scope real detection seam dice animation and wall authority
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113.test.cjs
      - name: Test V16.78.113 bridge to adapter authoritative participant scope
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113_bridge.test.cjs
      - name: Test tactical grid engine
        run: node tests/gens_rpg_tactical_combat_v2.test.cjs
      - name: Test tactical adapter
        run: node tests/gens_rpg_tactical_combat_v2_adapter.test.cjs
      - name: Test tactical bridge and cover
        run: node tests/gens_rpg_tactical_combat_v2_default.test.cjs
      - name: Guard tactical isolation
        run: node tests/gens_rpg_tactical_combat_v2_isolation.test.cjs
      - name: Preserve Survival isolation
        run: node tests/gens_survival_mode_isolation_v1678104.test.cjs
      - name: Preserve mode-aware dice and mobile combat performance guard
        run: node tests/gens_mobile_combat_performance_v16781022.test.cjs
      - name: Preserve equipment combat cache
        run: node tests/gens_equipment_combat_cache_v1678102hf1.test.cjs
      - name: Preserve canonical stat runtime link
        run: node tests/gens_clean_stats_runtime_link_v167892.test.cjs
      - name: Preserve single-authority stat engine
        run: node tests/gens_stat_engine_cleanup_v167894.test.cjs
      - name: Preserve Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
