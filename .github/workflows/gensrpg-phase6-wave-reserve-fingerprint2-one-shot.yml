name: GenSrpG one-shot Phase 6 reserve fingerprint alignment 2

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
    paths:
      - .github/workflows/gensrpg-phase6-wave-reserve-fingerprint2-one-shot.yml

permissions:
  contents: write

jobs:
  align-fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
          fetch-depth: 0

      - name: Align remaining exact runtime fingerprints only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_blob="fb8c77504ed067fb094374260b459f8d1fb7e824"
          new_blob="afc271f9e038f77c5c78caa9f4445d0e49eaea5d"
          old_size="8169503"
          new_size="8169047"

          expected={
            "docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json":(1,0),
            "docs/GENSRPG_PHASE2_STORAGE_OWNERS.json":(1,0),
            "tests/gens_phase4_storage_next_audit_3_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_next_audit_5_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_next_audit_6_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_next_audit_8_v1.test.cjs":(2,1),
            "tests/gens_phase4_storage_next_audit_9_v1.test.cjs":(2,1),
            "tests/gens_phase4_storage_next_audit_10_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_next_audit_12_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_challenge_history_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_challenge_library_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_dungeon_deck_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_dungeon_scene_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_economy_rules_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_manual_mj_effects_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_mj_rules_owner_v1.test.cjs":(1,1),
            "tests/gens_phase4_storage_exit_audit_13_v1.test.cjs":(1,1),
            "tests/gens_phase4_stats_s7_snapshot_audit_v1.test.cjs":(1,1),
            "tests/gens_phase4_inventory_equipment_sets_preaudit_v1.test.cjs":(1,1),
            "tests/gens_phase4_inventory_equipped_view_slot_refs_contract_v1.test.cjs":(1,1),
          }

          for name,(want_blob,want_size) in expected.items():
              p=Path(name)
              text=p.read_text(encoding="utf-8")
              got=(text.count(old_blob),text.count(old_size))
              if got!=(want_blob,want_size):
                  raise SystemExit(f"{name}: fingerprint guard mismatch got={got} expected={(want_blob,want_size)}")
              updated=text.replace(old_blob,new_blob).replace(old_size,new_size)
              if updated==text:
                  raise SystemExit(f"{name}: expected fingerprint-only change")
              p.write_text(updated,encoding="utf-8")

          print("Aligned remaining exact runtime fingerprints in",len(expected),"files")
          PY

      - name: Commit fingerprint alignment and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase6-wave-reserve-fingerprint2-one-shot.yml
          git config user.name "gensrpg-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs tests .github/workflows/gensrpg-phase6-wave-reserve-fingerprint2-one-shot.yml
          git diff --cached --stat
          git commit -m "test: align remaining runtime fingerprints after Survival reserve normalization"
          git push origin HEAD:work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
