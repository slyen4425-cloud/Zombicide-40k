name: Validate GenSrpG V16.78.93 Stat UI

on:
  push:
    branches:
      - work/v16.78.93-stat-ui-fix

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le nettoyage UI des anciennes stats
        run: node tests/gens_rpg_stat_ui_v167893.test.cjs
      - name: Régression nettoyage moteur V16.78.91
        run: node tests/gens_rpg_legacy_cleanup_v167891.test.cjs
      - name: Régression éditeur stats V16.78.90
        run: node tests/gens_clean_stats_rebuild_v167890.test.cjs
      - name: Régression Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
