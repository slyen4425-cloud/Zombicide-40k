name: GenSrpG Phase 4 Dungeon Scene exact apply

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-dungeon-scene-2026-09-20

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-dungeon-scene-2026-09-20
          fetch-depth: 0

      - name: Apply exact Dungeon Scene transport raccord
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "30487d09481e11e5883faca1a6e49727d9cecfb6"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          pairs=[
            ('JSON.parse(localStorage.getItem(GENS_DUNGEON_SCENE_KEY)||"[]")',
             'GensStorageV1.readJson(localStorage,GENS_DUNGEON_SCENE_KEY,[])'),
            ('localStorage.setItem(GENS_DUNGEON_SCENE_KEY,JSON.stringify(a||[]))',
             'GensStorageV1.writeJson(localStorage,GENS_DUNGEON_SCENE_KEY,a||[])'),
          ]
          for old,new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence: {old!r}; got {s.count(old)}")
              s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8",newline="")
          PY
          test "$(wc -c < index.html)" = "8174580"
          test "$(git hash-object index.html)" = "ee7b474802d8bb3b1d20e3aaf2507c4666fbd054"
          git diff --check
          git diff --numstat -- index.html
          git rm ".github/workflows/gensrpg-phase4-storage-dungeon-scene-apply.yml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: route Dungeon Scene JSON through Core storage"
          git push origin HEAD:work/gensrpg-phase4-storage-dungeon-scene-2026-09-20
