name: Test V16.78.74 restored visuals
on:
  push:
    branches:
      - work/v16.78.74-restore-visual-fixes
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean stats regression
        run: node tests/gens_clean_dynamic_stats_v167873.test.cjs
      - name: Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Authored runtime regression
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Source visual stability
        run: node tests/dungeon_source_render_stability_v167877.test.cjs
      - name: Hero art repair
        run: node tests/gens_dungeon_hero_art_repair_v167874.test.cjs
      - name: Build final page
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html _site/index.html
          cp service-worker.js _site/service-worker.js
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          h=p.read_text(encoding='utf-8')
          tags=[
            '<script src="assets/dungeon/dungeon-authored-cache-visual-167852.js?v=167875"></script>',
            '<script src="assets/dungeon/dungeon-source-render-stability-167877.js?v=167877"></script>',
            '<script src="assets/gensrpg/gens-rpg-stats-clean-167874.js?v=167874"></script>',
            '<script src="assets/gensrpg/gens-dungeon-hero-art-repair-167874.js?v=167874"></script>',
          ]
          for tag in tags:
            if tag not in h:h=h.replace('</body>',tag+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
      - name: Final visual and stat guards
        run: |
          grep -q 'dungeon-source-render-stability-167877.js?v=167877' _site/index.html
          grep -q 'gens-dungeon-hero-art-repair-167874.js?v=167874' _site/index.html
          grep -q 'gens-rpg-stats-clean-167874.js?v=167874' _site/index.html
          grep -q 'gensrpg-cache-16.78.74-restored-visuals' _site/service-worker.js
          ! grep -q 'gens-rpg-stat-reconcile-167902' _site/index.html
          ! grep -q 'gens-custom-stats-167881' _site/index.html
          ! grep -q 'dungeon-grid-flicker-guard-167876.js?v=167876' _site/index.html
          node tests/dungeon_source_render_stability_v167877.test.cjs _site/index.html
          node tests/gens_dungeon_hero_art_repair_v167874.test.cjs
          node tests/gens_clean_dynamic_stats_v167873.test.cjs
