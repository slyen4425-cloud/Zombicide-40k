name: One-shot Phase 6 V165 fingerprint alignment

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
    paths:
      - .github/workflows/oneshot-phase6-v165-fingerprint-alignment.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
          fetch-depth: 0

      - name: Guard and align exact fingerprints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          OLD_BLOB="f6a11fa5c0807debc0c9950cc2caf5356c97cfc8"
          NEW_BLOB="2232d8c1d65121758646915080bd3c17be4d4cd6"
          OLD_SIZE="8170881"
          NEW_SIZE="8170472"

          index=Path("index.html").read_bytes()
          git_blob=hashlib.sha1(b"blob "+str(len(index)).encode()+b"\0"+index).hexdigest()
          assert len(index)==8170472, len(index)
          assert git_blob==NEW_BLOB, git_blob
          assert b'window.refreshCustomEnemiesIntoZombieTypes=function(){' not in index
          assert index.count(b'function refreshCustomEnemiesIntoZombieTypes(){')==1

          touched=[]
          for p in sorted(Path("tests").glob("*.test.cjs")):
              s=p.read_text()
              n=s.replace(OLD_BLOB,NEW_BLOB).replace(OLD_SIZE,NEW_SIZE)
              if n!=s:
                  p.write_text(n)
                  touched.append(str(p))

          maps=[
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
          ]
          for p in maps:
              s=p.read_text()
              assert OLD_BLOB in s, f"old blob missing from {p}"
              n=s.replace(OLD_BLOB,NEW_BLOB)
              p.write_text(n)
              touched.append(str(p))

          table=Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv")
          s=table.read_text()
          old_header="# distinctGlobals=435 assignments=757 multiOwnerGlobals=119"
          new_header="# distinctGlobals=434 assignments=755 multiOwnerGlobals=118"
          old_row="refreshCustomEnemiesIntoZombieTypes\t2\tdungeonArtRenderFix165\n"
          assert old_header in s
          assert s.count(old_row)==1
          s=s.replace(old_header,new_header).replace(old_row,"")
          table.write_text(s)

          test=Path("tests/gens_phase2_inline_global_last_owner_v11411.test.cjs")
          s=test.read_text()
          assert "assert.equal(distinctGlobals,435" in s
          assert "assert.equal(assignments,757" in s
          assert "assert.equal(multiOwnerGlobals,119" in s
          s=s.replace("assert.equal(distinctGlobals,435","assert.equal(distinctGlobals,434")
          s=s.replace("assert.equal(assignments,757","assert.equal(assignments,755")
          s=s.replace("assert.equal(multiOwnerGlobals,119","assert.equal(multiOwnerGlobals,118")
          test.write_text(s)

          # Historical pre-audit/current-work references must remain historical.
          pre=Path("docs/GENSRPG_PHASE6_SURVIVAL_CUSTOM_ENEMY_REFRESH_PREAUDIT.md").read_text()
          assert OLD_BLOB in pre and "8 170 881" in pre

          print("aligned_test_files="+str(len(set(touched))))
          for p in sorted(set(touched)): print("aligned="+p)
          print("new_runtime_size="+str(len(index)))
          print("new_runtime_blob="+git_blob)
          print("inline_globals=434 assignments=755 multiOwnerGlobals=118")
          PY

      - name: Commit alignment and self-delete
        shell: bash
        run: |
          rm .github/workflows/oneshot-phase6-v165-fingerprint-alignment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json .github/workflows/oneshot-phase6-v165-fingerprint-alignment.yml
          git diff --cached --check
          git commit -m "test: align fingerprints after V165 refresh wrapper retirement"
          git push origin HEAD:work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
