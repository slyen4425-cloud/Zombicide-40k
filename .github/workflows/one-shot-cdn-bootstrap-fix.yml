name: One-shot CDN bootstrap repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace blocking jsDelivr bootstrap dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_supabase = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new_supabase = '<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>'
          old_qrcode = '<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>'
          new_qrcode = '<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>'

          changed = False
          for old, new in ((old_supabase, new_supabase), (old_qrcode, new_qrcode)):
              if old in html:
                  html = html.replace(old, new)
                  changed = True

          if changed:
              path.write_text(html, encoding='utf-8')

          if old_supabase in path.read_text(encoding='utf-8') or old_qrcode in path.read_text(encoding='utf-8'):
              raise SystemExit('Blocking jsDelivr bootstrap dependency still present')
          PY

      - name: Commit repair if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "CDN bootstrap already repaired; nothing to commit."
            exit 0
          fi
          git commit -m "V16.78.107 hotfix: avoid jsDelivr bootstrap outage"
          git push origin HEAD:main
