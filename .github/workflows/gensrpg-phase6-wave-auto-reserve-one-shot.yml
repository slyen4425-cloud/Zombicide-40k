name: GenSrpG one-shot Phase 6 wave auto reserve

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-wave-auto-reserve-2026-09-25
    paths:
      - .github/workflows/gensrpg-phase6-wave-auto-reserve-one-shot.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-wave-auto-reserve-2026-09-25
          fetch-depth: 0

      - name: Patch exact verified index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path("index.html")
          data=p.read_bytes()
          blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          expected_size=8169596
          expected_blob="d451372389f29d0145d3f9689ca739128a0650e9"
          if len(data)!=expected_size or blob!=expected_blob:
              raise SystemExit(f"Refusing patch: index mismatch size={len(data)} blob={blob}")

          text=data.decode("utf-8")
          old_fn='''function autoReserveFromProfile(p){
            const reserve={};
            ZOMBIE_TYPES.forEach(z=>reserve[z.id]=0);
            GensSurvivalV1.waveRules.collectEnemyIds(p).forEach(id=>{
              // valeur boîte actuelle si dispo, sinon au moins 1
              reserve[id]=Math.max(1,Number(defaultZombieConfig()[id])||1);
            });
            return reserve;
          }
          '''
          if text.count(old_fn)!=1:
              raise SystemExit(f"Expected exactly one legacy owner, got {text.count(old_fn)}")
          text=text.replace(old_fn,"",1)

          replacements=[
            ("normalizeWaveReserveForProfile(p,autoReserveFromProfile(p))",
             "normalizeWaveReserveForProfile(p,GensSurvivalV1.waveRules.autoReserve(p,defaultZombieConfig()))",1),
            ("reserve=autoReserveFromProfile(profile);",
             "reserve=GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig());",2),
            ("p.reserve||autoReserveFromProfile(profile)",
             "p.reserve||GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig())",1),
            ("renderWavePresetReserve(preset?.reserve||autoReserveFromProfile(p));",
             "renderWavePresetReserve(preset?.reserve||GensSurvivalV1.waveRules.autoReserve(p,defaultZombieConfig()));",1),
            ("const auto=autoReserveFromProfile(p);",
             "const auto=GensSurvivalV1.waveRules.autoReserve(p,defaultZombieConfig());",1),
          ]
          for old,new,count in replacements:
              actual=text.count(old)
              if actual!=count:
                  raise SystemExit(f"Replacement guard failed: expected {count}, got {actual}: {old}")
              text=text.replace(old,new)

          if "function autoReserveFromProfile" in text:
              raise SystemExit("Legacy autoReserveFromProfile owner still present")
          if text.count("GensSurvivalV1.waveRules.autoReserve(")!=6:
              raise SystemExit("Expected exactly 6 direct Survival autoReserve consumers")

          out=text.encode("utf-8")
          out_blob=hashlib.sha1(f"blob {len(out)}\0".encode()+out).hexdigest()
          if len(out)!=8169503 or out_blob!="fb8c77504ed067fb094374260b459f8d1fb7e824":
              raise SystemExit(f"Unexpected patched index size={len(out)} blob={out_blob}")
          p.write_bytes(out)
          print("Patched index verified:",len(out),out_blob)
          PY

      - name: Commit runtime and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase6-wave-auto-reserve-one-shot.yml
          git config user.name "gensrpg-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html .github/workflows/gensrpg-phase6-wave-auto-reserve-one-shot.yml
          git commit -m "refactor: connect Survival wave auto reserve"
          git push origin HEAD:work/gensrpg-phase6-survival-wave-auto-reserve-2026-09-25
