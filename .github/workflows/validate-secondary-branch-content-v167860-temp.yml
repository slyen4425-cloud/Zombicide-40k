name: Validate secondary branch content V16.78.60
on:
  push:
    branches:
      - work/dungeon-branch-content-fix-2026-09-06
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-authored-action-fix-167857.js
          node --check assets/dungeon/dungeon-secondary-branch-content-fix-167860.js
          node --check assets/dungeon/dungeon-authored-bootstrap-167849.js
      - name: Targeted regressions
        run: |
          node tests/dungeon_authored_action_fix_v167857.test.cjs
          node tests/dungeon_secondary_branch_content_fix_v167860.test.cjs
      - name: Dungeon regressions
        run: |
          node tests/dungeon_zone_links_v167846.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_authored_cache_visual_v167852.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_exact_trap_runtime_v167845.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
