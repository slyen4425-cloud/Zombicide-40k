name: Fix exact Dungeon chest inventory
on:
  push:
    branches:
      - work/dungeon-chest-open-inventory-fix-2026-09-05
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dungeon-chest-open-inventory-fix-2026-09-05
      - name: Apply exact chest inventory transaction fix
        run: python3 .github/scripts/fix_exact_chest_inventory_transaction.py
      - name: Syntax and regressions
        run: |
          node --check assets/dungeon/dungeon-zone-content-167824.js
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/gens_ui_recovery_v167843.test.cjs
      - name: Commit validated fix
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add assets/dungeon/dungeon-zone-content-167824.js tests/dungeon_zone_content_v167824.test.cjs
          git commit -m "Make exact chest rewards transactional"
          git push origin HEAD:work/dungeon-chest-open-inventory-fix-2026-09-05
