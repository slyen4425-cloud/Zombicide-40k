name: Validate authored zone links
on:
  push:
    branches:
      - work/dungeon-zone-links-bidirectional-2026-09-05
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-zone-links-167846.js
          node --check assets/gensrpg/gens-ui-recovery-167843.js
      - name: Targeted Dungeon tests
        run: |
          node tests/dungeon_zone_links_v167846.test.cjs
          node tests/dungeon_exact_trap_runtime_v167845.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/gens_ui_recovery_v167843.test.cjs
          node tests/dungeon_room_template_content_v167828.test.cjs
