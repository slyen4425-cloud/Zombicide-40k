name: Validate mobile cache selector
on:
  push:
    branches:
      - work/dungeon-cache-select-mobile-fix-2026-09-06
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-zone-links-167846.js
          node --check assets/dungeon/dungeon-authored-bootstrap-167849.js
      - name: Mobile cache selector regression
        run: node tests/dungeon_zone_links_v167846.test.cjs
      - name: Authored bootstrap regression
        run: node tests/dungeon_authored_bootstrap_v167849.test.cjs
      - name: Critical authored regressions
        run: |
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
