name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-1-2026-09-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  combat-callsite-one-shot:
    if: github.ref == 'refs/heads/work/gensrpg-combat-callsite-migration-1-2026-09-16' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-combat-callsite-migration-1-2026-09-16
          fetch-depth: 0

      - name: Prove direct-entry regression is red before migration
        run: |
          if node tests/gens_combat_ui_direct_entry_migration_1.test.cjs; then
            echo 'Expected the direct-entry regression test to fail before the migration.'
            exit 1
          fi

      - name: Apply exact UI callsite migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          replacements = [
            (
              'id="dungeonCombatMenuBtn" type="button" class="startGameBtn dungeonCombatMainBtn" onclick="openDungeonCombatSetup()"',
              'id="dungeonCombatMenuBtn" type="button" class="startGameBtn dungeonCombatMainBtn" onclick="GensRpgTacticalCombatV2Bridge.requestCombat(window,{reason:\'manual-setup\',entry:\'dungeonCombatMenuBtn\'})"'
            ),
            (
              'id="dungeonCombatSheetBtn" style="display:none;flex:1;min-width:150px;background:#783c26" onclick="openDungeonCombatSetup()"',
              'id="dungeonCombatSheetBtn" style="display:none;flex:1;min-width:150px;background:#783c26" onclick="GensRpgTacticalCombatV2Bridge.requestCombat(window,{reason:\'manual-setup\',entry:\'dungeonCombatSheetBtn\'})"'
            )
          ]
          for old, new in replacements:
            count = html.count(old)
            if count != 1:
              raise SystemExit(f'Exact UI callsite precondition failed: expected 1 occurrence, got {count}')
            html = html.replace(old, new)
          index.write_text(html, encoding='utf-8')

          inv_test = Path('tests/gens_combat_callsite_inventory_v11411.test.cjs')
          text = inv_test.read_text(encoding='utf-8')
          old = 'const expected={dc200StartCombat:13,openDungeonCombatSetup:17,launchCombat200:2,startCombat:6};'
          new = 'const expected={dc200StartCombat:13,openDungeonCombatSetup:15,launchCombat200:2,startCombat:6};'
          if text.count(old) != 1:
            raise SystemExit('Inventory test precondition failed')
          inv_test.write_text(text.replace(old, new), encoding='utf-8')

          doc = Path('docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md')
          text = doc.read_text(encoding='utf-8')
          old = '| `openDungeonCombatSetup` | 17 | ancien setup de combat, boutons UI, embuscade et bridges Core historiques |'
          new = '| `openDungeonCombatSetup` | 15 | ancien setup de combat, embuscade et bridges Core historiques ; 2 boutons UI natifs migrés vers le contrat Bridge |'
          if text.count(old) != 1:
            raise SystemExit('Inventory documentation count precondition failed')
          text = text.replace(old, new)
          marker = '## Contrat cible déjà disponible\n'
          note = '''## Migration validée — lot UI manuel 1\n\nLes deux boutons natifs `#dungeonCombatMenuBtn` et `#dungeonCombatSheetBtn` sont migrés directement vers `GensRpgTacticalCombatV2Bridge.requestCombat(window, options)` avec `reason: "manual-setup"`.\n\nCe lot ne modifie ni détection, ni embuscade, ni `dc200StartCombat`, ni `startCombat`, ni `launchCombat200`.\n\n'''
          if marker not in text:
            raise SystemExit('Inventory documentation insertion marker missing')
          doc.write_text(text.replace(marker, note + marker, 1), encoding='utf-8')

          wf = Path('.github/workflows/gensrpg-architecture-sentinels.yml')
          text = wf.read_text(encoding='utf-8')
          old = '''      - name: Figer l'inventaire des anciens points d'entrée combat\n        run: node tests/gens_combat_callsite_inventory_v11411.test.cjs\n\n      - name: Vérifier la composition de la preview manuelle\n'''
          new = '''      - name: Figer l'inventaire des anciens points d'entrée combat\n        run: node tests/gens_combat_callsite_inventory_v11411.test.cjs\n\n      - name: Vérifier la migration directe des deux boutons combat UI\n        run: node tests/gens_combat_ui_direct_entry_migration_1.test.cjs\n\n      - name: Vérifier la composition de la preview manuelle\n'''
          if text.count(old) != 1:
            raise SystemExit('Architecture workflow insertion precondition failed')
          wf.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Validate migrated real path
        run: |
          node tests/gens_combat_ui_direct_entry_migration_1.test.cjs
          node tests/gens_combat_callsite_inventory_v11411.test.cjs
          node tests/gens_bridge_single_entry_contract_v11411.test.cjs

      - name: Commit exact migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/gens_combat_callsite_inventory_v11411.test.cjs docs/GENSRPG_COMBAT_CALLSITE_INVENTORY.md .github/workflows/gensrpg-architecture-sentinels.yml
          git diff --cached --check
          git commit -m 'refactor: route two combat UI buttons through Bridge'
          git push origin HEAD:work/gensrpg-combat-callsite-migration-1-2026-09-16

  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native manual XP runtime
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Characterize native progression and rewards
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Verify Tactical victory rewards summary
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Execute Tactical victory to Dungeon XP and loot
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Characterize manual level authority
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
