name: GenSrpG Phase4 storage bootstrap apply

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-core-bootstrap-order-2026-09-20
    paths:
      - .gensrpg-storage-bootstrap-trigger

permissions:
  contents: write

jobs:
  apply-index-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-core-bootstrap-order-2026-09-20
          fetch-depth: 0

      - name: Verify exact index blob and insert Core storage bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = "ff11682d74be7921a591a9b76080eaf337c071be"
          actual = subprocess.check_output(["git","hash-object","index.html"], text=True).strip()
          if actual != expected:
              raise SystemExit(f"index.html blob mismatch: expected {expected}, got {actual}")

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="assets/gensrpg/core/storage-v1.js"></script>'
          if tag in html:
              raise SystemExit("Core storage bootstrap tag already present")

          anchor = '<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>\n'
          if html.count(anchor) != 1:
              raise SystemExit(f"bootstrap anchor count is {html.count(anchor)}, expected 1")

          html = html.replace(anchor, anchor + tag + "\n", 1)
          if html.count(tag) != 1:
              raise SystemExit("Core storage bootstrap tag insertion failed")

          first_inline_storage = html.find('localStorage.getItem(GENSRPG_IDB_MIGRATION_FLAG)')
          if first_inline_storage < 0 or html.find(tag) > first_inline_storage:
              raise SystemExit("Core storage tag is not before early inline storage")

          path.write_text(html, encoding="utf-8")
          PY
          git diff --check -- index.html

      - name: Commit exact micro-diff
        run: |
          git config user.name "GenSrpG restructuring bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap Core storage before inline scripts"
          git push origin HEAD:work/gensrpg-phase4-storage-core-bootstrap-order-2026-09-20
