name: Phase 4 hero resolver load-order one-shot

on:
  push:
    branches:
      - work/gensrpg-phase4-asset-resolver-hero-item-owners-2026-09-19
    paths:
      - .github/workflows/phase4-hero-resolver-load-order-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Move resolver before historical hero owner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path=Path("index.html")
          old_blob="04ca2b3803618694f8254e7b6a8fb103cfafa742"
          actual=subprocess.check_output(["git","rev-parse","HEAD:index.html"],text=True).strip()
          if actual!=old_blob:
              raise SystemExit(f"Unexpected committed index blob before load-order raccord: {actual}")

          text=path.read_text(encoding="utf-8")
          core='<script src="assets/gensrpg/core/asset-resolver-v1.js"></script>'
          old=core+chr(10)*2+'<script id="dungeonGithubArts164">'
          if text.count(old)!=1:
              raise SystemExit(f"Expected one old Core load position, got {text.count(old)}")
          text=text.replace(old,'<script id="dungeonGithubArts164">',1)

          owner='<script>'+chr(10)*2+'const Z40K_GENERIC_SHEET_BG'
          if text.count(owner)!=1:
              raise SystemExit(f"Expected one historical hero owner anchor, got {text.count(owner)}")
          text=text.replace(owner,core+chr(10)*2+owner,1)

          path.write_text(text,encoding="utf-8")
          print("Load-order source blob verified:",actual)
          PY

      - name: Commit load-order raccord and retire workflow
        shell: bash
        run: |
          rm .github/workflows/phase4-hero-resolver-load-order-once.yml
          git config user.name "GenSrpG Phase 4"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/phase4-hero-resolver-load-order-once.yml
          final_blob="$(git rev-parse :index.html)"
          test "$final_blob" = "ba47d9fb3b8aa1a2183e764455aae97e03965440"
          echo "Load-order staged index blob: $final_blob"
          git diff --cached --check
          git commit -m "refactor: load asset resolver before Dungeon hero owner"
          git push origin HEAD:work/gensrpg-phase4-asset-resolver-hero-item-owners-2026-09-19
