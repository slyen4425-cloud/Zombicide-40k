name: Diagnose V16.78.45 live board
on:
  push:
    branches:
      - work/dungeon-v16.78.45-live-board-fix-2026-09-05
    paths:
      - .github/workflows/diag-v167845-live-board.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Dungeon mode and bestiary constructor
        run: |
          echo '=== isDungeonMode ==='
          grep -nE 'function isDungeonMode|isDungeonMode=' index.html | head -n 50 || true
          L=$(grep -n 'function isDungeonMode' index.html | head -1 | cut -d: -f1); if [ -n "$L" ]; then A=$((L-15)); B=$((L+35)); sed -n "${A},${B}p" index.html; fi
          echo '=== enemy constructor E around 6450 ==='
          sed -n '6440,6505p' index.html
          echo '=== dungeon primary world launch ==='
          grep -nE 'gensrpg_dungeon_primary_selection_v167833|kind.:.world|kind:"world"|kind=.world' index.html assets/dungeon/*.js | head -n 120 || true
