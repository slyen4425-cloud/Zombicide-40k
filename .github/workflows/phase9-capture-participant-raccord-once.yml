name: Phase 9 Capture participant raccord one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture-participant-identity-raccord-2026-10-03

permissions:
  contents: write

jobs:
  patch-index:
    if: github.event.head_commit.message == 'ci(phase9): apply participant runtime raccord once'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture-participant-identity-raccord-2026-10-03
          fetch-depth: 0

      - name: Apply exact participant identity seam
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const path='index.html';
          let src=fs.readFileSync(path,'utf8');

          const replacements=[
            [
              '  if(isDungeonMode() && typeof ensureDungeonContent==="function")ensureDungeonContent();',
              '  const capture=!!(typeof GensCaptureV1!=="undefined" && typeof GensCaptureV1.isProfile==="function" && GensCaptureV1.isProfile(getActiveGameProfile()));\n  if(!capture && isDungeonMode() && typeof ensureDungeonContent==="function")ensureDungeonContent();'
            ],
            [
              '  // en Dungeon, la sélection faite dans la préparation est la seule source de vérité.\n  // Le vieux gestionnaire de tours ne doit JAMAIS réinjecter des héros d\'une session\n  // précédente dans la partie courante.\n  try{\n    if(typeof isDungeonMode==="function" && isDungeonMode()){',
              '  // en Dungeon et Capture, la sélection faite dans la préparation est la seule source de vérité.\n  // Capture utilise son identité canonique, sans emprunter l\'identité Dungeon.\n  // Le vieux gestionnaire de tours ne doit JAMAIS réinjecter des héros d\'une session\n  // précédente dans la partie courante.\n  try{\n    const capture=!!(typeof GensCaptureV1!=="undefined" && typeof GensCaptureV1.isProfile==="function" && GensCaptureV1.isProfile(getActiveGameProfile()));\n    if(capture || (typeof isDungeonMode==="function" && isDungeonMode())){'
            ]
          ];

          for(const [before,after] of replacements){
            const first=src.indexOf(before);
            if(first<0)throw new Error('expected runtime seam source not found');
            if(src.indexOf(before,first+1)>=0)throw new Error('runtime seam source is not unique');
            src=src.replace(before,after);
          }

          fs.writeFileSync(path,src,'utf8');
          const bytes=fs.readFileSync(path);
          const blob=crypto.createHash('sha1')
            .update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes]))
            .digest('hex');
          if(bytes.length!==8168810)throw new Error('unexpected post-raccord size '+bytes.length);
          if(blob!=='a5d337ae25435d801a72333ee27e6dbc390a5175')throw new Error('unexpected post-raccord blob '+blob);
          console.log(JSON.stringify({bytes:bytes.length,blob}));
          NODE

      - name: Commit exact runtime diff
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && { echo "No runtime change to commit"; exit 1; }
          git commit -m "runtime(phase9): decouple Capture participant identity from Dungeon"
          git push origin HEAD:work/gensrpg-phase9-capture-participant-identity-raccord-2026-10-03
