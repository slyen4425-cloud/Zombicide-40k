name: GenSrpG Capture V162 historic test rebase once
on:
  push:
    branches:
      - work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10
    paths:
      - .github/workflows/gensrpg-capture-historical-test-rebase-once.yml
permissions:
  contents: write
jobs:
  rebase-old-byte-guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check exact Source/Seed and rebase ONLY old fixtures
        env:
          GENSRPG_CAPTURE_TEST_REBASE_APPROVED: "1"
        run: |
          test "$(git branch --show-current)" = "work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10"
          node --check scripts/gensrpg_capture_rebase_legacy_guards_once_v1.cjs
          node tests/gens_phase9_capture_seed_physical_extraction_v1.test.cjs
          node scripts/gensrpg_capture_rebase_legacy_guards_once_v1.cjs
      - name: Check original test fingerprints are still checked
        run: |
          test "$(git diff --name-only | grep -vc '^tests/.*\.test\.cjs$')" -eq 0
          test "$(git diff --name-only | wc -l)" -gt 50
          git diff --numstat | tail -n 10
      - name: Commit only historical test adaptations on dedicated branch
        run: |
          git config user.name "gensrpg-controlled-test-rebase"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'tests/*.test.cjs'
          git diff --cached --check
          git commit -m "test(phase9): preserve exact legacy index snapshots after Capture V162 extraction"
          git push origin HEAD:work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10
