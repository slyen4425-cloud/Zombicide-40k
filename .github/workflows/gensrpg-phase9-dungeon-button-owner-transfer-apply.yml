name: GenSrpG Phase 9 Dungeon button owner transfer apply

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-residual-dungeon-couplings-preaudit-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-dungeon-button-owner-transfer-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          test "$(wc -c < index.html)" = "8167094"

      - name: Transfer Dungeon pregame button ownership to Shell
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old='''  const active=getActiveGameProfile?.();
  const captureFamily=!!active && typeof gensCapturePregameMode==="function" && gensCapturePregameMode();
  document.body.classList.toggle("gensCapturePregame",captureFamily);
  document.body.classList.toggle("gensAdventurePregame",!!active&&active.gameStyle==="dungeon");

  const dungeonBtn=document.getElementById("sessionDungeonSetupBtn");if(dungeonBtn)dungeonBtn.style.display=captureFamily?"none":"";
'''
          new='''  const active=getActiveGameProfile?.();
  const captureFamily=!!active && typeof gensCapturePregameMode==="function" && gensCapturePregameMode();
  const realDungeon=!!active && active.gameStyle==="dungeon"
    && String(active.id)===String(GAME_PROFILE_DUNGEON_ID)
    && !captureFamily;
  document.body.classList.toggle("gensCapturePregame",captureFamily);
  document.body.classList.toggle("gensAdventurePregame",!!active&&active.gameStyle==="dungeon");

  const dungeonGrid=document.querySelector("#pregameSetup .sessionSetupGrid");
  let dungeonBtn=document.getElementById("sessionDungeonSetupBtn");
  const dungeonPage=document.getElementById("sessionDungeonSetup");
  if(realDungeon){
    if(!dungeonBtn&&dungeonGrid){
      dungeonBtn=document.createElement("button");dungeonBtn.id="sessionDungeonSetupBtn";dungeonBtn.className="sessionSetupBtn";
      dungeonBtn.innerHTML="<b>🏰 AVENTURE</b><small>Choisir une aventure Dungeon déjà créée.</small>";
      dungeonBtn.onclick=()=>openSessionDungeonSetup();
      const obj=[...dungeonGrid.children].find(x=>/OBJETS\s*\/\s*PIOCHE/i.test(x.textContent||""));
      if(obj)dungeonGrid.insertBefore(dungeonBtn,obj);else dungeonGrid.appendChild(dungeonBtn);
    }
    if(dungeonBtn)dungeonBtn.style.display="";
  }else{
    dungeonBtn?.remove();
    if(dungeonPage)dungeonPage.style.setProperty("display","none","important");
  }
'''
          assert s.count(old)==1, f"wizard ownership anchor count={s.count(old)}"
          s=s.replace(old,new,1)

          old139='''/* Le bouton Aventure n'existe plus dans le HTML commun.
   On ne le crée que pour le VRAI profil Dungeon RPG. */
window.gensEnsureDungeonAdventureButton139=function(){
  const grid=document.querySelector("#pregameSetup .sessionSetupGrid");if(!grid)return;
  let b=document.getElementById("sessionDungeonSetupBtn");
  const page=document.getElementById("sessionDungeonSetup");
  let realDungeon=false;
  try{
    const p=getActiveGameProfile();
    realDungeon=p?.gameStyle==="dungeon"
      && String(p.id)===String(GAME_PROFILE_DUNGEON_ID)
      && !(typeof gensCurrentContentFamily==="function"&&gensCurrentContentFamily()==="creature");
  }catch(e){}
  if(!realDungeon){
    b?.remove();
    if(page)page.style.setProperty("display","none","important");
    return;
  }
  if(!b){
    b=document.createElement("button");b.id="sessionDungeonSetupBtn";b.className="sessionSetupBtn";
    b.innerHTML="<b>🏰 AVENTURE</b><small>Choisir une aventure Dungeon déjà créée.</small>";
    b.onclick=()=>openSessionDungeonSetup();
    const obj=[...grid.children].find(x=>/OBJETS\s*\/\s*PIOCHE/i.test(x.textContent||""));
    if(obj)grid.insertBefore(b,obj);else grid.appendChild(b);
  }
};

const r139=window.renderParticipantSelector;
window.renderParticipantSelector=function(){const x=r139.apply(this,arguments);gensEnsureDungeonAdventureButton139();return x};
const u139=window.updateGameStyleUi;
if(typeof u139==="function")window.updateGameStyleUi=function(){const x=u139.apply(this,arguments);gensEnsureDungeonAdventureButton139();return x};
setTimeout(gensEnsureDungeonAdventureButton139,50);

'''
          assert s.count(old139)==1, f"Capture139 ownership block count={s.count(old139)}"
          s=s.replace(old139,'',1)

          old151='''  try{gensEnsureDungeonAdventureButton139?.()}catch(e){}
'''
          assert s.count(old151)==1, f"Stability151 helper call count={s.count(old151)}"
          s=s.replace(old151,'',1)

          assert "gensEnsureDungeonAdventureButton139" not in s
          assert 'window.captureEnterWorld139=function()' in s
          assert 'window.startConfiguredGame=async function()' in s

          p.write_text(s,encoding="utf-8")
          PY

      - name: Repin cumulative runtime fingerprints only
        run: |
          python - <<'PY'
          from pathlib import Path
          old_blob="4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          new_blob="37056722bb0a27f96e26b3ef3b05e9543dc5a223"
          old_size="8167094"
          new_size="8166377"

          changed=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          for p in [
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
          ]:
              if not p.exists(): continue
              s=p.read_text(encoding="utf-8")
              n=s.replace(old_blob,new_blob).replace(old_size,new_size)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          print("repinned",len(changed),"files")
          for p in changed: print(p)
          PY

      - name: Verify exact runtime result
        run: |
          test "$(git hash-object index.html)" = "37056722bb0a27f96e26b3ef3b05e9543dc5a223"
          test "$(wc -c < index.html)" = "8166377"
          ! grep -q 'gensEnsureDungeonAdventureButton139' index.html
          grep -q 'function updatePregameWizard' index.html
          grep -q 'GAME_PROFILE_DUNGEON_ID' index.html
          grep -q 'window.captureEnterWorld139=function()' index.html
          git diff --check

      - name: Run ownership and Phase 9 static sentinels
        run: |
          node tests/gens_phase9_capture_dungeon_button_owner_transfer_v1.test.cjs
          node tests/gens_phase9_capture_pregame_ownership_raccord_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_identity_coupling_preaudit_v1.test.cjs
          node tests/gens_phase9_capture139_session_dependency_preaudit_v1.test.cjs
          node tests/gens_phase9_capture_seed_dungeon_style_retirement_v1.test.cjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/gensrpg-phase9-dungeon-button-owner-transfer-apply.yml

      - name: Verify final scope
        run: |
          test "$(git hash-object index.html)" = "37056722bb0a27f96e26b3ef3b05e9543dc5a223"
          test "$(wc -c < index.html)" = "8166377"
          test ! -e .github/workflows/gensrpg-phase9-dungeon-button-owner-transfer-apply.yml
          git diff --check
          git status --short

      - name: Commit exact GREEN candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(phase9): move Dungeon pregame button ownership to Shell"
          git push origin "HEAD:$GITHUB_REF_NAME"
