name: GenSrpG Phase 9 Capture seed retirement one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-dungeon-style-retirement-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-seed-retirement-one-shot.yml'

permissions:
  contents: write
# retry-contract-v2
# retry-scope-v3

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Rule 26 baseline
        run: |
          test "$(git hash-object index.html)" = "09b1e19c04777da82fd0ad355adc7eb82532db29"
          test "$(wc -c < index.html)" = "8167138"

      - name: Apply exact seed retirement and repin current fingerprints
        run: |
          python - <<'PY'
          from pathlib import Path

          old_blob="09b1e19c04777da82fd0ad355adc7eb82532db29"
          new_blob="4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          old_size="8167138"
          new_size="8167094"

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          marker='<script id="builtinMonsterCapture162"'
          start=s.find(marker)
          end=s.find('</script>', start)
          assert start>0 and end>start, "builtinMonsterCapture162 boundary missing"
          block=s[start:end]
          needle='"gameStyle":"dungeon",'
          assert block.count(needle)==2, f"expected exactly 2 seed/factory dungeon style fields, got {block.count(needle)}"
          newblock=block.replace(needle,'')
          s2=s[:start]+newblock+s[end:]
          p.write_text(s2,encoding="utf-8")

          changed=[]
          for t in sorted(Path("tests").rglob("*.test.cjs")):
              x=t.read_text(encoding="utf-8")
              y=x.replace(old_blob,new_blob).replace(old_size,new_size)
              if y!=x:
                  t.write_text(y,encoding="utf-8")
                  changed.append(str(t))

          manifests=[
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
          ]
          for m in manifests:
              if not m.exists():
                  continue
              x=m.read_text(encoding="utf-8")
              y=x.replace(old_blob,new_blob).replace(old_size,new_size)
              if y!=x:
                  m.write_text(y,encoding="utf-8")
                  changed.append(str(m))

          print("repinned",len(changed),"proof files")
          for item in changed:
              print(item)
          PY

      - name: Verify exact runtime result
        run: |
          test "$(git hash-object index.html)" = "4eee0fd1cc1b932cb7cb8b33ca357cf2d55bafeb"
          test "$(wc -c < index.html)" = "8167094"
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          marker='<script id="builtinMonsterCapture162"'
          start=s.find(marker); end=s.find('</script>',start)
          assert start>0 and end>start
          block=s[start:end]
          assert '"gameStyle":"dungeon"' not in block
          assert 'const MC162_ID="gp_mt7ker7t_m2iw9"' in block
          assert 'name":"Monster Capture"' in block
          assert 'controllableCreatures":true' in block
          assert s.count('gameStyle:"dungeon"')==1, "non-seed Dungeon identity must remain"
          PY

      - name: Run targeted Phase 9 structural sentinels
        run: |
          node tests/gens_phase9_capture_seed_dungeon_style_retirement_v1.test.cjs
          node tests/gens_phase9_capture_dungeon_identity_coupling_preaudit_v1.test.cjs
          node tests/gens_phase9_capture139_active_enemies_retirement_v1.test.cjs
          node tests/gens_phase9_capture139_base_profile_retirement_v1.test.cjs
          node tests/gens_phase9_capture139_session_dependency_preaudit_v1.test.cjs

      - name: Remove one-shot workflow
        run: rm .github/workflows/gensrpg-phase9-capture-seed-retirement-one-shot.yml

      - name: Verify diff scope
        run: |
          git diff --check
          git status --short
          python - <<'PY'
          import subprocess
          allowed_prefixes=("index.html","tests/","docs/GENSRPG_PHASE2_",".github/workflows/gensrpg-phase9-capture-seed-retirement-one-shot.yml")
          files=subprocess.check_output(["git","diff","--name-only"],text=True).splitlines()
          bad=[f for f in files if not f.startswith(allowed_prefixes)]
          assert not bad, f"unexpected changed files: {bad}"
          assert "index.html" in files
          print("changed files:", *files, sep="\n")
          PY

      - name: Commit exact GREEN candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(phase9): retire Dungeon style from Capture seed"
          git push origin "HEAD:$GITHUB_REF_NAME"
