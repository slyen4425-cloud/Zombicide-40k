name: GenSrpG Phase 7 map-boundary microdiff once

on:
  push:
    branches:
      - work/gensrpg-phase7-dungeon-generated-room-map-boundary-audit-2026-09-30
    paths:
      - .github/workflows/gensrpg-phase7-map-boundary-microdiff-once.yml

permissions:
  contents: write

jobs:
  microdiff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase7-dungeon-generated-room-map-boundary-audit-2026-09-30
          fetch-depth: 0

      - name: Apply bounded lot 33 microdiff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          EXPECTED_OLD_SIZE=8169447
          EXPECTED_OLD_BLOB="106d2ec6e82f3b777e1d724cd3f74f30a22fdf39"
          EXPECTED_NEW_SIZE=8169555
          EXPECTED_NEW_BLOB="02a052bc231728eb383e17c83e61a958be0ac58c"

          def git_blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()

          index_path=Path("index.html")
          old_bytes=index_path.read_bytes()
          assert len(old_bytes)==EXPECTED_OLD_SIZE, (len(old_bytes),EXPECTED_OLD_SIZE)
          assert git_blob(old_bytes)==EXPECTED_OLD_BLOB, git_blob(old_bytes)
          index=old_bytes.decode("utf-8")

          old_map='const mapObj=cfg().map===false?null:generateDungeonMap(kind,result.enemyQty||0);return {result,map:mapObj}'
          new_map='const mapPlan=GensDungeonV1.exploration.planGeneratedRoomMapBoundary(cfg().map,kind,result);const mapObj=mapPlan.status==="disabled"?null:generateDungeonMap(mapPlan.kind,mapPlan.enemyQty);return {result,map:mapObj}'
          assert index.count(old_map)==1, index.count(old_map)
          index=index.replace(old_map,new_map,1)
          new_bytes=index.encode("utf-8")
          assert len(new_bytes)==EXPECTED_NEW_SIZE, (len(new_bytes),EXPECTED_NEW_SIZE)
          assert git_blob(new_bytes)==EXPECTED_NEW_BLOB, git_blob(new_bytes)
          index_path.write_bytes(new_bytes)

          entry_path=Path("assets/gensrpg/dungeon/entry-v1.js")
          entry=entry_path.read_text("utf-8")
          old_owner='''  function shouldDefaultGeneratedRoomEnemyBranch(enemy,room){
            return Number(enemy.dungeonRoom||0)===Number(room)&&enemy.dc200Branch===undefined;
          }
          '''
          planner='''  function planGeneratedRoomMapBoundary(mapSetting,kind,result){
            if(mapSetting===false)return {status:"disabled",kind:null,enemyQty:null};
            return {status:"generate",kind,enemyQty:result.enemyQty||0};
          }
          '''
          assert entry.count(old_owner)==1, entry.count(old_owner)
          entry=entry.replace(old_owner,old_owner+"\n"+planner,1)

          old_export='''      buildGeneratedNonCombatRoomResult,
                shouldDefaultGeneratedRoomEnemyBranch,
                pickWeightedGeneratedRoomKind,'''
          new_export='''      buildGeneratedNonCombatRoomResult,
                shouldDefaultGeneratedRoomEnemyBranch,
                planGeneratedRoomMapBoundary,
                pickWeightedGeneratedRoomKind,'''
          assert entry.count(old_export)==1, entry.count(old_export)
          entry=entry.replace(old_export,new_export,1)
          entry_path.write_text(entry,"utf-8")

          tests=[
            Path("tests/gens_phase7_dungeon_generated_room_map_boundary_characterization_v1.test.cjs"),
            Path("tests/gens_phase7_dungeon_generated_room_map_boundary_v1.test.cjs"),
          ]
          for test_path in tests:
              t=test_path.read_text("utf-8")
              assert t.count(str(EXPECTED_OLD_SIZE))==1, (str(test_path),t.count(str(EXPECTED_OLD_SIZE)))
              assert t.count(EXPECTED_OLD_BLOB)==1, (str(test_path),t.count(EXPECTED_OLD_BLOB))
              t=t.replace(str(EXPECTED_OLD_SIZE),str(EXPECTED_NEW_SIZE),1)
              t=t.replace(EXPECTED_OLD_BLOB,EXPECTED_NEW_BLOB,1)
              t=t.replace(
                "generated room map-boundary characterization must track the exact lot 32 GREEN runtime size",
                "generated room map-boundary characterization must track the exact lot 33 runtime size")
              t=t.replace(
                "generated room map-boundary characterization must track the exact lot 32 GREEN runtime blob",
                "generated room map-boundary characterization must track the exact lot 33 runtime blob")
              t=t.replace(
                "map-boundary RED must start from the exact lot 32 GREEN runtime size",
                "map-boundary guard must track the exact lot 33 runtime size")
              t=t.replace(
                "map-boundary RED must start from the exact lot 32 GREEN runtime blob",
                "map-boundary guard must track the exact lot 33 runtime blob")
              test_path.write_text(t,"utf-8")

          assert index.count("GensDungeonV1.exploration.planGeneratedRoomMapBoundary(cfg().map,kind,result)")==1
          assert index.count(old_map)==0
          assert entry.count("function planGeneratedRoomMapBoundary(mapSetting,kind,result)")==1
          assert entry.count("planGeneratedRoomMapBoundary,")==1
          print("lot33 bounded microdiff prepared")
          print("index size",len(new_bytes))
          print("index blob",git_blob(new_bytes))
          PY

      - name: Run lot 33 characterization
        run: node tests/gens_phase7_dungeon_generated_room_map_boundary_characterization_v1.test.cjs

      - name: Run lot 33 owner guard
        run: node tests/gens_phase7_dungeon_generated_room_map_boundary_v1.test.cjs

      - name: Verify strict diff
        shell: bash
        run: |
          git diff --check
          echo "Changed before one-shot cleanup:"
          git status --short
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/gensrpg/dungeon/entry-v1.js index.html tests/gens_phase7_dungeon_generated_room_map_boundary_characterization_v1.test.cjs tests/gens_phase7_dungeon_generated_room_map_boundary_v1.test.cjs "

      - name: Commit bounded microdiff and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase7-map-boundary-microdiff-once.yml
          git config user.name "gensrpg-phase7-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/gensrpg/dungeon/entry-v1.js tests/gens_phase7_dungeon_generated_room_map_boundary_characterization_v1.test.cjs tests/gens_phase7_dungeon_generated_room_map_boundary_v1.test.cjs .github/workflows/gensrpg-phase7-map-boundary-microdiff-once.yml
          echo "Staged files:"
          git diff --cached --name-only
          git commit -m "refactor: extract generated room map-boundary planner"
          git push origin HEAD:work/gensrpg-phase7-dungeon-generated-room-map-boundary-audit-2026-09-30
