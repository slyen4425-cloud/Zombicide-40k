name: GenSrpG one-shot Capture135 retirement

on:
  push:
    branches:
      - work/gensrpg-phase5-startconfiguredgame-capture135-retirement-2026-09-24

permissions:
  contents: write

jobs:
  apply-capture135-retirement:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Capture135 patch
        run: python tools/gensrpg_phase5_apply_capture135_global_retirement.py --apply

      - name: Verify Capture135 retirement contract
        run: node tests/gens_phase5_startconfiguredgame_capture135_global_retirement_v1.test.cjs

      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "runtime: retire captureFix135 startConfiguredGame global assignment"
          git push origin HEAD:work/gensrpg-phase5-startconfiguredgame-capture135-retirement-2026-09-24
