name: Deploy GenSrpG known-good V16.78.123 to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la référence V16.78.123 connue fonctionnelle
        uses: actions/checkout@v4
        with:
          ref: 22ce0194fcb8b9a439fc2cdcecb3ffb91c5be58c

      - name: Vérifier la référence
        run: |
          test -f index.html
          test -f service-worker.js
          test -f assets/gensrpg/gens-chrome-startup-diag-1678122.js
          echo "Known-good commit:"
          git rev-parse HEAD
          echo "Expected: 22ce0194fcb8b9a439fc2cdcecb3ffb91c5be58c"

      - name: Préparer le site exact V123
        run: |
          rm -rf _site
          mkdir -p _site
          cp -f index.html _site/index.html
          if [ -f manifest.webmanifest ]; then cp -f manifest.webmanifest _site/manifest.webmanifest; fi
          if [ -f manifest.json ]; then cp -f manifest.json _site/manifest.json; fi
          cp -f service-worker.js _site/service-worker.js
          if [ -d icons ]; then cp -R icons _site/icons; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          for file in sound_*.mp3; do
            if [ -f "$file" ]; then cp -f "$file" _site/; fi
          done

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site comme artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
