name: GenSrpG Phase 12 Dungeon Core01 controlled apply

on:
  push:
    branches:
      - 'work/gensrpg-phase12-dungeon-core01-extraction-2026-10-13'
    paths:
      - '.github/workflows/gensrpg-phase12-dungeon-core01-controlled-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify pinned Dungeon source extraction
        run: |
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase12-dungeon-core01-extraction-2026-10-13'
          test "$(git hash-object index.html)" = 'bf996ec4e748a4927ac6dd57cceaeaf2afcd9441'
          python3 tools/gensrpg_phase12_dungeon_core01_extract_apply.py --apply
          node tests/gens_phase12_dungeon_core01_extraction_v1.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_runtime_composition_guard_v11411.test.cjs
      - name: Commit on work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gensrpg/dungeon/core01-session-ui-v1.js tests/gens_phase2_runtime_load_graph_v11411.test.cjs tests/gens_phase2_inline_owner_manifest_v11411.test.cjs tests/gens_phase2_inline_global_last_owner_v11411.test.cjs tests/gens_runtime_composition_guard_v11411.test.cjs
          git diff --cached --check
          git commit -m "refactor(phase12): move one Dungeon owner without functional changes"
          git push origin "HEAD:$GITHUB_REF_NAME"
