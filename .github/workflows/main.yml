name: Deploy GenSrpG V16.78.123 no-SW diagnostic to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la référence V16.78.123 connue fonctionnelle
        uses: actions/checkout@v4
        with:
          ref: 22ce0194fcb8b9a439fc2cdcecb3ffb91c5be58c

      - name: Vérifier la référence
        run: |
          test -f index.html
          test -f service-worker.js
          test -f assets/gensrpg/gens-chrome-startup-diag-1678122.js
          git rev-parse HEAD

      - name: Préparer le site V123
        run: |
          rm -rf _site
          mkdir -p _site
          cp -f index.html _site/index.html
          if [ -f manifest.webmanifest ]; then cp -f manifest.webmanifest _site/manifest.webmanifest; fi
          if [ -f manifest.json ]; then cp -f manifest.json _site/manifest.json; fi
          cp -f service-worker.js _site/service-worker.js
          if [ -d icons ]; then cp -R icons _site/icons; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          for file in sound_*.mp3; do
            if [ -f "$file" ]; then cp -f "$file" _site/; fi
          done

      - name: Ajouter le mode no-SW dans index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          s=p.read_text(encoding='utf-8')
          guard=r'''<script>
          (function(){
            try{
              const q=new URLSearchParams(location.search);
              if(!q.has('nosw')) return;
              window.__GENSRPG_NO_SW_TEST__=true;
              if('serviceWorker' in navigator){
                try{
                  const fakeReg={update:async()=>{},unregister:async()=>true,addEventListener:()=>{},removeEventListener:()=>{},waiting:null,installing:null,active:null};
                  Object.defineProperty(navigator.serviceWorker,'register',{configurable:true,value:async()=>fakeReg});
                }catch(e){console.warn('noSW register guard',e)}
              }
            }catch(e){console.warn('noSW guard',e)}
          })();
          </script>'''
          if '<head>' in s:
              s=s.replace('<head>','<head>\n'+guard,1)
          else:
              s=guard+'\n'+s
          p.write_text(s,encoding='utf-8')
          PY

      - name: Créer la page de nettoyage no-SW
        run: |
          cat > _site/nosw-clean-v124.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>GenSrpG diagnostic sans service worker</title>
          <body style="background:#111;color:#fff;font-family:sans-serif;padding:24px"><h2>Nettoyage diagnostic…</h2><pre id="log"></pre>
          <script>
          (async()=>{
            const log=document.getElementById('log');
            const say=t=>{log.textContent+=t+'\n'};
            try{
              if('serviceWorker' in navigator){
                const regs=await navigator.serviceWorker.getRegistrations();
                say('Service workers: '+regs.length);
                await Promise.all(regs.map(r=>r.unregister()));
                say('Service workers désinscrits');
              }
              if('caches' in window){
                const names=await caches.keys();
                say('Caches: '+names.length);
                await Promise.all(names.map(n=>caches.delete(n)));
                say('Caches supprimés');
              }
              say('Redirection vers V123 sans SW…');
              const target='./?nosw=1&clean=1&t='+Date.now();
              setTimeout(()=>location.replace(target),350);
            }catch(e){say('ERREUR: '+(e&&e.stack||e));}
          })();
          </script>
          EOF

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site comme artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
