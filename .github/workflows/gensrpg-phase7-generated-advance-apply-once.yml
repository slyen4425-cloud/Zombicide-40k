name: GenSrpG Phase 7 generated advance apply once

on:
  push:
    branches:
      - work/gensrpg-phase7-dungeon-exploration-2026-09-26
    paths:
      - .github/workflows/gensrpg-phase7-generated-advance-apply-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier la base exacte Rule 26
        run: |
          test "$(git hash-object index.html)" = "ca5cb0b92f4e6ff8779ebe2339bb2be32a89f8f9"
          grep -q "Intentionally contains no runtime code" assets/gensrpg/dungeon/entry-v1.js
          ! grep -q 'assets/gensrpg/dungeon/entry-v1.js?v=1' index.html
          ! grep -q 'GensDungeonV1.exploration.planGeneratedAdvance' index.html

      - name: Activer le plan pur Dungeon et raccorder Core 2.00
        run: |
          cat > assets/gensrpg/dungeon/entry-v1.js <<'JS'
          "use strict";

          (function installGensDungeonV1(root){
            const VERSION="1.0.0";

            function planGeneratedAdvance(currentRoom,roomLimit,roomStates){
              const current=Number(currentRoom||0);
              const limit=Number(roomLimit||10);
              if(current>=limit)return {status:"complete",targetRoom:null};
              const targetRoom=Math.max(1,current+1);
              const states=roomStates&&typeof roomStates==="object"?roomStates:{};
              const existing=states[String(targetRoom)];
              return {status:existing?.last?"existing":"create",targetRoom};
            }

            root.GensDungeonV1=Object.freeze({
              VERSION,
              exploration:Object.freeze({
                planGeneratedAdvance
              })
            });
          })(typeof window!=="undefined"?window:globalThis);
          JS

          python3 - <<'PY'
          import json
          from pathlib import Path

          contract_path=Path("assets/gensrpg/dungeon/module-contract-v1.json")
          contract=json.loads(contract_path.read_text(encoding="utf-8"))
          contract["status"]="partial-runtime-loaded"
          contract["lifecycle"]={
              "install":"loaded once by the source index; the connected Phase 7 slice exposes only a pure Dungeon API",
              "dispose":"no temporary state, listener, observer or timer is created by the connected slice"
          }
          contract["invariants"]=[
              "the active entry exposes only the public GensDungeonV1 namespace",
              "the first connected Phase 7 slice is the pure generated exploration advance planner",
              "the planner has no DOM storage timer listener observer or Tactical dependency",
              "generated room creation movement events spawn chest trap puzzle and combat remain outside this first slice",
              "authored World Builder travel remains owned by DungeonAuthoredRuntime167839 during this micro-lot",
              "no compatibility wrapper is introduced by this contract"
          ]
          contract["activatedPhase"]=7
          contract["publicRuntimeApi"]="GensDungeonV1"
          contract_path.write_text(json.dumps(contract,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")

          index_path=Path("index.html")
          html=index_path.read_text(encoding="utf-8")
          old='<script src="assets/gensrpg/survival/entry-v1.js?v=1"></script>\n'
          new=old+'<script src="assets/gensrpg/dungeon/entry-v1.js?v=1"></script>\n'
          if html.count(old)!=1:
              raise SystemExit("Survival entry anchor drifted")
          html=html.replace(old,new,1)

          old_block="""  if(x.room>=Number(cfg().rooms||10))return modal('🏆 Donjon terminé','Le groupe a terminé le donjon.');
            const targetRoom=Math.max(1,Number(x.room||0)+1);
            const movementLeft=Number.isFinite(Number(x.remaining?.[heroId]))
          """
          new_block="""  const advancePlan=GensDungeonV1.exploration.planGeneratedAdvance(x.room,Number(cfg().rooms||10),x.roomStates);
            if(advancePlan.status==='complete')return modal('🏆 Donjon terminé','Le groupe a terminé le donjon.');
            const targetRoom=advancePlan.targetRoom;
            const movementLeft=Number.isFinite(Number(x.remaining?.[heroId]))
          """
          if html.count(old_block)!=1:
              raise SystemExit("Core 2.00 generated target block drifted")
          html=html.replace(old_block,new_block,1)

          old_existing="""  const existing=x.roomStates?.[String(targetRoom)];
            if(existing?.last){
          """
          new_existing="""  const existing=x.roomStates?.[String(targetRoom)];
            if(advancePlan.status==='existing'&&existing?.last){
          """
          if html.count(old_existing)!=1:
              raise SystemExit("Core 2.00 existing-room branch drifted")
          html=html.replace(old_existing,new_existing,1)
          index_path.write_text(html,encoding="utf-8")

          sw_path=Path("service-worker.js")
          sw=sw_path.read_text(encoding="utf-8")
          sw_old='"./assets/gensrpg/survival/entry-v1.js",'
          sw_new=sw_old+'"./assets/gensrpg/dungeon/entry-v1.js",'
          if sw.count(sw_old)!=1 or "./assets/gensrpg/dungeon/entry-v1.js" in sw:
              raise SystemExit("PWA entry anchor drifted")
          sw_path.write_text(sw.replace(sw_old,sw_new,1),encoding="utf-8")
          PY

      - name: Vérifier le micro-diff exact
        run: |
          test "$(git hash-object index.html)" = "e513d23c7a8c7aef9a187202bbcc34ab540e856f"
          test "$(grep -o 'assets/gensrpg/dungeon/entry-v1.js?v=1' index.html | wc -l)" -eq 1
          test "$(grep -o 'GensDungeonV1.exploration.planGeneratedAdvance' index.html | wc -l)" -eq 1
          ! grep -q 'const targetRoom=Math.max(1,Number(x.room||0)+1);' index.html
          ! grep -q 'GensDungeonV1' assets/dungeon/dungeon-authored-runtime-167839.js
          node tests/gens_phase7_dungeon_generated_advance_plan_v1.test.cjs
          node tests/gens_phase7_dungeon_exploration_authority_characterization_v1.test.cjs

      - name: Committer le raccord et retirer le workflow temporaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gensrpg-phase7-generated-advance-apply-once.yml
          git add index.html service-worker.js assets/gensrpg/dungeon/entry-v1.js assets/gensrpg/dungeon/module-contract-v1.json
          git diff --cached --check
          git commit -m "refactor: extract Dungeon generated advance plan"
          git push origin HEAD:work/gensrpg-phase7-dungeon-exploration-2026-09-26
