name: GenSrpG Phase5 captureFix135 one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase5-capturefix135-retirement-2026-09-23'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded captureFix135 retirement
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git hash-object index.html)"
          if [ "$BEFORE" = "9313afd3437fe827b9c17245a675f75645570878" ]; then
            echo "Target index already present; no-op."
            exit 0
          fi
          test "$BEFORE" = "f13835a2827dbfa9e2698cb026d3e732ad62aba4"

          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          data=p.read_bytes()
          target=b'''\n/* 6) Nouveau jeu = reset du jour / tour monde Capture */\nconst start135=window.startConfiguredGame;\nif(typeof start135==="function"){\n  window.startConfiguredGame=async function(){\n    try{\n      if(typeof gensCapturePregameMode==="function"&&gensCapturePregameMode()){\n        const ws=captureWorldState();\n        ws.day=1;ws.turnIndex=0;ws.round=1;ws.last=null;\n        if(Array.isArray(ws.history))ws.history=[];\n        saveCaptureWorldState(ws);\n      }\n    }catch(e){console.warn("Reset jour Capture",e)}\n    return await start135.apply(this,arguments);\n  };\n}\n'''
          count=data.count(target)
          if count != 1:
              raise SystemExit(f"expected exactly one captureFix135 wrapper, got {count}")
          p.write_bytes(data.replace(target,b"",1))
          PY

          AFTER="$(git hash-object index.html)"
          test "$AFTER" = "9313afd3437fe827b9c17245a675f75645570878"

          git config user.name "gensrpg-phase5-bot"
          git config user.email "gensrpg-phase5-bot@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "refactor: retire shadowed captureFix135 start wrapper"
          git push origin "HEAD:${GITHUB_REF_NAME}"
