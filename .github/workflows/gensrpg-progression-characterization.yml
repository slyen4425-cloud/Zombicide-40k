name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire propriétaires XP et portrait pour caractérisation
        shell: python
        run: |
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          needles = [
              'function dungeonHandleLevelUp071',
              'function changeXP',
              'charImage',
              'progression-runtime-v1.js',
              'gens-dungeon-sheet-art-stability-167899.js',
          ]
          for needle in needles:
              print(f'\n===== {needle} =====')
              start = 0
              count = 0
              while True:
                  pos = text.find(needle, start)
                  if pos < 0:
                      break
                  count += 1
                  lo = max(0, pos - 1800)
                  hi = min(len(text), pos + 4200)
                  print(f'--- occurrence {count} @ {pos} ---')
                  print(text[lo:hi])
                  start = pos + len(needle)
                  if count >= 20:
                      print('--- capped at 20 occurrences ---')
                      break
              print(f'count={count}')
      - name: Caractériser progression et récompenses natives
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Vérifier le résumé de victoire Tactical
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Exécuter victoire Tactical vers XP et butin Dungeon
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Caractériser l'édition manuelle du niveau
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
      - name: Caractériser XP manuel vers points de caractéristiques
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Verrouiller le runtime extrait de progression XP manuelle
        run: node tests/gens_manual_xp_progression_runtime_v1.test.cjs
