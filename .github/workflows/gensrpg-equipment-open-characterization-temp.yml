name: GenSrpG Equipment open characterization temp

on:
  push:
    branches:
      - work/gensrpg-phase4-inventory-equipment-hero-art-open-hook-retirement-2026-09-21

jobs:
  equipment-open-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Caractériser l'ouverture Equipment
        run: node tests/gens_phase4_inventory_equipment_hero_art_open_hook_browser_v1.test.cjs
