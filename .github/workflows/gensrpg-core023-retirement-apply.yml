name: GenSrpG Core023 retirement one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase5-gomenu-core023-retirement-2026-09-23'

permissions:
  contents: write

jobs:
  apply-core023-retirement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-gomenu-core023-retirement-2026-09-23
          fetch-depth: 0

      - name: Verify exact source blob and retire only Core 0.23 goMenu
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("index.html")
          before = subprocess.check_output(["git","hash-object",str(path)], text=True).strip()
          expected_before = "6e76a99af5fb839db5ffb20a2e67fd1572bf13ea"
          expected_after = "c2424bada56517e579ffe65fa147facbb6bf2caf"
          if before != expected_before:
              raise SystemExit(f"unexpected source blob: {before} != {expected_before}")

          text = path.read_text(encoding="utf-8")
          old = '''const oldGo023=window.goMenu;
          window.goMenu=function(){
            const r=oldGo023?.apply(this,arguments);
            try{if(window.DungeonCore01?.active){document.body.style.overflow="";document.getElementById("specialDiceModal")?.classList.remove("open");document.getElementById("dc01Modal")?.classList.remove("open");DungeonCore01.show()}}catch(e){console.warn("Core return 0.23",e)}
            return r;
          };
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one Core 0.23 goMenu block, found {text.count(old)}")

          text = text.replace(old, "")
          path.write_text(text, encoding="utf-8")

          after = subprocess.check_output(["git","hash-object",str(path)], text=True).strip()
          if after != expected_after:
              raise SystemExit(f"unexpected candidate blob: {after} != {expected_after}")

          core_start = text.index('<script id="dungeonCore023StabilityFix"')
          core_end = text.index("</script>", core_start)
          core = text[core_start:core_end]
          if "oldGo023" in core or "window.goMenu=" in core:
              raise SystemExit("Core 0.23 goMenu authority still present")
          for required in (
              "oldOpenHero",
              "window.DungeonCore01.openHero=function",
              "specialDiceModal",
              "dungeonCombatActive",
          ):
              if required not in core:
                  raise SystemExit(f"preserved Core 0.23 responsibility missing: {required}")

      - name: Commit exact subtractive runtime change
        run: |
          test "$(git diff --name-only)" = "index.html"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: retire Core 0.23 goMenu authority"
          git push origin HEAD:work/gensrpg-phase5-gomenu-core023-retirement-2026-09-23
