name: Apply home UI observer production fix
on:
  push:
    branches:
      - fix/home-ui-observers-2026-09-05
    paths:
      - .github/workflows/apply-home-ui-production-fix.yml
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broad DOM observers with lightweight UI refresh hooks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          room = Path('assets/dungeon/dungeon-room-creator-100.js')
          text = room.read_text(encoding='utf-8')
          old = 'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();if(typeof MutationObserver==="function")new MutationObserver(()=>ensureLauncher()).observe(DOC.documentElement,{childList:true,subtree:true})}'
          new = 'if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(ensureLauncher,0),true)}'
          if text.count(old) != 1:
              raise SystemExit(f'Room Creator observer block count={text.count(old)}, expected 1')
          room.write_text(text.replace(old, new), encoding='utf-8')

          builder = Path('assets/dungeon/dungeon-world-builder-167821.js')
          text = builder.read_text(encoding='utf-8')
          old = '''if(DOC){
            if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();
            if(typeof MutationObserver==="function")new MutationObserver(()=>{ensureLauncher();ensureModal()}).observe(DOC.documentElement,{childList:true,subtree:true});
          }'''
          new = '''if(DOC){
            if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();
            DOC.addEventListener("click",()=>setTimeout(()=>{ensureLauncher();ensureModal()},0),true);
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'World Builder observer block count={text.count(old)}, expected 1')
          builder.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Static guards
        shell: bash
        run: |
          node --check assets/dungeon/dungeon-room-creator-100.js
          node --check assets/dungeon/dungeon-world-builder-167821.js
          ! grep -q 'observe(DOC.documentElement' assets/dungeon/dungeon-room-creator-100.js
          ! grep -q 'observe(DOC.documentElement' assets/dungeon/dungeon-world-builder-167821.js
          grep -q 'ROOT.DungeonRoomCreator100=' assets/dungeon/dungeon-room-creator-100.js
          grep -q 'ROOT.DungeonWorldBuilder167821=' assets/dungeon/dungeon-world-builder-167821.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "assets/dungeon/dungeon-room-creator-100.js assets/dungeon/dungeon-world-builder-167821.js "
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Mobile browser home and creator smoke test
        shell: bash
        run: |
          cat >/tmp/home_probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(String(e?.stack||e?.message||e)));
          await page.goto('http://127.0.0.1:8765/index.html',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1800);
          const initial=await page.evaluate(()=>({
            ready:document.readyState,
            cards:[...document.querySelectorAll('button.gensRootModeCard')].map(b=>(b.textContent||'').trim().replace(/\s+/g,' ').slice(0,100)),
            creatorApi:!!window.DungeonRoomCreator100,
            builderApi:!!window.DungeonWorldBuilder167821,
            creatorModal:getComputedStyle(document.getElementById('drc100Modal')).display,
            builderModal:getComputedStyle(document.getElementById('drc300Modal')).display,
            creatorInHome:!!document.getElementById('drc100Launcher')?.closest('#gensRootHome,#gensFamilyHome,#gensGameHome'),
            builderInHome:!!document.getElementById('drc300Launcher')?.closest('#gensRootHome,#gensFamilyHome,#gensGameHome')
          }));
          console.log('initial',JSON.stringify(initial));
          if(initial.cards.length<3) throw new Error('Expected at least 3 root mode cards, got '+initial.cards.length);
          if(!initial.creatorApi||!initial.builderApi) throw new Error('Creator/builder API missing');
          if(initial.creatorModal!=='none'||initial.builderModal!=='none') throw new Error('Creator/builder modal visible on home');
          if(initial.creatorInHome||initial.builderInHome) throw new Error('Creator/builder launcher leaked into home UI');
          for(let i=0;i<Math.min(3,initial.cards.length);i++){
            await page.evaluate(()=>{ if(typeof showGensRootHome==='function') showGensRootHome(); });
            await page.waitForTimeout(80);
            const card=page.locator('button.gensRootModeCard').nth(i);
            const label=(await card.textContent()||'').trim().replace(/\s+/g,' ');
            await card.click({timeout:5000});
            await page.waitForTimeout(120);
            console.log('clicked root card',i,label);
          }
          const refresh=await page.evaluate(async()=>{
            const editor=document.getElementById('dungeonAdvancedEditor');
            document.getElementById('drc100Launcher')?.remove();
            document.getElementById('drc300Launcher')?.remove();
            document.dispatchEvent(new MouseEvent('click',{bubbles:true}));
            await new Promise(r=>setTimeout(r,20));
            return {editor:!!editor,room:!!document.getElementById('drc100Launcher'),builder:!!document.getElementById('drc300Launcher')};
          });
          console.log('launcher refresh',JSON.stringify(refresh));
          if(refresh.editor && (!refresh.room||!refresh.builder)) throw new Error('Advanced editor launchers were not restored by lightweight hook');
          if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join('\n'));
          await browser.close();
          console.log('HOME_UI_SMOKE_OK');
          JS
          python3 -m http.server 8765 >/tmp/gens-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          timeout 45s node /tmp/home_probe.mjs
      - name: Commit only production source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-home-ui-production-fix.yml
          git add assets/dungeon/dungeon-room-creator-100.js assets/dungeon/dungeon-world-builder-167821.js
          git diff --cached --check
          git commit -m "Fix home UI freeze from dungeon editor DOM observers"
          git push
