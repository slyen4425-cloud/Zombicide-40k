name: Chrome Android Freeze Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/chrome-android-freeze-diagnostic.yml'

permissions:
  contents: read

jobs:
  chrome-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run mobile Chrome freeze probe
        env:
          TARGET_URL: https://slyen4425-cloud.github.io/Zombicide-40k/?nosw=1&ci=chrome-android-freeze
        run: |
          mkdir -p diagnostic-artifacts
          cat > /tmp/chrome-freeze-probe.mjs <<'EOF'
          import { chromium, devices } from 'playwright';
          import fs from 'node:fs';

          const target = process.env.TARGET_URL;
          const browser = await chromium.launch({headless:true});
          const device = devices['Pixel 7'];
          const summary = [];

          async function openPage(label){
            const context = await browser.newContext({
              ...device,
              serviceWorkers: 'block',
              locale: 'fr-FR'
            });
            const page = await context.newPage();
            const events=[];
            page.on('console', msg => events.push(`console:${msg.type()}:${msg.text()}`));
            page.on('pageerror', err => events.push(`pageerror:${err.stack||err.message}`));
            page.on('requestfailed', req => events.push(`requestfailed:${req.url()}:${req.failure()?.errorText||''}`));
            const start=Date.now();
            let gotoState='ok';
            try {
              await page.goto(target, {waitUntil:'domcontentloaded', timeout:30000});
              await page.waitForTimeout(2500);
            } catch(e){ gotoState='ERR '+e.message; }
            const loadMs=Date.now()-start;
            let heartbeat='unknown';
            try {
              heartbeat = await page.evaluate(() => new Promise(resolve => {
                const t=performance.now();
                setTimeout(()=>resolve(Math.round(performance.now()-t)),0);
              }));
            } catch(e){ heartbeat='ERR '+e.message; }
            await page.screenshot({path:`diagnostic-artifacts/${label}-loaded.png`, fullPage:true}).catch(()=>{});
            return {context,page,events,loadMs,gotoState,heartbeat};
          }

          const first = await openPage('00-home');
          let buttons=[];
          try {
            buttons = await first.page.locator('button, [role="button"], input[type="button"], input[type="submit"]').evaluateAll(els =>
              els.map((el,i)=>({
                i,
                tag:el.tagName,
                id:el.id||'',
                cls:typeof el.className==='string'?el.className:'',
                text:(el.innerText||el.value||el.textContent||'').replace(/\s+/g,' ').trim().slice(0,120),
                visible:!!(el.offsetWidth||el.offsetHeight||el.getClientRects().length)
              })).filter(x=>x.visible)
            );
          } catch(e){ first.events.push('button-enum-error:'+e.message); }
          fs.writeFileSync('diagnostic-artifacts/home-buttons.json', JSON.stringify(buttons,null,2));
          fs.writeFileSync('diagnostic-artifacts/home-events.log', first.events.join('\n'));
          console.log('HOME loadMs=', first.loadMs, 'heartbeat=', first.heartbeat, 'goto=', first.gotoState);
          console.log('VISIBLE BUTTONS=', JSON.stringify(buttons));
          await first.context.close();

          const candidates = buttons.slice(0, Math.min(buttons.length, 12));
          for(const b of candidates){
            const label=`btn-${String(b.i).padStart(2,'0')}`;
            const run=await openPage(label);
            const record={button:b, loadMs:run.loadMs, initialHeartbeat:run.heartbeat, goto:run.gotoState};
            let clickResult='ok', clickMs=null, afterHeartbeat='unknown', urlAfter='';
            try {
              const loc=run.page.locator('button, [role="button"], input[type="button"], input[type="submit"]').nth(b.i);
              const t=Date.now();
              await loc.click({timeout:5000});
              clickMs=Date.now()-t;
            } catch(e){ clickResult='ERR '+e.message; }
            try {
              afterHeartbeat = await Promise.race([
                run.page.evaluate(() => new Promise(resolve => setTimeout(()=>resolve('alive'),100))),
                new Promise(resolve => setTimeout(()=>resolve('HOST_TIMEOUT'),3000))
              ]);
            } catch(e){ afterHeartbeat='ERR '+e.message; }
            try{ urlAfter=run.page.url(); }catch{}
            record.clickResult=clickResult;
            record.clickMs=clickMs;
            record.afterHeartbeat=afterHeartbeat;
            record.urlAfter=urlAfter;
            summary.push(record);
            console.log('PROBE', JSON.stringify(record));
            fs.writeFileSync(`diagnostic-artifacts/${label}-events.log`, run.events.join('\n'));
            await run.page.screenshot({path:`diagnostic-artifacts/${label}-after.png`, fullPage:true}).catch(()=>{});
            await run.context.close().catch(()=>{});
          }

          fs.writeFileSync('diagnostic-artifacts/summary.json', JSON.stringify(summary,null,2));
          console.log('SUMMARY');
          console.log(JSON.stringify(summary,null,2));
          await browser.close();
          EOF
          node /tmp/chrome-freeze-probe.mjs

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-android-freeze-diagnostic
          path: diagnostic-artifacts/
          retention-days: 7
