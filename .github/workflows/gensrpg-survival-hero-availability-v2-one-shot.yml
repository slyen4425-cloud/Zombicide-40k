name: GenSrpG Survival hero availability repair v2 one-shot

on:
  push:
    branches:
      - 'work/gensrpg-survival-hero-availability-regression-2026-09-23'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace helper globals with owner-local repair
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object index.html)"
          bytes_before="$(wc -c < index.html | tr -d ' ')"
          test "$before" = "842d248315a89e848bdbea565bf33a420eda3806"
          test "$bytes_before" = "8171970"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          helper='''function survivalHeroIdsForBaseProfile(){
            applyCustomHeroesMulti();
            const dungeonCustomHeroIds=new Set(customHeroesForMode(true).map(h=>String(h.id)));
            const ids=new Set(
              Object.keys(CHARS).filter(id=>
                !(typeof DUNGEON_HERO_IDS!=="undefined"&&DUNGEON_HERO_IDS.includes(String(id))) &&
                !dungeonCustomHeroIds.has(String(id))
              )
            );
            customHeroesForMode(false).forEach(h=>{if(h?.id)ids.add(String(h.id));});
            return [...ids];
          }

          '''
          repair='''function repairEmptyBaseSurvivalHeroPool(){
            try{
              const profiles=loadGameProfilesRaw();
              const bp=profiles.find(p=>String(p?.id||"")===String(GAME_PROFILE_BASE_ID));
              if(!bp||bp.builtIn!==true||!Array.isArray(bp.heroPool)||bp.heroPool.length)return false;
              const restored=survivalHeroIdsForBaseProfile();
              if(!restored.length)return false;
              bp.heroPool=restored;
              saveGameProfiles(profiles);
              return true;
            }catch(e){console.warn("Réparation pool héros Survie",e);return false}
          }

          '''
          if s.count(helper)!=1:
              raise SystemExit(f"global survival helper count={s.count(helper)}")
          if s.count(repair)!=1:
              raise SystemExit(f"global repair helper count={s.count(repair)}")
          s=s.replace(helper,"",1).replace(repair,"",1)

          owner_old='''    // Isolation stricte : le pool 40K est indépendant du mode actif.
              // Un lancement Dungeon ne doit jamais vider le profil Survie de référence.
              bp.heroPool=survivalHeroIdsForBaseProfile();
          '''
          owner_new='''    // Isolation stricte : le pool 40K est indépendant du mode actif.
              // Un lancement Dungeon ne doit jamais vider le profil Survie de référence.
              applyCustomHeroesMulti();
              const dungeonCustomHeroIds=new Set(customHeroesForMode(true).map(h=>String(h.id)));
              const survivalHeroIds=new Set(
                Object.keys(CHARS).filter(id=>
                  !(typeof DUNGEON_HERO_IDS!=="undefined"&&DUNGEON_HERO_IDS.includes(String(id))) &&
                  !dungeonCustomHeroIds.has(String(id))
                )
              );
              customHeroesForMode(false).forEach(h=>{if(h?.id)survivalHeroIds.add(String(h.id));});
              bp.heroPool=[...survivalHeroIds];
          '''
          if s.count(owner_old)!=1:
              raise SystemExit(f"owner v1 count={s.count(owner_old)}")
          s=s.replace(owner_old,owner_new,1)

          call_old='''  setActiveGameProfileId(profileId);
            if(String(profileId)===String(GAME_PROFILE_BASE_ID))repairEmptyBaseSurvivalHeroPool();
            gensCleanIncompatibleHeroSelection();
          '''
          call_new='''  setActiveGameProfileId(profileId);
            if(String(profileId)===String(GAME_PROFILE_BASE_ID)){
              const baseProfile=activeGameProfileRaw();
              if(baseProfile?.builtIn===true&&Array.isArray(baseProfile.heroPool)&&!baseProfile.heroPool.length)ensureBaseGameProfile();
            }
            gensCleanIncompatibleHeroSelection();
          '''
          if s.count(call_old)!=1:
              raise SystemExit(f"openGensBuiltInGame repair call count={s.count(call_old)}")
          s=s.replace(call_old,call_new,1)

          if "function survivalHeroIdsForBaseProfile()" in s or "function repairEmptyBaseSurvivalHeroPool()" in s:
              raise SystemExit("new global helper still present")
          if "bp.heroPool=currentAllHeroIds().filter" in s:
              raise SystemExit("mode-dependent Survival heroPool rebuild returned")
          p.write_text(s,encoding="utf-8")
          PY

          after="$(git hash-object index.html)"
          bytes_after="$(wc -c < index.html | tr -d ' ')"
          echo "after_blob=$after"
          echo "after_bytes=$bytes_after"
          test "$after" = "6e76a99af5fb839db5ffb20a2e67fd1572bf13ea"
          test "$bytes_after" = "8171571"

      - name: Commit v2 owner repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/gensrpg-survival-hero-availability-v2-one-shot.yml
          git commit -m "fix: keep Survival hero repair inside existing owners"
          git push origin HEAD:work/gensrpg-survival-hero-availability-regression-2026-09-23
