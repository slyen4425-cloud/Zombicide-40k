name: GenSrpG architecture sentinels

on:
  push:
    branches:
      - 'work/gensrpg-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture-sentinels:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Verrouiller la composition réelle du runtime V114.11
        run: node tests/gens_runtime_composition_guard_v11411.test.cjs

      - name: Vérifier RuntimeBootstrap V1
        run: node tests/gens_runtime_bootstrap_v1.test.cjs

      - name: Bloquer toute nouvelle autorité globale GenSrpG
        run: node tests/gens_architecture_global_side_effect_guard.test.cjs

      - name: Vérifier le profil performance mobile inchangé
        run: node tests/gens_mobile_combat_performance_v16781022.test.cjs

      - name: Vérifier l'autorité UI Dungeon native V114.11
        run: node tests/gens_v11411_native_ui_authority.test.cjs

      - name: Vérifier Force canonique vers snapshot Tactical
        run: node tests/gens_force_to_tactical_snapshot_v11411.test.cjs

      - name: Vérifier Agilité canonique vers toucher distance expliqué
        run: node tests/gens_agility_ranged_hit_attribution_v11411.test.cjs

      - name: Vérifier la cohérence Base héros et Total en jeu
        run: node tests/gens_stat_editor_game_display_semantics_v11411.test.cjs

      - name: Vérifier le calcul final dégâts mêlée V114.11
        run: node tests/gens_v11411_final_melee_damage_contract.test.cjs

      - name: Caractériser progression, victoire et récompenses natives
        run: node tests/gens_progression_victory_characterization_v11411.test.cjs

      - name: Extraire les autorités exactes progression et victoire
        run: node tests/gens_progression_victory_authority_extract_v11411.test.cjs

      - name: Verrouiller XP manuel vers progression canonique
        run: node tests/gens_manual_xp_progression_runtime_v1.test.cjs

      - name: Vérifier le résumé de victoire Tactical
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs

      - name: Exécuter victoire Tactical vers XP et butin Dungeon
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs

      - name: Vérifier le polish Tactical V108 historique
        run: node tests/gens_rpg_tactical_combat_v2_polish_v1678108.test.cjs

      - name: Vérifier le retrait de l'observer global V108
        run: node tests/gens_v108_observer_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité détection V108
        run: node tests/gens_v108_detection_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité murale V108
        run: node tests/gens_v108_wall_authority_retirement_v11411.test.cjs

      - name: Vérifier le polish Tactical V109 historique
        run: node tests/gens_rpg_tactical_combat_v2_polish_v1678109.test.cjs

      - name: Vérifier le retrait de l'observer global V109
        run: node tests/gens_v109_observer_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité murale V109
        run: node tests/gens_v109_wall_authority_retirement_v11411.test.cjs

      - name: Vérifier les snapshots Tactical V110 historiques
        run: node tests/gens_rpg_tactical_combat_v2_stats_v1678110.test.cjs

      - name: Vérifier les corrections runtime V111 historiques
        run: node tests/gens_rpg_tactical_runtime_fixes_v1678111.test.cjs

      - name: Vérifier le retrait de l'observer global V111
        run: node tests/gens_v111_observer_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité détection V111
        run: node tests/gens_v111_detection_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité murale V111
        run: node tests/gens_v111_wall_authority_retirement_v11411.test.cjs

      - name: Vérifier la cohérence spatiale V112 historique
        run: node tests/gens_rpg_tactical_combat_coherence_v1678112.test.cjs

      - name: Vérifier le retrait de l'observer global V112
        run: node tests/gens_v112_observer_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité détection V112
        run: node tests/gens_v112_detection_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité murale V112
        run: node tests/gens_v112_wall_authority_retirement_v11411.test.cjs

      - name: Vérifier l'autorité runtime V113
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113.test.cjs

      - name: Verrouiller V113 comme unique autorité de détection Tactical
        run: node tests/gens_tactical_single_detection_authority_v11411.test.cjs

      - name: Vérifier le retrait de l'observer global V113
        run: node tests/gens_v113_observer_retirement_v11411.test.cjs

      - name: Vérifier que toute la chaîne Tactical est sans observer global actif
        run: node tests/gens_tactical_observer_chain_clean_v11411.test.cjs

      - name: Caractériser l'autorité visuelle des murs Tactical
        run: node tests/gens_tactical_visual_authority_characterization_v11411.test.cjs

      - name: Verrouiller l'unique autorité JS des murs Tactical
        run: node tests/gens_tactical_single_js_wall_authority_v11411.test.cjs

      - name: Caractériser la dette CSS murale historique
        run: node tests/gens_tactical_wall_css_authority_characterization_v11411.test.cjs

      - name: Vérifier le retrait CSS mural V108
        run: node tests/gens_v108_wall_css_authority_retirement_v11411.test.cjs

      - name: Verrouiller l'unique autorité CSS des murs Tactical
        run: node tests/gens_tactical_single_css_wall_authority_v11411.test.cjs

      - name: Vérifier le retrait CSS mural V109
        run: node tests/gens_v109_wall_css_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait CSS mural V111
        run: node tests/gens_v111_wall_css_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait CSS mural V112
        run: node tests/gens_v112_wall_css_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait CSS mural V113
        run: node tests/gens_v113_wall_css_authority_retirement_v11411.test.cjs

      - name: Vérifier le retrait de l'autorité murale V113
        run: node tests/gens_v113_wall_authority_retirement_v11411.test.cjs

      - name: Vérifier le raccord Bridge vers V113
        run: node tests/gens_rpg_tactical_runtime_authority_v1678113_bridge.test.cjs

      - name: Vérifier le scope V113 sur le contrat Bridge explicite
        run: node tests/gens_bridge_v113_explicit_scope_v11411.test.cjs

      - name: Vérifier la parité détection V113 du contrat Bridge explicite
        run: node tests/gens_bridge_v113_detection_parity_v11411.test.cjs

      - name: Caractériser l'autorité de démarrage et des participants combat
        run: node tests/gens_combat_authority_characterization_v11411.test.cjs

      - name: Vérifier le contrat unique d'entrée du Bridge Tactical
        run: node tests/gens_bridge_single_entry_contract_v11411.test.cjs

      - name: Figer l'inventaire des anciens points d'entrée combat
        run: node tests/gens_combat_callsite_inventory_v11411.test.cjs

      - name: Vérifier la composition de la preview manuelle
        run: node tests/gens_preview_composition_v11411.test.cjs

  browser-sentinel:
    needs: architecture-sentinels
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright pour la sentinelle navigateur
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Vérifier l'isolation navigateur V114.11
        run: node tests/gens_v11411_native_ui_browser.test.cjs

      - name: Vérifier le rendu canonique des murs dans Chromium
        run: node tests/gens_tactical_wall_browser_v11411.test.cjs

      - name: Vérifier la preview manuelle dans Chromium
        run: node tests/gens_preview_browser_v11411.test.cjs
