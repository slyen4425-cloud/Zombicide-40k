name: Validate V16.78.107.1 Tactical UI

on:
  push:
    branches:
      - work/v16.78.107.1-tactical-readability-roll-walls
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax tactical routing and UI modules
        run: |
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-bridge.js
          node --check assets/gensrpg/gens-rpg-runtime-repair-1678106.js
          node --check assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js
          node --check assets/gensrpg/gens-mobile-combat-performance-16781022.js
      - name: Test global Dungeon combat entry routing
        run: node tests/gens_rpg_tactical_combat_v2_entry_v1678105.test.cjs
      - name: Test real Runtime 2.00 renderer seam and Dungeon dedupe
        run: node tests/gens_rpg_runtime_repair_v1678106.test.cjs
      - name: Test tactical portraits persistent dice roll rule and walls
        run: node tests/gens_rpg_tactical_combat_v2_ui_v1678107.test.cjs
      - name: Test tactical grid engine
        run: node tests/gens_rpg_tactical_combat_v2.test.cjs
      - name: Test tactical adapter
        run: node tests/gens_rpg_tactical_combat_v2_adapter.test.cjs
      - name: Test tactical bridge and cover
        run: node tests/gens_rpg_tactical_combat_v2_default.test.cjs
      - name: Guard tactical isolation
        run: node tests/gens_rpg_tactical_combat_v2_isolation.test.cjs
      - name: Preserve Survival isolation
        run: node tests/gens_survival_mode_isolation_v1678104.test.cjs
      - name: Preserve mode-aware dice
        run: node tests/gens_mobile_combat_performance_v16781022.test.cjs
      - name: Preserve Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
