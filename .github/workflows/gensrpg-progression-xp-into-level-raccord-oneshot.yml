name: GenSrpG Progression xpIntoLevel raccord one-shot

on:
  push:
    branches:
      - work/gensrpg-phase4-progression-xp-into-level-raccord-2026-09-22
    paths:
      - .github/workflows/gensrpg-progression-xp-into-level-raccord-oneshot.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-progression-xp-into-level-raccord-2026-09-22
          fetch-depth: 0

      - name: Verify exact source and patch XP-into-level owner
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < index.html)" = "8174416"
          test "$(git hash-object index.html)" = "a68bcbaf5d16bdbe2e70cbe0959a421371554fcc"
          test "$(git hash-object assets/gensrpg/core/progression-v1.js)" = "f633de55f1e6bda339e66c65debc35d7b8da2510"

          python - <<'PY'
          from pathlib import Path
          import subprocess

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          old='window.dungeonRpgXpIntoLevel=function(xp){const p=activeProg(),v=Math.max(0,Number(xp)||0);if(!p||(p.xpCurveMode||"linear")!=="custom"){const per=Math.max(1,Number(p?.xpPerLevel)||loadDungeonRpgRules().xpPerLevel||10);return v%per}const level=dungeonRpgLevelFromXp(v),start=level<=1?0:Math.max(0,Number(p.xpThresholds?.[level])||0);return Math.max(0,v-start)}'
          new='window.dungeonRpgXpIntoLevel=function(xp){const p=activeProg(),v=Math.max(0,Number(xp)||0),needsFallback=(!p||(p.xpCurveMode||"linear")!=="custom")&&!Number(p?.xpPerLevel),fallback=needsFallback?loadDungeonRpgRules().xpPerLevel:undefined;return GensProgressionV1.xpIntoLevel(v,p,fallback)}'

          assert s.count(old)==1
          assert new not in s
          assert s.count('assets/gensrpg/core/progression-v1.js?v=1')==1

          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")

          assert p.stat().st_size==8174346
          blob=subprocess.check_output(["git","hash-object","index.html"],text=True).strip()
          assert blob=="8da7afa3c986f29e740eee1748dcc0ec0f8f75bc",blob
          PY

          grep -F 'GensProgressionV1.xpIntoLevel(v,p,fallback)' index.html
          git diff --check -- index.html
          git diff -- index.html

      - name: Commit exact micro-raccord and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gensrpg-progression-xp-into-level-raccord-oneshot.yml
          git add index.html
          git diff --cached --check
          git commit -m "refactor: raccord Core Progression xpIntoLevel owner"
          git push origin HEAD:work/gensrpg-phase4-progression-xp-into-level-raccord-2026-09-22
