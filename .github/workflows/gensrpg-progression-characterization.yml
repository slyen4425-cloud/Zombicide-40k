name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-4b-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core301-disabled-retirement-one-shot:
    if: github.actor != 'github-actions[bot]' && startsWith(github.ref_name, 'work/gensrpg-combat-callsite-migration-4b-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prove Lot 4B target is red before retirement
        run: |
          if node tests/gens_core301_disabled_timeline_retirement_lot4b.test.cjs; then
            echo 'Lot 4B target is already green before the expected retirement.' >&2
            exit 1
          fi
      - name: Retire only disabled Core 3.01 timeline script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<script id="dungeonCore301Timeline" type="application/x-gensrpg-disabled">'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('Disabled Core 3.01 timeline marker not found')
          end = text.find('</script>', start)
          if end < 0:
              raise SystemExit('Disabled Core 3.01 timeline end not found')
          end += len('</script>')
          block = text[start:end]
          if block.count('dc200StartCombat') != 2:
              raise SystemExit(f'Expected exactly 2 dc200StartCombat references in disabled Core 3.01, found {block.count("dc200StartCombat")}')
          if 'dungeonCore303TimelineRootFix' in block:
              raise SystemExit('Active Core 3.03 leaked into removal block')
          if text.count(marker) != 1:
              raise SystemExit('Disabled Core 3.01 marker is not unique')
          text = text[:start] + text[end:]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Validate exact Lot 4B target
        run: |
          node tests/gens_core301_disabled_timeline_retirement_lot4b.test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const count=n=>(s.match(new RegExp('\\b'+n+'\\b','g'))||[]).length;
          const expected={dc200StartCombat:9,openDungeonCombatSetup:1,launchCombat200:2,startCombat:6};
          for(const [name,n] of Object.entries(expected)){
            const got=count(name);
            if(got!==n)throw new Error(`${name} inventory changed unexpectedly: ${got} != ${n}`);
          }
          NODE
      - name: Commit exact disabled Core 3.01 retirement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No runtime change produced'; exit 1; }
          git commit -m 'refactor: retire disabled Core 3.01 timeline script'
          git push origin HEAD:${{ github.ref_name }}

  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native manual XP runtime
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Characterize native progression and rewards
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Verify Tactical victory rewards summary
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Execute Tactical victory to Dungeon XP and loot
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Characterize manual level authority
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
