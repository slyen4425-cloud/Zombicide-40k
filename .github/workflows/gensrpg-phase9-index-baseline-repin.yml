name: GenSrpG Phase 9 index baseline repin one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-public-entry-raccord-2026-10-03'
    paths:
      - '.github/workflows/gensrpg-phase9-index-baseline-repin.yml'

permissions:
  contents: write

jobs:
  repin-index-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify new runtime baseline
        run: |
          test "$(git hash-object index.html)" = "f523410e175ee4946059da8e8ee8519295fb63c5"
          test "$(wc -c < index.html)" = "8169430"

      - name: Repin exact baseline constants in tests only
        run: python tools/gensrpg_phase9_repin_index_baseline.py

      - name: Verify mechanical scope
        run: |
          ! grep -RIl --exclude-dir=.git '02a052bc231728eb383e17c83e61a958be0ac58c\|8169555' tests
          git diff --check
          test -z "$(git diff --name-only | grep -v '^tests/')" || (echo "Non-test file modified" && exit 1)
          echo "Changed test files: $(git diff --name-only | wc -l)"
          git diff --stat

      - name: Commit repinned test baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: repin index baseline after Capture public entry"
          git push origin "HEAD:$GITHUB_REF_NAME"
