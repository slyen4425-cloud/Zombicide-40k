name: GenSrpG Architecture Guard

on:
  push:
    branches:
      - work/gensrpg-restructure-phase-1
      - nettoyage-bugs
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce GenSrpG Charter boundaries
        run: node tests/gens_architecture_charter_guard.test.cjs
      - name: Validate pure Core RPG rules contract
        run: node tests/gens_core_rpg_rules_contract.test.cjs
      - name: Validate canonical stats to Tactical runtime path
        run: node tests/gens_core_rpg_runtime_path_contract.test.cjs
      - name: Validate Tactical RPG armor and ranged boundaries
        run: node tests/gens_core_rpg_tactical_boundaries_contract.test.cjs
