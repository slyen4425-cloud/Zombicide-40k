name: Capture official release payload (not public activation)
on:
  push:
    branches:
      - 'work/gensrpg-capture-official-delivery-package-*'
      - 'work/gensrpg-capture-official-hub-composition-*'
      - 'work/gensrpg-capture-pages-pinned-delivery-*'
      - 'work/gensrpg-capture-official-battle-view-*'
      - 'work/gensrpg-capture-real-wild-button-*'
      - 'work/gensrpg-capture-world-paired-encounters-playable-*'
      - 'work/gensrpg-capture-offline-verified-media-cache-*'
  pull_request:
    paths:
      - 'tools/stage_capture_lab_delivery.mjs'
      - '.github/workflows/main.yml'
      - 'tests/gens_capture_lab_pages_pipeline_v1.test.cjs'
      - 'tests/gens_capture_lab_pages_site_v1.test.cjs'
      - 'tests/gens_capture_lab_delivery_v1.test.cjs'
      - 'tests/gens_capture_kitsune_author_12_gate_v1.test.cjs'
      - 'tests/gens_capture_official_hub_composition_v1.test.cjs'
      - 'tests/gens_capture_official_hub_composition_browser_v1.test.cjs'
      - 'tests/gens_capture_official_battle_view_v1.test.cjs'
      - 'tests/gens_capture_official_battle_view_2v2_browser_v1.test.cjs'
      - 'assets/gensrpg/capture/capture-official-battle-view-v1.mjs'
      - 'assets/gensrpg/capture/capture-official-hub-composition-v1.mjs'
      - 'assets/gensrpg/capture/capture-official-wild-entry-v1.mjs'
      - 'assets/gensrpg/capture/legacy-monolith-functions-v1.js'
      - 'tests/gens_capture_real_wild_button_v1.test.cjs'
      - 'tests/gens_capture_real_wild_button_browser_v1.test.cjs'
      - 'tests/gens_capture_public_world_2v2_browser_v1.test.cjs'
      - 'tests/gens_capture_native_lab_scene_v1.test.cjs'
      - 'tests/gens_capture_lab_single_authority_acceptance_v1.test.cjs'
      - 'tests/gens_capture_lab_world_settings_owner_v1.test.cjs'
      - 'tests/gens_capture_lab_authoring_port_v1.test.cjs'
      - 'tests/gens_capture_lab_author_ui_provider_v1.test.cjs'
      - 'assets/gensrpg/capture/capture-lab-author-ui-provider-v1.mjs'
      - 'assets/gensrpg/capture/lab-ownership-port-v1.js'
      - 'assets/gensrpg/capture/capture-native-lab-*.mjs'
      - '.github/workflows/capture-lab-delivery.yml'
      - 'service-worker.js'
      - 'tests/gens_capture_pwa_offline_pinned_media_v1.test.cjs'
      - 'tests/gens_capture_pwa_offline_pinned_media_browser_v1.test.cjs'
      - 'tools/build_capture_lab_preview.mjs'
      - 'tools/prepare_capture_lab_authored_preview.mjs'
      - 'docs/GENSRPG_CAPTURE_LAB_STAGED_FILES_2026-10-27.json'
permissions:
  contents: read
jobs:
  official-static-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real PWA worker guards approved immutable creature images and warm-offline resume
        run: node --test tests/gens_capture_pwa_offline_pinned_media_v1.test.cjs
      - name: TDD Kitsune official twelfth author provenance
        run: node --test tests/gens_capture_kitsune_author_12_gate_v1.test.cjs
      - name: TDD check true original Capture COMBATTRE owner (RED before implementation)
        run: node --test tests/gens_capture_real_wild_button_v1.test.cjs
      - name: Check official payload wiring in the real Pages pipeline (RED before implementation)
        run: node --test tests/gens_capture_lab_pages_pipeline_v1.test.cjs
      - name: Resolve immutable official author and asset SHA from the existing owners
        id: pins
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import {COMBAT_LAB_SOURCE_V1} from './assets/gensrpg/capture/combat-lab-engine-loader-v1.mjs';
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('docs/GENSRPG_CAPTURE_LAB_STAGED_FILES_2026-10-27.json','utf8'));
          if(COMBAT_LAB_SOURCE_V1.sha!==manifest.authoredSourceLabPin)throw Error('Conflicting pinned Combat authority');
          if(!/^[0-9a-f]{40}$/.test(manifest.authoredAssetsPin))throw Error('Unpinned visual catalog');
          console.log('combat='+COMBAT_LAB_SOURCE_V1.sha);
          console.log('visuals='+manifest.authoredAssetsPin);
          JS
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.pins.outputs.combat }}
          path: combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.pins.outputs.visuals }}
          path: combat-assets
          sparse-checkout: |
            data/assets/catalog
      - name: Build official static release payload without installing it in the game
        run: |
          mkdir -p _site
          node tools/stage_capture_lab_delivery.mjs combat-lab combat-assets _site
      - name: Verify packaged bytes, official ESM imports, species limits and no public/PWA changes
        env:
          COMBAT_LAB_ROOT: ${{ github.workspace }}/combat-lab
          COMBAT_ASSETS_ROOT: ${{ github.workspace }}/combat-assets
          CAPTURE_LAB_DELIVERY_SITE: ${{ github.workspace }}/_site
        run: |
          node --test tests/gens_capture_lab_authoring_port_v1.test.cjs
          node --test tests/gens_capture_lab_author_ui_provider_v1.test.cjs
          node --test tests/gens_capture_lab_world_settings_owner_v1.test.cjs
          node --test tests/gens_capture_lab_single_authority_acceptance_v1.test.cjs
          node --test tests/gens_capture_native_lab_scene_v1.test.cjs
          node --test tests/gens_capture_lab_delivery_v1.test.cjs
          node --test tests/gens_capture_official_hub_composition_v1.test.cjs
          node --test tests/gens_capture_official_battle_view_v1.test.cjs
          node tests/gens_phase9_capture_exit_gate_evidence_v1.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
      - name: Install browsers for real official Hub landscape touch tests
        run: |
          npm install --prefix /tmp/capture-lab-browser --no-save playwright@1.55.0
          /tmp/capture-lab-browser/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Verify real saved-Hub composition in Chromium and Firefox landscape
        env:
          NODE_PATH: /tmp/capture-lab-browser/node_modules
          CAPTURE_LAB_DELIVERY_SITE: ${{ github.workspace }}/_site
          CAPTURE_OFFICIAL_HUB_SCREENSHOT: _site/capture-official-hub-landscape.png
        run: |
          node --test tests/gens_capture_official_hub_composition_browser_v1.test.cjs
          node --test tests/gens_capture_official_battle_view_2v2_browser_v1.test.cjs
      - name: Verify ORIGINAL World-rendered COMBATTRE, migration consent and native Combat in Chromium and Firefox
        env:
          NODE_PATH: /tmp/capture-lab-browser/node_modules
          CAPTURE_LAB_DELIVERY_SITE: ${{ github.workspace }}/_site
          CAPTURE_NATIVE_LAB_SCREENSHOT: _site/capture-native-lab-landscape.png
          CAPTURE_NATIVE_LAB_VIDEO_DIR: _site/capture-native-lab-video
        run: |
          node --test tests/gens_capture_real_wild_button_browser_v1.test.cjs
          node --test tests/gens_capture_public_world_2v2_browser_v1.test.cjs
      - name: Verify actual service worker and immutable official sprite warm/offline in landscape Chromium + Firefox
        env:
          NODE_PATH: /tmp/capture-lab-browser/node_modules
          CAPTURE_LAB_DELIVERY_SITE: ${{ github.workspace }}/_site
        run: node --test tests/gens_capture_pwa_offline_pinned_media_browser_v1.test.cjs
      - name: Upload version-locked payload (not deployed, no public game entry)
        uses: actions/upload-artifact@v4
        with:
          name: capture-official-release-payload
          path: |
            _site/vendor/combat-lab/
            _site/assets/gensrpg/capture/runtime-data/
            _site/capture-official-hub-landscape.png
            _site/capture-native-lab-landscape.png
            _site/capture-native-lab-video/
          retention-days: 14
