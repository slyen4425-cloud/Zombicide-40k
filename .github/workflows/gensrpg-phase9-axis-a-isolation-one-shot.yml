name: GenSrpG Phase 9 Capture Axis A targeted proof (temporary)
on:
  push:
    branches:
      - work/gensrpg-phase9-capture-axis-a-runtime-isolation-2026-10-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture-axis-a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run real Capture-alone combat isolation diagnostic
        run: node tests/gens_phase9_capture_axis_a_no_dungeon_runtime_browser_v1.test.cjs
