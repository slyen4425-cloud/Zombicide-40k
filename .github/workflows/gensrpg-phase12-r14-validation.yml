            node "$file" || failures="${failures} ${file##*/}"
            echo "::endgroup::"
          done <<'TEST_FILES'
          tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs
          tests/gens_phase2_runtime_side_effect_inventory_v11411.test.cjs
          tests/gens_phase2_inline_owner_manifest_v11411.test.cjs
          tests/gens_phase2_inline_global_last_owner_v11411.test.cjs
          tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs
          tests/gens_phase3_target_structure_contracts_v1.test.cjs
          tests/gens_runtime_composition_guard_v11411.test.cjs
          TEST_FILES
          if [ -n "$failures" ]; then
            printf 'FAILED:%s\n' "$failures" | tee r14_failure_summary.txt
            exit 1
          fi
          echo 'PASSED 8 verified checks'
      - name: Report immutable SHA status to GitHub
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          VALIDATION_CONTEXT: "gensrpg/r14/architecture"
        run: |
          set -euo pipefail
          result="$JOB_RESULT"
          if [ "$result" = 'success' ]; then result='success'; else result='failure'; fi
          description='R14 Runtime owner and architecture sentinels - '"$JOB_RESULT"
          if [ -f r14_failure_summary.txt ]; then
            first="$(head -c 90 r14_failure_summary.txt)"
            description="R14 ${first}"
          fi
          payload="$(jq -nc --arg state "$result" --arg context "$VALIDATION_CONTEXT" --arg description "${description:0:139}" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$description,target_url:$url}')"
          curl --fail --show-error --silent --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
  core-tactical:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Core Dice, Tactical seam and source parity
        shell: bash
        run: |
          set -uo pipefail
          failures=''
          while IFS= read -r file; do
            test -n "$file" || continue
            echo "::group::node $file"
            node "$file" || failures="${failures} ${file##*/}"
            echo "::endgroup::"
          done <<'TEST_FILES'
          tests/gens_phase4_dice_d10048_raccord_v1.test.cjs
          tests/gens_phase4_dice_first_raccord_preaudit_v1.test.cjs
          TEST_FILES
          if [ -n "$failures" ]; then
            printf 'FAILED:%s\n' "$failures" | tee r14_failure_summary.txt
            exit 1
          fi
          echo 'PASSED 2 verified checks'
      - name: Report immutable SHA status to GitHub
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          VALIDATION_CONTEXT: "gensrpg/r14/core-tactical"
        run: |
          set -euo pipefail
          result="$JOB_RESULT"
          if [ "$result" = 'success' ]; then result='success'; else result='failure'; fi
          description='R14 Core Dice, Tactical seam and source parity - '"$JOB_RESULT"
          if [ -f r14_failure_summary.txt ]; then
