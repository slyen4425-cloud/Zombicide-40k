name: GenSrpG Phase 5 Core 0.30 derived alignment one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase5-gomenu-core030-retirement-2026-09-23'

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime and align derived fingerprints/cartography
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "6a9392e667881f2087e4df931645cada4201cb3c"
          test "$(wc -c < index.html | tr -d ' ')" = "8171079"

          python3 - <<'PY'
          from pathlib import Path

          OLD_BLOB="4f8c3b9be4189a9ac163fcb17531c95cbd783b05"
          NEW_BLOB="6a9392e667881f2087e4df931645cada4201cb3c"
          OLD_SIZE="8171795"
          NEW_SIZE="8171079"

          changed=[]

          # Exact runtime fingerprints in tests are derived from index.html.
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              n=s.replace(OLD_BLOB,NEW_BLOB).replace(OLD_SIZE,NEW_SIZE)
              if n!=s:
                  p.write_text(n,encoding="utf-8")
                  changed.append(str(p))

          # Phase 2 maps are descriptive derivatives of the current index.
          derived=[
              Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
              Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json"),
              Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
              Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
          ]
          for p in derived:
              s=p.read_text(encoding="utf-8")
              if s.count(OLD_BLOB)!=1:
                  raise SystemExit(f"{p}: expected exactly one old source blob, got {s.count(OLD_BLOB)}")
              n=s.replace(OLD_BLOB,NEW_BLOB,1)
              if p.name=="GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv":
                  old="# distinctGlobals=438 assignments=768 multiOwnerGlobals=121"
                  new="# distinctGlobals=438 assignments=767 multiOwnerGlobals=121"
                  if n.count(old)!=1:
                      raise SystemExit(f"{p}: inline assignment header drift")
                  n=n.replace(old,new,1)
                  oldrow="goMenu\t5\tdungeonCore200Rebuild"
                  newrow="goMenu\t4\tdungeonCore200Rebuild"
                  if n.count(oldrow)!=1:
                      raise SystemExit(f"{p}: goMenu row drift")
                  n=n.replace(oldrow,newrow,1)
              p.write_text(n,encoding="utf-8")
              changed.append(str(p))

          # Phase 2 generated-table sentinel: one global assignment was removed.
          p=Path("tests/gens_phase2_inline_global_last_owner_v11411.test.cjs")
          s=p.read_text(encoding="utf-8")
          old="assert.equal(assignments,768,'explicit inline global assignments drifted');"
          new="assert.equal(assignments,767,'explicit inline global assignments drifted');"
          if s.count(old)!=1:
              raise SystemExit("Phase 2 inline global assignment assertion drift")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          if str(p) not in changed: changed.append(str(p))

          # Historical pre-audit sentinel is realigned to characterize the
          # remaining chain; the dedicated retirement sentinel guards Core 0.30.
          p=Path("tests/gens_phase5_gomenu_screen_transitions_preaudit_v1.test.cjs")
          s=p.read_text(encoding="utf-8")
          replacements=[
              ("assert.deepEqual(phase2,{count:5,last:'dungeonCore200Rebuild'},",
               "assert.deepEqual(phase2,{count:4,last:'dungeonCore200Rebuild'},"),
              ("assert.equal(total,5,'goMenu current runtime assignment count drifted');",
               "assert.equal(total,4,'goMenu current runtime assignment count drifted');"),
              ("  'dungeonCore023StabilityFix',\n  'dungeonCore030HeroReturnFix',\n  'dungeonCore200Rebuild'",
               "  'dungeonCore023StabilityFix',\n  'dungeonCore200Rebuild'"),
              ("assert.match(bodies.dungeonCore030HeroReturnFix,/const prevGo=window\\.goMenu;[\\s\\S]*if\\(window\\.DungeonCore01\\?\\.active && DungeonCore01\\.eligible\\?\\.\\(\\)\\)/,\n  'Core 0.30 keeps a Dungeon hero-return/UI cleanup branch');\n",
               ""),
          ]
          for old,new in replacements:
              if s.count(old)!=1:
                  raise SystemExit(f"goMenu preaudit expected replacement count 1, got {s.count(old)} for {old[:80]!r}")
              s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          changed.append(str(p))

          # The dedicated TDD must already be GREEN structurally.
          source=Path("index.html").read_text(encoding="utf-8")
          a=source.index('<script id="dungeonCore030HeroReturnFix">')
          z=source.index('</script>',a)
          body=source[a:z]
          if "window.goMenu=" in body or "const prevGo=window.goMenu;" in body:
              raise SystemExit("Core 0.30 goMenu authority unexpectedly remains")

          # No current test may still lock the superseded exact runtime fingerprint.
          stale=[]
          for p in sorted(Path("tests").rglob("*.test.cjs")):
              s=p.read_text(encoding="utf-8")
              if OLD_BLOB in s or OLD_SIZE in s:
                  stale.append(str(p))
          if stale:
              raise SystemExit("stale runtime fingerprints remain: "+", ".join(stale))

          print("aligned files:")
          for x in changed: print(x)
          PY

      - name: Commit derived alignment and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv                   docs/GENSRPG_PHASE2_INLINE_OWNERS.json                   docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json                   docs/GENSRPG_PHASE2_STORAGE_OWNERS.json                   docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json                   tests
          git rm .github/workflows/gensrpg-phase5-gomenu-core030-derived-alignment-one-shot.yml
          git commit -m "test: align Core 0.30 goMenu retirement derivatives"
          git push origin HEAD:work/gensrpg-phase5-gomenu-core030-retirement-2026-09-23
