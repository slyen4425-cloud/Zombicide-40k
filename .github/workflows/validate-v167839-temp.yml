name: Validate V16.78.39 authored Dungeon runtime
on:
  push:
    branches:
      - work/dungeon-v16.78.39-authored-runtime
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax authored runtime
        run: node --check assets/dungeon/dungeon-authored-runtime-167839.js
      - name: Syntax session bridge
        run: node --check assets/dungeon/dungeon-world-session-bridge-167832.js
      - name: Dedicated two-room authored runtime
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Authored/generated mode selection
        run: node tests/dungeon_world_session_bridge_v167832.test.cjs
      - name: Full random Dungeon regression
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Existing large-room authority
        run: node tests/dungeon_large_room_v167834.test.cjs
      - name: Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Legacy custom room compatibility
        run: node tests/dungeon_room_runtime_v167822.test.cjs
      - name: Legacy World Runtime compatibility
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Exact zone content chain
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
      - name: Build exact Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f "Z40K_GITHUB_PAGES_READY.zip" ]; then unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site; fi
          cp -f index.html _site/index.html
          [ ! -f manifest.webmanifest ] || cp -f manifest.webmanifest _site/manifest.webmanifest
          [ ! -f manifest.json ] || cp -f manifest.json _site/manifest.json
          cp -f service-worker.js _site/service-worker.js
          mkdir -p _site/icons
          [ ! -f icon-192.png ] || cp -f icon-192.png _site/icons/icon-192.png
          [ ! -f icon-512.png ] || cp -f icon-512.png _site/icons/icon-512.png
          for file in sound_*.mp3; do [ ! -f "$file" ] || cp -f "$file" _site/; done
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          index=Path('_site/index.html')
          modules=[
            (Path('_site/assets/dungeon/dungeon-core-318.js'), '<script src="assets/dungeon/dungeon-core-318.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-large-room-support-167834.js'), '<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-100.js'), '<script src="assets/dungeon/dungeon-room-creator-100.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-v2-167819.js'), '<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-feedback-167821.js'), '<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>'),
            (Path('_site/assets/dungeon/dungeon-world-builder-167821.js'), '<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-runtime-167822.js'), '<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>'),
            (Path('_site/assets/dungeon/dungeon-world-runtime-167823.js'), '<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>'),
            (Path('_site/assets/dungeon/dungeon-zone-content-167824.js'), '<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>'),
            (Path('_site/assets/dungeon/dungeon-authored-runtime-167839.js'), '<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167839"></script>'),
            (Path('_site/assets/dungeon/dungeon-equipment-ui.js'), '<script src="assets/dungeon/dungeon-equipment-ui.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-equipment-hotfix-167817.js'), '<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>'),
            (Path('_site/assets/dungeon/dungeon-set-editor-167818.js'), '<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>'),
            (Path('_site/assets/gensrpg/gens-world-summary-167820.js'), '<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>')
          ]
          html=index.read_text(encoding='utf-8')
          if '</body>' not in html: raise SystemExit('missing </body>')
          for module,tag in modules:
            if not module.exists(): raise SystemExit(f'missing {module}')
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          index.write_text(html,encoding='utf-8')
          PY
      - name: Verify final Pages module order
        run: |
          grep -q 'dungeon-world-runtime-167823.js?v=167838' _site/index.html
          grep -q 'dungeon-zone-content-167824.js?v=167824' _site/index.html
          grep -q 'dungeon-authored-runtime-167839.js?v=167839' _site/index.html
          grep -q 'dungeon-world-session-bridge-167832.js?v=167839' _site/assets/dungeon/dungeon-room-creator-feedback-167821.js
          grep -q 'gensrpg-cache-16.78.39-authored-dungeon-runtime' _site/service-worker.js
          python3 - <<'PY'
          from pathlib import Path
          h=Path('_site/index.html').read_text(encoding='utf-8')
          assert h.index('dungeon-world-runtime-167823.js?v=167838') < h.index('dungeon-zone-content-167824.js?v=167824') < h.index('dungeon-authored-runtime-167839.js?v=167839')
          PY
      - name: Final site Dungeon load
        run: node tests/dungeon_final_load_regression.test.cjs _site/index.html
      - name: Final site authored two-room scenario
        run: node tests/dungeon_authored_runtime_v167839.test.cjs _site/index.html
      - name: Final site mode selection
        run: node tests/dungeon_world_session_bridge_v167832.test.cjs _site/index.html
      - name: Final site Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs _site/index.html
      - name: Final site World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs _site/index.html
      - name: Final site exact content
        run: node tests/dungeon_zone_content_v167824.test.cjs _site/index.html
      - name: Final site equipment
        run: node tests/dungeon_equipment_ui_hotfix_v167817.test.cjs assets/dungeon/dungeon-equipment-ui.js assets/dungeon/dungeon-equipment-hotfix-167817.js _site/index.html
      - name: Final site sets
        run: node tests/dungeon_set_editor_v167818.test.cjs assets/dungeon/dungeon-set-editor-167818.js _site/index.html .github/workflows/main.yml service-worker.js
      - name: Final site summaries
        run: node tests/gens_world_summary_v167820.test.cjs _site/index.html
