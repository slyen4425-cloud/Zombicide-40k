name: GenSrpG Phase 6 Survival Zombicide base wave raccord

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-zombicide-base-wave-profile-2026-09-25

permissions:
  contents: write

jobs:
  raccord:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-zombicide-base-wave-profile-2026-09-25
          fetch-depth: 0

      - name: Apply exact Phase 6 Survival raccord
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          OLD_SIZE=8170730
          OLD_BLOB="7663392f163aac32c4c3b918cbce67472856b3b6"
          NEW_SIZE=8169596
          NEW_BLOB="d451372389f29d0145d3f9689ca739128a0650e9"

          index=Path("index.html")
          raw=index.read_bytes()
          blob=hashlib.sha1(f"blob {len(raw)}\0".encode()+raw).hexdigest()
          assert len(raw)==OLD_SIZE, (len(raw),OLD_SIZE)
          assert blob==OLD_BLOB, (blob,OLD_BLOB)

          src=raw.decode("utf-8")
          owner="function zombicideBaseWaveProfile(){"
          next_owner="function zombicideBaseReserve(){"
          legacy_call="zombicideBaseWaveProfile()"
          direct_call="GensSurvivalV1.waveRules.zombicideBaseProfile(BP_SPAWN_CARDS,ZOMBIE_TYPES)"

          assert src.count(owner)==1
          assert src.count(legacy_call)==4

          start=src.index(owner)
          end=src.index(next_owner,start)
          src=src[:start]+src[end:]

          assert src.count(legacy_call)==3
          src=src.replace(legacy_call,direct_call)
          assert src.count("zombicideBaseWaveProfile")==0
          assert src.count(direct_call)==3

          out=src.encode("utf-8")
          out_blob=hashlib.sha1(f"blob {len(out)}\0".encode()+out).hexdigest()
          assert len(out)==NEW_SIZE, (len(out),NEW_SIZE)
          assert out_blob==NEW_BLOB, (out_blob,NEW_BLOB)
          index.write_bytes(out)

          # Exact-current-runtime fingerprint guards only.
          targets=list(Path("tests").glob("*.cjs"))
          targets+=list(Path("docs").glob("GENSRPG_PHASE2_*"))
          changed=0
          for p in targets:
              try:
                  text=p.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new=text.replace(str(OLD_SIZE),str(NEW_SIZE)).replace(OLD_BLOB,NEW_BLOB)
              if new!=text:
                  p.write_text(new,encoding="utf-8")
                  changed+=1
          print({"newSize":len(out),"newBlob":out_blob,"fingerprintFiles":changed})
          PY

      - name: Verify micro-lot sentinel locally
        run: node tests/gens_phase6_survival_zombicide_base_wave_profile_v1.test.cjs

      - name: Commit exact raccord and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/gensrpg-phase6-survival-zombicide-base-wave-profile-raccord.yml
          git add index.html tests docs/GENSRPG_PHASE2_*
          git commit -m "refactor: connect Zombicide base waves to Survival"
          git push origin HEAD:work/gensrpg-phase6-survival-zombicide-base-wave-profile-2026-09-25
