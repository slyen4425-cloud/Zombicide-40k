name: Validate V16.78.41 authored content fixes
on:
  push:
    branches:
      - work/dungeon-v16.78.41-authored-content-fixes
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax authored content hotfix
        run: node --check assets/dungeon/dungeon-authored-content-hotfix-167841.js
      - name: Authored content HP trap chest regression
        run: node tests/dungeon_authored_content_hotfix_v167841.test.cjs
      - name: Full Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Authored movement
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Large rooms
        run: node tests/dungeon_large_room_v167834.test.cjs
      - name: World session selection
        run: node tests/dungeon_world_session_bridge_v167832.test.cjs
      - name: Exact zone content
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
      - name: Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: World Runtime
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Equipment hotfix
        run: node tests/dungeon_equipment_ui_hotfix_v167817.test.cjs assets/dungeon/dungeon-equipment-ui.js assets/dungeon/dungeon-equipment-hotfix-167817.js
      - name: Build final site copy
        run: |
          rm -rf _site
          mkdir -p _site
          cp -f index.html _site/index.html
          cp -f service-worker.js _site/service-worker.js
          cp -R assets _site/assets
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          tags=[
            '<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>',
            '<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>',
            '<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167840"></script>',
            '<script src="assets/dungeon/dungeon-authored-content-hotfix-167841.js?v=167841"></script>',
            '<script src="assets/dungeon/dungeon-equipment-ui.js"></script>',
            '<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>',
            '<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>'
          ]
          for tag in tags:
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY
      - name: Set editor final-site regression
        run: node tests/dungeon_set_editor_v167818.test.cjs assets/dungeon/dungeon-set-editor-167818.js _site/index.html .github/workflows/main.yml service-worker.js
      - name: Final authored content load
        run: node tests/dungeon_authored_content_hotfix_v167841.test.cjs _site/index.html
