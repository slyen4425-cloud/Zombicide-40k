name: GenSrpG hero sheet Talent flash

on:
  push:
    branches:
      - 'work/gensrpg-hero-sheet-talent-flash-diagnostic-2026-09-17'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  characterize-talent-visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Apply scoped native Talent visibility fix in worktree
        id: patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = ' if(p)p.style.display=d?"block":"none";if(z)z.style.display=d?"none":"block";'
          new = ' if(z)z.style.display=d?"none":"block";'
          count = text.count(old)

          if count == 1:
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              changed = 'true'
          elif count == 0 and new in text:
              changed = 'false'
          else:
              raise SystemExit(f'Expected exactly one scoped Talent visibility writer, found {count}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f'changed={changed}\n')
          PY

      - name: Run true-path Talent characterization and capture failure
        id: talent_test
        shell: bash
        run: |
          set +e
          node tests/gens_hero_sheet_talent_flash_v11411.test.cjs > /tmp/talent-test.log 2>&1
          status=$?
          cat /tmp/talent-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            mkdir -p notes
            {
              echo "Temporary CI diagnostic after applying only the scoped Talent-panel visibility removal in the worktree."
              echo
              cat /tmp/talent-test.log
            } > notes/gensrpg-talent-flash-ci-diagnostic.txt
          fi
          exit 0

      - name: Persist diagnostic only when the scoped fix is still red
        if: steps.talent_test.outputs.status != '0'
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q '^diagnostic: capture Talent true-path failure$'; then
            exit 0
          fi
          git restore --staged . || true
          git add notes/gensrpg-talent-flash-ci-diagnostic.txt
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git commit -m "diagnostic: capture Talent true-path failure"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          exit 1

      - name: Commit scoped runtime fix to work branch
        if: steps.talent_test.outputs.status == '0' && steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add index.html
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "fix: keep Talent visibility under sheet tabs"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Fail if Talent characterization remains red
        if: steps.talent_test.outputs.status != '0'
        run: exit 1
