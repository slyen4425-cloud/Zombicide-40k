name: GenSrpG Phase12 R09 source rollback and Survival wave smoke
on:
  push:
    branches:
      - 'work/gensrpg-phase12-r09-survival-wave-spawn-2026-10-18'
permissions:
  contents: read
jobs:
  r09-source-rollback-survival:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Certify original d7 source and output blobs
        run: |
          test "$(git hash-object index.html)" = '4dbe3314d5048f2def404ed674498c0670c04fc1'
          test "$(git hash-object assets/gensrpg/survival/legacy-wave-presets-spawn-v1.js)" = '515642eda275802c50af867d5712517d47020414'
          node tools/gensrpg_phase12_r09_wave_extract_apply.cjs --verify
          test "$(node tools/gensrpg_phase12_r09_wave_extract_apply.cjs --restore-r08 | git hash-object --stdin)" = "6eeed45a0a12085c1b107ee6c24b49040277ca54"
      - name: Exercise true classic-script global composition and Survival reserve/waves
        run: |
          node --check assets/gensrpg/survival/legacy-wave-presets-spawn-v1.js
          node tests/gensrpg_phase12_r09_wave_sentinel.test.cjs
