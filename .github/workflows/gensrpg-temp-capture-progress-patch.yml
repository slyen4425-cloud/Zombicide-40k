name: GenSrpG temporary Capture progress index patch

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-capture-progress-2026-09-20
    paths:
      - .github/workflows/gensrpg-temp-capture-progress-patch.yml

permissions:
  contents: write

jobs:
  apply-exact-index-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-capture-progress-2026-09-20
          fetch-depth: 0

      - name: Apply exact Capture progress patch
        run: |
          set -euo pipefail
          git apply --check .github/capture-progress-index.patch
          git apply .github/capture-progress-index.patch

          python3 - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          assert s.count("localStorage.getItem(captureCreatureProgressRulesKey())")==0
          assert s.count("localStorage.setItem(captureCreatureProgressRulesKey()")==0
          assert s.count("GensStorageV1.readJson(localStorage,captureCreatureProgressRulesKey(),{})")==1
          assert s.count("GensStorageV1.writeJson(localStorage,captureCreatureProgressRulesKey(),r)")==4
          assert s.count("GensStorageV1.writeJson(localStorage,captureCreatureProgressRulesKey(),pr)")==2
          PY

          test "$(git hash-object index.html)" = "5d2b0a6da51fd70bd36f087cb9ab82a1af308226"

      - name: Commit only the final source change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/capture-progress-index.patch .github/workflows/gensrpg-temp-capture-progress-patch.yml
          git add index.html
          git diff --cached --check
          git commit -m "refactor: route Capture progress JSON through Core storage"
          git push origin HEAD:work/gensrpg-phase4-storage-capture-progress-2026-09-20
