name: GenSrpG Phase 9 Capture World Exploration one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-world-exploration-extraction-2026-10-10'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-world-exploration-apply.yml'

permissions:
  contents: write

jobs:
  apply-world-exploration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved baseline and pre-change CI source
        run: |
          test "$(git hash-object index.html)" = "2f2edfa5a1e229e4630889e7f0d5442199e221eb"
          test "$(wc -c < index.html)" = "7975990"
          test "$(git branch --show-current)" = "work/gensrpg-phase9-capture-world-exploration-extraction-2026-10-10"

      - name: Apply physical owner transfer (byte pinned)
        run: |
          python tools/gensrpg_phase9_capture_world_extraction_apply.py --apply
          python tools/gensrpg_phase9_capture_world_extraction_apply.py --verify
          test "$(git hash-object index.html)" = "42583858f0df0f1b3bcd65ca6a282c8ba27b1c07"
          test "$(wc -c < index.html)" = "7958968"
          test "$(git hash-object assets/gensrpg/capture/world-exploration-v1.js)" = "ecfe276ba1a73b0a164c09f698ab17010289b7ee"
          node --check assets/gensrpg/capture/world-exploration-v1.js

      - name: Keep historical tests pinned to their original exact source
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/helpers/gens_capture_v162_legacy_snapshot_v1.cjs')
          t=p.read_text()
          old="const index=fs.readFileSync(path.join(root,'index.html'));"
          new="const index=require('./gens_capture_world_extraction_snapshot_v1.cjs').seedEraIndexBytes(root);"
          assert t.count(old)==1
          p.write_text(t.replace(old,new),newline='')
          p=Path('scripts/gensrpg_capture_seed_extract_v1.cjs')
          t=p.read_text()
          old="  const index=fs.readFileSync(indexPath);"
          new="  const index=require('../tests/helpers/gens_capture_world_extraction_snapshot_v1.cjs').seedEraIndexBytes(root);"
          assert t.count(old)==2
          p.write_text(t.replace(old,new,1),newline='')
          PY

      - name: Check physical extraction and legacy sentinels
        run: |
          node tests/gens_phase9_capture_world_physical_extraction_v1.test.cjs
          node tests/gens_phase9_capture_seed_physical_extraction_v1.test.cjs
          node tests/gens_phase9_capture_hub_world_owner_characterization_v1.test.cjs
          node tests/gens_phase9_capture_axis_a_no_dungeon_runtime_browser_v1.test.cjs --help >/dev/null 2>&1 || true

      - name: Install Chromium for real Capture browser routes
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify real Capture browser lifecycle after world transfer
        run: |
          node tests/gens_phase9_capture_axis_b_clean_resume_browser_v1.test.cjs
          node tests/gens_phase9_capture_axis_c_shutdown_owner_browser_v1.test.cjs
          node tests/gens_phase5_capture_victory_resume_e2e_browser_v1.test.cjs

      - name: Review restricted runtime diff before committing
        run: |
          git diff --check
          git diff --stat
          python tools/gensrpg_phase9_capture_world_extraction_apply.py --verify
          test -z "$(git diff --name-only | grep -v -E '^(index\.html|tests/helpers/gens_capture_v162_legacy_snapshot_v1\.cjs|scripts/gensrpg_capture_seed_extract_v1\.cjs)$')"
          test -f assets/gensrpg/capture/world-exploration-v1.js

      - name: Commit verified owner without touching main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gensrpg/capture/world-exploration-v1.js \
            tests/helpers/gens_capture_v162_legacy_snapshot_v1.cjs \
            scripts/gensrpg_capture_seed_extract_v1.cjs
          test "$(git diff --cached --name-only | wc -l)" = "4"
          git commit -m "refactor(phase9): physically extract Capture world exploration owner"
          git push origin "HEAD:$GITHUB_REF_NAME"
