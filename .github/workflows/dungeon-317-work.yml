name: Dungeon 3.17 workbench

on:
  push:
    branches:
      - "work/dungeon-v16.78.11-spatial-armor-shop"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Core 3.17 patch
        run: node tests/apply_core317_patch.cjs
      - name: Check Core 3.17 JavaScript syntax
        run: node --check assets/dungeon/dungeon-core-317.js
      - name: Core 3.17 regressions
        run: node tests/core317_regression.test.cjs
      - name: Existing dungeon regression suite
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Reject whitespace errors
        run: git diff --check
      - name: Commit validated V16.78.11 application patch
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html service-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "feat: GenSrpG V16.78.11 / Dungeon Core 3.17"
            git push
          fi
