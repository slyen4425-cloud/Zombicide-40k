name: GenSrpG Phase5 Dungeon S2 scan fingerprints

on:
  push:
    branches:
      - work/gensrpg-phase5-module-screen-return-dungeon-s2-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-dungeon-s2-scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-module-screen-return-dungeon-s2-2026-09-23
          fetch-depth: 0
      - name: List S1 fingerprint references
        shell: bash
        run: |
          set -euo pipefail
          echo "=== S1 BLOB REFERENCES ==="
          grep -RIl --exclude='index.html' 'c17460335b2deb5e5916dbf91448b0706c38d0df' tests docs assets .github || true
          echo "=== S1 SIZE REFERENCES ==="
          grep -RIl --exclude='index.html' '8172505' tests docs assets .github || true
