name: Validate V16.78.38 built-world generation isolation
on:
  push:
    branches:
      - work/dungeon-v16.78.38-built-world-generation-settings-isolation
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax World Runtime
        run: node --check assets/dungeon/dungeon-world-runtime-167823.js
      - name: Syntax World Session Bridge
        run: node --check assets/dungeon/dungeon-world-session-bridge-167832.js
      - name: Built-world generation settings isolation
        run: node tests/dungeon_world_session_bridge_v167832.test.cjs
      - name: Built-world direct runtime
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Real room sizes and world selection guard
        run: node tests/dungeon_large_room_v167834.test.cjs
      - name: Exact Zone content chain
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Full Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Room runtime
        run: node tests/dungeon_room_runtime_v167822.test.cjs
      - name: Enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
      - name: Equipment hotfix
        run: node tests/dungeon_equipment_ui_hotfix_v167817.test.cjs assets/dungeon/dungeon-equipment-ui.js assets/dungeon/dungeon-equipment-hotfix-167817.js
      - name: Set editor
        run: node tests/dungeon_set_editor_v167818.test.cjs assets/dungeon/dungeon-set-editor-167818.js
      - name: World summaries
        run: node tests/gens_world_summary_v167820.test.cjs
      - name: Build final site copy
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f "Z40K_GITHUB_PAGES_READY.zip" ]; then unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site; fi
          cp -f index.html _site/index.html
          [ ! -f manifest.webmanifest ] || cp -f manifest.webmanifest _site/manifest.webmanifest
          [ ! -f manifest.json ] || cp -f manifest.json _site/manifest.json
          cp -f service-worker.js _site/service-worker.js
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          index=Path('_site/index.html')
          modules=[
            '<script src="assets/dungeon/dungeon-core-318.js"></script>',
            '<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-100.js"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>',
            '<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>',
            '<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>',
            '<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>',
            '<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>',
            '<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>',
            '<script src="assets/dungeon/dungeon-equipment-ui.js"></script>',
            '<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>',
            '<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>',
            '<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>'
          ]
          html=index.read_text(encoding='utf-8')
          if '</body>' not in html: raise SystemExit('missing </body>')
          for tag in modules:
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          index.write_text(html,encoding='utf-8')
          PY
      - name: Final site load and isolation
        run: |
          grep -q 'dungeon-world-runtime-167823.js?v=167838' _site/index.html
          grep -q 'dungeon-world-session-bridge-167832.js?v=167838' _site/assets/dungeon/dungeon-room-creator-feedback-167821.js
          grep -q 'gensrpg-cache-16.78.38-built-world-no-auto-generation' _site/service-worker.js
          node tests/dungeon_final_load_regression.test.cjs _site/index.html
          node tests/dungeon_world_session_bridge_v167832.test.cjs _site/index.html
          node tests/dungeon_world_runtime_v167823.test.cjs _site/index.html
          node tests/dungeon_room_creator_v2_v167819.test.cjs _site/index.html
          node tests/dungeon_world_builder_v167821.test.cjs _site/index.html
          node tests/dungeon_room_runtime_v167822.test.cjs _site/index.html
          node tests/dungeon_zone_content_v167824.test.cjs _site/index.html
          node tests/dungeon_equipment_ui_hotfix_v167817.test.cjs assets/dungeon/dungeon-equipment-ui.js assets/dungeon/dungeon-equipment-hotfix-167817.js _site/index.html
          node tests/dungeon_set_editor_v167818.test.cjs assets/dungeon/dungeon-set-editor-167818.js _site/index.html .github/workflows/main.yml service-worker.js
          node tests/gens_world_summary_v167820.test.cjs _site/index.html
