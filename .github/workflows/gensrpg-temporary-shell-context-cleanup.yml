name: GenSrpG temporary Shell context cleanup

on:
  push:
    branches:
      - 'work/gensrpg-phase1-shell-context-cleanup-fix-2026-09-18'

permissions:
  contents: write

jobs:
  apply-shell-context-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify source index blob
        shell: bash
        run: |
          set -euo pipefail
          expected='8aa918ba7da41be41fb369ccc522bb217c97bfa1'
          actual="$(git hash-object index.html)"
          echo "index blob: $actual"
          test "$actual" = "$expected"

      - name: Apply minimal owner cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''function openGensFamily(family){
            gensSelectedFamily=family;
            gensHideHomeLevels();'''
          new='''function openGensFamily(family){
            gensSelectedFamily=family;
            document.body.classList.remove("gensCapturePregame","gensAdventurePregame");
            if(family!=="adventure")document.body.classList.remove("gensDungeonTheme");
            gensHideHomeLevels();'''
          if s.count(old) != 1:
              raise SystemExit(f"Expected exactly one openGensFamily owner anchor, found {s.count(old)}")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only)" = "index.html"
          git diff --unified=4 -- index.html

      - name: Commit minimal runtime change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: clear stale Shell context when changing family"
          git push origin "HEAD:${GITHUB_REF_NAME}"
