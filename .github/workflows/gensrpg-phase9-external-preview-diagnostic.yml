name: GenSrpG Phase 9 external preview diagnostic

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-session-start-owner-transfer-2026-10-07'
    paths:
      - '.github/workflows/gensrpg-phase9-external-preview-diagnostic.yml'
      - 'tests/gens_preview_external_browser_v1.test.cjs'
      - 'tests/gens_dungeon_builder_visibility_browser_v11411.test.cjs'
      - 'tests/gens_capture_current_shell_browser_v11411.test.cjs'

permissions:
  contents: read

jobs:
  external-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify Capture Adventure card semantics
        run: node tests/gens_capture_current_shell_browser_v11411.test.cjs

      - name: Reproduce Capture return to Dungeon Builder deterministically
        if: always()
        run: node tests/gens_dungeon_builder_visibility_browser_v11411.test.cjs
