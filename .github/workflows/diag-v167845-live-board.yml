name: Diagnose V16.78.45 live board
on:
  push:
    branches:
      - work/dungeon-v16.78.45-live-board-fix-2026-09-05
    paths:
      - .github/workflows/diag-v167845-live-board.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live enemy authority and scene storage
        run: |
          echo '=== definitions ==='
          grep -nE 'function (visibleEnemies|liveEnemies)|trackSpawnedEnemyInstances|dc200Bypassed|function sceneForRoom|loadDungeonSceneElements' index.html | head -n 240 || true
          echo '=== spatial enemy filters 39270-39345 ==='
          sed -n '39270,39345p' index.html
          echo '=== spawn tracker surroundings ==='
          L=$(grep -n 'function trackSpawnedEnemyInstances' index.html | head -1 | cut -d: -f1); if [ -n "$L" ]; then A=$((L-35)); B=$((L+80)); sed -n "${A},${B}p" index.html; fi
          echo '=== every dc200Bypassed write ==='
          grep -n 'dc200Bypassed' index.html || true
          echo '=== scene storage definitions ==='
          grep -nE 'function (loadDungeonSceneElements|saveDungeonSceneElements|addDungeonSceneElement|removeDungeonSceneElement)' index.html | head -n 80 || true
