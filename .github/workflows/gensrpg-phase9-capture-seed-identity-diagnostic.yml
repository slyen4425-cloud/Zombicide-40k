name: GenSrpG Phase 9 Capture seed identity diagnostic

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-dungeon-identity-preaudit-2026-10-04'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-seed-identity-diagnostic.yml'

permissions:
  contents: read

jobs:
  capture-without-dungeon-style:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Caractériser Capture sans gameStyle Dungeon
        run: node tests/gens_phase9_capture_seed_without_dungeon_style_browser_characterization_v1.test.cjs
