name: Capture v2 clean ownership boundary
on:
  workflow_dispatch:
  push:
    branches:
      - 'work/gensrpg-capture-clean-replacement-*'
  pull_request:
    paths:
      - 'assets/gensrpg/capture-v2/**'
      - 'index.html'
      - 'tests/gens_capture_v2_clean_boundary.test.cjs'
      - 'tests/gens_capture_v2_game_menu_v1.test.cjs'
      - 'tests/gens_capture_v2_item_editor_catalog_20261110.test.mjs'
      - 'tests/gens_capture_v2_item_editor_browser_20261110.test.cjs'
      - 'tests/gens_capture_v2_adventure_hero_progression_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_portfolio_v1.test.mjs'
      - 'tests/gens_capture_v2_compact_rpg_sheet_v1.test.mjs'
      - 'tests/gens_capture_v2_world_selection_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_progression_access_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_rules_draft_persistence_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_creator_draft_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_play_sheet_v1.test.mjs'
      - 'tests/gens_capture_v2_adventure_wild_reserve_20261108.test.mjs'
      - 'tests/gens_capture_v2_adventure_xp_fullscreen_20261108.test.mjs'
      - 'tests/gens_capture_v2_play_resume_team_loading_20261108.test.mjs'
      - 'tests/gens_capture_v2_play_team_ux_20261108.test.mjs'
      - 'tests/gens_capture_v2_camera_team_preplay_20261108.test.mjs'
      - 'tests/gens_capture_v2_atomic_bestiary_cache_20261108.test.mjs'
      - 'tests/gens_capture_v2_team_native_interop_20261108.test.mjs'
      - 'tests/gens_capture_v2_multiplayer_lobby_v1.test.mjs'
      - 'tests/gens_capture_v2_survival_online_boundary_v1.test.mjs'
      - 'tests/gens_capture_v2_live_room_adapter_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_position_contract_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_transport_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_live_subscription_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_observation_ui_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_frame_relay_v1.test.mjs'
      - 'tests/gens_capture_v2_peer_play_bridge_v1.test.mjs'
      - 'tests/gens_capture_v2_exploration_position_events_v1.test.mjs'
      - 'supabase/migrations/20261106195000_gensrpg_capture_peer_presence_v1.sql'
      - 'supabase/migrations/20261106170500_gensrpg_capture_rooms_isolated_v1.sql'
      - 'tests/gens_capture_v2_adventure_hp_policy_20261105.test.mjs'
      - 'tests/gens_capture_v2_adventure_owned_stats_grant_v1.test.mjs'
      - 'tests/gens_capture_v2_official_combat_levels_pin_v1.test.mjs'
      - 'tests/gens_capture_v2_generic_profile_owner.test.cjs'
      - 'tests/gens_capture_v2_root_browser.test.cjs'
      - 'tests/gens_capture_v2_pwa_cache_owner_v1.test.cjs'
      - 'tests/gens_capture_v2_pwa_upgrade_browser_v1.test.cjs'
      - 'tests/gens_dungeon_builder_visibility_after_capture_v2_browser_v1.test.cjs'
      - 'tests/gens_preview_external_capture_v2_browser_v1.test.cjs'
      - '.github/workflows/main.yml'
      - '.github/workflows/capture-v2-clean-base.yml'
permissions:
  contents: read
jobs:
  clean-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse the two new Capture-only modules
        run: |
          node --check assets/gensrpg/capture-v2/identity-v1.js
          node --check assets/gensrpg/capture-v2/shell-entry-v1.js
      - name: Verify real GenSrpg root and both official sources (TDD RED first)
        run: |
          node --test tests/gens_capture_v2_clean_boundary.test.cjs
          node --test tests/gens_capture_v2_pwa_cache_owner_v1.test.cjs

      - name: Certified immutable Lab main ancestry guard (TDD)
        run: node --test tests/gens_capture_v2_official_pin_lineage_20261107.test.mjs
      - name: Menu de jeu Capture — groupes Monde/Combat et entrée 2.5D unique (TDD)
        run: node --test tests/gens_capture_v2_game_menu_v1.test.cjs

      - name: TDD Monster Capture — salon hôte/invités isolé (RED puis GREEN)
        run: node --test tests/gens_capture_v2_multiplayer_lobby_v1.test.mjs

      - name: Monster Capture — refuser la synchronisation globale du multijoueur Survie
        run: node --test tests/gens_capture_v2_survival_online_boundary_v1.test.mjs

      - name: Monster Capture — authentification isolée et vrais boutons héberger/rejoindre/quitter
        run: node --test tests/gens_capture_v2_live_room_adapter_v1.test.mjs

      - name: TDD Capture C3 — projection de position Exploration & anti-replay, RED puis GREEN
        run: node --test tests/gens_capture_v2_peer_position_contract_v1.test.mjs

      - name: Capture C3 — client Auth réel & RPC de position avec identité serveur
        run: node --test tests/gens_capture_v2_peer_transport_v1.test.mjs

      - name: Capture C3 — notifications Realtime vers positions serveur garanties par RLS (RED/GREEN)
        run: node --test tests/gens_capture_v2_peer_live_subscription_v1.test.mjs

      - name: Capture C3 — positions distantes présentées sans deuxième renderer
        run: node --test tests/gens_capture_v2_peer_observation_ui_v1.test.mjs

      - name: Capture C3 — livraison vers le renderer officiel Exploration uniquement après handshake
        run: node --test tests/gens_capture_v2_peer_frame_relay_v1.test.mjs

      - name: Capture C3 — vraie entrée Aventure, monde partagé validé avant sauvegarde
        run: node --test tests/gens_capture_v2_peer_play_bridge_v1.test.mjs

      - name: Capture C3 — événements de navigation officiels, écouteur iframe et dispose
        run: node --test tests/gens_capture_v2_exploration_position_events_v1.test.mjs

      - name: Aventure V2 — contrat XP, loot, bestiaire publié, sauvegarde et résultat unique (TDD)
        run: node --test tests/gens_capture_v2_adventure_contract_v1.test.mjs

      - name: Éditeur d’objets Capture — catalogue, imports sans destruction, sauvegardes historiques
        run: node --test tests/gens_capture_v2_item_editor_catalog_20261110.test.mjs

      - name: RED/GREEN — 1 à 6 créatures de départ en Aventure
        run: node --test tests/gens_capture_v2_initial_party_1to6_20261107.test.mjs

      - name: Correction avant publication — sauvegardes multiples, migration additive et sélection de la partie
        run: node --test tests/gens_capture_v2_adventure_portfolio_v1.test.mjs

      - name: Fiches RPG héros et créatures — réduction sans perte des portraits ou des zones tactiles
        run: node --test tests/gens_capture_v2_compact_rpg_sheet_v1.test.mjs

      - name: Capture C9 — monde lié à la partie, activation officielle sans copie de WorldDocument
        run: node --test tests/gens_capture_v2_world_selection_v1.test.mjs

      - name: TDD GenSRPG Aventure → Exploration Jouer session corrélée (RED puis GREEN)
        run: node --test tests/gens_capture_v2_native_play_handoff_v1.test.mjs

      - name: TDD official Bestiary → native Exploration encounter candidates, published only
        run: node --test tests/gens_capture_v2_published_encounter_catalog_v1.test.mjs

      - name: TDD GenSRPG published Combat Bestiary grant into real Exploration Jouer
        run: node --test tests/gens_capture_v2_adventure_publication_grant_v1.test.mjs

      - name: TDD CombatResult officiel → Core Storage Aventure, commit avant ack, replay sans double loot
        run: node --test tests/gens_capture_v2_adventure_combat_commit_v1.test.mjs

      - name: Aventure V2 — sélection officielle d'une HeroDefinition et grant Jouer scoped (TDD)
        run: node --test tests/gens_capture_v2_adventure_hero_selection_v1.test.mjs

      - name: Aventure — XP par paliers, stats officielles 20 points, rôles du créateur (TDD)
        run: node --test tests/gens_capture_v2_adventure_progression_access_v1.test.mjs

      - name: Préparation Aventure sans répartition de stats, fiche jeu propriétaire (TDD)
        run: node --test tests/gens_capture_v2_preparation_stats_owner_20261107.test.mjs

      - name: Aventure — réglages sauvegardés avant une première partie, recharge sans perte (TDD)
        run: node --test tests/gens_capture_v2_adventure_rules_draft_persistence_v1.test.mjs

      - name: Aventure — permissions créateur MJ sauvées avant première partie (TDD)
        run: node --test tests/gens_capture_v2_adventure_creator_draft_v1.test.mjs

      - name: "Caméra de partie Aventure : angle créateur 35–90 et zoom libre Exploration (TDD)"
        run: node --test tests/gens_capture_v2_creator_game_camera_20261107.test.mjs

      - name: Aventure en partie — fiche personnage, inventaire, créatures, stats du Core (TDD)
        run: node --test tests/gens_capture_v2_adventure_play_sheet_v1.test.mjs
      - name: Monster Capture team, return title and native speed (new rule)
        run: node --test tests/gens_capture_v2_play_team_ux_20261108.test.mjs
      - name: Camera preplay and complete 1-to-6 team regression
        run: node --test tests/gens_capture_v2_camera_team_preplay_20261108.test.mjs
      - name: TDD Android PWA — fichiers officiels Bestiaire cohérents malgré ancien cache
        run: node --test tests/gens_capture_v2_atomic_bestiary_cache_20261108.test.mjs

      - name: Aventure sauvage — 1 à 6 créatures en réserve, KO et sauvegarde unique
        run: node --test tests/gens_capture_v2_adventure_wild_reserve_20261108.test.mjs
      - name: Répartition XP des 1 à 6 créatures et sac visible en plein écran (TDD)
        run: node --test tests/gens_capture_v2_adventure_xp_fullscreen_20261108.test.mjs
      - name: Save/reboot 1–6 party and first-paint loading regression
        run: node --test tests/gens_capture_v2_play_resume_team_loading_20261108.test.mjs

      - name: Aventure V2 — choix créateur progression du héros sans XP par défaut (TDD)
        run: node --test tests/gens_capture_v2_adventure_hero_progression_v1.test.mjs

      - name: Aventure — PV 25 % configurable, sauvegardes anciennes intactes et niveaux libres (TDD)
        run: node --test tests/gens_capture_v2_adventure_hp_policy_20261105.test.mjs

      - name: RED/GREEN — PV 140→35 identiques à Combat, monde Test 1, aucune sauvegarde écrasée
        run: node --test tests/gens_capture_v2_hp_world_id_20261108.test.mjs

      - name: Aventure — points de stats de l'instance transportés avec validation du budget officiel (TDD)
        run: node --test tests/gens_capture_v2_adventure_owned_stats_grant_v1.test.mjs

      - name: Aventure V2 — projection de l'instance réelle avant le Combat (TDD)
        run: node --test tests/gens_capture_v2_adventure_playing_party_grant_v1.test.mjs

      - name: Aventure V2 — seule UI propriétaire, vrais éditeurs et Bestiaire non dupliqués
        run: node --test tests/gens_capture_v2_adventure_ui_owner_v1.test.mjs

      - name: Historical Survival Dungeon game profile factory parity
        run: node --test tests/gens_capture_v2_generic_profile_owner.test.cjs

  root-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and certify both published main pins
        id: pins
        run: |
          node tools/verify_capture_official_lab_pins_v1.mjs >> "$GITHUB_OUTPUT"
      - name: Read official Combat from main at its certified SHA
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.pins.outputs.combat }}
          path: combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
      - name: Read official Exploration from main at its certified SHA
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/laboratoire_dynamique_exploration-
          ref: ${{ steps.pins.outputs.exploration }}
          path: exploration-lab
          sparse-checkout: |
            src
            assets
            index.html
            builder.html
            world-assembler.html
            sculpt-lab.html
            play.html
            scripts
      # Real Adventure/Bestiary browser test must use the certified public
      # preview's ONE immutable author-visual pin. Never fake the catalog or
      # borrow a moving global-assets HEAD.
      - name: Read the single currently certified public visual pin
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/Zombicide-40k
          ref: aa34bf1f415d14ba2c62e6745f8655aec6e3a4fa
          path: approved-public-preview
          sparse-checkout: |
            tools
      - name: Resolve immutable visual catalog SHA from public Pages owner
        id: adventure_visual_pin
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const pin=JSON.parse(fs.readFileSync('approved-public-preview/tools/capture_v2_pages_preview_pin.json','utf8'));
          const visual=pin.officialVisuals;
          if(pin.schema!=='gensrpg-capture-v2-pages-source-pin-v1' ||
             pin.publicPath!=='/preview/capture-v2-pr225/' ||
             visual?.repository!=='slyen4425-cloud/GenSrpg_labo_combat_dynamique' ||
             visual.ref!=='global-assets' ||
             !/^[a-f0-9]{40}$/.test(visual.sha) ||
             !Number.isInteger(visual.certifiedCiRun)||visual.certifiedCiRun<=0)
            throw Error('No certified visual authority in active Pages pin');
          console.log('sha='+visual.sha);
          JS
      - name: Checkout only the catalog of published author assets
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.adventure_visual_pin.outputs.sha }}
          path: approved-adventure-visuals
          sparse-checkout: |
            data/assets/catalog
      - name: Assemble original Lab modules without any GenSrpg engine copy
        run: |
          test "$(git -C combat-lab rev-parse HEAD)" = "${{ steps.pins.outputs.combat }}"
          test "$(git -C exploration-lab rev-parse HEAD)" = "${{ steps.pins.outputs.exploration }}"
          mkdir -p _site/vendor/combat-lab _site/vendor/exploration-lab
          cp -a combat-lab/src combat-lab/data combat-lab/examples _site/vendor/combat-lab/
          cp -a exploration-lab/src exploration-lab/assets _site/vendor/exploration-lab/
          cp exploration-lab/index.html exploration-lab/builder.html exploration-lab/world-assembler.html exploration-lab/sculpt-lab.html exploration-lab/play.html _site/vendor/exploration-lab/
          # The installed-PWA regression must run against real GenSrpg Pages files,
          # not a vendor-only directory that returned 404 for every pre-cache URL.
          cp -f index.html service-worker.js manifest.webmanifest _site/
          mkdir -p _site/assets
          rsync -a --exclude='/gensrpg/capture/' assets/ _site/assets/
          test -f _site/index.html
          test -f _site/assets/gensrpg/capture-v2/shell-entry-v1.js
          test ! -e _site/assets/gensrpg/capture
          node tools/stage_capture_v2_labs.mjs combat-lab exploration-lab _site
          node tools/stage_capture_v2_official_visuals.mjs approved-adventure-visuals approved-public-preview/tools/capture_v2_pages_preview_pin.json _site
      - name: Capture V2 — véritable Combat main et niveaux 1 uniques, pas de fallback Tester (TDD)
        run: node --test tests/gens_capture_v2_official_combat_levels_pin_v1.test.mjs

      - name: Gorice et Gemmor du vrai Bestiaire Combat, caméra Exploration certifiée (TDD)
        run: node --test tests/gens_capture_v2_official_gorice_gemmor_20261108.test.mjs

      - name: Combat officiel = fiche en jeu PV 140→35, points Santé et reprise ancienne (TDD)
        run: node --test tests/gens_capture_v2_official_hp_parity_20261108.test.mjs

      - name: Verify native owner of speed, transitions, team and title return
        run: node --test tests/gens_capture_v2_team_native_interop_20261108.test.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 pngjs@7.0.0
          npx playwright install chromium
      - name: Run real four-mode GenSrpg root and Capture V2-to-Dungeon Builder in Chromium
        run: |
          node --test tests/gens_capture_v2_root_browser.test.cjs
          node --test tests/gens_capture_v2_item_editor_browser_20261110.test.cjs
          node tests/gens_dungeon_builder_visibility_after_capture_v2_browser_v1.test.cjs
          node --test tests/gens_capture_v2_pwa_upgrade_browser_v1.test.cjs
          node tests/gens_preview_external_capture_v2_browser_v1.test.cjs

  inspect-authored-drop-icons:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect exact uploaded ZIP on current publisher main without touching source branch
        uses: actions/checkout@v4
        with:
          ref: 4bac69424ccf0dabb078258eba0d0ab45689b496
          sparse-checkout: monster_capture_drops_visuels_12_icones.zip
          persist-credentials: false
      - name: Print checked ZIP file names, sizes, PNG dimensions, and safe extraction paths
        run: |
          python3 - <<'PY'
          import zipfile,hashlib,struct, pathlib
          p=pathlib.Path('monster_capture_drops_visuels_12_icones.zip')
          print('AUTHORED_DROP_ZIP_BYTES',p.stat().st_size)
          print('AUTHORED_DROP_ZIP_SHA256',hashlib.sha256(p.read_bytes()).hexdigest())
          with zipfile.ZipFile(p) as z:
              entries=[x for x in z.infolist() if not x.is_dir()]
              print('AUTHORED_DROP_README_BEGIN')
              print(z.read('README_IMPORT.md').decode('utf-8'))
              print('AUTHORED_DROP_README_END')
              print('AUTHORED_DROP_RUNTIME_ICONS',len([x for x in entries if x.filename.startswith('icones_png_512/') and x.filename.endswith('.png')]))
              print('AUTHORED_DROP_IMAGE_COUNT',len(entries))
              if not entries or len(entries)>100 or sum(x.file_size for x in entries)>100_000_000:
                  raise ValueError('Unexpected authored source ZIP size/count')
              for x in entries:
                  name=pathlib.PurePosixPath(x.filename)
                  if name.is_absolute() or '..' in name.parts or not x.filename.isascii():
                      raise ValueError('Unsafe archive entry '+repr(x.filename))
                  data=z.read(x)
                  dims=''
                  if data[:8]==bytes([137,80,78,71,13,10,26,10]):
                      dims=str(struct.unpack('>II',data[16:24]))
                  elif data[:4]==b'RIFF' and data[8:12]==b'WEBP':
                      dims='webp'
                  print('AUTHORED_DROP_ENTRY',repr(x.filename),x.file_size,dims,
                        hashlib.sha256(data).hexdigest()[:16])
          PY
