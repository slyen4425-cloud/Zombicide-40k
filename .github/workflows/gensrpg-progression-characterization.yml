name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-4-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core201-bridge-one-shot:
    if: startsWith(github.ref_name, 'work/gensrpg-combat-callsite-migration-4-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Prove Core 2.01 target is red before migration
        run: |
          if node tests/gens_core201_direct_bridge_lot4a.test.cjs; then
            echo 'Lot 4A target is already green before the expected migration.' >&2
            exit 1
          fi
      - name: Migrate only Core 2.01 encounter buttons to Bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          start_marker='<script id="dungeonCore201Stability">'
          start=text.find(start_marker)
          if start < 0:
              raise SystemExit('Core 2.01 script not found')
          end=text.find('</script>', start)
          if end < 0:
              raise SystemExit('Core 2.01 script end not found')
          body=text[start:end]
          old_count=body.count('dc200StartCombat(')
          if old_count != 2:
              raise SystemExit(f'Expected exactly 2 Core 2.01 dc200StartCombat calls, found {old_count}')
          anchor='"use strict";\n'
          if body.count(anchor) != 1:
              raise SystemExit('Core 2.01 strict-mode anchor is not unique')
          helper='function requestCombat201(enemyIds,reason){return window.GensRpgTacticalCombatV2Bridge.requestCombat(window,{enemyIds:Array.isArray(enemyIds)?enemyIds.map(String):[],reason:reason,entry:"dc201EncounterPanel"})}\n'
          if 'function requestCombat201(' in body:
              raise SystemExit('Core 2.01 helper already exists unexpectedly')
          body=body.replace(anchor,anchor+helper,1)
          body=body.replace('dc200StartCombat(','requestCombat201(')
          if 'dc200StartCombat' in body:
              raise SystemExit('Historical Core 2.01 adapter reference remains')
          if body.count('requestCombat201(') != 3:
              raise SystemExit('Expected one helper definition plus two Core 2.01 calls')
          text=text[:start]+body+text[end:]
          p.write_text(text,encoding='utf-8')
          PY
      - name: Validate exact Lot 4A target
        run: |
          node tests/gens_core201_direct_bridge_lot4a.test.cjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const count=n=>(s.match(new RegExp('\\b'+n+'\\b','g'))||[]).length;
          const expected={dc200StartCombat:11,openDungeonCombatSetup:1,launchCombat200:2,startCombat:6};
          for(const [name,n] of Object.entries(expected)){
            const got=count(name);
            if(got!==n) throw new Error(`${name} inventory changed unexpectedly: ${got} != ${n}`);
          }
          NODE
      - name: Commit exact Core 2.01 migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && { echo 'No runtime change produced'; exit 1; }
          git commit -m 'refactor: route Core 2.01 encounter buttons through Bridge'
          git push origin HEAD:${{ github.ref_name }}

  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate native manual XP runtime
        run: node tests/gens_manual_xp_statpoints_characterization_v11411.test.cjs
      - name: Characterize native progression and rewards
        run: node tests/gens_progression_authority_characterization_v11411.test.cjs
      - name: Verify Tactical victory rewards summary
        run: node tests/gens_tactical_victory_rewards_v11411.test.cjs
      - name: Execute Tactical victory to Dungeon XP and loot
        run: node tests/gens_tactical_victory_rewards_runtime_v11411.test.cjs
      - name: Characterize manual level authority
        run: node tests/gens_manual_level_authority_characterization_v11411.test.cjs
