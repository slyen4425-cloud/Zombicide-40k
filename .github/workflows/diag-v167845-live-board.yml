name: Diagnose V16.78.45 live board
on:
  push:
    branches:
      - work/dungeon-v16.78.45-live-board-fix-2026-09-05
    paths:
      - .github/workflows/diag-v167845-live-board.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual bestiary HP and tracker wrappers
        run: |
          echo '=== skeleton definitions ==='
          grep -n 'dng_skeleton' index.html | head -n 80 || true
          echo '=== tracker wrappers around 31200 ==='
          sed -n '31190,31270p' index.html
          echo '=== Core 3.18 tracker patch ==='
          cat assets/dungeon/dungeon-core-318.js
          echo '=== authored apply hooks ==='
          grep -nE 'applyCurrentZone|worldContentApplied167824|effectiveContent' assets/dungeon/dungeon-authored-runtime-167839.js assets/dungeon/dungeon-zone-content-167824.js
