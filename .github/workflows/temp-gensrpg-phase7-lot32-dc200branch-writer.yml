name: TEMP GenSrpG Phase7 lot32 dc200Branch writer

on:
  push:
    branches:
      - 'work/gensrpg-phase7-dungeon-generated-room-enemy-branch-normalization-audit-2026-09-30'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded lot 32 dc200Branch patch
        run: python3 tools/temp_phase7_lot32_dc200branch_writer.py

      - name: Commit exact lot 32 runtime files
        run: |
          if git diff --quiet; then
            echo "No runtime diff to commit."
            exit 0
          fi
          test "$(git diff --name-only | sort)" = $'index.html\ntests/gens_phase7_dungeon_generated_room_enemy_branch_normalization_characterization_v1.test.cjs\ntests/gens_phase7_dungeon_generated_room_enemy_branch_normalization_v1.test.cjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html tests/gens_phase7_dungeon_generated_room_enemy_branch_normalization_characterization_v1.test.cjs tests/gens_phase7_dungeon_generated_room_enemy_branch_normalization_v1.test.cjs
          git commit -m 'feat: delegate generated enemy branch default rule to Dungeon'
          git push
