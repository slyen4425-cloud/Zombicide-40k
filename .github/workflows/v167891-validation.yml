name: Validate GenSrpG V16.78.91

on:
  push:
    branches:
      - work/v16.78.91-legacy-stat-cleanup

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntaxe du correctif
        run: node --check assets/gensrpg/gens-rpg-legacy-cleanup-167891.js
      - name: Test du retrait des coefficients historiques
        run: node tests/gens_rpg_legacy_cleanup_v167891.test.cjs
      - name: Régression du nouvel éditeur de stats
        run: node tests/gens_clean_stats_rebuild_v167890.test.cjs
      - name: Régression stats dynamiques
        run: node tests/gens_clean_dynamic_stats_v167873.test.cjs
      - name: Régression Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Vérifier le raccordement production et le cache
        run: |
          grep -q 'gens-rpg-legacy-cleanup-167891.js?v=167891' .github/workflows/main.yml
          grep -q 'gens-rpg-legacy-cleanup-167891.js' service-worker.js
          grep -q 'gensrpg-cache-16.78.91-rpg-legacy-stat-cleanup' service-worker.js
