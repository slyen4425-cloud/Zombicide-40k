name: Validate authored bootstrap fix
on:
  push:
    branches:
      - work/dungeon-authored-linking-final-load-fix-2026-09-06
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-authored-bootstrap-167849.js
          node --check assets/dungeon/dungeon-authored-cache-guard-167849.js
          node --check assets/dungeon/dungeon-room-creator-feedback-167821.js
      - name: First click and cache guard regression
        run: node tests/dungeon_authored_bootstrap_v167849.test.cjs
      - name: Authored room/link regressions
        run: |
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_zone_links_v167846.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_exact_trap_runtime_v167845.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/dungeon_room_template_content_v167828.test.cjs
