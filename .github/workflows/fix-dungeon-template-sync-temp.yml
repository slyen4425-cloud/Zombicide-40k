name: Fix Dungeon template inheritance
on:
  push:
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dungeon-template-sync-fix-2026-09-05
      - name: Apply patch
        run: |
          python3 .github/scripts/fix_dungeon_template_sync.py
          python3 .github/scripts/fix_test_variant_mode.py
      - name: Syntax and regressions
        run: |
          node --check assets/dungeon/dungeon-room-template-content-167828.js
          node --check assets/dungeon/dungeon-authored-runtime-167839.js
          node tests/dungeon_room_template_content_v167828.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_world_builder_v167821.test.cjs
          node tests/dungeon_room_runtime_v167822.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/gens_ui_recovery_v167843.test.cjs
      - name: Commit validated fix
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add assets/dungeon/dungeon-room-template-content-167828.js assets/dungeon/dungeon-authored-runtime-167839.js tests/dungeon_room_template_content_v167828.test.cjs .github/workflows/main.yml
          git commit -m "Fix Dungeon room template inheritance and stale content"
          git push origin HEAD:work/dungeon-template-sync-fix-2026-09-05
