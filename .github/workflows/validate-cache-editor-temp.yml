name: Validate secondary cache editor
on:
  push:
    branches:
      - work/dungeon-cache-editor-validator-fix-2026-09-06
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax
        run: node --check assets/dungeon/dungeon-zone-links-167846.js
      - name: Secondary cache editor regression
        run: node tests/dungeon_zone_links_v167846.test.cjs
      - name: Exact authored room regression
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Critical Dungeon regressions
        run: |
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_exact_trap_runtime_v167845.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/dungeon_room_template_content_v167828.test.cjs
