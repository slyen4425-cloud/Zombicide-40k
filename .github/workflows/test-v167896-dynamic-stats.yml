name: Test V16.78.96 Dynamic Stats

on:
  push:
    branches:
      - work/dungeon-v16.78.96-unified-dynamic-stats

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test canonical custom-stat runtime and unified renderer
        run: node tests/gens_custom_stat_runtime_profile_v167889.test.cjs

      - name: Test native stat grid compatibility
        run: node tests/gens_native_stat_grid_v167890.test.cjs

      - name: Test Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs

      - name: Build final stat-loading page
        run: |
          rm -rf _site
          mkdir -p _site/assets/gensrpg
          cp index.html _site/index.html
          python3 tools/patch_generic_stat_grid_v167890.py _site/index.html
          cp assets/gensrpg/gens-custom-stats-167881.js _site/assets/gensrpg/
          cp assets/gensrpg/gens-stat-rules-help-167880.js _site/assets/gensrpg/
          cp assets/gensrpg/gens-stat-help-extension-167881.js _site/assets/gensrpg/
          cp assets/gensrpg/gens-custom-stat-runtime-profile-167889.js _site/assets/gensrpg/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          tags=[
            '<script src="assets/gensrpg/gens-custom-stats-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-stat-rules-help-167880.js?v=167880"></script>',
            '<script src="assets/gensrpg/gens-stat-help-extension-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-custom-stat-runtime-profile-167889.js?v=167889"></script>'
          ]
          if '</body>' not in html: raise SystemExit('missing body')
          for tag in tags:
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY

      - name: Test final stat module order and renderer
        run: node tests/gens_custom_stat_runtime_profile_v167889.test.cjs _site/index.html

      - name: Check V16.78.96 cache
        run: |
          grep -q 'gensrpg-cache-16.78.96-unified-dynamic-stats' service-worker.js
          grep -q 'gensrpg-cache-16.78.95-custom-stat-authority' service-worker.js
