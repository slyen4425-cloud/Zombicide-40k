name: Phase 4 asset resolver raccord one-shot

on:
  push:
    branches:
      - work/gensrpg-phase4-asset-resolver-2026-09-19
    paths:
      - .github/workflows/phase4-asset-resolver-raccord-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch exact verified index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          path=Path("index.html")
          old_blob="d942934741ca200319de02116c4dd384722d39c7"

          actual=subprocess.check_output(["git","rev-parse","HEAD:index.html"],text=True).strip()
          if actual!=old_blob:
              raise SystemExit(f"Unexpected committed index blob before Phase 4 raccord: {actual}")

          text=path.read_text(encoding="utf-8")
          marker='<script id="dungeonGithubArts164">'
          if text.count(marker)!=1:
              raise SystemExit(f"Expected one dungeonGithubArts164 marker, got {text.count(marker)}")
          text=text.replace(marker,'<script src="assets/gensrpg/core/asset-resolver-v1.js"></script>\\n\\n'+marker,1)

          def replace_statement(source,anchor,replacement,must_contain):
              if source.count(anchor)!=1:
                  raise SystemExit(f"Expected one anchor, got {source.count(anchor)}: {anchor}")
              start=source.index(anchor)
              end=source.index(';',start)+1
              fragment=source[start:end]
              if must_contain not in fragment:
                  raise SystemExit(f"Unexpected historical fragment for {anchor}: {fragment[:180]}")
              return source[:start]+replacement+source[end:]

          start=text.index('window.dungeonAutoArtPath164=function(id){')
          end=text.index('};',start)+2
          fragment=text[start:end]
          if 'assets/dungeon/creatures/' not in fragment:
              raise SystemExit('dungeonAutoArtPath164 no longer owns the expected historical path')
          text=text[:start]+'window.dungeonAutoArtPath164=function(id){\\n  return window.GensAssetResolverV1.dungeonCreaturePath(id);\\n};'+text[end:]

          text=replace_statement(
              text,
              'const artPath=id=>',
              'const artPath=id=>window.GensAssetResolverV1.dungeonCreaturePath(id);',
              'assets/dungeon/creatures/'
          )
          text=replace_statement(
              text,
              'const dungeonPath166=id=>',
              'const dungeonPath166=id=>window.GensAssetResolverV1.dungeonCreaturePath(id);',
              'assets/dungeon/creatures/'
          )
          text=replace_statement(
              text,
              'window.GENSRPG_DUNGEON_ASSET_ROOT_168=',
              'window.GENSRPG_DUNGEON_ASSET_ROOT_168=window.GensAssetResolverV1.ROOTS.dungeon.creatures;',
              'assets/dungeon/creatures/'
          )

          path.write_text(text,encoding="utf-8")
          print("Phase 4 source blob verified:",actual)
          PY

      - name: Commit raccord and retire one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/phase4-asset-resolver-raccord-once.yml
          git config user.name "GenSrpG Phase 4"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/phase4-asset-resolver-raccord-once.yml
          final_blob="$(git rev-parse :index.html)"
          test "$final_blob" = "286e427df42bc1a04cc981ecbdf90ecb4de547ab"
          echo "Phase 4 staged index blob: $final_blob"
          git diff --cached --check
          git commit -m "refactor: route Dungeon creature paths through Core resolver"
          git push origin HEAD:work/gensrpg-phase4-asset-resolver-2026-09-19
