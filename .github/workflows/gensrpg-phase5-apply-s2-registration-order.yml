name: GenSrpG Phase5 S2 registration-order one-shot

on:
  push:
    branches:
      - work/gensrpg-phase5-module-launch-s2-survival-provider-2026-09-24
    paths:
      - .github/workflows/gensrpg-phase5-apply-s2-registration-order.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact S2 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relocate Survival provider registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          p=Path("index.html")
          b=p.read_bytes()
          def blob(data):
              return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()

          assert len(b)==8171879, len(b)
          assert blob(b)=="cacee0bb95d8c046264668c1ccc721fc88bbed2d", blob(b)
          s=b.decode("utf-8")

          reg='window.GensShellModuleLaunchV1.register("survival",gensSurvivalStartModuleSessionV1);\n'
          assert s.count(reg)==1, s.count(reg)
          old_provider=s.index('const gensSurvivalNativeStartV1=startConfiguredGame;')
          registry=s.index('window.GensShellModuleLaunchV1=Object.freeze({')
          old_reg=s.index(reg)
          assert old_provider < old_reg < registry, (old_provider,old_reg,registry)

          s=s.replace(reg,"",1)

          marker='''window.GensShellModuleLaunchV1=Object.freeze({
            register:gensRegisterModuleLaunchV1,
            activeModule:gensShellActiveModuleV1,
            startModuleSession:gensStartModuleSessionV1
          });
          '''
          assert s.count(marker)==1, s.count(marker)
          s=s.replace(marker,marker+reg,1)

          out=s.encode("utf-8")
          assert len(out)==8171879, len(out)
          assert blob(out)=="7601760f7a635094d4f687b725a639b5728e93b4", blob(out)
          p.write_bytes(out)

          old="cacee0bb95d8c046264668c1ccc721fc88bbed2d"
          new="7601760f7a635094d4f687b725a639b5728e93b4"
          allowed_prefixes=("tests/","docs/GENSRPG_PHASE2_")
          changed=[]
          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              rel=path.as_posix()
              if rel.startswith(".git/") or rel=="index.html":
                  continue
              if not rel.endswith((".cjs",".json",".tsv")):
                  continue
              try:
                  text=path.read_text()
              except Exception:
                  continue
              if old not in text:
                  continue
              assert rel.startswith(allowed_prefixes), "unexpected current-runtime fingerprint owner: "+rel
              path.write_text(text.replace(old,new))
              changed.append(rel)

          assert changed, "no fingerprint followers realigned"
          print("fingerprint followers:")
          for rel in changed:
              print(rel)

          # Prove the S2 static contract before committing.
          PY
          node tests/gens_phase5_module_launch_s2_survival_provider_v1.test.cjs

      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase5-apply-s2-registration-order.yml

      - name: Commit corrected S2 runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_* .github/workflows/gensrpg-phase5-apply-s2-registration-order.yml
          git diff --cached --check
          git commit -m "fix: order Phase 5 S2 Survival provider registration"
          git push origin HEAD:work/gensrpg-phase5-module-launch-s2-survival-provider-2026-09-24
