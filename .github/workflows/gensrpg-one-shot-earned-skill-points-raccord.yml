name: GenSrpG one-shot earned skill points raccord

on:
  push:
    branches:
      - work/gensrpg-phase4-progression-earned-skill-points-raccord-2026-09-22
    paths:
      - .github/workflows/gensrpg-one-shot-earned-skill-points-raccord.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact raccord branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-progression-earned-skill-points-raccord-2026-09-22
          fetch-depth: 0

      - name: Patch exact earned skill points seam
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path("index.html")
          data = path.read_bytes()

          def git_blob(b):
              return hashlib.sha1(b"blob " + str(len(b)).encode() + b"\0" + b).hexdigest()

          expected_old_size = 8174346
          expected_old_blob = "8da7afa3c986f29e740eee1748dcc0ec0f8f75bc"
          expected_new_size = 8174314
          expected_new_blob = "8ef7c65fca1f72f0393f0f6ccb6fea8426b41f91"

          if len(data) != expected_old_size or git_blob(data) != expected_old_blob:
              raise SystemExit(f"refuse source drift: size={len(data)} blob={git_blob(data)}")

          text = data.decode("utf-8")
          old = 'window.dungeonRpgEarnedSkillPoints=function(xp){const p=activeProg();if(!p){const r=loadDungeonRpgRules();return Math.max(0,r.startingSkillPoints)+Math.max(0,dungeonRpgLevelFromXp(xp)-1)*Math.max(0,r.skillPointsPerLevel)}const level=dungeonRpgLevelFromXp(xp);return Math.max(0,Number(p.startingSkillPoints)||0)+Math.max(0,level-1)*Math.max(0,Number(p.talentPointsPerLevel)||0)}'
          new = 'window.dungeonRpgEarnedSkillPoints=function(xp){const p=activeProg();if(!p){const r=loadDungeonRpgRules(),level=dungeonRpgLevelFromXp(xp);return GensProgressionV1.earnedSkillPointsFromLevel(level,null,r.startingSkillPoints,r.skillPointsPerLevel)}const level=dungeonRpgLevelFromXp(xp);return GensProgressionV1.earnedSkillPointsFromLevel(level,p)}'

          if text.count(old) != 1:
              raise SystemExit(f"refuse seam count: {text.count(old)}")
          if text.count(new) != 0:
              raise SystemExit("target seam already present")

          patched = text.replace(old, new, 1).encode("utf-8")
          if len(patched) != expected_new_size or git_blob(patched) != expected_new_blob:
              raise SystemExit(f"refuse target mismatch: size={len(patched)} blob={git_blob(patched)}")

          path.write_bytes(patched)
          print(f"patched size={len(patched)} blob={git_blob(patched)}")

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/gensrpg-one-shot-earned-skill-points-raccord.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/gensrpg-one-shot-earned-skill-points-raccord.yml
          git diff --cached --stat
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s\n' '.github/workflows/gensrpg-one-shot-earned-skill-points-raccord.yml' 'index.html' | sort)"
          git commit -m "refactor: raccord earned skill points to Core Progression"
          git push origin HEAD:work/gensrpg-phase4-progression-earned-skill-points-raccord-2026-09-22
