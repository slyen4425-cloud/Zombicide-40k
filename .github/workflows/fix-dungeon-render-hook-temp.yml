name: Fix Dungeon authored render hook
on:
  push:
    branches:
      - work/dungeon-render-runtime-hook-fix-2026-09-05
    paths:
      - .github/workflows/fix-dungeon-render-hook-temp.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dungeon-render-runtime-hook-fix-2026-09-05
      - name: Restore safe Dungeon runtime rebind
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/dungeon/dungeon-zone-content-167824.js')
          s=p.read_text(encoding='utf-8')
          old='if(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",install,{once:true});else install();DOC.addEventListener("click",()=>setTimeout(()=>{ensureLauncher();wrapCore();ensureInteractionPanel()},0),true)}else wrapCore();'
          new='''let runtimeRebindQueued=false;\nfunction scheduleRuntimeRebind(){if(runtimeRebindQueued)return;runtimeRebindQueued=true;setTimeout(()=>{runtimeRebindQueued=false;try{ensureLauncher();wrapCore()}catch(e){}},0)}\nfunction installRuntimeObserver(){if(!DOC||typeof MutationObserver!=="function")return false;const target=DOC.body||DOC.documentElement;if(!target)return false;const observer=new MutationObserver(list=>{for(const m of list||[]){for(const n of Array.from(m.addedNodes||[])){if(!n||n.nodeType!==1)continue;const id=String(n.id||"");if(id==="dc01Explore"||id==="dc047RoomBoard"||id==="dc200Scene"||n.querySelector?.("#dc01Explore,#dc047RoomBoard,#dc200Scene")){scheduleRuntimeRebind();return}}}});observer.observe(target,{childList:true,subtree:true});return true}\nif(DOC){if(DOC.readyState==="loading")DOC.addEventListener("DOMContentLoaded",()=>{install();installRuntimeObserver()},{once:true});else{install();installRuntimeObserver()}DOC.addEventListener("click",()=>{scheduleRuntimeRebind();try{ensureInteractionPanel()}catch(e){}},true)}else wrapCore();'''
          if old not in s:
              raise SystemExit('expected V16.78.43 click hook not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Syntax and targeted regressions
        run: |
          node --check assets/dungeon/dungeon-zone-content-167824.js
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_authored_runtime_v167839.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          node tests/gens_ui_recovery_v167843.test.cjs
          grep -q 'installRuntimeObserver' assets/dungeon/dungeon-zone-content-167824.js
          ! grep -q 'new MutationObserver(()=>{ensureLauncher();wrapCore();ensureInteractionPanel()}).observe(DOC.documentElement' assets/dungeon/dungeon-zone-content-167824.js
      - name: Commit validated source fix
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add assets/dungeon/dungeon-zone-content-167824.js
          git commit -m "Restore safe authored Dungeon render rebind"
          git push origin HEAD:work/dungeon-render-runtime-hook-fix-2026-09-05
