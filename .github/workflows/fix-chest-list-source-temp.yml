name: Fix Dungeon chest list source
on:
  push:
    branches:
      - work/dungeon-chest-list-source-fix-2026-09-05
permissions:
  contents: write
jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dungeon-chest-list-source-fix-2026-09-05
      - name: Apply list source patch
        run: python3 .github/scripts/fix_chest_list_source.py
      - name: Syntax and regressions
        run: |
          node --check assets/dungeon/dungeon-room-content-ui-167831.js
          node --check assets/dungeon/dungeon-room-visual-config-167826.js
          node --check assets/dungeon/dungeon-room-template-content-167828.js
          node tests/dungeon_room_content_ui_v167831.test.cjs
          node tests/dungeon_room_visual_config_v167826.test.cjs
          node tests/dungeon_room_template_content_v167828.test.cjs
          node tests/dungeon_zone_content_v167824.test.cjs
          node tests/dungeon_runtime_regression.test.cjs
          grep -q 'selectedItems?.("zone")' assets/dungeon/dungeon-room-visual-config-167826.js
          grep -q 'selectedItems?.("template")' assets/dungeon/dungeon-room-template-content-167828.js
      - name: Commit validated fix
        run: |
          git config user.name "slyen4425-cloud"
          git config user.email "slyen4425@gmail.com"
          git add assets/dungeon/dungeon-room-content-ui-167831.js assets/dungeon/dungeon-room-visual-config-167826.js assets/dungeon/dungeon-room-template-content-167828.js
          git commit -m "Make chest item list the authoritative source"
          git push origin HEAD:work/dungeon-chest-list-source-fix-2026-09-05
