name: GenSrpG one-shot Phase 6 wave reserve normalization

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
    paths:
      - .github/workflows/gensrpg-phase6-wave-reserve-normalization-one-shot.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
          fetch-depth: 0

      - name: Patch exact verified index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,re

          p=Path("index.html")
          data=p.read_bytes()
          blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
          expected_size=8169503
          expected_blob="fb8c77504ed067fb094374260b459f8d1fb7e824"
          if len(data)!=expected_size or blob!=expected_blob:
              raise SystemExit(f"Refusing patch: index mismatch size={len(data)} blob={blob}")

          text=data.decode("utf-8")

          old_fn='''function normalizeWaveReserveForProfile(profile,reserve){
            refreshCustomEnemiesIntoZombieTypes();
            const out={...defaultZombieConfig(),...(reserve||{})};

            // Pour chaque vraie carte d'apparition, garantir assez de réserve pour
            // au moins résoudre une carte complète de ce type.
            const minimums={};
            (profile?.levels||[]).forEach(level=>{
              (level?.cards||[]).forEach(card=>{
                if(card?.kind!=="enemy" || !card?.enemy)return;
                const id=String(card.enemy);
                const qty=Math.max(1,Number(card.qty)||1);
                minimums[id]=Math.max(minimums[id]||0,qty);
              });
            });

            Object.entries(minimums).forEach(([id,min])=>{
              const current=Math.max(0,Number(out[id])||0);
              if(current<=0)out[id]=Math.max(1,min);
            });
            return out;
          }

          '''
          if text.count(old_fn)!=1:
              raise SystemExit(f"Expected exactly one legacy owner, got {text.count(old_fn)}")
          text=text.replace(old_fn,"",1)

          replacements=[
            ('''  const profile=readWaveProfileFromUi();
            let reserve=normalizeWaveReserveForProfile(profile,collectWaveReserveFromUi());''',
             '''  const profile=readWaveProfileFromUi();
            refreshCustomEnemiesIntoZombieTypes();
            let reserve=GensSurvivalV1.waveRules.normalizeReserve(profile,collectWaveReserveFromUi(),defaultZombieConfig());'''),
            ('''function autoConfigureWaveReserve(){
            const p=readWaveProfileFromUi();
            const reserve=normalizeWaveReserveForProfile(p,GensSurvivalV1.waveRules.autoReserve(p,defaultZombieConfig()));''',
             '''function autoConfigureWaveReserve(){
            const p=readWaveProfileFromUi();
            refreshCustomEnemiesIntoZombieTypes();
            const reserve=GensSurvivalV1.waveRules.normalizeReserve(p,GensSurvivalV1.waveRules.autoReserve(p,defaultZombieConfig()),defaultZombieConfig());'''),
            ('''  if(!hasAny && used.length)reserve=GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig());
            reserve=normalizeWaveReserveForProfile(profile,reserve);''',
             '''  if(!hasAny && used.length)reserve=GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig());
            refreshCustomEnemiesIntoZombieTypes();
            reserve=GensSurvivalV1.waveRules.normalizeReserve(profile,reserve,defaultZombieConfig());'''),
            ('''  const profile=p.profile||GensSurvivalV1.waveRules.defaultProfile();
            const reserve=normalizeWaveReserveForProfile(
              profile,
              p.reserve||GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig())
            );''',
             '''  const profile=p.profile||GensSurvivalV1.waveRules.defaultProfile();
            refreshCustomEnemiesIntoZombieTypes();
            const reserve=GensSurvivalV1.waveRules.normalizeReserve(
              profile,
              p.reserve||GensSurvivalV1.waveRules.autoReserve(profile,defaultZombieConfig()),
              defaultZombieConfig()
            );''')
          ]

          for old,new in replacements:
              actual=text.count(old)
              if actual!=1:
                  raise SystemExit(f"Replacement guard failed: expected 1, got {actual}: {old.splitlines()[0]}")
              text=text.replace(old,new,1)

          if "function normalizeWaveReserveForProfile" in text:
              raise SystemExit("Legacy normalizeWaveReserveForProfile owner still present")
          if text.count("GensSurvivalV1.waveRules.normalizeReserve(")!=4:
              raise SystemExit("Expected exactly 4 direct Survival normalizeReserve consumers")
          if len(re.findall(r'refreshCustomEnemiesIntoZombieTypes\(\);[\s\S]{0,260}?GensSurvivalV1\.waveRules\.normalizeReserve\(',text))!=4:
              raise SystemExit("Expected custom-enemy refresh before all 4 normalizeReserve consumers")

          out=text.encode("utf-8")
          out_blob=hashlib.sha1(f"blob {len(out)}\0".encode()+out).hexdigest()
          if len(out)!=8169047 or out_blob!="afc271f9e038f77c5c78caa9f4445d0e49eaea5d":
              raise SystemExit(f"Unexpected patched index size={len(out)} blob={out_blob}")
          p.write_bytes(out)
          print("Patched index verified:",len(out),out_blob)
          PY

      - name: Commit runtime and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase6-wave-reserve-normalization-one-shot.yml
          git config user.name "gensrpg-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html .github/workflows/gensrpg-phase6-wave-reserve-normalization-one-shot.yml
          git commit -m "refactor: connect Survival wave reserve normalization"
          git push origin HEAD:work/gensrpg-phase6-survival-wave-reserve-normalization-2026-09-25
