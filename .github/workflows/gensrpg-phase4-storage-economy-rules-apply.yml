name: GenSrpG temporary Economy rules storage micro-diff

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-economy-rules-2026-09-20
    paths:
      - .github/workflows/gensrpg-phase4-storage-economy-rules-apply.yml

permissions:
  contents: write

jobs:
  apply-exact-index-micro-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche exacte
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-economy-rules-2026-09-20
          fetch-depth: 0

      - name: Vérifier puis appliquer uniquement le raccord Economy Rules
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path=Path("index.html")
          raw=path.read_bytes()

          def blob_sha(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          source_sha=blob_sha(raw)
          expected_source="a070af09f9cb1fcda78987e83bc117d7544d1b6c"
          expected_target="16deeb169abbc31a7db04161902e9381fd6888ad"

          if source_sha==expected_target:
              print("Micro-diff déjà appliqué exactement.")
              raise SystemExit(0)
          if source_sha!=expected_source:
              raise SystemExit(f"REFUS: blob index.html inattendu: {source_sha}")

          text=raw.decode("utf-8")
          old_read='try{Object.assign(d,JSON.parse(localStorage.getItem(DUNGEON_ECO_RULES_160)||"{}"))}catch(e){}'
          new_read='try{Object.assign(d,GensStorageV1.readJson(localStorage,DUNGEON_ECO_RULES_160,{}))}catch(e){}'
          old_write='localStorage.setItem(DUNGEON_ECO_RULES_160,JSON.stringify(r||dungeonEconomyRules160()));'
          new_write='GensStorageV1.writeJson(localStorage,DUNGEON_ECO_RULES_160,r||dungeonEconomyRules160());'

          if text.count(old_read)!=1:
              raise SystemExit(f"REFUS: anciennes lectures Economy Rules: {text.count(old_read)}")
          if text.count(old_write)!=1:
              raise SystemExit(f"REFUS: anciennes écritures Economy Rules: {text.count(old_write)}")

          text=text.replace(old_read,new_read).replace(old_write,new_write)
          target=text.encode("utf-8")
          target_sha=blob_sha(target)

          if len(target)!=8174580:
              raise SystemExit(f"REFUS: taille cible inattendue: {len(target)}")
          if target_sha!=expected_target:
              raise SystemExit(f"REFUS: blob cible inattendu: {target_sha}")

          block_start=text.index('<script id="dungeonEconomy160">')
          block_end=text.index('</script>',block_start)
          block=text[block_start:block_end]

          if "localStorage.getItem(DUNGEON_ECO_RULES_160)" in block:
              raise SystemExit("REFUS: lecture directe Economy Rules restante")
          if "localStorage.setItem(DUNGEON_ECO_RULES_160" in block:
              raise SystemExit("REFUS: écriture directe Economy Rules restante")
          if block.count("GensStorageV1.readJson(localStorage,DUNGEON_ECO_RULES_160,{})")!=1:
              raise SystemExit("REFUS: nombre de lectures Core Economy Rules incorrect")
          if block.count("GensStorageV1.writeJson(localStorage,DUNGEON_ECO_RULES_160,r||dungeonEconomyRules160())")!=1:
              raise SystemExit("REFUS: nombre d'écritures Core Economy Rules incorrect")

          if block.count("localStorage.getItem(key)")!=1:
              raise SystemExit("REFUS: lecture session Economy dynamique modifiée")
          if block.count("localStorage.setItem(key,")!=1:
              raise SystemExit("REFUS: écriture session Economy dynamique modifiée")
          if block.count("localStorage.setItem(key(heroId),")!=1:
              raise SystemExit("REFUS: écriture inventaire héros modifiée")
          if 'const key="gensrpg_dungeon_session_eco_160_"+id' not in block:
              raise SystemExit("REFUS: clé dynamique Economy session modifiée")
          if "gensrpg_dungeon_runtime_v2" in block:
              raise SystemExit("REFUS: runtime_v2 est hors périmètre")

          path.write_bytes(target)
          print("Micro-diff Economy Rules vérifié:", target_sha)

      - name: Vérifier le diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html

      - name: Committer uniquement index.html si nécessaire
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "refactor: route Economy rules JSON through Core storage"
          git push origin HEAD:work/gensrpg-phase4-storage-economy-rules-2026-09-20
