  browser-sentinel:
    needs: architecture-sentinels
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Playwright pour la sentinelle navigateur
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Vérifier l'isolation navigateur V114.11
        run: node tests/gens_v11411_native_ui_browser.test.cjs

      - name: Vérifier le lancement Survie par le vrai Shell
        run: node tests/gens_survival_shell_launch_browser_v11411.test.cjs

      - name: Caractériser Fouiller et les arts Survie
        run: node tests/gens_survival_search_art_browser_v11411.test.cjs

      - name: Caractériser Dungeon après Survie dans Chromium
        env:
          GENSRPG_BROWSER: chromium
        run: node tests/gens_dungeon_after_survival_start_state_browser_v11411.test.cjs

      - name: Vérifier le Dungeon Builder dans le vrai éditeur
        run: node tests/gens_dungeon_builder_visibility_browser_v11411.test.cjs

      - name: Caractériser la stabilité de Config objet moderne
        run: node tests/gens_object_config_editor_browser_v11411.test.cjs

      - name: Caractériser le flash Survie dans la fiche RPG
        run: node tests/gens_rpg_sheet_survival_flash_browser_v11411.test.cjs

      - name: Vérifier cache, retour et pièges authored dans Chromium
        run: node tests/gens_authored_cache_trap_browser_v11411.test.cjs

      - name: Vérifier Save & Quit puis reprise par le vrai Shell
        run: node tests/gens_savequit_resume_shell_browser_v11411.test.cjs

      - name: Vérifier le placeholder PvP par le vrai Shell
        run: node tests/gens_pvp_placeholder_shell_browser_v11411.test.cjs

      - name: Vérifier Monster Capture actuel par le vrai Shell
        run: node tests/gens_capture_current_shell_browser_v11411.test.cjs

      - name: Caractériser Capture dans la composition complète Phase 2
        run: node tests/gens_phase2_full_composition_capture_browser_v11411.test.cjs

      - name: Vérifier la non-interférence des quatre modules
        run: node tests/gens_four_module_noninterference_shell_browser_v11411.test.cjs

      - name: Vérifier le rendu canonique des murs dans Chromium
        run: node tests/gens_tactical_wall_browser_v11411.test.cjs

      - name: Vérifier la preview manuelle dans Chromium
        run: node tests/gens_preview_browser_v11411.test.cjs

      - name: Caractériser la résolution réelle des assets Phase 4
        run: node tests/gens_asset_resolver_browser_v1.test.cjs

      - name: Caractériser les tokens tardifs du resolver d’assets Phase 4
        run: node tests/gens_asset_resolver_late_tokens_browser_v1.test.cjs

      - name: Caractériser les retries de wrappers Equipment dans Chromium
        run: node tests/gens_phase4_inventory_equipment_wrapper_retry_browser_preaudit_v1.test.cjs

      - name: Vérifier la garde de chaîne retry Equipment dans Chromium
        run: node tests/gens_phase4_inventory_equipment_wrapper_chain_guard_browser_v1.test.cjs

      - name: Caractériser l'ouverture Equipment sans dépendance au hook Hero Art
