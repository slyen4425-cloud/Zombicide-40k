name: Validate V16.78.43 UI recovery

on:
  push:
    branches:
      - work/ui-recovery-v16.78.43
      - main

permissions:
  contents: read

jobs:
  validate-ui-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax UI recovery
        run: node --check assets/gensrpg/gens-ui-recovery-167843.js
      - name: Syntax bootstrap layer
        run: node --check assets/dungeon/dungeon-room-grid-capture-167830.js
      - name: Syntax service worker
        run: node --check service-worker.js
      - name: UI recovery regression
        run: node tests/gens_ui_recovery_v167843.test.cjs
      - name: Full Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: World Builder regression
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Room Creator V2 regression
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
