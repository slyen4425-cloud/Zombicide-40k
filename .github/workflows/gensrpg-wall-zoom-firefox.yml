name: GenSrpG Firefox wall zoom proof

on:
  push:
    branches:
      - 'work/gensrpg-wall-zoom-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-wall-zoom:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Firefox et les outils de test
        run: |
          npm install --no-save playwright@1.55.0 pngjs@7.0.0
          npx playwright install --with-deps firefox
          python3 -m pip install --quiet pillow

      - name: Convertir la texture murale JPG en PNG de diagnostic
        run: |
          python3 - <<'PY'
          from PIL import Image
          src='assets/dungeon/creatures/dng_wall_block.jpg'
          dst='assets/dungeon/creatures/dng_wall_block_converted_test.png'
          with Image.open(src) as im:
              im.convert('RGBA').save(dst, 'PNG', optimize=True)
          PY

      - name: Reproduire l'explication dégâts du test manuel
        continue-on-error: true
        run: node tests/gens_damage_explanation_consistency_v11411.test.cjs

      - name: Reproduire le mur blanc pendant le zoom Firefox
        continue-on-error: true
        run: node tests/gens_tactical_wall_zoom_pixels_firefox_v11411.test.cjs

      - name: Comparer les représentations murales par pixels
        run: node tests/gens_wall_zoom_candidate_matrix_firefox_v11411.test.cjs
