name: GenSrpG Phase 4 Dice first raccord one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
    paths:
      - '.github/workflows/gensrpg-phase4-dice-first-raccord-once.yml'

permissions:
  contents: write

jobs:
  raccord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
          fetch-depth: 0

      - name: Verify source blob and apply exact Dice first raccord
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "5b9b9ae780f735eadef049afeb10acf0b57441fe"
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text("utf-8")

          old_tag='<script src="assets/gensrpg/core/storage-v1.js"></script>\n'
          new_tag=old_tag+'<script src="assets/gensrpg/core/dice-v1.js"></script>\n'
          if s.count(old_tag)!=1:
              raise SystemExit(f"unexpected Core storage tag anchor count: {s.count(old_tag)}")

          old='''function d100ThresholdFromChance(chance){
            const c=Math.max(1,Math.min(100,Number(chance)||1));
            return Math.max(1,Math.min(100,101-c));
          }'''
          new='''function d100ThresholdFromChance(chance){
            const c=Math.max(1,Math.min(100,Number(chance)||1));
            return GensDiceV1.thresholdFromChance(c);
          }'''
          if s.count(old)!=1:
              raise SystemExit(f"unexpected d100ThresholdFromChance anchor count: {s.count(old)}")

          s=s.replace(old_tag,new_tag,1).replace(old,new,1)
          p.write_text(s,encoding="utf-8",newline="")
          PY
          test "$(git hash-object index.html)" = "5b8e790fefe7970a250fd9485ee80549511737e6"
          git add index.html
          test "$(git rev-parse :index.html)" = "5b8e790fefe7970a250fd9485ee80549511737e6"

      - name: Commit raccord and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gensrpg-phase4-dice-first-raccord-once.yml
          git add -A
          git commit -m "refactor: route D100 threshold through Core Dice"
          git push origin HEAD:work/gensrpg-phase4-dice-first-raccord-2026-09-22
