name: Validate Room Visual Config V16.78.25

on:
  push:
    branches:
      - work/dungeon-v16.78.25-room-visual-config

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check visual configurator
        run: node --check assets/dungeon/dungeon-room-visual-config-167825.js
      - name: Test visual element configuration
        run: node tests/dungeon_room_visual_config_v167825.test.cjs
      - name: Check Room Creator loader wiring
        run: grep -q 'dungeon-room-visual-config-167825.js?v=167825' assets/dungeon/dungeon-room-creator-feedback-167821.js
      - name: Test full Dungeon runtime regressions
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Test Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Test Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: Test World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Test authoritative World Runtime
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Test exact zone content runtime
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Test enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
