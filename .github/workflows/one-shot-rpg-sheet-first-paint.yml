name: One-shot RPG sheet first paint
on:
  push:
    branches:
      - work/gensrpg-rpg-sheet-shell-isolation-2026-09-19
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify source blob
        shell: bash
        run: |
          set -euxo pipefail
          SOURCE_BLOB="$(git hash-object index.html)"
          echo "SOURCE_BLOB=$SOURCE_BLOB"
          test "$SOURCE_BLOB" = "55453138449d07bde731ff6934acc442f56bae32"
      - name: Patch exact delayed RPG renderer
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          b=p.read_bytes()
          old=b'  setTimeout(()=>{try{applyDungeonSheetIdentity();renderDungeonHeroStats();renderDungeonSkillTree();updateDungeonSearchUi()}catch(e){}},0);'
          new=b'  try{applyDungeonSheetIdentity();renderDungeonHeroStats();renderDungeonSkillTree();updateDungeonSearchUi()}catch(e){}'
          count=b.count(old)
          print("MATCH_COUNT="+str(count))
          if count != 1:
              raise SystemExit("expected exactly one delayed RPG sheet renderer")
          p.write_bytes(b.replace(old,new))
          PY
      - name: Verify target blob
        shell: bash
        run: |
          set -euxo pipefail
          TARGET_BLOB="$(git hash-object index.html)"
          echo "TARGET_BLOB=$TARGET_BLOB"
          test "$TARGET_BLOB" = "d942934741ca200319de02116c4dd384722d39c7"
          git diff --check
      - name: Commit runtime patch and remove one-shot workflow
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "gensrpg-ci"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-shot-rpg-sheet-first-paint.yml
          git add index.html
          git commit -m "fix: render RPG sheet state before first paint"
          git push origin HEAD:work/gensrpg-rpg-sheet-shell-isolation-2026-09-19
