name: Validate GenSrpG V16.78.93 Stats Audit

on:
  push:
    branches:
      - work/v16.78.93-stats-audit-fix
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: V16.78.93 stats runtime audit
        run: node tests/gens_stats_runtime_audit_v167893.test.cjs
      - name: V16.78.91 legacy cleanup regression
        run: node tests/gens_rpg_legacy_cleanup_v167891.test.cjs
      - name: V16.78.90 clean stats regression
        run: node tests/gens_clean_stats_rebuild_v167890.test.cjs
      - name: Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
