name: Phase 9 fingerprint scan one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture-pregame-ownership-raccord-2026-10-04

jobs:
  scan:
    if: ${{ github.event.head_commit.message == 'phase9 scan stale fingerprints once' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture-pregame-ownership-raccord-2026-10-04
      - name: Scan stale runtime fingerprints
        run: |
          python - <<'PY'
          from pathlib import Path
          old_blob='a5d337ae25435d801a72333ee27e6dbc390a5175'
          old_size='8168810'
          rows=[]
          for root in [Path('tests'),Path('docs')]:
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if not p.is_file(): continue
                  try: s=p.read_text(encoding='utf-8')
                  except Exception: continue
                  cb=s.count(old_blob); cs=s.count(old_size)
                  if cb or cs:
                      rows.append((str(p),cb,cs))
          print('STALE_FINGERPRINTS_BEGIN')
          for row in rows:
              print(f'{row[0]}|blob={row[1]}|size={row[2]}')
          print('STALE_FINGERPRINTS_END')
          print('TOTAL',len(rows))
          PY
