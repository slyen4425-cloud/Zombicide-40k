name: Test V16.78.99 Shared Stat Service

on:
  push:
    branches:
      - work/dungeon-v16.78.99-shared-stat-service

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test shared stat service behavior
        run: node tests/gens_stat_service_v167899.test.cjs

      - name: Test stat service final grid
        run: node tests/gens_native_stat_grid_v167890.test.cjs

      - name: Test compatibility effects and stealth
        run: node tests/gens_custom_stat_effects_v167881.test.cjs

      - name: Test final stat bridge and equipment fields
        run: node tests/gens_custom_stat_runtime_profile_v167889.test.cjs

      - name: Test Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs

      - name: Test authored Dungeon engine separately
        run: node tests/dungeon_authored_runtime_v167839.test.cjs

      - name: Build final page with production module order
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          python3 tools/patch_generic_stat_grid_v167890.py _site/index.html
          cp service-worker.js _site/service-worker.js
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          html=p.read_text(encoding='utf-8')
          tags=[
            '<script src="assets/gensrpg/gens-custom-stats-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-stat-rules-help-167880.js?v=167880"></script>',
            '<script src="assets/gensrpg/gens-stat-help-extension-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-custom-stat-runtime-profile-167889.js?v=167889"></script>'
          ]
          for tag in tags:
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          p.write_text(html,encoding='utf-8')
          PY

      - name: Test final built page
        run: |
          node tests/gens_stat_service_v167899.test.cjs _site/index.html
          node tests/gens_native_stat_grid_v167890.test.cjs _site/index.html
          node tests/gens_custom_stat_effects_v167881.test.cjs _site/index.html
          node tests/gens_custom_stat_runtime_profile_v167889.test.cjs _site/index.html
          node tests/dungeon_authored_runtime_v167839.test.cjs _site/index.html
          grep -q 'gens-stat-service-167899.js?v=167899' _site/index.html
          grep -q 'gensrpg-cache-16.78.99-shared-stat-service' _site/service-worker.js
          ! grep -q 'gensCanonicalStatGridV167897' _site/index.html
