name: Dungeon 3.17 workbench

on:
  push:
    branches:
      - "work/dungeon-v16.78.11-spatial-armor-shop"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing dungeon regression suite
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Extract Core 3.17 integration targets
        run: node tests/extract_core317_targets.cjs
      - name: Commit compact inspection dump
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/core317_targets_dump.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: capture Core 3.17 integration targets [skip ci]"
            git push
          fi
