name: Phase 9 current test fingerprint refresh one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'phase9 refresh current runtime fingerprints once' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04
          fetch-depth: 0

      - name: Refresh only exact previous-runtime fingerprints in tests
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const oldBlob='8a42d15ed218895690a3b8490bbe636d9d2d27c6';
          const newBlob='3438e75b607d0b9bb68eb1d3edc2d97b3bd662ed';
          const oldSize='8167091';
          const newSize='8167048';
          const changed=[];
          function walk(dir){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,ent.name);
              if(ent.isDirectory())walk(p);
              else if(ent.isFile() && /\.cjs$/.test(ent.name)){
                const c=fs.readFileSync(p,'utf8');
                const next=c.split(oldBlob).join(newBlob).split(oldSize).join(newSize);
                if(next!==c){fs.writeFileSync(p,next,'utf8');changed.push(p);}
              }
            }
          }
          walk('tests');
          console.log(JSON.stringify({changed},null,2));
          if(!changed.length)throw new Error('no stale current-runtime test fingerprints found');
          NODE

      - name: Commit fingerprint-only diff
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --quiet && { echo "No fingerprint changes"; exit 1; }
          git commit -m "test: advance current runtime fingerprints after Capture139 retirement"
          git push origin HEAD:work/gensrpg-phase9-capture139-base-profile-retirement-2026-10-04
