name: GenSrpG Phase 4 B5 one-shot raccord

on:
  push:
    branches:
      - 'work/gensrpg-phase4-asset-resolver-late-token-paths-2026-09-19'
    paths:
      - '.github/workflows/gensrpg-phase4-b5-once.yml'

permissions:
  contents: write

jobs:
  raccord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: 'work/gensrpg-phase4-asset-resolver-late-token-paths-2026-09-19'
          fetch-depth: 0

      - name: Verify source blob and apply exact B5 raccord
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "388d1b49adbe5d9ac80a4b5474f51b0b2b0b7fc9"
          python - <<'PY'
          from pathlib import Path

          p=Path("index.html")
          s=p.read_text("utf-8")
          replacements=[
          ('''function heroImg(id){
            const c=CHARS?.[id]||findCustomHero?.(id)||{};
            if(c.image||c.avatar)return c.image||c.avatar;
            const map={dungeon_aldren:"dng_aldren.png",dungeon_lyra:"dng_lyra.png",dungeon_brom:"dng_brom.png"};
            return map[String(id)]?"assets/dungeon/creatures/"+map[String(id)]:""
          }''','''function heroImg(id){
            const c=CHARS?.[id]||findCustomHero?.(id)||{};
            if(c.image||c.avatar)return c.image||c.avatar;
            return window.GensAssetResolverV1.dungeonHeroPath(id)
          }'''),
          ('''function heroArt(id){
            const c=heroDef(id);
            if(c.image||c.avatar)return c.image||c.avatar;
            const f={dungeon_aldren:"dng_aldren.png",dungeon_lyra:"dng_lyra.png",dungeon_brom:"dng_brom.png"}[String(id)];
            return f?"assets/dungeon/creatures/"+f:""
          }''','''function heroArt(id){
            const c=heroDef(id);
            if(c.image||c.avatar)return c.image||c.avatar;
            return window.GensAssetResolverV1.dungeonHeroPath(id)
          }'''),
          ('''function enemyArt(e){
            let d=null;try{d=activeEnemyDefinition?.(e?.enemyId)||null}catch(_){}
            return d?.art||d?.image_data||d?.image||d?.avatar||(e?.enemyId?ROOT+String(e.enemyId)+".png":"")
          }''','''function enemyArt(e){
            let d=null;try{d=activeEnemyDefinition?.(e?.enemyId)||null}catch(_){}
            const id=String(e?.enemyId||"");
            const canonical=window.GensAssetResolverV1.dungeonCreaturePath(id);
            return d?.art||d?.image_data||d?.image||d?.avatar||canonical||(id?ROOT+id+".png":"")
          }'''),
          ('''function heroArt(id){const d=heroDef(id);return d.image||d.avatar||({dungeon_aldren:ROOT+"dng_aldren.png",dungeon_lyra:ROOT+"dng_lyra.png",dungeon_brom:ROOT+"dng_brom.png"}[String(id)]||"")}''','''function heroArt(id){const d=heroDef(id);return d.image||d.avatar||window.GensAssetResolverV1.dungeonHeroPath(id)}'''),
          ('''function enemyArt(e){
            let d=null;try{d=activeEnemyDefinition?.(e?.enemyId)||null}catch(_){}
            try{if(typeof gensDungeonCreatureArt165==="function")return gensDungeonCreatureArt165(d||e?.enemyId)||""}catch(_){}
            return e?.enemyId?ROOT+String(e.enemyId)+".png":(d?.image_data||d?.art||"")
          }''','''function enemyArt(e){
            let d=null;try{d=activeEnemyDefinition?.(e?.enemyId)||null}catch(_){}
            try{if(typeof gensDungeonCreatureArt165==="function")return gensDungeonCreatureArt165(d||e?.enemyId)||""}catch(_){}
            const id=String(e?.enemyId||"");
            const canonical=window.GensAssetResolverV1.dungeonCreaturePath(id);
            return canonical||(id?ROOT+id+".png":(d?.image_data||d?.art||""))
          }''')
          ]
          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f"unexpected B5 anchor count: {count}")
              s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8",newline="")
          PY
          test "$(git hash-object index.html)" = "207353f408d8c60213b512f73184bb9ec666b75d"
          git add index.html
          test "$(git rev-parse :index.html)" = "207353f408d8c60213b512f73184bb9ec666b75d"

      - name: Commit raccord and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gensrpg-phase4-b5-once.yml
          git add -A
          git commit -m "refactor: route late Dungeon token paths through Core resolver"
          git push origin HEAD:work/gensrpg-phase4-asset-resolver-late-token-paths-2026-09-19
