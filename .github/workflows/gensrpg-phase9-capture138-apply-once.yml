name: GenSrpG Phase9 Capture138 40-byte guarded migration (branch-only)
on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture138-delayed-hub-guard-2026-10-09'
    paths:
      - '.github/workflows/gensrpg-phase9-capture138-apply-once.yml'
permissions:
  contents: write
concurrency:
  group: gensrpg-phase9-capture138-apply-once
  cancel-in-progress: false
jobs:
  apply-on-branch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/work/gensrpg-phase9-capture138-delayed-hub-guard-2026-10-09'
    steps:
      - name: Lire le checkpoint de la branche
        uses: actions/checkout@v4
      - name: Appliquer strictement le changement deja teste (checkout ephemere)
        env:
          GENSRPG_APPLY_PHASE9_GUARD: APPLY_VERIFIED_40_BYTE_GUARD
        run: node scripts/gens_capture138_pin_simulation_audit.cjs
      - name: Verrouiller le diff et les 107 fichiers justifies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '1a61147d5a32889fa85e6a09e846049103b9f0bf'
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed" | while IFS= read -r f; do
            case "$f" in
              index.html|tests/*.test.cjs) ;;
              *) echo "CHAMP HORS LOT: $f"; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "$changed" | grep -c .)" -eq 107
          test "$(printf '%s\n' "$changed" | grep -c '^index.html$')" -eq 1
          test "$(printf '%s\n' "$changed" | grep -c '^tests/')" -eq 106
          echo "107 fichiers : 1 ligne runtime, 106 fichiers test rebaselines apres execution reelle."
          git diff --numstat -- index.html
          git diff -- index.html | tail -12
      - name: Commiter UNIQUEMENT sur la branche de travail, jamais main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/work/gensrpg-phase9-capture138-delayed-hub-guard-2026-10-09'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- index.html tests/*.test.cjs
          git diff --cached --check
          git commit -m 'fix(phase9): gardien 30ms Capture138 et pins verifiables (108 tests GREEN)'
          git push origin HEAD:refs/heads/work/gensrpg-phase9-capture138-delayed-hub-guard-2026-10-09
