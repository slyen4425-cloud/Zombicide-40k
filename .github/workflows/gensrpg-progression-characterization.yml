name: GenSrpG progression characterization

on:
  push:
    branches:
      - 'work/gensrpg-progression-victory-reconnect-*'
      - 'work/gensrpg-xp-portrait-cleanfix-*'
      - 'work/gensrpg-combat-callsite-migration-4d-2026-09-17'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  progression-characterization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact Core 2.11 detection entry migration
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('index.html'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); c=s.count(old); n=s.count(new); assert c==1 or (c==0 and n==1), f'unexpected source counts old={c} new={n}'; out=s.replace(old,new,1) if c==1 else s; assert out.count('dc200StartCombat')==s.count('dc200StartCombat')-(2 if c==1 else 0); p.write_text(out)"
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'refactor: route Core 2.11 detection through tactical Bridge'
          git push origin HEAD:$GITHUB_REF_NAME
