name: GenSrpG Capture C crossmode root diagnosis
on:
  push:
    branches:
      - work/gensrpg-phase9-capture-axis-c-shutdown-owner-2026-10-10
permissions:
  contents: read
jobs:
  crossmode:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Diagnose historical Dungeon -> Capture DOM without altering original test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const file='tests/gens_phase9_capture_persisted_profile_without_dungeon_style_resume_characterization_v1.test.cjs';
          let s=fs.readFileSync(file,'utf8');
          const snap="JSON.stringify(await page.evaluate(()=>({root:getComputedStyle(document.getElementById('gensRootHome')).display,rootInline:document.getElementById('gensRootHome').getAttribute('style'),game:getComputedStyle(document.getElementById('gensGameHome')).display,menu:getComputedStyle(document.getElementById('menu')).display,hub:getComputedStyle(document.getElementById('captureGameHub')).display,body:document.body.className,mode:gensMode151(),active:activeGameProfileId(),shellOwner:window.GensCaptureV1?.status?.(),hubOwner:window.GensCaptureHubEntryV1?.status?.()})))";
          const a='    await startCapture(page);';
          const b='    assert.equal(afterVictory.active,CAPTURE_ID,';
          if(!s.includes(a)||!s.includes(b))throw Error('Fixture anchors changed');
          s=s.replace(a,a+"\n    console.log('[crossmode-diagnostic] START '+ "+snap+");");
          s=s.replace(b,"    console.log('[crossmode-diagnostic] VICTORY '+ "+snap+");\n"+b);
          fs.writeFileSync('tests/_capture_crossmode_diag_temporary.test.cjs',s);
          NODE
          node tests/_capture_crossmode_diag_temporary.test.cjs
