name: Validate Dungeon Room Runtime V16.78.22

on:
  push:
    branches:
      - work/dungeon-v16.78.22-room-runtime-integration

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check runtime bridge
        run: node --check assets/dungeon/dungeon-room-runtime-167822.js
      - name: Test room runtime integration
        run: node tests/dungeon_room_runtime_v167822.test.cjs
      - name: Test full Dungeon runtime regressions
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Test Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: Test Dungeon World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Test enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
