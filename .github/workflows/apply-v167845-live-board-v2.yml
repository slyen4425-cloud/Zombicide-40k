        run: |
          rm -rf _site && mkdir -p _site/assets
          cp index.html _site/index.html
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html');h=p.read_text(encoding='utf-8')
          mods=['<script src="assets/dungeon/dungeon-core-318.js"></script>','<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>','<script src="assets/dungeon/dungeon-room-creator-100.js"></script>','<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>','<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>','<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>','<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>','<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>','<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>','<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167840"></script>','<script src="assets/dungeon/dungeon-equipment-ui.js"></script>','<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>','<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>','<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>']
          for tag in mods:
              if tag not in h:h=h.replace('</body>',tag+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
          node tests/dungeon_final_load_regression.test.cjs _site/index.html
          node tests/dungeon_zone_content_v167824.test.cjs _site/index.html
          node tests/dungeon_authored_runtime_v167839.test.cjs _site/index.html
          node tests/dungeon_live_board_v167845.test.cjs
      - name: Commit validated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf _site
          git add assets/dungeon/dungeon-zone-content-167824.js service-worker.js tests/dungeon_zone_content_v167824.test.cjs tests/dungeon_authored_content_v167844.test.cjs tests/dungeon_live_board_v167845.test.cjs
