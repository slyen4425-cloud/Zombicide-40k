name: Phase 9 Capture pregame UI ownership one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-04

permissions:
  contents: write

jobs:
  patch-index:
    if: ${{ github.event.head_commit.message == 'phase9 apply pregame ui ownership runtime once' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-04
          fetch-depth: 0

      - name: Apply exact pregame UI ownership seam
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const crypto=require('node:crypto');

          const indexPath='index.html';
          let src=fs.readFileSync(indexPath,'utf8');

          const old137=`function cleanDungeonPregame137(){
            const capture=typeof gensCapturePregameMode==="function"&&gensCapturePregameMode();
            const btn=document.getElementById("sessionDungeonSetupBtn");
            const page=document.getElementById("sessionDungeonSetup");
            if(btn)btn.style.display=capture?"none":"";
            if(page&&capture)page.style.setProperty("display","none","important");
          }
          setTimeout(cleanDungeonPregame137,80);
          const update137=window.updateGameStyleUi;
          if(typeof update137==="function")window.updateGameStyleUi=function(){const r=update137.apply(this,arguments);cleanDungeonPregame137();return r};
          `;

          const old138=`window.captureCleanDungeonUi138=function(){
            const cap=isCaptureContext138();
            const btn=document.getElementById("sessionDungeonSetupBtn");
            const page=document.getElementById("sessionDungeonSetup");
            if(btn)btn.style.setProperty("display",cap?"none":"","important");
            if(page&&cap)page.style.setProperty("display","none","important");

            /* sécurité : aucun accès au bouton Aventure depuis la grille de session */
            const grid=document.querySelector(".sessionSetupGrid");
            if(grid&&cap){
              [...grid.querySelectorAll("button")].forEach(b=>{
                if(b.id==="sessionDungeonSetupBtn")b.style.setProperty("display","none","important");
              });
            }
          };
          const rps138=window.renderParticipantSelector;
          window.renderParticipantSelector=function(){const r=rps138.apply(this,arguments);captureCleanDungeonUi138();return r};
          const ugs138=window.updateGameStyleUi;
          if(typeof ugs138==="function")window.updateGameStyleUi=function(){const r=ugs138.apply(this,arguments);captureCleanDungeonUi138();return r};
          document.addEventListener("DOMContentLoaded",()=>setTimeout(captureCleanDungeonUi138,80));
          setTimeout(captureCleanDungeonUi138,200);
          `;

          const old138Call='        captureCleanDungeonUi138();\n';

          for(const [label,before] of [['Capture137 cleanup',old137],['Capture138 cleanup',old138],['Capture138 post-start call',old138Call]]){
            const first=src.indexOf(before);
            if(first<0)throw new Error(label+' source not found');
            if(src.indexOf(before,first+1)>=0)throw new Error(label+' source is not unique');
            src=src.replace(before,'');
          }

          fs.writeFileSync(indexPath,src,'utf8');
          const bytes=fs.readFileSync(indexPath);
          const blob=crypto.createHash('sha1')
            .update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes]))
            .digest('hex');

          if(bytes.length!==8167044)throw new Error('unexpected post-raccord size '+bytes.length);
          if(blob!=='d38eae0b46208f71bc4c290b25b625cc9c12e052')throw new Error('unexpected post-raccord blob '+blob);

          if(src.includes('cleanDungeonPregame137'))throw new Error('Capture137 cleanup still present');
          if(src.includes('captureCleanDungeonUi138'))throw new Error('Capture138 cleanup still present');
          if(!src.includes('window.openSessionDungeonSetup=(function(old)'))throw new Error('Capture137 openSessionDungeonSetup guard lost');
          if(!src.includes('window.gensEnsureDungeonAdventureButton139=function()'))throw new Error('Capture139 owner lost');

          const oldSize='8168810';
          const newSize='8167044';
          const oldBlob='a5d337ae25435d801a72333ee27e6dbc390a5175';
          const newBlob='d38eae0b46208f71bc4c290b25b625cc9c12e052';

          function walk(dir,out=[]){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name);
              const st=fs.statSync(p);
              if(st.isDirectory())walk(p,out); else out.push(p);
            }
            return out;
          }

          const updatedTests=[];
          for(const p of walk('tests').filter(p=>p.endsWith('.cjs'))){
            let txt=fs.readFileSync(p,'utf8');
            if(txt.includes(oldSize)&&txt.includes(oldBlob)){
              txt=txt.split(oldSize).join(newSize).split(oldBlob).join(newBlob);
              fs.writeFileSync(p,txt,'utf8');
              updatedTests.push(p);
            }
          }

          const manifests=[
            'docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv',
            'docs/GENSRPG_PHASE2_INLINE_OWNERS.json',
            'docs/GENSRPG_PHASE2_STORAGE_OWNERS.json',
            'docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json'
          ];
          const updatedManifests=[];
          for(const p of manifests){
            if(!fs.existsSync(p))continue;
            let txt=fs.readFileSync(p,'utf8');
            if(txt.includes(oldBlob)){
              txt=txt.split(oldBlob).join(newBlob);
              fs.writeFileSync(p,txt,'utf8');
              updatedManifests.push(p);
            }
          }

          console.log(JSON.stringify({
            runtime:{bytes:bytes.length,blob},
            updatedTestsCount:updatedTests.length,
            updatedTests,
            updatedManifests
          },null,2));
          NODE

      - name: Commit exact runtime diff
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json
          git diff --cached --quiet && { echo "No change to commit"; exit 1; }
          git commit -m "runtime(phase9): consolidate Capture pregame UI ownership"
          git push origin HEAD:work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-04
