name: GenSrpG stats editor authority

on:
  push:
    branches:
      - 'work/gensrpg-stats-editor-regression-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stats-editor-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Caractériser les autorités concurrentes de l'éditeur de stats
        run: node tests/gens_stats_editor_authority_characterization_v11411.test.cjs
      - name: Exiger une seule autorité finale pour l'éditeur de stats
        run: node tests/gens_stats_editor_single_authority_v11411.test.cjs
