name: Validate Room Creator V1

on:
  push:
    branches:
      - work/dungeon-v16.78.14-room-creator-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Room Creator regressions
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Syntax check Room Creator
        run: node --check assets/dungeon/dungeon-room-creator-100.js
