name: GenSrpG Phase12 Core200 real Dungeon room spawn fix
on:
  push:
    branches:
      - 'work/gensrpg-phase12-dungeon-core200-room-spawn-fix-2026-10-20'
permissions:
  contents: read
  statuses: write
jobs:
  source-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Exact Core200 change, all R10-R15 guards and architecture
        run: |
          set -euo pipefail
          node tests/gensrpg_phase12_dungeon_core200_spawn_order_guard.test.cjs
          node tests/gensrpg_phase12_r15_builders_character_entity_sentinel.test.cjs
          node tests/gensrpg_phase12_r14_builders_rpg_universe_sentinel.test.cjs
          node tests/gensrpg_phase12_r13_builders_enemy_editor_sentinel.test.cjs
          node tests/gensrpg_phase12_r12_dungeon_rpg_rules_talents_sentinel.test.cjs
          node tests/gensrpg_phase12_r11_retired_scripts_sentinel.test.cjs
          node tests/gensrpg_phase12_r10_capture_sentinel.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_runtime_side_effect_inventory_v11411.test.cjs
          node tests/gens_phase2_inline_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_inline_global_last_owner_v11411.test.cjs
          node tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs
          node tests/gens_phase3_target_structure_contracts_v1.test.cjs
          node tests/gens_runtime_composition_guard_v11411.test.cjs
          node tests/gens_phase4_dice_d10048_raccord_v1.test.cjs
          node tests/gens_phase4_dice_first_raccord_preaudit_v1.test.cjs
          node tests/gens_architecture_global_side_effect_guard.test.cjs
          node tests/gens_rpg_tactical_session_guard_v16781144.test.cjs
          node tests/gens_phase4_stats_s7_snapshot_audit_v1.test.cjs
          node tests/gensrpg_phase12_post_r15_inline_authority_baseline.test.cjs
      - name: Exact SHA status source and regressions
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RES: ${{ job.status }}
        run: |
          state=failure; if [ "$RES" = success ]; then state=success; fi
          payload="$(jq -nc --arg state "$state" --arg context 'gensrpg/phase12/core200-room-spawn/regression' --arg desc "Core200 single-owner order + 21 old/new regression sentinels $RES" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$desc,target_url:$url}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
  real-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install isolated Playwright Chromium and Firefox
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/gensrpg-core200-pw playwright@1.56.1
          /tmp/gensrpg-core200-pw/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Reproduce real Dungeon profile, reload, start, spawn and fight UI
        env:
          GENSRPG_PW_ROOT: /tmp/gensrpg-core200-pw
          GENSRPG_TEST_URL: http://127.0.0.1:8898/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/dungeon_core200_http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do if curl -fsS -o /dev/null 'http://127.0.0.1:8898/index.html'; then break; fi; sleep 1; done
          node tests/gensrpg_phase12_dungeon_room_spawn_browser.cjs
      - name: Exact SHA status browser
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RES: ${{ job.status }}
        run: |
          state=failure; if [ "$RES" = success ]; then state=success; fi
          payload="$(jq -nc --arg state "$state" --arg context 'gensrpg/phase12/core200-room-spawn/browser' --arg desc "Real Dungeon Chromium Firefox encounter and combat $RES" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$desc,target_url:$url}')"
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d "$payload" >/dev/null
