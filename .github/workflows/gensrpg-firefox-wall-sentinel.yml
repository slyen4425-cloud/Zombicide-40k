name: GenSrpG Firefox wall sentinel

on:
  push:
    branches:
      - 'work/gensrpg-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox-wall-zoom:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Vérifier l'intégrité du JPEG mural canonique
        run: node tests/gens_wall_asset_integrity_v11411.test.cjs

      - name: Vérifier l'explication visuelle des dégâts
        run: node tests/gens_damage_explanation_consistency_v11411.test.cjs

      - name: Installer Firefox Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox

      - name: Vérifier les murs sous zoom fractionnaire Firefox
        run: node tests/gens_tactical_wall_zoom_firefox_v11411.test.cjs

      - name: Caractériser Dungeon après Survie dans Firefox
        env:
          GENSRPG_BROWSER: firefox
        run: node tests/gens_dungeon_after_survival_start_state_browser_v11411.test.cjs
