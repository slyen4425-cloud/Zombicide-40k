name: GenSrpG temporary Challenge Library storage micro-diff

on:
  push:
    branches:
      - work/gensrpg-phase4-storage-challenge-library-2026-09-20
    paths:
      - .github/workflows/gensrpg-phase4-storage-challenge-library-apply.yml

permissions:
  contents: write

jobs:
  apply-exact-index-micro-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche exacte
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-storage-challenge-library-2026-09-20
          fetch-depth: 0

      - name: Vérifier puis appliquer uniquement le raccord Challenge Library
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path=Path("index.html")
          raw=path.read_bytes()

          def blob_sha(data):
              return hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()

          expected_source="16deeb169abbc31a7db04161902e9381fd6888ad"
          expected_target="bfe9149e8150f15017bfcffe1a00fb797791aa83"
          source_sha=blob_sha(raw)

          if source_sha==expected_target:
              print("Micro-diff déjà appliqué exactement.")
              raise SystemExit(0)
          if source_sha!=expected_source:
              raise SystemExit(f"REFUS: blob index.html inattendu: {source_sha}")

          text=raw.decode("utf-8")
          replacements=[
            ('JSON.parse(localStorage.getItem(CHALLENGE_LIB_KEY_069)||"[]")',
             'GensStorageV1.readJson(localStorage,CHALLENGE_LIB_KEY_069,[])'),
            ('localStorage.setItem(CHALLENGE_LIB_KEY_069,JSON.stringify(lib))',
             'GensStorageV1.writeJson(localStorage,CHALLENGE_LIB_KEY_069,lib)'),
            ('localStorage.setItem(CHALLENGE_LIB_KEY_069,JSON.stringify(Array.isArray(lib)?lib:[]))',
             'GensStorageV1.writeJson(localStorage,CHALLENGE_LIB_KEY_069,Array.isArray(lib)?lib:[])'),
            ("JSON.parse(localStorage.getItem('gensrpg_challenge_library_v1')||'[]')",
             "GensStorageV1.readJson(localStorage,'gensrpg_challenge_library_v1',[])"),
            ('JSON.parse(localStorage.getItem("gensrpg_challenge_library_v1")||"[]")',
             'GensStorageV1.readJson(localStorage,"gensrpg_challenge_library_v1",[])')
          ]

          for old,new in replacements:
              n=text.count(old)
              if n!=1:
                  raise SystemExit(f"REFUS: occurrence inattendue ({n}) pour {old}")
              text=text.replace(old,new)

          target=text.encode("utf-8")
          target_sha=blob_sha(target)
          if len(target)!=8174580:
              raise SystemExit(f"REFUS: taille cible inattendue: {len(target)}")
          if target_sha!=expected_target:
              raise SystemExit(f"REFUS: blob cible inattendu: {target_sha}")

          checks=[
            'localStorage.getItem(CHALLENGE_LIB_KEY_069)',
            'localStorage.setItem(CHALLENGE_LIB_KEY_069',
            "localStorage.getItem('gensrpg_challenge_library_v1')",
            'localStorage.getItem("gensrpg_challenge_library_v1")'
          ]
          for token in checks:
              if token in text:
                  raise SystemExit(f"REFUS: accès direct Challenge Library restant: {token}")

          if text.count('GensStorageV1.readJson(localStorage,CHALLENGE_LIB_KEY_069,[])')!=1:
              raise SystemExit("REFUS: lecture Core 0.51 incorrecte")
          if text.count('GensStorageV1.writeJson(localStorage,CHALLENGE_LIB_KEY_069,lib)')!=1:
              raise SystemExit("REFUS: écriture merge Core 0.51 incorrecte")
          if text.count('GensStorageV1.writeJson(localStorage,CHALLENGE_LIB_KEY_069,Array.isArray(lib)?lib:[])')!=1:
              raise SystemExit("REFUS: écriture save Core 0.51 incorrecte")
          if text.count("GensStorageV1.readJson(localStorage,'gensrpg_challenge_library_v1',[])")!=1:
              raise SystemExit("REFUS: fallback Core 2.00 incorrect")
          if text.count('GensStorageV1.readJson(localStorage,"gensrpg_challenge_library_v1",[])')!=1:
              raise SystemExit("REFUS: fallback Core 2.02 incorrect")

          path.write_bytes(target)
          print("Micro-diff Challenge Library vérifié:",target_sha)

      - name: Vérifier le diff
        run: |
          git diff --check
          git diff --stat
          git diff -- index.html

      - name: Committer uniquement index.html si nécessaire
        run: |
          if git diff --quiet -- index.html; then
            echo "Aucun changement à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m "refactor: route Challenge Library JSON through Core storage"
          git push origin HEAD:work/gensrpg-phase4-storage-challenge-library-2026-09-20
