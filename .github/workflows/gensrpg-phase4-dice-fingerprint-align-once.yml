name: GenSrpG Phase 4 Dice fingerprint align one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
    paths:
      - '.github/workflows/gensrpg-phase4-dice-fingerprint-align-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
          fetch-depth: 0

      - name: Realign proven stale fingerprints only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "5b8e790fefe7970a250fd9485ee80549511737e6"
          python - <<'PY'
          from pathlib import Path
          old_size="8174580"
          new_size="8174637"
          old_blob="5b9b9ae780f735eadef049afeb10acf0b57441fe"
          new_blob="5b8e790fefe7970a250fd9485ee80549511737e6"
          targets=[
    "tests/gens_phase4_storage_next_audit_9_v1.test.cjs",
    "tests/gens_phase4_storage_dungeon_deck_owner_v1.test.cjs",
    "tests/gens_phase4_storage_economy_rules_owner_v1.test.cjs",
    "tests/gens_phase4_storage_manual_mj_effects_owner_v1.test.cjs",
    "tests/gens_phase4_inventory_equipment_sets_preaudit_v1.test.cjs",
    "tests/gens_phase4_inventory_equipped_view_slot_refs_contract_v1.test.cjs",
    "tests/gens_phase4_storage_exit_audit_13_v1.test.cjs",
    "tests/gens_phase4_storage_challenge_history_owner_v1.test.cjs",
    "tests/gens_phase4_stats_s7_snapshot_audit_v1.test.cjs",
    "tests/gens_phase4_storage_dungeon_scene_owner_v1.test.cjs",
    "tests/gens_phase4_storage_next_audit_10_v1.test.cjs",
    "tests/gens_phase4_storage_next_audit_12_v1.test.cjs",
    "tests/gens_phase4_storage_challenge_library_owner_v1.test.cjs",
    "tests/gens_phase4_storage_mj_rules_owner_v1.test.cjs",
    "tests/gens_asset_resolver_final_audit_v1.test.cjs",
    "docs/GENSRPG_PHASE2_STORAGE_OWNERS.json",
          ]
          for name in targets:
              p=Path(name)
              s=p.read_text("utf-8")
              before=s
              s=s.replace(old_size,new_size).replace(old_blob,new_blob)
              if s==before:
                  raise SystemExit(f"no stale fingerprint replaced in {name}")
              p.write_text(s,encoding="utf-8",newline="")
          PY

          echo '=== residual stale fingerprint check ==='
          ! grep -RIn --include='*.cjs' --include='*.json' --include='*.tsv' '8174580' tests docs
          ! grep -RIn --include='*.cjs' --include='*.json' --include='*.tsv' '5b9b9ae780f735eadef049afeb10acf0b57441fe' tests docs

          node tests/gens_phase4_storage_next_audit_9_v1.test.cjs
          node tests/gens_phase4_storage_dungeon_deck_owner_v1.test.cjs
          node tests/gens_phase4_storage_economy_rules_owner_v1.test.cjs
          node tests/gens_phase4_storage_manual_mj_effects_owner_v1.test.cjs
          node tests/gens_phase4_inventory_equipment_sets_preaudit_v1.test.cjs
          node tests/gens_phase4_inventory_equipped_view_slot_refs_contract_v1.test.cjs
          node tests/gens_phase4_storage_exit_audit_13_v1.test.cjs
          node tests/gens_phase4_storage_challenge_history_owner_v1.test.cjs
          node tests/gens_phase4_stats_s7_snapshot_audit_v1.test.cjs
          node tests/gens_phase4_storage_dungeon_scene_owner_v1.test.cjs
          node tests/gens_phase4_storage_next_audit_10_v1.test.cjs
          node tests/gens_phase4_storage_next_audit_12_v1.test.cjs
          node tests/gens_phase4_storage_challenge_library_owner_v1.test.cjs
          node tests/gens_phase4_storage_mj_rules_owner_v1.test.cjs
          node tests/gens_asset_resolver_final_audit_v1.test.cjs
          node tests/gens_phase2_storage_ownership_characterization_v11411.test.cjs

      - name: Commit fingerprint alignment and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/gensrpg-phase4-dice-fingerprint-probe.yml
          rm -f .github/workflows/gensrpg-phase4-dice-fingerprint-align-once.yml
          git add -A
          git commit -m "test: realign historical guards after Core Dice source load"
          git push origin HEAD:work/gensrpg-phase4-dice-first-raccord-2026-09-22
