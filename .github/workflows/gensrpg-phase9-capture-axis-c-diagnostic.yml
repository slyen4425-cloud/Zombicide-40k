name: GenSrpG phase9 Capture axis C shutdown UI diagnostic

on:
  push:
    branches:
      - work/gensrpg-phase9-capture-axis-c-real-shutdown-2026-10-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-axis-c-ui-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Caractériser les contrôles réels de sortie Capture après session complète
        run: node tests/gens_phase9_capture_axis_c_shutdown_ui_diagnostic_browser_v1.test.cjs
