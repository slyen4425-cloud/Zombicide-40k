name: GenSrpG Phase 5 Core 0.23 goMenu retirement one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase5-gomenu-core023-retirement-2026-09-23'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and retire Core 0.23 goMenu owner
        shell: bash
        run: |
          set -euo pipefail
          before="$(git hash-object index.html)"
          bytes_before="$(wc -c < index.html | tr -d ' ')"
          test "$before" = "6e76a99af5fb839db5ffb20a2e67fd1572bf13ea"
          test "$bytes_before" = "8171571"

          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''const oldGo023=window.goMenu;
          window.goMenu=function(){
            const r=oldGo023?.apply(this,arguments);
            try{if(window.DungeonCore01?.active){document.body.style.overflow="";document.getElementById("specialDiceModal")?.classList.remove("open");document.getElementById("dc01Modal")?.classList.remove("open");DungeonCore01.show()}}catch(e){console.warn("Core return 0.23",e)}
            return r;
          };
          '''
          if s.count(old)!=1:
              raise SystemExit(f"Core 0.23 goMenu owner match count={s.count(old)}")
          s=s.replace(old,"",1)
          a=s.index('<script id="dungeonCore023StabilityFix">')
          z=s.index('</script>',a)
          body=s[a:z]
          if 'window.goMenu=' in body or 'const oldGo023=window.goMenu;' in body:
              raise SystemExit("Core 0.23 still owns/captures goMenu")
          required=[
              'const oldOpenHero=window.DungeonCore01.openHero;',
              'window.DungeonCore01.openHero=function',
              'specialDiceModal',
              'window.dungeonCombatActive'
          ]
          for token in required:
              if token not in body:
                  raise SystemExit("Core 0.23 preserved responsibility missing: "+token)
          p.write_text(s,encoding="utf-8")
          PY

          after="$(git hash-object index.html)"
          bytes_after="$(wc -c < index.html | tr -d ' ')"
          echo "after_blob=$after"
          echo "after_bytes=$bytes_after"
          test "$after" = "c2424bada56517e579ffe65fa147facbb6bf2caf"
          test "$bytes_after" = "8171186"

      - name: Commit owner retirement and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/gensrpg-phase5-gomenu-core023-retirement-one-shot.yml
          git commit -m "refactor: retire Core 0.23 goMenu authority"
          git push origin HEAD:work/gensrpg-phase5-gomenu-core023-retirement-2026-09-23
