name: GenSrpG Phase 12 D9 Core202 controlled apply
on:
  push:
    branches:
      - 'work/gensrpg-phase12-dungeon-d9-extraction-2026-10-16'
    paths:
      - '.github/workflows/gensrpg-phase12-dungeon-core202-d9-controlled-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact D8 source and apply bit-exact D9 Core202
        run: |
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase12-dungeon-d9-extraction-2026-10-16'
          test "$(git hash-object index.html)" = 'f56dc5bbb368b176509ab16477bd4b24dd000497'
          python3 tools/gensrpg_phase12_dungeon_core202_d9_extract_apply.py --apply
          python3 tools/gensrpg_phase12_dungeon_core202_d9_extract_apply.py --verify
          node --check assets/gensrpg/dungeon/core202-content-density-v1.js
          node tests/gens_phase12_dungeon_core202_d9_extraction_v1.test.cjs
          node tests/gens_authored_core202_boundary_v11411.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs
          node tests/gens_runtime_composition_guard_v11411.test.cjs
          node tests/gens_phase2_inline_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_inline_global_last_owner_v11411.test.cjs
          node tests/gens_architecture_global_side_effect_guard.test.cjs
      - name: Commit certified D9 runtime and protected sentinels only
        run: |
          test "$GITHUB_REF_NAME" = 'work/gensrpg-phase12-dungeon-d9-extraction-2026-10-16'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/gensrpg/dungeon/core202-content-density-v1.js docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json tests/gens_authored_core202_boundary_v11411.test.cjs tests/gens_phase12_dungeon_*_extraction_v1.test.cjs tests/helpers/gens_capture_team_roster_snapshot_v1.cjs tests/gens_phase2_runtime_load_graph_v11411.test.cjs tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs tests/gens_phase2_runtime_side_effect_inventory_v11411.test.cjs tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs tests/gens_runtime_composition_guard_v11411.test.cjs tests/gens_phase2_inline_owner_manifest_v11411.test.cjs tests/gens_phase2_inline_global_last_owner_v11411.test.cjs tools/gensrpg_phase12_dungeon_*_extract_apply.py
          git diff --cached --check
          git commit -m "refactor(phase12): externalize active Dungeon Core202 byte-identically"
          git push origin "HEAD:$GITHUB_REF_NAME"
