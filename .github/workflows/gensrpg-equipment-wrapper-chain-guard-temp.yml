name: GenSrpG Equipment wrapper chain guard RED

on:
  push:
    branches:
      - 'work/gensrpg-phase4-inventory-equipment-wrapper-retry-scope-fix-2026-09-21'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equipment-wrapper-chain-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Vérifier la garde de chaîne retry Equipment
        run: node tests/gens_phase4_inventory_equipment_wrapper_chain_guard_browser_v1.test.cjs
