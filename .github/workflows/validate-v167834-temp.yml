name: Validate Final V16.78.34
on:
  push:
    branches:
      - work/dungeon-v16.78.34-large-rooms-authoritative-world
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-large-room-support-167834.js
          node --check assets/dungeon/dungeon-world-runtime-167823.js
      - name: Large rooms 15x15
        run: node tests/dungeon_large_room_v167834.test.cjs
      - name: Direct and historical World Runtime
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Exact Zone content chain
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Dungeon runtime complete
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Room Runtime
        run: node tests/dungeon_room_runtime_v167822.test.cjs
      - name: Enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
      - name: Cache and Pages wiring
        run: |
          grep -q 'gensrpg-cache-16.78.34-large-rooms-authoritative-world' service-worker.js
          grep -q 'dungeon-large-room-support-167834.js' service-worker.js
          grep -q 'dungeon-large-room-support-167834.js?v=167834' .github/workflows/main.yml
          grep -q "dungeon_large_room_v167834.test.cjs" .github/workflows/main.yml
