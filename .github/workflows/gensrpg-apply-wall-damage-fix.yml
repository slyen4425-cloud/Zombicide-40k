name: GenSrpG apply characterized wall and damage fix

on:
  push:
    branches:
      - 'work/gensrpg-wall-zoom-damage-display-2026-09-16'
    paths:
      - '.github/workflows/gensrpg-apply-wall-damage-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-wall-zoom-damage-display-2026-09-16
      - name: Appliquer uniquement les deux substitutions caractérisées
        run: |
          python - <<'PY'
          from pathlib import Path

          damage = Path('assets/gensrpg/gens-rpg-tactical-visual-dice-16781142.js')
          s = damage.read_text()
          old = 'raw=Math.max(0,num(result.rawDamage,base+bonus))'
          new = 'raw=Math.max(0,Math.round(base+bonus))'
          assert s.count(old) == 1, f'damage fragment count={s.count(old)}'
          damage.write_text(s.replace(old, new, 1))

          ui = Path('assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js')
          s = ui.read_text()
          old = 'isolation:isolate!important;contain:layout paint!important;'
          new = 'isolation:auto!important;contain:none!important;'
          assert s.count(old) == 1, f'wall fragment count={s.count(old)}'
          ui.write_text(s.replace(old, new, 1))
          PY
      - name: Committer le correctif minimal sur la branche de travail
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/gensrpg/gens-rpg-tactical-visual-dice-16781142.js assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js
          git diff --cached --check
          git commit -m 'fix: stabilize Firefox wall zoom and damage explanation'
          git push origin HEAD:work/gensrpg-wall-zoom-damage-display-2026-09-16
