name: GenSrpG Phase 9 Capture138 exact retirement one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture138-legacy-start-retirement-2026-10-09'
    paths:
      - '.github/workflows/gensrpg-phase9-capture138-retirement-apply.yml'

permissions:
  contents: write

jobs:
  capture138-strict-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify start SHA and Rule 26 exact runtime
        run: |
          test "$(wc -c < index.html)" = "8165398"
          test "$(git hash-object index.html)" = "18627cc0c5fc7945732c8a910504c59ef823b6ae"
      - name: RED expected on actual source
        run: |
          if node tests/gens_phase9_capture138_legacy_start_retirement_v1.test.cjs > /tmp/red.log 2>&1; then
            echo "RED test unexpectedly passed"; cat /tmp/red.log; exit 1
          fi
          grep -F 'RED: the obsolete Capture138 global start wrapper' /tmp/red.log
      - name: Remove exact 724-byte Capture138 legacy-launch seam
        run: python tools/gensrpg_phase9_capture138_retirement_apply.py
      - name: Mechanically pin current baselines and preserve older rollback oracles
        run: python tools/gensrpg_phase9_capture138_retirement_repin.py
      - name: Prove new source and inverses
        run: |
          test "$(wc -c < index.html)" = "8164674"
          test "$(git hash-object index.html)" = "644fc5d0ce5fd195c5496d42cc0204bd1f9a9831"
          node tests/gens_phase9_capture138_legacy_start_retirement_v1.test.cjs
          node tests/gens_phase9_capture_hub_entry_owner_transfer_v1.test.cjs
          node tests/gens_phase9_capture_hub_world_owner_characterization_v1.test.cjs
          node tests/gens_phase5_startconfiguredgame_remaining_chain_preaudit_v1.test.cjs
          node tests/gens_phase5_module_launch_final_shell_authority_v1.test.cjs
      - name: Verify changed files and avoid broad mutation
        run: |
          git diff --check
          test "$(git diff --numstat -- index.html | cut -f1)" = "0"
          test "$(git diff --numstat -- index.html | cut -f2)" = "19"
          if git diff --name-only | grep -Ev '^(index\.html|tests/|docs/GENSRPG_PHASE2_)'; then
            echo 'UNEXPECTED non-test/non-manifest changed file'; exit 1
          fi
          git diff --stat
          git diff -- index.html | sed -n '1,110p'
      - name: Commit exact guarded retirement on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv
          git commit -m "refactor(phase9): retire dead Capture138 global start interception"
          git push origin "HEAD:$GITHUB_REF_NAME"
