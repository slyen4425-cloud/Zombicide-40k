name: GenSrpG Phase 9 Capture seed compatibility diagnostic

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-compatibility-preaudit-2026-10-05'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-seed-compatibility-diagnostic.yml'

permissions:
  contents: read

jobs:
  persisted-capture-without-dungeon-style:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Caractériser reprise Capture persistée sans gameStyle Dungeon
        run: node tests/gens_phase9_capture_persisted_profile_without_dungeon_style_resume_characterization_v1.test.cjs
