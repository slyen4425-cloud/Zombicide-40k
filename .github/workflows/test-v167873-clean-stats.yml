name: Test V16.78.73 clean dynamic stats
on:
  push:
    branches:
      - work/v16.78.73-clean-dynamic-stats
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test clean dynamic stat engine
        run: node tests/gens_clean_dynamic_stats_v167873.test.cjs
      - name: Test Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Test authored Dungeon runtime
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Test UI recovery
        run: node tests/gens_ui_recovery_v167843.test.cjs
      - name: Build final page with clean stat module
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html _site/index.html
          cp service-worker.js _site/service-worker.js
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          h=p.read_text(encoding='utf-8')
          tag='<script src="assets/gensrpg/gens-rpg-stats-clean-167874.js?v=167874"></script>'
          if tag not in h:h=h.replace('</body>',tag+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
      - name: Final guards
        run: |
          grep -q 'gens-rpg-stats-clean-167874.js?v=167874' _site/index.html
          grep -q 'gensrpg-cache-16.78.73-clean-dynamic-stats' _site/service-worker.js
          ! grep -q 'gens-rpg-stats-clean-167873.js?v=167873' _site/index.html
          ! grep -q 'gens-custom-stats-167881' _site/index.html
          ! grep -q 'gens-rpg-stat-reconcile-167902' _site/index.html
          node tests/gens_clean_dynamic_stats_v167873.test.cjs