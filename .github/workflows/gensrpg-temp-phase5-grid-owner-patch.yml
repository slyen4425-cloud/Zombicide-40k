name: GenSrpG temporary Phase 5 grid owner patch

on:
  push:
    branches:
      - work/gensrpg-phase5-survival-to-dungeon-grid-repair-2026-09-24

permissions:
  contents: write

jobs:
  patch-index-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current chantier
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-survival-to-dungeon-grid-repair-2026-09-24
          fetch-depth: 0

      - name: Patch authoritative Dungeon render owner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = "function render(){const x=spatialEnsure(rt());if(!active200||!x)return;syncChestAuthority208(x);"
          new = "function syncEntranceState200(x){document.body?.classList?.toggle('dc054AtEntrance',Number(x?.room||0)<=0)}\nfunction render(){const x=spatialEnsure(rt());if(!active200||!x)return;syncEntranceState200(x);syncChestAuthority208(x);"
          if old not in s:
              raise SystemExit("Core200 render anchor not found exactly once")
          if s.count(old) != 1:
              raise SystemExit(f"Core200 render anchor count = {s.count(old)}")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit owner correction
        shell: bash
        run: |
          git config user.name "gensrpg-phase5-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: let Dungeon runtime own entrance grid visibility"
          git push origin HEAD:work/gensrpg-phase5-survival-to-dungeon-grid-repair-2026-09-24
