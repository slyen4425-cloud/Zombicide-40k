name: GenSrpG Tactical dock sentinel

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Do not duplicate full CI for the same code on feature-branch push + PR.
# New commits supersede only obsolete checks for the SAME pull request.
# Never cancel a main-branch run or another pull request.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('tactical-dock-pr-{0}', github.event.pull_request.number) || format('tactical-dock-ref-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  dock-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Vérifier le contrat source du dock Tactical
        run: node tests/gens_tactical_dock_canonical_render_hook_v11411.test.cjs
      - name: Caractériser le risque de couche legacy au-dessus du Dock
        run: node tests/gens_tactical_dock_legacy_layer_characterization_v11411.test.cjs
      - name: Exiger le nettoyage legacy sur entrée Bridge directe
        run: node tests/gens_tactical_bridge_legacy_layer_target_v11411.test.cjs

  dock-chromium:
    needs: dock-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Chromium Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Vérifier le dock sur le vrai rendu Tactical Chromium
        run: GENS_BROWSER=chromium node tests/gens_tactical_dock_browser_v11411.test.cjs

  dock-firefox:
    needs: dock-contract
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Firefox Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps firefox
      - name: Vérifier le dock sur le vrai rendu Tactical Firefox
        run: GENS_BROWSER=firefox node tests/gens_tactical_dock_browser_v11411.test.cjs
