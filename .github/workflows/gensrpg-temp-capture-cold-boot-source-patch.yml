name: GenSrpG temporary Capture cold-boot source patch

on:
  push:
    branches:
      - 'work/gensrpg-capture-cold-boot-profile-bootstrap-fix-2026-09-18'

permissions:
  contents: write

jobs:
  apply-exact-source-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply exact owner fix and verify blob
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("index.html")
          data = path.read_text(encoding="utf-8")
          start_tag = '<script id="builtinMonsterCapture162">'
          start = data.find(start_tag)
          if start < 0:
              raise SystemExit("builtinMonsterCapture162 block not found")
          end = data.find("</script>", start)
          if end < 0:
              raise SystemExit("builtinMonsterCapture162 block end not found")

          block = data[start:end]
          old = "const profiles=loadGameProfilesRaw();"
          new = "const profiles=loadGameProfiles();"
          if block.count(old) != 1:
              raise SystemExit(f"expected exactly one target in block, found {block.count(old)}")

          block = block.replace(old, new, 1)
          updated = data[:start] + block + data[end:]
          path.write_text(updated, encoding="utf-8")

          raw = path.read_bytes()
          git_blob = hashlib.sha1(f"blob {len(raw)}\0".encode() + raw).hexdigest()
          expected = "437fb42c36e6583842d4b72f06159fdf013c0fd2"
          if git_blob != expected:
              raise SystemExit(f"unexpected patched blob {git_blob}, expected {expected}")
          print("verified patched blob", git_blob)
          PY

          git diff -- index.html
          test "$(git diff --name-only | tr -d '\r')" = "index.html"

      - name: Commit exact runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: bootstrap profiles before Monster Capture seed"
          git push origin "HEAD:${GITHUB_REF_NAME}"
