name: GenSrpG Phase1 Wire Core Once

on:
  push:
    branches:
      - work/gensrpg-restructure-phase-1

permissions:
  contents: write

jobs:
  wire-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-restructure-phase-1
      - name: Insert Core RPG rules before Tactical bridge
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const file='index.html';
          const core='assets/gensrpg/core/rpg-rules.js';
          const tactical='assets/gensrpg/gens-rpg-tactical-combat-v2-stats-1678110.js';
          const html=fs.readFileSync(file,'utf8');
          const coreCount=(html.match(/assets\/gensrpg\/core\/rpg-rules\.js/g)||[]).length;
          const tacticalIx=html.indexOf(tactical);
          assert.ok(tacticalIx>=0,'Tactical RPG stats bridge script reference not found');
          if(coreCount===1){
            assert.ok(html.indexOf(core)<tacticalIx,'Existing Core script must be before Tactical bridge');
            console.log('Core RPG browser wiring already correct; no index change needed.');
            process.exit(0);
          }
          assert.equal(coreCount,0,'Unexpected duplicate Core RPG script references');
          const scriptStart=html.lastIndexOf('<script',tacticalIx);
          const scriptEnd=html.indexOf('>',scriptStart);
          assert.ok(scriptStart>=0&&scriptEnd>=tacticalIx,'Could not locate Tactical script tag');
          const lineStart=html.lastIndexOf('\n',scriptStart)+1;
          const indent=(html.slice(lineStart,scriptStart).match(/^\s*/)||[''])[0];
          const insertion=`${indent}<script src="${core}"></script>\n`;
          const out=html.slice(0,scriptStart)+insertion+html.slice(scriptStart);
          assert.equal((out.match(/assets\/gensrpg\/core\/rpg-rules\.js/g)||[]).length,1);
          assert.ok(out.indexOf(core)<out.indexOf(tactical));
          fs.writeFileSync(file,out);
          console.log('Inserted Core RPG rules immediately before Tactical stats bridge.');
          NODE
      - name: Validate browser wiring contract
        run: node tests/gens_core_rpg_browser_wiring_contract.test.cjs
      - name: Commit exact index wiring
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required."
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire Core RPG rules before Tactical bridge"
          git push origin HEAD:refs/heads/work/gensrpg-restructure-phase-1
