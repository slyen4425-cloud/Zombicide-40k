name: GenSrpG Phase12 Dungeon real UI -> combat path
on:
  push:
    branches:
      - 'work/gensrpg-phase12-dungeon-real-flow-sentinel-2026-10-20'
permissions:
  contents: read
  statuses: write
jobs:
  real-dungeon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect exact source and forbid runtime edits
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '9f35eb833a6ede4b91399854f19bb9bef59f45ab'
          git diff --exit-code 95740b6353a116c7e66b5d1095338b81d8b223bf -- index.html service-worker.js assets/ docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json
          node tests/gensrpg_phase12_post_r15_inline_authority_baseline.test.cjs
      - name: Set up isolated Chromium and Firefox
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --prefix /tmp/gensrpg-real-flow-pw playwright@1.56.1
          /tmp/gensrpg-real-flow-pw/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Follow actual UI from profile to generated Dungeon combat
        shell: bash
        env:
          GENSRPG_PW_ROOT: /tmp/gensrpg-real-flow-pw
          GENSRPG_TEST_URL: http://127.0.0.1:8898/index.html
        run: |
          set -euo pipefail
          python3 -m http.server 8898 --bind 127.0.0.1 >/tmp/gensrpg-dungeon-real-http.log 2>&1 &
          srv=$!
          trap 'kill "$srv" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8898/index.html; then break; fi
            sleep 1
          done
          node tests/gensrpg_phase12_dungeon_real_flow_browser.cjs 2>&1 | tee /tmp/gensrpg-dungeon-real-trace.log
      - name: Post exact-SHA result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_RESULT" = success ]; then state=success; fi
          payload="$(jq -nc --arg state "$state" --arg context 'gensrpg/phase12/dungeon-real-flow' --arg desc "Real Dungeon UI profile->explore->combat sentinel: $JOB_RESULT" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" '{state:$state,context:$context,description:$desc,target_url:$url}')"
          curl --fail --silent --show-error --retry 2 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload" >/dev/null
