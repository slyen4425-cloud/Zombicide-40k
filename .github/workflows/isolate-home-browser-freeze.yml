name: Isolate home browser freeze
on:
  push:
    branches:
      - fix/home-ui-observers-2026-09-05
    paths:
      - .github/workflows/isolate-home-browser-freeze.yml
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print startup mutation and timer hooks
        shell: bash
        run: |
          echo '--- broad observers ---'
          grep -RInE 'MutationObserver|observe\([^;]*(documentElement|body)|setInterval\(' index.html assets 2>/dev/null | head -300 || true
          echo '--- scripts in index ---'
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8',errors='replace')
          tags=re.findall(r'<script\b[^>]*>.*?</script\s*>',s,re.I|re.S)
          for i,t in enumerate(tags):
              m=re.search(r'\bsrc\s*=\s*["\']([^"\']+)',t,re.I)
              kind='src='+m.group(1) if m else 'INLINE len='+str(len(t))
              print(f'{i:03d} {kind}')
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Build script-isolation pages
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8',errors='replace')
          rx=re.compile(r'<script\b[^>]*>.*?</script\s*>',re.I|re.S)
          def ext(t): return re.search(r'\bsrc\s*=',t,re.I) is not None
          variants={
            'probe-original.html':s,
            'probe-inline-only.html':rx.sub(lambda m:'' if ext(m.group(0)) else m.group(0),s),
            'probe-external-only.html':rx.sub(lambda m:m.group(0) if ext(m.group(0)) else '',s),
            'probe-no-scripts.html':rx.sub('',s),
          }
          for n,c in variants.items(): Path(n).write_text(c,encoding='utf-8')
          PY
      - name: Probe renderer responsiveness
        shell: bash
        run: |
          cat >probe_case.mjs <<'JS'
          import { chromium } from 'playwright';
          const file=process.argv[2];
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
          const req=[]; const errs=[];
          page.on('request',r=>{if(r.resourceType()==='script')req.push(r.url())});
          page.on('pageerror',e=>errs.push(String(e?.message||e)));
          await page.route('**/*',route=>{
            const u=new URL(route.request().url());
            if(u.hostname==='127.0.0.1'||u.hostname==='localhost'||u.protocol==='data:'||u.protocol==='blob:') return route.continue();
            return route.abort();
          });
          await page.goto('http://127.0.0.1:8765/'+file,{waitUntil:'commit',timeout:4000});
          await new Promise(r=>setTimeout(r,1200));
          let outcome;
          const evaluate=page.evaluate(()=>({ready:document.readyState,title:document.title,body:document.body?.children?.length||0,cards:document.querySelectorAll('button.gensRootModeCard').length}));
          outcome=await Promise.race([evaluate,new Promise(r=>setTimeout(()=>r({hung:true}),2500))]);
          console.log('CASE',file,JSON.stringify(outcome),'scripts',req.length,'last',req.slice(-8),'errors',errs.slice(0,8));
          if(outcome?.hung){process.exitCode=2; setTimeout(()=>process.exit(2),50);return;}
          await browser.close();
          JS
          python3 -m http.server 8765 >/tmp/gens-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          for f in probe-no-scripts.html probe-inline-only.html probe-external-only.html probe-original.html; do
            echo "=== $f ==="
            timeout 9s node probe_case.mjs "$f" || echo "CASE_EXIT=$? for $f"
          done
          rm -f probe_case.mjs probe-original.html probe-inline-only.html probe-external-only.html probe-no-scripts.html
