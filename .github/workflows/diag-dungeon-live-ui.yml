name: Diagnose Dungeon live UI
on:
  push:
    branches:
      - diag/dungeon-live-ui-2026-09-05
    paths:
      - .github/workflows/diag-dungeon-live-ui.yml
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact live renderer paths
        shell: bash
        run: |
          {
            echo '=== MAP STATE REPAIR 39315-39365 ==='
            sed -n '39315,39365p' index.html
            echo '=== CORE 2.01 ENEMY HELPERS 39880-39975 ==='
            sed -n '39880,39975p' index.html
            echo '=== CORE 2.11 TRAP HELPERS 41170-41260 ==='
            sed -n '41170,41260p' index.html
            echo '=== ZONE AUTOTRAP FULL ==='
            grep -o 'function autoTrap([^}]*}[^}]*}' assets/dungeon/dungeon-zone-content-167824.js || true
            grep -o 'function triggerTrap([^}]*}[^}]*}' assets/dungeon/dungeon-zone-content-167824.js || true
          } > diag-dungeon-live-ui-precise.txt
      - name: Commit precise report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diag-dungeon-live-ui-precise.txt
          git commit -m "Capture precise Dungeon live renderer paths" || exit 0
          git push
