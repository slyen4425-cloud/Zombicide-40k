name: GenSrpG Phase 4 Dice align one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
    paths:
      - '.github/workflows/gensrpg-phase4-dice-align-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: 'work/gensrpg-phase4-dice-first-raccord-2026-09-22'
          fetch-depth: 0

      - name: Align cache and cartography for the single Dice raccord
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "5b8e790fefe7970a250fd9485ee80549511737e6"
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label):
              p=Path(path)
              s=p.read_text("utf-8")
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f"{label}: expected 1 anchor, got {n}")
              p.write_text(s.replace(old,new,1),encoding="utf-8",newline="")

          rep("service-worker.js",
              '"./assets/gensrpg/core/storage-v1.js","./assets/dungeon/dungeon-room-creator-100.js"',
              '"./assets/gensrpg/core/storage-v1.js","./assets/gensrpg/core/dice-v1.js","./assets/dungeon/dungeon-room-creator-100.js"',
              "service-worker Core Dice cache")

          p="tests/gens_phase2_runtime_load_graph_v11411.test.cjs"
          rep(p,
              "  'assets/gensrpg/core/storage-v1.js',\n  'assets/gensrpg/core/asset-resolver-v1.js',",
              "  'assets/gensrpg/core/storage-v1.js',\n  'assets/gensrpg/core/dice-v1.js',\n  'assets/gensrpg/core/asset-resolver-v1.js',",
              "raw direct Dice")
          rep(p,
              "assert.equal(new Set(productionDirect).size,32,'production composition must expose 32 unique direct local JS entries');",
              "assert.equal(new Set(productionDirect).size,33,'production composition must expose 33 unique direct local JS entries');",
              "direct composition count")
          rep(p,
              "  'assets/gensrpg/core/asset-resolver-v1.js',\n  'assets/gensrpg/core/storage-v1.js',\n  'assets/gensrpg/core/stats-normalization-v1.js',",
              "  'assets/gensrpg/core/asset-resolver-v1.js',\n  'assets/gensrpg/core/storage-v1.js',\n  'assets/gensrpg/core/dice-v1.js',\n  'assets/gensrpg/core/stats-normalization-v1.js',",
              "connected Dice service")
          rep(p,
              "const phase4InertServices=[\n  'assets/gensrpg/core/stats-resistance-normalization-v1.js',\n  'assets/gensrpg/core/stats-armor-contract-v1.js',\n  'assets/gensrpg/core/dice-v1.js'\n];",
              "const phase4InertServices=[\n  'assets/gensrpg/core/stats-resistance-normalization-v1.js',\n  'assets/gensrpg/core/stats-armor-contract-v1.js'\n];",
              "remove Dice inert classification")
          rep(p,
              "assert.equal(reachable.size,76,'production-reachable JS graph must currently contain 76 files');",
              "assert.equal(reachable.size,77,'production-reachable JS graph must currently contain 77 files');",
              "reachable graph count")

          p="tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs"
          rep(p,
              "assert.equal(reachable.size,76,'production graph size drifted before owner validation');",
              "assert.equal(reachable.size,77,'production graph size drifted before owner validation');",
              "owner reachable count")
          rep(p,
              "assert.equal(mapped.size,76,'owner manifest must currently map all 76 production-reachable files');",
              "assert.equal(mapped.size,77,'owner manifest must currently map all 77 production-reachable files');",
              "owner mapped count")

          rep("tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs",
              "assert.equal(reachable.size,76);",
              "assert.equal(reachable.size,77);",
              "unreachable characterization count")

          rep("tests/gens_phase2_runtime_side_effect_inventory_v11411.test.cjs",
              "assert.equal(reachable.size,76);",
              "assert.equal(reachable.size,77);",
              "side effect inventory count")

          p="tests/gens_phase3_target_structure_contracts_v1.test.cjs"
          rep(p,
              "assert.equal(Object.keys(ownerManifest.files||{}).length,76,'Phase 3 scaffolding must remain inert while the current Phase 4 production owner graph contains 76 files');",
              "assert.equal(Object.keys(ownerManifest.files||{}).length,77,'Phase 3 scaffolding must remain inert while the current Phase 4 production owner graph contains 77 files');",
              "Phase 3 owner graph count")
          rep(p,
              "  productionOwnerGraph:76,",
              "  productionOwnerGraph:77,",
              "Phase 3 diagnostic count")

          p="docs/GENSRPG_PHASE2_RUNTIME_OWNERS.json"
          old='    "assets/gensrpg/core/runtime-bootstrap-v1.js": {'
          new='''    "assets/gensrpg/core/dice-v1.js": {
              "owner": "GenSrpG Core Dice",
              "domain": "core",
              "role": "canonical pure D100 threshold primitive; first production raccord through the historical d100ThresholdFromChance boundary adapter"
            },
            "assets/gensrpg/core/runtime-bootstrap-v1.js": {'''
          rep(p,old,new,"Core Dice owner manifest")

          p="tests/gens_phase4_dice_preaudit_v1.test.cjs"
          rep(p,
              'assert.equal(index.includes("assets/gensrpg/core/dice-v1.js"),false,',
              'assert.equal(index.includes("assets/gensrpg/core/dice-v1.js"),true,',
              "Dice preaudit load state")
          rep(p,
              '  "Core Dice contract must remain inert until a dedicated raccord lot");',
              '  "post-raccord invariant: Core Dice must now be explicitly production-loaded");',
              "Dice preaudit load message")
          rep(p,
              r'assert.match(index,/function d100ThresholdFromChance\(chance\)\{[\s\S]*?101-c/,',
              r'assert.match(index,/function d100ThresholdFromChance\(chance\)\{[\s\S]*?Number\(chance\)\|\|1[\s\S]*?GensDiceV1\.thresholdFromChance\(c\)/,',
              "Dice preaudit seam")
          rep(p,
              '  "index must still own the shared D100 threshold helper");',
              '  "index must keep the shared D100 boundary while delegating the threshold formula to Core Dice");',
              "Dice preaudit seam message")
          rep(p,
              "  runtimeRaccord:false,",
              "  runtimeRaccord:'d100ThresholdFromChance',",
              "Dice preaudit diagnostic")

          p="tests/gens_phase4_dice_first_raccord_preaudit_v1.test.cjs"
          rep(p,
              r'const thresholdMatch=index.match(/function d100ThresholdFromChance\(chance\)\{\s*const c=Math\.max\(1,Math\.min\(100,Number\(chance\)\|\|1\)\);\s*return Math\.max\(1,Math\.min\(100,101-c\)\);\s*\}/);',
              r'const thresholdMatch=index.match(/function d100ThresholdFromChance\(chance\)\{\s*const c=Math\.max\(1,Math\.min\(100,Number\(chance\)\|\|1\)\);\s*return GensDiceV1\.thresholdFromChance\(c\);\s*\}/);',
              "first raccord preaudit helper")
          rep(p,
              "assert.ok(thresholdMatch,'historical D100 threshold helper contract drifted');",
              "assert.ok(thresholdMatch,'selected D100 boundary must preserve legacy normalization and delegate to Core Dice');",
              "first raccord preaudit helper message")
          rep(p,
              "const legacyCtx={Math,Number};",
              "const legacy=chance=>{",
              "legacy adapter start")
          rep(p,
              "vm.createContext(legacyCtx);",
              "  const c=Math.max(1,Math.min(100,Number(chance)||1));",
              "legacy adapter normalize")
          rep(p,
              "vm.runInContext(thresholdMatch[0]+';this.legacyThreshold=d100ThresholdFromChance;',legacyCtx);",
              "  return Math.max(1,Math.min(100,101-c));",
              "legacy adapter formula")
          rep(p,
              "const legacy=legacyCtx.legacyThreshold;",
              "};",
              "legacy adapter end")
          rep(p,
              "assert.equal(index.includes('assets/gensrpg/core/dice-v1.js'),false,",
              "assert.equal(index.includes('assets/gensrpg/core/dice-v1.js'),true,",
              "first raccord preaudit load")
          rep(p,
              "  'Core Dice must remain inert during first-raccord preaudit');",
              "  'selected first raccord must explicitly load Core Dice');",
              "first raccord preaudit load message")
          rep(p,
              "  runtimeChanged:false",
              "  runtimeChanged:true",
              "first raccord preaudit diagnostic")

          rep("tests/gens_phase4_dice_contract_v1.test.cjs",
              "  runtimeRaccord:false",
              "  runtimeRaccord:'d100ThresholdFromChance'",
              "Core Dice contract diagnostic")
          PY

          node tests/gens_phase4_dice_contract_v1.test.cjs
          node tests/gens_phase4_dice_preaudit_v1.test.cjs
          node tests/gens_phase4_dice_first_raccord_preaudit_v1.test.cjs
          node tests/gens_phase4_dice_first_raccord_v1.test.cjs
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_phase2_runtime_owner_manifest_v11411.test.cjs
          node tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs
          node tests/gens_phase2_runtime_side_effect_inventory_v11411.test.cjs
          node tests/gens_phase3_target_structure_contracts_v1.test.cjs

      - name: Commit alignment and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/gensrpg-phase4-dice-align-once.yml
          git add -A
          git commit -m "test: align Core Dice first raccord sentinels"
          git push origin HEAD:work/gensrpg-phase4-dice-first-raccord-2026-09-22
