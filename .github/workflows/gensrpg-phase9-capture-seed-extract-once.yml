name: GenSrpG Phase9 Capture seed extraction once
on:
  push:
    branches:
      - work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10
    paths:
      - .github/workflows/gensrpg-phase9-capture-seed-extract-once.yml
permissions:
  contents: write
jobs:
  extract-and-validate:
    if: github.event.head_commit.message == 'ci(phase9): trigger verified one-shot Capture seed extraction'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact, dedicated work branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Confirm branch and old source SHA
        run: |
          test "$(git branch --show-current)" = "work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git status --porcelain
      - name: Extract owner from proven old HTML, rollback-verify, then syntax-check
        env:
          GENSRPG_CAPTURE_EXTRACT_APPROVED: "1"
        run: |
          node scripts/gensrpg_capture_seed_extract_v1.cjs --apply
          node --check assets/gensrpg/capture/builtin-seed-v1.js
          node tests/gens_phase9_capture_seed_physical_extraction_v1.test.cjs
      - name: Install Chromium for real Capture lifecycle
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove new seed loads in real Capture and Save Quit still resumes
        run: |
          node tests/gens_phase9_capture_axis_b_clean_resume_browser_v1.test.cjs
          node tests/gens_phase9_capture_axis_c_shutdown_owner_browser_v1.test.cjs
      - name: Commit ONLY index and Capture external seed on dedicated branch
        run: |
          test "$(git branch --show-current)" = "work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10"
          git config user.name "gensrpg-controlled-extraction"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html assets/gensrpg/capture/builtin-seed-v1.js
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git commit -m "refactor(capture): extract unchanged V16.162 seed from HTML"
          git push origin HEAD:work/gensrpg-phase9-capture-physical-seed-extraction-2026-10-10
