name: GenSrpG Phase 9 Capture Axe B diagnostic one-shot

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-axis-b-clean-resume-2026-10-10'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  axis-b-targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Installer Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Tester Capture partie vierge victoire sauvegarde reload reprise et jour 3 sans Dungeon
        run: node tests/gens_phase9_capture_axis_b_clean_resume_browser_v1.test.cjs
