name: Capture V2 official native release gate
on:
  workflow_dispatch:
  push:
    branches:
      - 'work/gensrpg-capture-clean-replacement-*'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/gensrpg/capture-v2/**'
      - 'tests/gens_capture_v2_adventure_xp_fullscreen_20261108.test.mjs'
      - 'tools/stage_capture_v2_labs.mjs'
      - 'tests/gens_capture_v2_*.test.cjs'
      - '.github/workflows/main.yml'
      - '.github/workflows/capture-lab-delivery.yml'
permissions:
  contents: read
concurrency:
  group: capture-v2-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-static-delivery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: TDD clean ownership, profile isolation and real Pages gate
        run: |
          node --check assets/gensrpg/capture-v2/identity-v1.js
          node --check assets/gensrpg/capture-v2/shell-entry-v1.js
          node --check tools/stage_capture_v2_labs.mjs
          node --test tests/gens_capture_v2_clean_boundary.test.cjs
          node --test tests/gens_capture_v2_pwa_cache_owner_v1.test.cjs
          node --test tests/gens_capture_v2_adventure_xp_fullscreen_20261108.test.mjs
          node --test tests/gens_capture_v2_generic_profile_owner.test.cjs
          node --test tests/gens_capture_combat_main_only_guard_20261030.test.cjs
      - name: Resolve the TWO exact, immutable Lab main SHAs
        id: pins
        run: |
          node tools/verify_capture_official_lab_pins_v1.mjs >> "$GITHUB_OUTPUT"
      - name: Checkout Combat only from approved main
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.pins.outputs.combat }}
          path: combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
      - name: Checkout Exploration only from approved main
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/laboratoire_dynamique_exploration-
          ref: ${{ steps.pins.outputs.exploration }}
          path: exploration-lab
          sparse-checkout: |
            src
            assets
            index.html
            builder.html
            world-assembler.html
            sculpt-lab.html
            play.html
            scripts
      - name: Read the certified public Capture visual approval (immutable)
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/Zombicide-40k
          ref: aa34bf1f415d14ba2c62e6745f8655aec6e3a4fa
          path: approved-public-preview
          sparse-checkout: |
            tools
      - name: Resolve approved immutable visual SHA
        id: adventure_visual_pin
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const pin=JSON.parse(fs.readFileSync('approved-public-preview/tools/capture_v2_pages_preview_pin.json','utf8'));
          const v=pin.officialVisuals;
          if(pin.schema!=='gensrpg-capture-v2-pages-source-pin-v1' ||
             pin.publicPath!=='/preview/capture-v2-pr225/' ||
             v?.repository!=='slyen4425-cloud/GenSrpg_labo_combat_dynamique' ||
             v.ref!=='global-assets' || !/^[a-f0-9]{40}$/.test(v.sha) ||
             !Number.isInteger(v.certifiedCiRun) || v.certifiedCiRun<=0)
            throw Error('Publicly certified immutable visual authority missing');
          console.log('sha='+v.sha);
          JS
      - name: Read only approved Combat visual catalogue bytes
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.adventure_visual_pin.outputs.sha }}
          path: approved-adventure-visuals
          sparse-checkout: |
            data/assets/catalog

      - name: Assemble exact Lab source files and refuse any historical Capture payload
        env:
          CAPTURE_V2_SITE: ${{ github.workspace }}/_site
          COMBAT_LAB_ROOT: ${{ github.workspace }}/combat-lab
          EXPLORATION_LAB_ROOT: ${{ github.workspace }}/exploration-lab
        run: |
          mkdir -p _site/vendor/exploration-lab _site/assets _site/icons
          # A native preview must be a complete immutable site, never an
          # iframe silently loading first-party files from the CI checkout.
          # Keep the existing Pages publisher separate; do not deploy this PR.
          cp -f index.html service-worker.js manifest.webmanifest _site/
          rsync -a --exclude='/gensrpg/capture/' assets/ _site/assets/
          for file in icon-192.png icon-512.png; do
            if test -f "$file"; then cp -f "$file" _site/ && cp -f "$file" _site/icons/; fi
          done
          for file in sound_*.mp3; do
            if test -f "$file"; then cp -f "$file" _site/; fi
          done
          test ! -e _site/assets/gensrpg/capture
          cp -a exploration-lab/src exploration-lab/assets _site/vendor/exploration-lab/
          cp exploration-lab/index.html exploration-lab/builder.html exploration-lab/world-assembler.html exploration-lab/sculpt-lab.html exploration-lab/play.html _site/vendor/exploration-lab/
          node tools/stage_capture_v2_labs.mjs combat-lab exploration-lab _site
          node tools/stage_capture_v2_official_visuals.mjs approved-adventure-visuals approved-public-preview/tools/capture_v2_pages_preview_pin.json _site
          node --test tests/gens_capture_v2_pages_delivery_v1.test.cjs
      - name: Install real Chromium for the actual four-mode app, landscape touch
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 pngjs@7.0.0
          npx playwright install --with-deps chromium
      - name: Test real GenSrpg root, native Combat and Exploration, without old Capture
        env:
          CAPTURE_V2_SITE: ${{ github.workspace }}/_site
        run: node --test tests/gens_capture_v2_root_browser.test.cjs
      - name: Preserve the COMPLETE native same-origin preview artifact (not deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: capture-v2-native-static-preview-${{ github.sha }}
          path: _site/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve the exact consumer source manifest as CI evidence (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: capture-v2-main-only-source-manifest
          path: _site/assets/gensrpg/capture-v2/delivery-manifest.json
          retention-days: 14
