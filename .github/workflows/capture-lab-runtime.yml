name: Capture official Combat runtime
on:
  push:
    branches: ['work/gensrpg-capture-lab-bridge-runtime-*', 'work/gensrpg-capture-lab-bridge-history-*', 'work/gensrpg-capture-explicit-profile-migration-*']
  pull_request:
    paths:
      - 'assets/gensrpg/capture/combat-lab-*'
      - 'assets/gensrpg/capture/temporary-*.js'
      - 'assets/gensrpg/capture/preview/**'
      - 'capture-lab-preview.html'
      - 'tools/build_capture_lab_preview.mjs'
      - 'tests/gens_capture_lab_runtime*.test.cjs'
      - 'tests/gens_capture_saved_profile_bridge_v1.test.cjs'
      - 'tests/gens_capture_lab_authored_source_v1.test.cjs'
      - 'tests/gens_capture_lab_pinned_assets_v1.test.cjs'
      - 'tests/gens_capture_lab_authored_browser_v1.test.cjs'
      - 'tests/gens_capture_lab_saved_hub_browser_v1.test.cjs'
      - 'tests/gens_capture_lab_saved_hub_exact_index_v1.test.cjs'
      - 'tests/gens_capture_r10_certified_owner_snapshot_v1.test.cjs'
      - 'tests/fixtures/gensrpg-phase12-r10-capture-original-owner-20261018.js.txt'
      - 'tools/gensrpg_phase12_r10_capture_extract_apply.cjs'
      - 'capture-lab-saved-hub-preview.html'
      - 'assets/gensrpg/capture/preview/saved-hub-*'
      - 'tests/gens_capture_world_lab_wild_transaction_v1.test.cjs'
      - 'assets/gensrpg/capture/capture-world-lab-wild-transaction-v1.mjs'
      - 'assets/gensrpg/capture/capture-lab-hub-battle-command-v1.mjs'
      - 'assets/gensrpg/capture/saved-profile-lab-migration-v1.mjs'
      - 'capture-lab-authored-preview.html'
      - 'tools/prepare_capture_lab_authored_preview.mjs'
      - 'tests/fixtures/capture-lab-authored-preview-settings-v1.json'
      - 'assets/gensrpg/core/asset-resolver-v1.js'
      - 'docs/GENSRPG_CAPTURE_LAB_STAGED_FILES_2026-10-27.json'
      - 'tests/fixtures/capture-lab-*'
      - '.github/workflows/capture-lab-runtime.yml'
      - 'tests/helpers/gens_chrome_*20261024.cjs'
      - 'tests/gens_capture_history_upload_20261027.test.cjs'
      - 'tests/fixtures/gens_profile_save_upload_exact_edits_20261025.json'
permissions:
  contents: read
jobs:
  real-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve the single immutable Combat pin
        id: combat
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import {COMBAT_LAB_SOURCE_V1 as source} from './assets/gensrpg/capture/combat-lab-engine-loader-v1.mjs';
          console.log('sha='+source.sha);
          JS
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.combat.outputs.sha }}
          path: combat-lab
          sparse-checkout: |
            src/core
            src/contracts
            src/adapters/input/capture
            src/catalogs
            data/capture
            data/combat
      - name: Resolve the single immutable official asset pin
        id: assets
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import fs from 'node:fs';
          const manifest=JSON.parse(fs.readFileSync('./docs/GENSRPG_CAPTURE_LAB_STAGED_FILES_2026-10-27.json','utf8'));
          if(!/^[a-f0-9]{40}$/.test(manifest.authoredAssetsPin))throw new Error('Unpinned Lab media assets');
          console.log('sha='+manifest.authoredAssetsPin);
          JS
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.assets.outputs.sha }}
          path: combat-assets
          sparse-checkout: |
            data/assets/catalog
      - name: Test real Core, AI, result return and cleanup
        env:
          COMBAT_LAB_ROOT: ${{ github.workspace }}/combat-lab
          COMBAT_ASSETS_ROOT: ${{ github.workspace }}/combat-assets
        run: |
          node --test tests/gens_capture_lab_runtime_v1.test.cjs
          node --test tests/gens_capture_saved_profile_bridge_v1.test.cjs
          node --test tests/gens_capture_lab_authored_source_v1.test.cjs
          node --test tests/gens_capture_world_lab_wild_transaction_v1.test.cjs
          node tests/gens_core_asset_resolver_v1.test.cjs
          node --test tests/gens_capture_lab_pinned_assets_v1.test.cjs
      - name: Verify exact historical source projection and preserved profile saves
        run: |
          node --test tests/gens_capture_history_upload_20261027.test.cjs
          node tests/gens_capture_lab_saved_hub_exact_index_v1.test.cjs
          node tests/gens_capture_r10_certified_owner_snapshot_v1.test.cjs
      - name: Verify production graph and explicit opt-in Capture boundaries
        run: |
          node tests/gens_phase2_runtime_load_graph_v11411.test.cjs
          node tests/gens_phase2_unreachable_files_characterization_v11411.test.cjs
          node tests/gens_phase9_capture_exit_gate_evidence_v1.test.cjs
      - name: Preserve the existing boundary and zone tests
        run: |
          node tests/gens_capture_lab_bridge_contract.test.cjs
          node tests/gens_capture_lab_ownership_port.test.cjs
          node tests/gens_capture_manual_battle_trigger_v1.test.cjs
          node tests/gens_capture_temporary_encounter_source_v1.test.cjs
          node tests/gens_capture_temporary_zone_controller_v1.test.cjs
          node tests/gens_capture_temporary_zone_invalid_destination_v1.test.cjs
          node tests/gens_capture_temporary_zone_session_v1.test.cjs
          node tests/gens_capture_hub_temporary_play_owner_v1.test.cjs
      - name: Build isolated preview with unchanged pinned Core modules
        run: node tools/build_capture_lab_preview.mjs combat-lab _site/capture-lab-preview combat-assets
      - name: Install browser verification
        run: |
          npm install --prefix /tmp/capture-lab-browser --no-save playwright@1.55.0
          /tmp/capture-lab-browser/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Test landscape touch in Chromium and Firefox
        env:
          NODE_PATH: /tmp/capture-lab-browser/node_modules
          CAPTURE_LAB_SCREENSHOT_AUTHORED: _site/capture-lab-preview/authored-preview.png
          CAPTURE_LAB_SCREENSHOT_SAVED_HUB: _site/capture-lab-preview/saved-hub-preview.png
        run: |
          node --test tests/gens_capture_lab_runtime_browser_v1.test.cjs
          node --test tests/gens_capture_lab_authored_browser_v1.test.cjs
          node --test tests/gens_capture_lab_saved_hub_browser_v1.test.cjs
      - name: Upload reviewable standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: capture-lab-preview
          path: _site/capture-lab-preview
          retention-days: 14
