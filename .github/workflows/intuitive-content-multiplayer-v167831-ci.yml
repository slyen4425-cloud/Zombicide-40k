name: Validate Intuitive Content Multiplayer V16.78.31
on:
  push:
    branches:
      - work/dungeon-v16.78.31-intuitive-content-multiplayer
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax intuitive content UI
        run: node --check assets/dungeon/dungeon-room-content-ui-167831.js
      - name: Syntax multiplayer entry
        run: node --check assets/gensrpg/gens-multiplayer-entry-167831.js
      - name: Test intuitive content UI
        run: node tests/dungeon_room_content_ui_v167831.test.cjs
      - name: Test multiplayer entry
        run: node tests/gens_multiplayer_entry_v167831.test.cjs
      - name: Test exact zone content chain
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Test full Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Test Room Creator V1
        run: node tests/dungeon_room_creator_v1.test.cjs
      - name: Test Room Creator V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs
      - name: Test World Builder
        run: node tests/dungeon_world_builder_v167821.test.cjs
      - name: Test World Runtime
        run: node tests/dungeon_world_runtime_v167823.test.cjs
      - name: Test enemy room scope
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs
