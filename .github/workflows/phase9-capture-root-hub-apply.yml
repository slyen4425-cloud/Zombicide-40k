name: "Phase9 Capture root Hub exact patch"
on:
  push:
    branches:
      - "work/gensrpg-phase9-capture-root-hub-2026-10-11"
    paths:
      - ".github/workflows/phase9-capture-root-hub-apply.yml"
permissions:
  contents: write
jobs:
  apply-exact-index:
    if: github.repository == 'slyen4425-cloud/Zombicide-40k'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply exact user-ZIP-verified index patch
        run: python3 scripts/phase9_capture_root_hub_patch_2026_10_11.py
      - name: Commit only the target index on work branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git diff --cached --exit-code && { echo "No patch change"; exit 1; } || true
          git commit -m "feat(shell): give Monster Capture its own first-level Hub family"
          git push origin HEAD:refs/heads/work/gensrpg-phase9-capture-root-hub-2026-10-11
