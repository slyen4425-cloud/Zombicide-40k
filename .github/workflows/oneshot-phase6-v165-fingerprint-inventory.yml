name: One-shot Phase 6 V165 fingerprint inventory

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
    paths:
      - .github/workflows/oneshot-phase6-v165-fingerprint-inventory.yml

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
          fetch-depth: 0

      - name: Inventory exact old runtime fingerprints
        shell: bash
        run: |
          echo "=== OLD BLOB ==="
          git grep -n -F "f6a11fa5c0807debc0c9950cc2caf5356c97cfc8" -- ':!docs/GENSRPG_CURRENT_WORK.md' || true
          echo "=== OLD SIZE ==="
          git grep -n -E '8170881|8 170 881' -- ':!docs/GENSRPG_CURRENT_WORK.md' || true

      - name: Self-delete inventory workflow
        shell: bash
        run: |
          rm .github/workflows/oneshot-phase6-v165-fingerprint-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/oneshot-phase6-v165-fingerprint-inventory.yml
          git commit -m "ci: remove V165 fingerprint inventory workflow"
          git push origin HEAD:work/gensrpg-phase6-survival-custom-enemy-refresh-2026-09-25
