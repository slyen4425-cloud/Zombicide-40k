name: Test V16.79.03 mobile stat and art
on:
  push:
    branches:
      - work/v16.79.03-mobile-stat-art-fix
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mobile stat/editor + art + safe import regression
        run: node tests/gens_stat_import_safety_v167902.test.cjs
      - name: Dynamic stat service
        run: node tests/gens_rpg_stat_service_v167901.test.cjs
      - name: Permanent inter-mode gate
        run: node tests/gens_ui_recovery_v167843.test.cjs
      - name: Dungeon runtime
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Authored Dungeon runtime
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Build final production page
        run: |
          rm -rf _site && mkdir -p _site
          cp index.html _site/index.html
          cp service-worker.js _site/service-worker.js
          mkdir -p _site/assets
          cp -R assets/. _site/assets/
          python3 tools/patch_generic_stat_grid_v167890.py _site/index.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('_site/index.html')
          h=p.read_text(encoding='utf-8')
          modules=[
            '<script src="assets/gensrpg/gens-rpg-stat-reconcile-167902.js?v=167902"></script>',
            '<script src="assets/gensrpg/gens-backup-import-safe-167902.js?v=167902"></script>',
            '<script src="assets/gensrpg/gens-custom-stats-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-stat-rules-help-167880.js?v=167880"></script>',
            '<script src="assets/gensrpg/gens-stat-help-extension-167881.js?v=167881"></script>',
            '<script src="assets/gensrpg/gens-custom-stat-runtime-profile-167889.js?v=167889"></script>'
          ]
          for tag in modules:
            if tag not in h:h=h.replace('</body>',tag+'\n</body>')
          p.write_text(h,encoding='utf-8')
          PY
      - name: Final site guards
        run: |
          node tests/gens_stat_import_safety_v167902.test.cjs
          node tests/gens_native_stat_grid_v167890.test.cjs _site/index.html
          node tests/dungeon_final_load_regression.test.cjs _site/index.html
          grep -q 'gens-rpg-stat-reconcile-167902.js?v=167902' _site/index.html
          grep -q 'gens-custom-stat-runtime-profile-167889.js?v=167889' _site/index.html
          grep -q 'gensrpg-cache-16.79.03-mobile-stat-art' _site/service-worker.js
