name: GenSrpG Phase5 openChar Core028 characterization

on:
  push:
    branches:
      - work/gensrpg-phase5-openchar-authority-preaudit-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-openchar-core028-characterize.yml

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact preaudit branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-openchar-authority-preaudit-2026-09-23

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Characterize openChar without Dungeon Core 0.28
        run: node tests/gens_phase5_openchar_core028_browser_characterization_v1.test.cjs
