name: Debug home UI freeze
on:
  push:
    branches:
      - debug/home-ui-freeze-2026-09-05
    paths-ignore:
      - diagnostics/**
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose index home navigation
        run: node tests/home_ui_freeze_diagnostic.cjs
      - name: Build compact diagnostic report
        if: always()
        run: node tests/home_ui_freeze_report.cjs
      - name: Commit diagnostic report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/home-ui-freeze-report.txt
          git diff --cached --quiet || git commit -m "Record home UI freeze diagnostic report"
          git push
