name: Phase 9 Capture pregame UI raccord one-shot

on:
  push:
    branches:
      - work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-03

permissions:
  contents: write

jobs:
  patch-runtime:
    if: ${{ github.event.head_commit.message == 'phase9 apply pregame UI runtime raccord once' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-03
          fetch-depth: 0

      - name: Apply exact pregame UI ownership seam
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');

          const path='index.html';
          let src=fs.readFileSync(path,'utf8');
          const beforeBytes=Buffer.from(src,'utf8');
          const beforeBlob=crypto.createHash('sha1')
            .update(Buffer.concat([Buffer.from('blob '+beforeBytes.length+'\0'),beforeBytes]))
            .digest('hex');
          if(beforeBytes.length!==8168810)throw new Error('unexpected pre-raccord size '+beforeBytes.length);
          if(beforeBlob!=='a5d337ae25435d801a72333ee27e6dbc390a5175')throw new Error('unexpected pre-raccord blob '+beforeBlob);

          const old137=`/* ---------- supprime réellement le morceau Aventure Dungeon en Capture ---------- */
          window.openSessionDungeonSetup=(function(old){
            return function(){
              if(typeof gensCapturePregameMode==="function"&&gensCapturePregameMode())return;
              return old.apply(this,arguments);
            };
          })(window.openSessionDungeonSetup);
          function cleanDungeonPregame137(){
            const capture=typeof gensCapturePregameMode==="function"&&gensCapturePregameMode();
            const btn=document.getElementById("sessionDungeonSetupBtn");
            const page=document.getElementById("sessionDungeonSetup");
            if(btn)btn.style.display=capture?"none":"";
            if(page&&capture)page.style.setProperty("display","none","important");
          }
          setTimeout(cleanDungeonPregame137,80);
          const update137=window.updateGameStyleUi;
          if(typeof update137==="function")window.updateGameStyleUi=function(){const r=update137.apply(this,arguments);cleanDungeonPregame137();return r};
          `;
          const new137=`/* ---------- garde Aventure Dungeon en Capture ---------- */
          window.openSessionDungeonSetup=(function(old){
            return function(){
              if(typeof gensCapturePregameMode==="function"&&gensCapturePregameMode())return;
              return old.apply(this,arguments);
            };
          })(window.openSessionDungeonSetup);
          `;

          const old138=`/* ---------- supprime vraiment Aventure Dungeon du flux Capture ---------- */
          window.captureCleanDungeonUi138=function(){
            const cap=isCaptureContext138();
            const btn=document.getElementById("sessionDungeonSetupBtn");
            const page=document.getElementById("sessionDungeonSetup");
            if(btn)btn.style.setProperty("display",cap?"none":"","important");
            if(page&&cap)page.style.setProperty("display","none","important");

            /* sécurité : aucun accès au bouton Aventure depuis la grille de session */
            const grid=document.querySelector(".sessionSetupGrid");
            if(grid&&cap){
              [...grid.querySelectorAll("button")].forEach(b=>{
                if(b.id==="sessionDungeonSetupBtn")b.style.setProperty("display","none","important");
              });
            }
          };
          const rps138=window.renderParticipantSelector;
          window.renderParticipantSelector=function(){const r=rps138.apply(this,arguments);captureCleanDungeonUi138();return r};
          const ugs138=window.updateGameStyleUi;
          if(typeof ugs138==="function")window.updateGameStyleUi=function(){const r=ugs138.apply(this,arguments);captureCleanDungeonUi138();return r};
          document.addEventListener("DOMContentLoaded",()=>setTimeout(captureCleanDungeonUi138,80));
          setTimeout(captureCleanDungeonUi138,200);
          `;
          const new138='/* ---------- UI Aventure Dungeon possédée par Capture139 ---------- */\n';

          function replaceOnce(text,before,after,label){
            const first=text.indexOf(before);
            if(first<0)throw new Error(label+' source not found');
            if(text.indexOf(before,first+1)>=0)throw new Error(label+' source not unique');
            return text.replace(before,after);
          }

          src=replaceOnce(src,old137,new137,'Capture137 cleanup');
          src=replaceOnce(src,old138,new138,'Capture138 cleanup');
          src=replaceOnce(src,'        captureCleanDungeonUi138();\n','', 'Capture138 residual cleanup call');

          fs.writeFileSync(path,src,'utf8');
          const bytes=fs.readFileSync(path);
          const blob=crypto.createHash('sha1')
            .update(Buffer.concat([Buffer.from('blob '+bytes.length+'\0'),bytes]))
            .digest('hex');
          if(bytes.length!==8167013)throw new Error('unexpected post-raccord size '+bytes.length);
          if(blob!=='40598938bc5211240cf2aa92442f59bc9d21f804')throw new Error('unexpected post-raccord blob '+blob);

          const oldBlob='a5d337ae25435d801a72333ee27e6dbc390a5175';
          const newBlob='40598938bc5211240cf2aa92442f59bc9d21f804';
          const oldSize='8168810';
          const newSize='8167013';

          function walk(dir,out=[]){
            for(const ent of fs.readdirSync(dir,{withFileTypes:true})){
              const p=dir+'/'+ent.name;
              if(ent.isDirectory())walk(p,out);
              else out.push(p);
            }
            return out;
          }

          let advanced=0;
          for(const p of walk('tests')){
            if(!/\.cjs$/.test(p))continue;
            let text=fs.readFileSync(p,'utf8');
            if(!text.includes(oldBlob))continue;
            text=text.split(oldBlob).join(newBlob);
            text=text.split(oldSize).join(newSize);
            fs.writeFileSync(p,text,'utf8');
            advanced++;
          }

          for(const p of [
            'docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv',
            'docs/GENSRPG_PHASE2_INLINE_OWNERS.json',
            'docs/GENSRPG_PHASE2_STORAGE_OWNERS.json',
            'docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json'
          ]){
            let text=fs.readFileSync(p,'utf8');
            if(text.includes(oldBlob)){
              text=text.split(oldBlob).join(newBlob);
              text=text.split(oldSize).join(newSize);
              fs.writeFileSync(p,text,'utf8');
            }
          }

          console.log(JSON.stringify({bytes:bytes.length,blob,advancedTestFingerprints:advanced}));
          NODE

      - name: Commit exact runtime and fingerprint transition
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json
          git diff --cached --quiet && { echo "No runtime change to commit"; exit 1; }
          git commit -m "runtime(phase9): consolidate Capture pregame UI ownership"
          git push origin HEAD:work/gensrpg-phase9-capture-pregame-ui-ownership-raccord-2026-10-03
