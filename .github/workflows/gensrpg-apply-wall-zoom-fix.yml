name: Apply validated GenSrpG wall zoom fix

on:
  push:
    branches:
      - 'work/gensrpg-wall-zoom-visual-proof-2026-09-16'
    paths:
      - '.github/workflows/gensrpg-apply-wall-zoom-fix.yml'

permissions:
  contents: write

jobs:
  apply-validated-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-wall-zoom-visual-proof-2026-09-16
          fetch-depth: 0

      - name: Installer Pillow
        run: python3 -m pip install --quiet pillow

      - name: Réencoder la texture et appliquer les deux raccords ciblés
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFile

          ImageFile.LOAD_TRUNCATED_IMAGES = True
          root = Path('.')
          src = root / 'assets/dungeon/creatures/dng_wall_block.jpg'
          dst = root / 'assets/dungeon/creatures/dng_wall_block.png'
          with Image.open(src) as im:
              im.load()
              im.convert('RGBA').save(dst, 'PNG', optimize=True)

          replacements = {
              'assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js': [
                  ('const WALL_ASSET="assets/dungeon/creatures/dng_wall_block.jpg";',
                   'const WALL_ASSET="assets/dungeon/creatures/dng_wall_block.png";'),
              ],
              'assets/gensrpg/gens-rpg-tactical-visual-dice-16781142.js': [
                  ('const WALL_ASSET="assets/dungeon/creatures/dng_wall_block.jpg";',
                   'const WALL_ASSET="assets/dungeon/creatures/dng_wall_block.png";'),
                  ('bonus=num(result.statDamageBonus,0),raw=Math.max(0,num(result.rawDamage,base+bonus)),armor=',
                   'bonus=num(result.statDamageBonus,0),raw=bonus?Math.max(0,Math.round(base+bonus)):Math.max(0,num(result.rawDamage,base)),armor='),
              ],
          }
          for rel, pairs in replacements.items():
              p = root / rel
              text = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{rel}: expected exactly one occurrence, found {count}: {old[:80]}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Vérifier le correctif d'explication dégâts
        run: node tests/gens_damage_explanation_consistency_v11411.test.cjs

      - name: Vérifier le PNG généré
        run: |
          python3 - <<'PY'
          from PIL import Image
          p='assets/dungeon/creatures/dng_wall_block.png'
          with Image.open(p) as im:
              im.verify()
          print('canonical wall PNG: OK')
          PY

      - name: Commit du correctif validé
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/dungeon/creatures/dng_wall_block.png assets/gensrpg/gens-rpg-tactical-combat-v2-ui.js assets/gensrpg/gens-rpg-tactical-visual-dice-16781142.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: stabilize canonical wall texture on Firefox zoom'
          git push origin HEAD:work/gensrpg-wall-zoom-visual-proof-2026-09-16
