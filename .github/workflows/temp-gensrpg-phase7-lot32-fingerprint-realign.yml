name: TEMP GenSrpG lot32 fingerprint realign

on:
  push:
    branches:
      - 'work/gensrpg-phase7-dungeon-generated-room-enemy-branch-normalization-audit-2026-09-30'

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bounded current-runtime fingerprint realignment
        run: python3 tools/temp_phase7_lot32_fingerprint_realign.py

      - name: Commit bounded guard and metadata realignment
        run: |
          if git diff --quiet; then
            echo "No fingerprint diff to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv docs/GENSRPG_PHASE2_INLINE_OWNERS.json docs/GENSRPG_PHASE2_STORAGE_OWNERS.json
          git commit -m 'test: realign current runtime guards to dc200Branch predicate blob'
          git push
