name: GenSrpG apply Phase4 asset resolver raccord

on:
  push:
    branches:
      - work/gensrpg-phase4-asset-resolver-2026-09-18
    paths:
      - .github/workflows/gensrpg-apply-phase4-asset-resolver-temp.yml

permissions:
  contents: write

jobs:
  apply-raccord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase4-asset-resolver-2026-09-18
          fetch-depth: 0

      - name: Apply exact Core asset resolver raccord
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          p=Path("index.html")
          data=p.read_bytes()

          def git_blob_sha(raw):
              return hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()

          before=git_blob_sha(data)
          expected_before="3a3db76d12ae511f6293e8ff25d124616731a08b"
          if before != expected_before:
              raise SystemExit(f"Refus: blob index avant patch {before} != {expected_before}")

          text=data.decode("utf-8")
          replacements=[
              (
                  '<script id="dungeonGithubArts164">',
                  '<script src="assets/gensrpg/core/asset-resolver-v1.js"></script>\n<script id="dungeonGithubArts164">'
              ),
              (
                  '<script id="dungeonGithubArts164">\n(function(){\n"use strict";\n\n/* V16.164',
                  '<script id="dungeonGithubArts164">\n(function(){\n"use strict";\nconst assetResolver164=window.GensAssetResolverV1;\nif(!assetResolver164)throw new Error("Core Asset Resolver V1 missing before dungeonGithubArts164");\nconst DUNGEON_CREATURE_ROOT_164="assets/dungeon/creatures/";\n\n/* V16.164'
              ),
              (
                  '  return "assets/dungeon/creatures/"+id+".png";',
                  '  return assetResolver164.join(DUNGEON_CREATURE_ROOT_164,id+".png");'
              ),
              (
                  '    z.art=custom || dungeonAutoArtPath164(id);',
                  '    z.art=assetResolver164.resolve({candidates:[custom],root:DUNGEON_CREATURE_ROOT_164,file:id+".png"});'
              ),
              (
                  '      return {...z,art:custom||dungeonAutoArtPath164(z.id)};',
                  '      return {...z,art:assetResolver164.resolve({candidates:[custom],root:DUNGEON_CREATURE_ROOT_164,file:String(z.id)+".png"})};'
              ),
              (
                  '<script id="dungeonArtRenderFix165">\n(function(){\n"use strict";\nconst artPath=id=>"assets/dungeon/creatures/"+String(id||"").trim()+".png";',
                  '<script id="dungeonArtRenderFix165">\n(function(){\n"use strict";\nconst assetResolver165=window.GensAssetResolverV1;\nif(!assetResolver165)throw new Error("Core Asset Resolver V1 missing before dungeonArtRenderFix165");\nconst DUNGEON_CREATURE_ROOT_165="assets/dungeon/creatures/";'
              ),
              (
                  '  return customOverride(id)||artPath(id);',
                  '  return assetResolver165.resolve({candidates:[customOverride(id)],root:DUNGEON_CREATURE_ROOT_165,file:String(id||"").trim()+".png"});'
              ),
              (
                  '<script id="dungeonDirectImageBinding166">\n(function(){\n"use strict";\n\n/* V16.166',
                  '<script id="dungeonDirectImageBinding166">\n(function(){\n"use strict";\nconst assetResolver166=window.GensAssetResolverV1;\nif(!assetResolver166)throw new Error("Core Asset Resolver V1 missing before dungeonDirectImageBinding166");\nconst DUNGEON_CREATURE_ROOT_166="assets/dungeon/creatures/";\n\n/* V16.166'
              ),
              (
                  'const dungeonPath166=id=>"assets/dungeon/creatures/"+String(id||"")+".png";\n',
                  ''
              ),
              (
                  '  return customArt166(id,def)||dungeonPath166(id);',
                  '  return assetResolver166.resolve({candidates:[customArt166(id,def)],root:DUNGEON_CREATURE_ROOT_166,file:String(id||"")+".png"});'
              ),
              (
                  '  const src=dungeonPath166(id);',
                  '  const src=assetResolver166.join(DUNGEON_CREATURE_ROOT_166,String(id||"")+".png");'
              )
          ]

          for old,new in replacements:
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f"Refus: motif attendu exactement 1 fois, trouvé {count}: {old[:100]!r}")
              text=text.replace(old,new,1)

          out=text.encode("utf-8")
          after=git_blob_sha(out)
          expected_after="7fd8cb20a4f20470262695eed37cacf324109501"
          print("before:",before)
          print("after :",after)
          if after != expected_after:
              raise SystemExit(f"Refus: blob final {after} != {expected_after}")

          p.write_bytes(out)
          PY

      - name: Validate exact diff
        shell: bash
        run: |
          git diff --check
          git diff --numstat -- index.html
          git diff -- index.html

      - name: Commit raccord and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/gensrpg-apply-phase4-asset-resolver-temp.yml
          git config user.name "gensrpg-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/gensrpg-apply-phase4-asset-resolver-temp.yml
          git commit -m "refactor: route Dungeon creature art through Core resolver"
          git push origin HEAD:work/gensrpg-phase4-asset-resolver-2026-09-18
