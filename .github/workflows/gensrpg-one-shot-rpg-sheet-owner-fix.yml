name: GenSrpG one-shot RPG sheet owner fix

on:
  push:
    branches:
      - 'work/gensrpg-rpg-sheet-shell-isolation-2026-09-19'

permissions:
  contents: write

jobs:
  patch-exact-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-rpg-sheet-shell-isolation-2026-09-19
          fetch-depth: 0

      - name: Verify exact source blob and make Dungeon sheet identity synchronous
        run: |
          set -euo pipefail
          before="$(git hash-object index.html)"
          test "$before" = "55453138449d07bde731ff6934acc442f56bae32"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='''function render(){
            setTimeout(()=>{try{applyDungeonSheetIdentity();renderDungeonHeroStats();renderDungeonSkillTree();updateDungeonSearchUi()}catch(e){}},0);
            const c=CHARS[current];'''
          new='''function render(){
            try{applyDungeonSheetIdentity();renderDungeonHeroStats();renderDungeonSkillTree();updateDungeonSearchUi()}catch(e){}
            const c=CHARS[current];'''
          if s.count(old)!=1:
              raise SystemExit(f"render owner marker count={s.count(old)}")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
          after="$(git hash-object index.html)"
          test "$after" = "d942934741ca200319de02116c4dd384722d39c7"

      - name: Commit exact patch and remove one-shot workflow
        run: |
          set -euo pipefail
          rm .github/workflows/gensrpg-one-shot-rpg-sheet-owner-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/gensrpg-one-shot-rpg-sheet-owner-fix.yml
          git commit -m "fix: render RPG sheet identity before first paint"
          git push origin HEAD:work/gensrpg-rpg-sheet-shell-isolation-2026-09-19
