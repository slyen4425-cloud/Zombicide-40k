name: GenSrpG one-shot Phase 6 builtin boundary

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-custom-enemy-builtin-boundary-2026-09-26

permissions:
  contents: write

jobs:
  apply-builtin-boundary:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Phase 6 builtin boundary patch
        run: python tools/gensrpg_phase6_apply_builtin_boundary.py

      - name: Verify only index runtime changed
        run: |
          git diff --check
          test "$(git diff --name-only)" = "index.html"

      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "runtime: isolate Survival builtin enemy boundary"
          git push origin HEAD:work/gensrpg-phase6-survival-custom-enemy-builtin-boundary-2026-09-26
