name: GenSrpG stats owner patch once

on:
  push:
    branches:
      - 'work/gensrpg-stats-consistency-reconnect-2026-09-16'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-existing-owners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Appliquer le raccord dans les propriétaires existants
        run: node tools/patch-stats-consistency-v11411.cjs
      - name: Vérifier Agilité et sémantique Base/Total avant commit
        run: |
          node tests/gens_agility_ranged_hit_attribution_v11411.test.cjs
          node tests/gens_stat_editor_game_display_semantics_v11411.test.cjs
      - name: Committer uniquement les trois propriétaires corrigés
        run: |
          if git diff --quiet -- assets/gensrpg/gens-rpg-stats-clean-167874.js assets/gensrpg/gens-rpg-tactical-combat-v2-adapter.js assets/gensrpg/gens-hero-editor-dynamic-167897.js; then
            echo "Aucun changement à committer"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gensrpg/gens-rpg-stats-clean-167874.js assets/gensrpg/gens-rpg-tactical-combat-v2-adapter.js assets/gensrpg/gens-hero-editor-dynamic-167897.js
          git commit -m "fix: reconnect canonical stat attribution and display"
          git push origin HEAD:${GITHUB_REF_NAME}
