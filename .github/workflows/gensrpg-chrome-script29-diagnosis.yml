name: GenSrpG Chrome Script 29 metadata diagnosis
on:
  push:
    branches:
      - work/gensrpg-chrome-script29-investigation-2026-10-24
    paths:
      - 'tests/gens_chrome_script29_map_20261024.cjs'
      - '.github/workflows/gensrpg-chrome-script29-diagnosis.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map-script-29:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Locate exact parser-stage 29 from checked-out production HTML
        run: node tests/gens_chrome_script29_map_20261024.cjs
      - name: Upload short script-stage mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-script29-map
          path: artifacts/gensrpg-chrome-script29-map.json
          if-no-files-found: warn
