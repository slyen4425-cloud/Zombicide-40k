name: Capture Lab Bridge Contract
on:
  push:
    branches:
      - 'work/gensrpg-capture-lab-bridge-*'
  pull_request:
    paths:
      - 'assets/gensrpg/integrations/lab-sync-coordinator-v1.js'
      - 'tests/gens_lab_sync_coordinator_v1.test.cjs'
      - 'assets/gensrpg/integrations/lab-version-sync-v1.js'
      - 'tests/gens_lab_version_sync_v1.test.cjs'
      - 'assets/gensrpg/capture/battle-bridge-contract-v1.js'
      - 'assets/gensrpg/capture/lab-ownership-port-v1.js'
      - 'tests/gens_capture_*bridge*.test.cjs'
      - 'tests/gens_capture_lab_ownership_port.test.cjs'
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Capture battle DTO
        run: node tests/gens_capture_lab_bridge_contract.test.cjs
      - name: Validate lab battle trigger and creature editor ownership
        run: node tests/gens_capture_lab_ownership_port.test.cjs

      - name: Validate pinned Combat and Exploration versions
        run: node tests/gens_lab_version_sync_v1.test.cjs
      - name: Validate two-lab update coordinator
        run: node tests/gens_lab_sync_coordinator_v1.test.cjs
