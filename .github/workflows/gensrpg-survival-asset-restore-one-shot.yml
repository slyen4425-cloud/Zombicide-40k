          301f9877ba86d8af874e7c0e90c0392e156b2c3dabcfb26a22ada8081f7d1d3a  assets/img_31_a7de1a50.jpg
          9d73b2a1a8965aaa696efc2f4511e4724b85d22e4d937304f7aa1d2d0d3c3a86  assets/img_32_29232d11.jpg
          EOF

          sed -i 's/^          //' /tmp/survival-assets.sha256
          sha256sum -c /tmp/survival-assets.sha256

      - name: Commit restored assets on the isolated work branch
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "No asset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img_*.png assets/img_*.jpg
          git commit -m "fix(survival): restore canonical built-in art files"
          git push origin HEAD:${GITHUB_REF_NAME}
