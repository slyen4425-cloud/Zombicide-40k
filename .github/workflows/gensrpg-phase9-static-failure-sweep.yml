name: GenSrpG Phase 9 static failure sweep

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-public-entry-raccord-2026-10-03'
    paths:
      - '.github/workflows/gensrpg-phase9-static-failure-sweep.yml'

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sweep all static architecture tests
        run: python tools/gensrpg_phase9_static_failure_sweep.py
