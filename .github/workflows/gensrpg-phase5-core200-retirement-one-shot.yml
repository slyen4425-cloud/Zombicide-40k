name: GenSrpG one-shot Core200 retirement

on:
  push:
    branches:
      - work/gensrpg-phase5-startconfiguredgame-core200-global-retirement-2026-09-24

permissions:
  contents: write

jobs:
  apply-core200-retirement:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact Core200 patch
        run: python tools/gensrpg_phase5_apply_core200_global_retirement.py

      - name: Verify retirement contract
        run: node tests/gens_phase5_startconfiguredgame_core200_global_retirement_v1.test.cjs

      - name: Commit runtime patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "runtime: retire Core200 startConfiguredGame global assignment"
          git push origin HEAD:work/gensrpg-phase5-startconfiguredgame-core200-global-retirement-2026-09-24
