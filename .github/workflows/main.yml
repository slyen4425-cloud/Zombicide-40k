# GenSrpG V16.78.74 restored visuals on clean stats base — 2026-09-08
name: Deploy GenSrpG to GitHub Pages

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Release builds for separate PRs must not cancel or block each other.
# Only deployments/updates of the same ref share a concurrency lock.
concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    # Playwright 1.57 Chromium is tested on Ubuntu 24.04; ubuntu-latest now
    # selects Ubuntu 26.04 where the browser installer fails before tests.
    # Pin CI OS only: does not touch the shipped game or any Lab pin.
    runs-on: ubuntu-24.04

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Tester la réparation automatique des profils Dungeon
        run: node tests/dungeon_profile_auto_repair.test.cjs

      - name: Tester la batterie Dungeon runtime complète
        run: node tests/dungeon_runtime_regression.test.cjs

      - name: Tester l'autorité unique World Builder et les vraies tailles
        run: node tests/dungeon_large_room_v167834.test.cjs

      - name: Tester le créateur de pièces Dungeon
        run: node tests/dungeon_room_creator_v1.test.cjs

      - name: Tester le créateur de pièces Dungeon V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs

      - name: Tester le constructeur de donjon Phase 3
        run: node tests/dungeon_world_builder_v167821.test.cjs

      - name: Tester l'intégration des pièces créées en partie Dungeon
        run: node tests/dungeon_room_runtime_v167822.test.cjs

      - name: Tester la sélection du moteur de Monde construit
        run: node tests/dungeon_world_session_bridge_v167832.test.cjs

      - name: Tester le moteur dédié et le mouvement du donjon construit
        run: node tests/dungeon_authored_runtime_v167839.test.cjs

      - name: Tester les liaisons secondaires et retours du donjon construit
        run: node tests/dungeon_zone_links_v167846.test.cjs

      - name: Tester le World Runtime historique de compatibilité
        run: node tests/dungeon_world_runtime_v167823.test.cjs

      - name: Tester le contenu exact par Zone
        run: node tests/dungeon_zone_content_v167824.test.cjs

      - name: Tester l'instanciation ennemie par salle
        run: node tests/dungeon_enemy_room_scope_v318.test.cjs

      - name: Bloquer les régressions d'interface et de cache
        run: node tests/gens_ui_recovery_v167843.test.cjs

      - name: Tester la mise à jour PWA Android et l'isolation des caches sans perte des sauvegardes
        run: |
          node --test tests/gensrpg_pwa_cache_isolation_20261107.test.cjs
          node --test tests/gensrpg_pwa_release_stamp_20261107.test.mjs

      - name: Tester les caractéristiques RPG dynamiques propres V16.78.73
        run: node tests/gens_clean_dynamic_stats_v167873.test.cjs

      - name: Tester la stabilité visuelle source Dungeon
        run: node tests/dungeon_source_render_stability_v167877.test.cjs

      - name: Tester la restauration des arts héros Dungeon
        run: node tests/gens_dungeon_hero_art_repair_v167874.test.cjs

      - name: Tester le profil mobile et la latence des combats V16.78.102.2
        run: node tests/gens_mobile_combat_performance_v16781022.test.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier la synchronisation atomique du Combat main
        run: |
          node --test tests/gens_capture_combat_main_autosync_20261030.test.mjs
          node --test tests/gens_capture_combat_autosync_workflow_20261030.test.cjs
          node --check tools/run_capture_combat_main_autosync.mjs
          node --test tests/gens_capture_combat_main_only_guard_20261030.test.cjs
          node --test tests/gens_official_lab_main_pin_history.test.mjs

      - name: Résoudre la version officielle immuable Capture / visuels (aucune synchronisation mouvante)
        id: capture_pages_pins
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import {COMBAT_LAB_SOURCE_V1} from './assets/gensrpg/capture/combat-lab-engine-loader-v1.mjs';
          import fs from 'node:fs';
          import {assertOfficialMainHistoryPin} from './tools/verify_official_main_pin.mjs';
          const manifest=JSON.parse(fs.readFileSync('docs/GENSRPG_CAPTURE_LAB_STAGED_FILES_2026-10-27.json','utf8'));
          if(COMBAT_LAB_SOURCE_V1.sha!==manifest.authoredSourceLabPin)throw Error('Conflicting pinned Combat authority');
          // Immutable approved releases stay valid AFTER new main commits.
          // Fetch ONLY refs/heads/main and reject branch-only / Pages SHAs.
          const proof=assertOfficialMainHistoryPin({
            repository:'slyen4425-cloud/GenSrpg_labo_combat_dynamique',
            sha:COMBAT_LAB_SOURCE_V1.sha
          });
          console.error('OFFICIAL_COMBAT_MAIN_HISTORY',JSON.stringify(proof));
          if(!/^[0-9a-f]{40}$/.test(manifest.authoredAssetsPin))throw Error('Unpinned official visuals');
          if(manifest.productionActivated!==false)throw Error('Capture Hub must remain dormant');
          console.log('combat='+COMBAT_LAB_SOURCE_V1.sha);
          console.log('visuals='+manifest.authoredAssetsPin);
          JS

      - name: Charger uniquement les modules officiels Capture au SHA épinglé
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.capture_pages_pins.outputs.combat }}
          path: combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo

      - name: Refuser Combat main sans le contrat de scène native déjà validé
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const scene = fs.readFileSync('combat-lab/src/ui/capture-combat-preview-v1.js','utf8');
          const combat = fs.readFileSync('combat-lab/src/ui/combat-2v2-test-ui.js','utf8');
          if (!scene.includes('embeddedBattle') || !combat.includes('embeddedBattle')) {
            throw new Error('Combat main lacks embeddedBattle native scene ownership; cannot ship GenSrpg without an unapproved gh-pages fallback');
          }
          JS
      - name: Charger uniquement le catalogue visuel officiel au SHA épinglé
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.capture_pages_pins.outputs.visuals }}
          path: combat-assets
          sparse-checkout: |
            data/assets/catalog

      - name: Préparer le site
        run: |
          rm -rf _site
          mkdir -p _site

          if [ -f "Z40K_GITHUB_PAGES_READY.zip" ]; then
            unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site
          fi

          cp -f index.html _site/index.html

          # Execute safe Dungeon profile reconciliation before any game scripts.
          python3 - <<'PY'
          from pathlib import Path
          index = Path('_site/index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<script src="assets/gensrpg/core/storage-v1.js"></script>'
          repair = '<script src="assets/gensrpg/core/dungeon-profile-auto-repair-v1.js?v=20261025"></script>'
          assert html.count(marker) == 1, 'Storage script marker missing or ambiguous'
          assert repair not in html, 'Duplicate auto repair script'
          index.write_text(html.replace(marker, repair + '\n' + marker, 1), encoding='utf-8')
          PY

          # Opt-in Chrome Android diagnostic is a separate URL, never injected
          # into normal index.html, with all three pieces installed atomically.
          if [ -f "diagnostic.html" ]; then
            test -f "diagnostic-shell.js"
            test -f "diagnostic-boot.js"
            cp -f diagnostic.html diagnostic-shell.js diagnostic-boot.js _site/
          fi

          # Optional read-only Dungeon profile diagnostic; not loaded by the game.
          if [ -f "dungeon-profiles-diagnostic.html" ]; then
            cp -f dungeon-profiles-diagnostic.html _site/dungeon-profiles-diagnostic.html
          fi

          # Opt-in, backed-up Chrome Dungeon profile repair page.
          if [ -f "dungeon-profiles-safe-repair.html" ]; then
            cp -f dungeon-profiles-safe-repair.html _site/dungeon-profiles-safe-repair.html
          fi

          # Standalone opt-in Capture 2v2 demonstration. Never injected in
          # index.html, never registered in the PWA and owns separate demo saves.
          if [ -f "capture-world-2v2-test.html" ]; then
            cp -f capture-world-2v2-test.html _site/capture-world-2v2-test.html
          fi

          if [ -f "manifest.webmanifest" ]; then
            cp -f manifest.webmanifest _site/manifest.webmanifest
          fi

          if [ -f "manifest.json" ]; then
            cp -f manifest.json _site/manifest.json
          fi

          if [ -f "service-worker.js" ]; then
            cp -f service-worker.js _site/service-worker.js
            # Nouveau worker à CHAQUE déploiement, jamais de branche mouvante.
            # _site est seul modifié ; aucun cache IndexedDB ni code source muté.
            node tools/version_pwa_release_worker.mjs _site/service-worker.js "$GITHUB_SHA"
          fi

          mkdir -p _site/icons

          if [ -f "icon-192.png" ]; then
            cp -f icon-192.png _site/icons/icon-192.png
          fi

          if [ -f "icon-512.png" ]; then
            cp -f icon-512.png _site/icons/icon-512.png
          fi

          for file in sound_*.mp3; do
            if [ -f "$file" ]; then
              cp -f "$file" _site/
            fi
          done

          if [ -d "assets" ]; then
            mkdir -p _site/assets
            cp -R assets/. _site/assets/
          fi

          echo ""
          echo "========================================="
          echo " CONTENU DU SITE À PUBLIER"
          echo "========================================="
          find _site -maxdepth 6 -type f | sort

          echo ""
          echo "========================================="
          echo " ASSETS DUNGEON"
          echo "========================================="
          find _site/assets/dungeon -type f 2>/dev/null | sort || true

          echo ""
          echo "========================================="
          echo " SONS"
          echo "========================================="
          ls -lh _site/sound_*.mp3 2>/dev/null || true

      - name: Charger les modules Dungeon externes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path("_site/index.html")
          modules = [
              (Path("_site/assets/gensrpg/core/storage-v1.js"), '<script src="assets/gensrpg/core/storage-v1.js"></script>', "GenSrpG Core storage service missing"),
              (Path("_site/assets/dungeon/dungeon-event-runtime-fix-167878.js"), '<script src="assets/dungeon/dungeon-event-runtime-fix-167878.js"></script>', "Dungeon event proximity fix missing"),
              (Path("_site/assets/dungeon/dungeon-core-318.js"), '<script src="assets/dungeon/dungeon-core-318.js"></script>', "Dungeon Core 3.18 asset missing"),
              (Path("_site/assets/dungeon/dungeon-large-room-support-167834.js"), '<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>', "Dungeon large-room support missing"),
              (Path("_site/assets/gensrpg/core/text-utils-v1.js"), '<script src="assets/gensrpg/core/text-utils-v1.js"></script>', "GenSrpG Core Text Utils v1 missing"),
              (Path("_site/assets/dungeon/dungeon-room-creator-100.js"), '<script src="assets/dungeon/dungeon-room-creator-100.js"></script>', "Room Creator asset missing"),
              (Path("_site/assets/dungeon/dungeon-room-creator-v2-167819.js"), '<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>', "Room Creator V2 asset missing"),
              (Path("_site/assets/dungeon/dungeon-room-creator-feedback-167821.js"), '<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>', "Room Creator autosave feedback missing"),
              (Path("_site/assets/dungeon/dungeon-world-builder-167821.js"), '<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>', "Dungeon World Builder Phase 3 asset missing"),
              (Path("_site/assets/dungeon/dungeon-room-runtime-167822.js"), '<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>', "Dungeon room runtime integration missing"),
              (Path("_site/assets/dungeon/dungeon-world-runtime-167823.js"), '<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>', "Dungeon compatibility World Runtime missing"),
              (Path("_site/assets/dungeon/dungeon-zone-content-167824.js"), '<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>', "Dungeon exact zone content missing"),
              (Path("_site/assets/dungeon/dungeon-authored-runtime-167839.js"), '<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167840"></script>', "Dedicated authored Dungeon movement runtime missing"),
              (Path("_site/assets/dungeon/dungeon-authored-cache-visual-167852.js"), '<script src="assets/dungeon/dungeon-authored-cache-visual-167852.js?v=167875"></script>', "Authored Dungeon runtime wall/token bridge missing"),
              (Path("_site/assets/dungeon/dungeon-source-render-stability-167877.js"), '<script src="assets/dungeon/dungeon-source-render-stability-167877.js?v=167877"></script>', "Dungeon source render stability missing"),
              (Path("_site/assets/dungeon/dungeon-equipment-ui.js"), '<script src="assets/dungeon/dungeon-equipment-ui.js"></script>', "Dungeon equipment UI bridge missing"),
              (Path("_site/assets/gensrpg/core/inventory-equipped-view-v1.js"), '<script src="assets/gensrpg/core/inventory-equipped-view-v1.js?v=1"></script>', "GenSrpG Core Inventory equipped view missing"),
              (Path("_site/assets/gensrpg/core/equipment-bonus-sets-v1.js"), '<script src="assets/gensrpg/core/equipment-bonus-sets-v1.js?v=1"></script>', "GenSrpG Core Equipment bonus + sets missing"),
              (Path("_site/assets/gensrpg/core/equipment-evolution-v1.js"), '<script src="assets/gensrpg/core/equipment-evolution-v1.js?v=1"></script>', "GenSrpG Core Equipment evolution missing"),
              (Path("_site/assets/dungeon/dungeon-equipment-hotfix-167817.js"), '<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>', "Dungeon equipment editor hotfix missing"),
              (Path("_site/assets/dungeon/dungeon-set-editor-167818.js"), '<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>', "Dungeon set editor missing"),
              (Path("_site/assets/gensrpg/gens-world-summary-167820.js"), '<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>', "GenSrpG live world summary module missing"),
              (Path("_site/assets/gensrpg/core/stats-normalization-v1.js"), '<script src="assets/gensrpg/core/stats-normalization-v1.js?v=1"></script>', "GenSrpG Core Stats normalization missing"),
              (Path("_site/assets/gensrpg/core/stats-value-engine-v1.js"), '<script src="assets/gensrpg/core/stats-value-engine-v1.js?v=1"></script>', "GenSrpG Core Stats value engine missing"),
              (Path("_site/assets/gensrpg/core/stats-hero-values-v1.js"), '<script src="assets/gensrpg/core/stats-hero-values-v1.js?v=1"></script>', "GenSrpG Core Stats hero values provider missing"),
              (Path("_site/assets/gensrpg/core/stats-modifier-provider-v1.js"), '<script src="assets/gensrpg/core/stats-modifier-provider-v1.js?v=1"></script>', "GenSrpG Core Stats modifier provider missing"),
              (Path("_site/assets/gensrpg/core/stats-derived-values-v1.js"), '<script src="assets/gensrpg/core/stats-derived-values-v1.js?v=1"></script>', "GenSrpG Core Stats derived values missing"),
              (Path("_site/assets/gensrpg/core/stats-snapshot-v1.js"), '<script src="assets/gensrpg/core/stats-snapshot-v1.js?v=1"></script>', "GenSrpG Core Stats snapshot missing"),
              (Path("_site/assets/gensrpg/gens-rpg-stats-clean-167874.js"), '<script src="assets/gensrpg/gens-rpg-stats-clean-167874.js?v=167874"></script>', "GenSrpG clean dynamic RPG stat module missing"),
              (Path("_site/assets/gensrpg/gens-dungeon-hero-art-repair-167874.js"), '<script src="assets/gensrpg/gens-dungeon-hero-art-repair-167874.js?v=167874"></script>', "Dungeon built-in hero art repair missing"),
              (Path("_site/assets/gensrpg/gens-mobile-combat-performance-16781022.js"), '<script src="assets/gensrpg/gens-mobile-combat-performance-16781022.js"></script>', "GenSrpG mobile combat performance module missing"),
              (Path("_site/assets/gensrpg/shell/module-launch-final-authority-v1.js"), '<script src="assets/gensrpg/shell/module-launch-final-authority-v1.js"></script>', "GenSrpG final Shell module launch authority missing"),
          ]
          html = index.read_text(encoding="utf-8")
          if "</body>" not in html:
              raise SystemExit("Cannot inject GenSrpG modules: </body> missing")
          # The performance bridge must stay immediately before the final Shell launch authority.
          # Remove both source tail tags first so Pages rebuilds the same canonical order.
          perf_tag = '<script src="assets/gensrpg/gens-mobile-combat-performance-16781022.js"></script>'
          final_shell_tag = '<script src="assets/gensrpg/shell/module-launch-final-authority-v1.js"></script>'
          html = html.replace(perf_tag + "\n", "").replace(perf_tag, "")
          html = html.replace(final_shell_tag + "\n", "").replace(final_shell_tag, "")
          for module, tag, error in modules:
              if not module.exists():
                  raise SystemExit(error)
              if tag not in html:
                  html = html.replace("</body>", tag + "\n</body>")
          index.write_text(html, encoding="utf-8")
          PY

      # Compatibility exception: this older test-only 2v2 URL still uses
      # the pinned author-inputs and Combat ESM graph. A separate migration
      # must validate a V2-only replacement before this delivery can retire.
      - name: Construire la livraison Capture officielle passive depuis le publisher unique
        run: node tools/stage_capture_lab_delivery.mjs combat-lab combat-assets _site

      - name: Vérifier les bytes, SHA, propriétaire et non-activation de la livraison Pages
        env:
          COMBAT_LAB_ROOT: ${{ github.workspace }}/combat-lab
          COMBAT_ASSETS_ROOT: ${{ github.workspace }}/combat-assets
          CAPTURE_LAB_DELIVERY_SITE: ${{ github.workspace }}/_site
        run: |
          node --test tests/gens_capture_lab_pages_pipeline_v1.test.cjs
          node --test tests/gens_capture_lab_delivery_v1.test.cjs
          node --test tests/gens_capture_lab_pages_site_v1.test.cjs
          node --test tests/gens_capture_official_hub_composition_v1.test.cjs
          node tests/gens_phase9_capture_exit_gate_evidence_v1.test.cjs

      - name: Tester le chargement réel mur HD et pions adaptatifs Dungeon
        run: node tests/dungeon_wall_visual_v167866.test.cjs _site/index.html

      - name: Tester le chargement final de la stabilité visuelle Dungeon
        run: node tests/dungeon_source_render_stability_v167877.test.cjs _site/index.html

      - name: Tester le chargement final des arts héros Dungeon
        run: node tests/gens_dungeon_hero_art_repair_v167874.test.cjs

      - name: Tester le chargement final Dungeon
        run: node tests/dungeon_final_load_regression.test.cjs _site/index.html

      - name: Vérifier le chargement final du correctif de combat mobile
        run: |
          grep -q 'gens-mobile-combat-performance-16781022.js' _site/index.html
          node tests/gens_mobile_combat_performance_v16781022.test.cjs _site/index.html

      - name: Tester le chargement final du moteur construit dédié
        run: |
          grep -q 'dungeon-world-runtime-167823.js?v=167838' _site/index.html
          grep -q 'dungeon-zone-content-167824.js?v=167824' _site/index.html
          grep -q 'dungeon-authored-runtime-167839.js?v=167840' _site/index.html
          grep -q 'dungeon-authored-cache-visual-167852.js?v=167875' _site/index.html
          grep -q 'dungeon-source-render-stability-167877.js?v=167877' _site/index.html
          grep -q 'gens-dungeon-hero-art-repair-167874.js?v=167874' _site/index.html
          grep -q 'dungeon-world-session-bridge-167832.js?v=167839' _site/assets/dungeon/dungeon-room-creator-feedback-167821.js
          grep -q 'gens-rpg-stats-clean-167874.js?v=167874' _site/index.html
          ! grep -q 'gens-custom-stats-167881' _site/index.html
          ! grep -q 'gens-rpg-stat-reconcile-167902' _site/index.html
          ! grep -q 'dungeon-grid-flicker-guard-167876.js?v=167876' _site/index.html
          grep -q 'gensrpg-cache-16.78.40-authored-movement' _site/service-worker.js
          grep -q 'gensrpg-cache-16.78.72-perceptual-actor-scale' _site/service-worker.js
          grep -q 'gensrpg-cache-16.78.73-clean-dynamic-stats' _site/service-worker.js
          grep -q 'gensrpg-cache-16.78.74-restored-visuals' _site/service-worker.js
          node tests/gens_clean_dynamic_stats_v167873.test.cjs
          node tests/dungeon_source_render_stability_v167877.test.cjs _site/index.html
          node tests/gens_dungeon_hero_art_repair_v167874.test.cjs
          node tests/dungeon_large_room_v167834.test.cjs
          node tests/dungeon_world_session_bridge_v167832.test.cjs _site/index.html
          node tests/dungeon_authored_runtime_v167839.test.cjs _site/index.html
          node tests/dungeon_zone_links_v167846.test.cjs
          node tests/dungeon_world_runtime_v167823.test.cjs _site/index.html

      - name: Tester le chargement final du Créateur V2
        run: node tests/dungeon_room_creator_v2_v167819.test.cjs _site/index.html

      - name: Tester le chargement final du Constructeur Phase 3
        run: node tests/dungeon_world_builder_v167821.test.cjs _site/index.html

      - name: Tester le chargement final de l'intégration des pièces
        run: node tests/dungeon_room_runtime_v167822.test.cjs _site/index.html

      - name: Tester le chargement final du contenu exact par Zone
        run: node tests/dungeon_zone_content_v167824.test.cjs _site/index.html

      - name: Tester le hotfix équipements Dungeon V16.78.17
        run: node tests/dungeon_equipment_ui_hotfix_v167817.test.cjs assets/dungeon/dungeon-equipment-ui.js assets/dungeon/dungeon-equipment-hotfix-167817.js _site/index.html

      - name: Tester l'éditeur de sets Dungeon V16.78.18
        run: node tests/dungeon_set_editor_v167818.test.cjs assets/dungeon/dungeon-set-editor-167818.js _site/index.html .github/workflows/main.yml service-worker.js

      - name: Tester les récapitulatifs de mondes V16.78.20
        run: node tests/gens_world_summary_v167820.test.cjs _site/index.html

      - name: Capture V2 release — TDD immutable selected-source Lab pins
        run: node --test tests/gens_capture_v2_pages_lab_pin_ownership_20261105.test.mjs
      - name: Monster Capture stats source — release candidate gate (TDD RED)
        run: node --test tests/gens_capture_v2_owned_stats_pages_promotion_20261105.test.mjs

      # Single publisher, isolated URL: the production root above remains
      # byte-for-byte unchanged by this candidate. Do not merge PR #225.
      - name: Resolve single official Capture V2 candidate SHA for preview
        id: preview_pin
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const pin=JSON.parse(fs.readFileSync('tools/capture_v2_pages_preview_pin.json','utf8'));
          if(pin.schema!=='gensrpg-capture-v2-pages-source-pin-v1'||
             pin.repository!=='slyen4425-cloud/Zombicide-40k'||
             pin.publicPath!=='/preview/capture-v2-pr225/'||
             !/^[a-f0-9]{40}$/.test(pin.sha))throw Error('Invalid canonical preview pin');
          console.log('sha='+pin.sha);
          JS
      - name: Checkout exact CI-verified GenSrpg Capture V2 candidate (preview ONLY)
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/Zombicide-40k
          ref: ${{ steps.preview_pin.outputs.sha }}
          path: capture-v2-source
      - name: Resolve official Combat and Exploration from selected Capture V2 source
        id: preview_labs
        run: node tools/resolve_capture_v2_preview_sources.mjs capture-v2-source/assets/gensrpg/capture-v2/source-pins-v1.json >> "$GITHUB_OUTPUT"

      # Production Combat uses an earlier certified version. NEVER replace its
      # checkout while composing this independent test-only subtree.
      - name: Checkout approved Combat main for isolated Capture V2 preview
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.preview_labs.outputs.combat }}
          path: preview-combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
            assets/runtime/audio

      - name: Checkout approved Exploration main for isolated Capture V2 preview
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/laboratoire_dynamique_exploration-
          ref: ${{ steps.preview_labs.outputs.exploration }}
          path: preview-exploration-lab
          sparse-checkout: |
            src
            assets
            index.html
            builder.html
            world-assembler.html
            sculpt-lab.html
            play.html
            manifest.webmanifest
            scripts
            integration/combat-bridge

      - name: Checkout exact approved Combat visual media for native encounter
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: aded6a9bc571dd1dd557889d35ad4e513f6f27dd
          path: preview-combat-assets
          sparse-checkout: |
            data/assets/catalog

      - name: Stage isolated native preview under the existing Pages owner
        run: |
          test "$(git -C capture-v2-source rev-parse HEAD)" = "${{ steps.preview_pin.outputs.sha }}"
          test "$(git -C preview-combat-lab rev-parse HEAD)" = "${{ steps.preview_labs.outputs.combat }}"
          test "$(git -C preview-exploration-lab rev-parse HEAD)" = "${{ steps.preview_labs.outputs.exploration }}"
          node --check tools/stage_capture_v2_pages_preview.mjs
          node tools/stage_capture_v2_pages_preview.mjs capture-v2-source preview-combat-lab preview-exploration-lab _site preview-combat-assets
          # Execute the unit tests from the EXACT pinned Capture source, not the old main.
          node --test capture-v2-source/tests/gens_capture_v2_adventure_save_defeat_policy_20261107.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_result_world_archive_20261107.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_adventure_portfolio_v1.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_adventure_contract_v1.test.mjs
          node --test tests/gens_capture_v2_isolated_pages_preview.test.cjs
          node --test tests/gens_capture_v2_encounter_bridge_site.test.cjs

      - name: Auditer taille réelle et duplication du site avant toute publication
        env:
          GENSRPG_REQUIRE_PAGES_SITE: '1'
        run: |
          node --test tests/gensrpg_pages_no_legacy_combat_copy.test.cjs
          node --test tests/gensrpg_pages_release_budget.test.cjs
          node --test tests/gens_capture_lab_pages_pipeline_v1.test.cjs

      - name: Install Chromium for real nested Capture V2 browser proof
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 pngjs@7.0.0
          npx playwright install chromium

      - name: Test real native Combat arena and Exploration 2.5D at Pages nested URL
        run: node --test tests/gens_capture_v2_isolated_pages_browser.test.cjs

      - name: Tester checkout de la preuve HTTPS dans le runner Pages distinct
        run: node --test tests/gens_capture_v2_pages_deploy_checkout.test.cjs

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer le site comme artifact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Independent PR review GATE of the exact same preview assembly. This is
  # not a publisher: only the original build+deploy job may update Pages.
  # It stays testable while production's older Combat pin is separately
  # recertified through its existing official auto-sync candidate PR.
  capture-preview-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture V2 release — TDD immutable selected-source Lab pins
        run: node --test tests/gens_capture_v2_pages_lab_pin_ownership_20261105.test.mjs
      - name: Monster Capture stats source — release candidate gate (TDD RED)
        run: node --test tests/gens_capture_v2_owned_stats_pages_promotion_20261105.test.mjs

      - name: Establish unchanged stable root as browser-test baseline
        run: |
          mkdir -p _site
          cp index.html service-worker.js manifest.webmanifest _site/
          node --check tools/stage_capture_v2_pages_preview.mjs
      - name: Resolve the single immutable candidate release pin
        id: preview_pin
        run: |
          node - <<'JS' >> "$GITHUB_OUTPUT"
          const fs=require('node:fs');
          const pin=JSON.parse(fs.readFileSync('tools/capture_v2_pages_preview_pin.json','utf8'));
          if(pin.schema!=='gensrpg-capture-v2-pages-source-pin-v1'||
             pin.repository!=='slyen4425-cloud/Zombicide-40k'||
             pin.publicPath!=='/preview/capture-v2-pr225/'||
             !/^[a-f0-9]{40}$/.test(pin.sha))throw Error('Invalid review SHA');
          console.log('sha='+pin.sha);
          JS
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/Zombicide-40k
          ref: ${{ steps.preview_pin.outputs.sha }}
          path: capture-v2-source
      - name: Resolve official Combat and Exploration from selected Capture V2 source
        id: preview_labs
        run: node tools/resolve_capture_v2_preview_sources.mjs capture-v2-source/assets/gensrpg/capture-v2/source-pins-v1.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: ${{ steps.preview_labs.outputs.combat }}
          path: preview-combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
            assets/runtime/audio
      - uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/laboratoire_dynamique_exploration-
          ref: ${{ steps.preview_labs.outputs.exploration }}
          path: preview-exploration-lab
          sparse-checkout: |
            src
            assets
            index.html
            builder.html
            world-assembler.html
            sculpt-lab.html
            play.html
            manifest.webmanifest
            scripts
            integration/combat-bridge
      - name: Checkout exact approved Combat visual media for native encounter
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: aded6a9bc571dd1dd557889d35ad4e513f6f27dd
          path: preview-combat-assets
          sparse-checkout: |
            data/assets/catalog

      - name: Build the physical Pages subdirectory from the three official SHAs
        run: |
          node tools/stage_capture_v2_pages_preview.mjs capture-v2-source preview-combat-lab preview-exploration-lab _site preview-combat-assets
          # Execute the unit tests from the EXACT pinned Capture source, not the old main.
          node --test capture-v2-source/tests/gens_capture_v2_adventure_save_defeat_policy_20261107.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_result_world_archive_20261107.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_adventure_portfolio_v1.test.mjs
          node --test capture-v2-source/tests/gens_capture_v2_adventure_contract_v1.test.mjs
          node --test tests/gens_capture_v2_isolated_pages_preview.test.cjs
          node --test tests/gens_capture_v2_encounter_bridge_site.test.cjs
      - name: Install Chromium and verify the real nested site
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 pngjs@7.0.0
          npx playwright install chromium
          node --test tests/gens_capture_v2_isolated_pages_browser.test.cjs
      - name: Keep the self-contained tested preview as a review artifact only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: capture-v2-isolated-preview-review-${{ github.sha }}
          path: _site/preview/capture-v2-pr225/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # The deploy job runs on a new runner. It never inherits the source
      # checkout performed by build; the live proof reads our single version
      # pin from this exact published commit, not from a moving branch.
      - name: Checkout exact published source for HTTPS proof
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify actual HTTPS preview provenance and untouched production root
        run: |
          set -eu
          base="https://slyen4425-cloud.github.io/Zombicide-40k"
          dir="/tmp/capture-v2-pages-check"
          mkdir -p "$dir"
          # The successful Pages deploy API is NOT proof that the intended
          # immutable candidate and original Labs are what HTTPS now serves.
          curl -fsSL --retry 15 --retry-all-errors --retry-delay 3 \
            "$base/preview/capture-v2-pr225/release-provenance.v1.json?build=$GITHUB_RUN_ID" \
            -o "$dir/release.json"
          for file in \
            "index.html" \
            "bridge-transport-manifest.v1.json" \
            "assets/gensrpg/capture-v2/delivery-manifest.json" \
            "vendor/exploration-lab/combat-preview/examples/dom-demo/exploration-encounter.html" \
            "vendor/exploration-lab/combat-preview/examples/dom-demo/exploration-encounter.js" \
            "vendor/exploration-lab/combat-preview/data/capture/showcase/encounter-bundle.v1.json" \
            "vendor/exploration-lab/capture-assets/data/assets/catalog/global-visual-assets.v1.json" \
            "vendor/combat-lab/examples/dom-demo/capture-editor-v2.html" \
            "vendor/exploration-lab/sculpt-lab.html" \
            "vendor/exploration-lab/src/sculpt-lab-main.js"; do
            mkdir -p "$dir/preview/$(dirname "$file")"
            curl -fsSL --retry 15 --retry-all-errors --retry-delay 3 \
              "$base/preview/capture-v2-pr225/$file?build=$GITHUB_RUN_ID" \
              -o "$dir/preview/$file"
          done
          curl -fsSL --retry 15 --retry-all-errors --retry-delay 3 \
            "$base/index.html?build=$GITHUB_RUN_ID" -o "$dir/root-index.html"
          node - "$dir" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto');
          const folder=process.argv[2],bytes=p=>fs.readFileSync(path.join(folder,p));
          const hash=x=>crypto.createHash('sha256').update(x).digest('hex');
          const release=JSON.parse(bytes('release.json'));
          const manifestBytes=bytes('preview/assets/gensrpg/capture-v2/delivery-manifest.json');
          const delivery=JSON.parse(manifestBytes);
          const bridgeBytes=bytes('preview/bridge-transport-manifest.v1.json');
          const bridge=JSON.parse(bridgeBytes);
          const pin=JSON.parse(fs.readFileSync('tools/capture_v2_pages_preview_pin.json','utf8'));
          if(release.schema!=='gensrpg-capture-v2-isolated-pages-preview-v1'||
             release.source.commit!==pin.sha||
             release.productionRootSha256!==hash(bytes('root-index.html'))||
             release.previewIndexSha256!==hash(bytes('preview/index.html'))||
             release.deliveryManifestSha256!==hash(manifestBytes)||
             release.encounterBridgeManifestSha256!==hash(bridgeBytes)||
             bridge.schema!=='gensrpg-capture-v2-native-encounter-transport-v1'||
             bridge.combat.sha!==release.combat.sha||
             bridge.exploration.sha!==release.exploration.sha||
             bridge.legacyCaptureRuntime!==false||
             !bytes('preview/vendor/exploration-lab/combat-preview/examples/dom-demo/exploration-encounter.html').toString('utf8').includes('./exploration-encounter.js')||
             !bytes('preview/vendor/exploration-lab/combat-preview/examples/dom-demo/exploration-encounter.js').toString('utf8').includes('mountCoop2v2Test')||
             release.combat.sha!==delivery.combat.sha||
             release.exploration.sha!==delivery.exploration.sha||
             release.legacyCaptureRuntime!==false||delivery.legacyCaptureRuntime!==false)
            throw Error('LIVE HTTPS failed immutable Capture V2 and root integrity gate');
          const html=bytes('preview/index.html').toString('utf8');
          if(!html.includes('assets/gensrpg/capture-v2/shell-entry-v1.js'))
            throw Error('Live Capture V2 shell unavailable');
          console.log('VERIFIED live same-origin preview:',release.publicPath,
            'Capture:',release.source.commit,
            'Combat:',release.combat.sha,
            'Exploration:',release.exploration.sha);
          JS
