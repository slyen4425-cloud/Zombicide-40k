name: Apply V16.78.44 authored content corrections
on:
  push:
    branches:
      - work/dungeon-v16.78.44-authored-content-fixes-2026-09-05
    paths:
      - .github/workflows/apply-v167844-authored-content-fixes.yml
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch authored Dungeon content natively
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path): return Path(path).read_text(encoding='utf-8')
          def save(path,text): Path(path).write_text(text,encoding='utf-8')
          def rep(text,old,new,label):
              n=text.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 exact match, got {n}')
              return text.replace(old,new)
          def sub(text,pattern,new,label,flags=re.S):
              out,n=re.subn(pattern,new,text,count=1,flags=flags)
              if n!=1: raise SystemExit(f'{label}: expected 1 regex match, got {n}')
              return out

          # 1) Exact zone content: monster HP authority, hidden traps, exact chest UI, target-linked puzzles.
          path='assets/dungeon/dungeon-zone-content-167824.js'; s=load(path)
          s=rep(s,'const VERSION="1.0.0";\nconst APP_VERSION="16.78.24";','const VERSION="1.2.0";\nconst APP_VERSION="16.78.44";','zone version')
          s=rep(s,'hasKey:!!x?.hasKey,hp:Number.isFinite(Number(x?.hp))?Math.max(1,Number(x.hp)):null','hasKey:!!x?.hasKey','remove authored HP override')
          s=rep(s,'targetType:String(x?.targetType||"cell"),label:String(x?.label||"")','targetType:String(x?.targetType||"cell"),targetIndex:Number.isFinite(Number(x?.targetIndex))?Math.max(0,Math.trunc(Number(x.targetIndex))):Math.max(0,Math.trunc(Number(x?.cell)||0)),label:String(x?.label||"")','puzzle target index')
          s=rep(s,' updatedAt:String(r.updatedAt||"")\n}}',' templateRoomId:String(r.templateRoomId||""),\n templateLinked:r.templateLinked===true?true:r.templateLinked===false?false:null,\n updatedAt:String(r.updatedAt||"")\n}}','template metadata')
          s=rep(s,'function writeJson(key,v){localStorage.setItem(key,JSON.stringify(v));return v}\n','function writeJson(key,v){localStorage.setItem(key,JSON.stringify(v));return v}\nfunction scrubLegacyEnemyHp(){const all=readJson(CONTENT_KEY,{});if(!all||typeof all!=="object"||Array.isArray(all))return false;let changed=false;for(const dungeon of Object.values(all)){if(!dungeon||typeof dungeon!=="object")continue;for(const zone of Object.values(dungeon)){if(!zone||typeof zone!=="object"||!Array.isArray(zone.enemies))continue;for(const enemy of zone.enemies){if(enemy&&Object.prototype.hasOwnProperty.call(enemy,"hp")){delete enemy.hp;changed=true}}}}if(changed)writeJson(CONTENT_KEY,all);return changed}\n','legacy HP scrub')
          s=sub(s,r'function spawnEnemy\(enemyId,qty,room,cell,hp\)\{.*?\}\nfunction clearDynamicMarkers','function spawnEnemy(enemyId,qty,room,cell){const ids=[];for(let i=0;i<qty;i++){let made=[];try{made=ROOT.trackSpawnedEnemyInstances?.(enemyId,1,room)||[]}catch(e){}for(const id of made){ids.push(String(id));try{const all=ROOT.loadActiveEnemies?.()||[],inst=all.find(e=>String(e?.id)===String(id));if(inst){inst.dungeonRoom=Number(room);ROOT.saveActiveEnemies?.(all)}}catch(e){}}}return ids}\nfunction clearDynamicMarkers','spawn keeps bestiary HP')
          s=sub(s,r'function syncMapMarkers\(x,content\)\{.*?\}\nfunction persistSpatial','function syncMapMarkers(x,content){const map=x?.last?.map;if(!map?.cells)return;if(content.mode==="fixed")clearDynamicMarkers(map);for(const e of content.enemies)putMarker(map,e.cell,e.role==="boss"?"boss":"enemy");for(const c of content.chests)putMarker(map,c.cell,"chest");for(const p of content.puzzles)if(String(p?.targetType||"cell")==="cell")putMarker(map,p.cell,"puzzle");for(const n of content.npcs)putMarker(map,n.cell,"npc");for(const it of content.items)putMarker(map,it.cell,"item")}\nfunction persistSpatial','hide trap and attached puzzle markers')
          s=rep(s,'spawnEnemy(spec.enemyId,spec.qty,room,cell,spec.hp)','spawnEnemy(spec.enemyId,spec.qty,room,cell)','spawn call')
          s=rep(s,'persistSpatial(x);writeRuntime(x);return true}\nfunction inventoryState','persistSpatial(x);writeRuntime(x);cleanLegacyChestCards();return true}\nfunction inventoryState','clean authored cards after apply')
          helper='''function authoredActive(x){const rt=x||readRuntime();return !!rt?.last?.authoredRuntime167839}\nfunction cleanLegacyChestCards(){if(!DOC||!authoredActive())return 0;let removed=0;for(const card of Array.from(DOC.querySelectorAll?.("#dc200Scene .dc200SceneCard")||[])){if(!String(card?.textContent||"").toLowerCase().includes("coffre"))continue;try{card.remove()}catch(e){if(card?.style)card.style.display="none"}removed++}return removed}\nfunction puzzleTargetCell(p){const type=String(p?.targetType||"cell");const explicit=Number(p?.targetIndex);return (type==="door"||type==="chest")&&Number.isFinite(explicit)?Math.max(0,Math.trunc(explicit)):Math.max(0,Math.trunc(Number(p?.cell)||0))}\nfunction findBlockingPuzzle(ctx,targetType,cell){if(!ctx)return null;const type=String(targetType||"cell"),idx=Math.max(0,Math.trunc(Number(cell)||0));return (ctx.content?.puzzles||[]).find(p=>String(p?.targetType||"cell")===type&&puzzleTargetCell(p)===idx&&!ctx.state?.solvedPuzzles?.[p.id])||null}\nfunction blockingPuzzleAt(targetType,cell){const p=findBlockingPuzzle(currentContext(),targetType,cell);return p?clone(p):null}\nfunction puzzleBlockNotice(p,target){try{ROOT.modal?.("❓ Énigme requise","Résous d’abord "+(p?.label||"l’énigme")+" liée "+target+".")}catch(e){try{ROOT.showToast?.("❓ Résous d’abord l’énigme liée "+target)}catch(_){}}}\n'''
          s=rep(s,'function markCellFloor(x,cell){if(x?.last?.map?.cells?.[cell]&&!["entry","exit","wall"].includes(String(x.last.map.cells[cell])))x.last.map.cells[cell]="floor"}\n','function markCellFloor(x,cell){if(x?.last?.map?.cells?.[cell]&&!["entry","exit","wall"].includes(String(x.last.map.cells[cell])))x.last.map.cells[cell]="floor"}\n'+helper,'zone authored helpers')
          s=sub(s,r'function openChest\(chestId\)\{.*?\}\nfunction pickItem','''function openChest(chestId){const ctx=currentContext();if(!ctx||!ctx.hero)return false;const chest=ctx.content.chests.find(c=>c.id===String(chestId));if(!chest||ctx.state.openedChests[chest.id])return false;const lock=findBlockingPuzzle(ctx,"chest",chest.cell);if(lock){puzzleBlockNotice(lock,"à ce coffre");return false}grantRewards(ctx.hero,chest.gold,chest.items);ctx.state.openedChests[chest.id]=true;markCellFloor(ctx.x,chest.cell);persistSpatial(ctx.x);writeRuntime(ctx.x);try{ROOT.showToast?.("🎁 Coffre ouvert · "+chest.gold+" or · "+chest.items.reduce((n,i)=>n+i.qty,0)+" objet(s)")}catch(e){}try{ROOT.DungeonCore01?.render?.()}catch(e){}return true}\nfunction pickItem''','chest puzzle gate')
          s=rep(s,'ctx.state.solvedPuzzles[p.id]=true;writeRuntime(ctx.x);return true}','ctx.state.solvedPuzzles[p.id]=true;writeRuntime(ctx.x);try{ROOT.DungeonCore01?.render?.()}catch(e){}return true}','refresh after puzzle')
          s=sub(s,r'function ensureInteractionPanel\(\)\{.*?\}\nfunction wrapCore','''function ensureInteractionPanel(){if(!DOC)return;const old=DOC.getElementById("dzc167824Actions"),ctx=currentContext();if(!ctx?.hero){old?.remove();return}const pos=Number(ctx.x.positions?.[ctx.hero]),actions=[];for(const c of ctx.content.chests)if(c.cell===pos&&!ctx.state.openedChests[c.id]&&!findBlockingPuzzle(ctx,"chest",c.cell))actions.push('<button type="button" onclick="DungeonZoneContent167824.openChest(\\''+esc(c.id)+'\\')">🎁 Ouvrir '+esc(c.label||("coffre "+c.rarity))+'</button>');for(const i of ctx.content.items)if(i.cell===pos&&!ctx.state.pickedItems[i.id])actions.push('<button type="button" onclick="DungeonZoneContent167824.pickItem(\\''+esc(i.id)+'\\')">📦 Ramasser '+esc(i.label||i.itemId)+'</button>');for(const p of ctx.content.puzzles)if(puzzleTargetCell(p)===pos&&!ctx.state.solvedPuzzles[p.id])actions.push('<button type="button" onclick="DungeonZoneContent167824.solvePuzzle(\\''+esc(p.id)+'\\')">❓ Résoudre '+esc(p.label||"l’énigme")+'</button>');for(const n of ctx.content.npcs)if(n.cell===pos)actions.push('<button type="button" onclick="DungeonZoneContent167824.talkNpc(\\''+esc(n.id)+'\\')">🧑 Parler à '+esc(n.label||n.npcId||"PNJ")+'</button>');if(!actions.length){old?.remove();return}let box=old;if(!box){box=DOC.createElement("div");box.id="dzc167824Actions";box.style.cssText="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0";const anchor=DOC.getElementById("dc01Explore")||DOC.getElementById("dc047RoomBoard");anchor?.parentNode?.insertBefore(box,anchor)}if(box)box.innerHTML=actions.join("")}\nfunction wrapCore''','interaction target routing')
          s=sub(s,r'function wrapCore\(\)\{.*?\}\n\nfunction parseRewardItems','''function wrapCore(){const core=ROOT.DungeonCore01;if(!core)return false;if(typeof core.explore==="function"&&!core.explore.__dzc167824){const old=core.explore.bind(core),w=function(){const out=old(...arguments);try{applyCurrentZone()}catch(e){console.warn("Zone content apply",e)}try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core.explore=w}for(const name of ["render","show"]){const old=core[name];if(typeof old!=="function"||old.__dzc167824)continue;const w=function(){const out=old.apply(this,arguments);try{autoTrap();cleanLegacyChestCards();ensureInteractionPanel()}catch(e){}return out};w.__dzc167824=true;w.__dzc167824Original=old;core[name]=w}return true}\n\nfunction parseRewardItems''','core authored cleanup wrappers')
          s=rep(s,'function install(){if(installing)return false;installing=true;try{ROOT.GENSRPG_VERSION=APP_VERSION;ensureStyles();ensureModal();ensureLauncher();wrapCore();return true}finally{installing=false}}','function install(){if(installing)return false;installing=true;try{ROOT.GENSRPG_VERSION=APP_VERSION;scrubLegacyEnemyHp();ensureStyles();ensureModal();ensureLauncher();wrapCore();cleanLegacyChestCards();return true}finally{installing=false}}','zone install migration')
          s=rep(s,'ROOT.DungeonZoneContent167824={VERSION,APP_VERSION,CONTENT_KEY,normalizeContent,getZoneContent,saveZoneContent,applyCurrentZone,openChest,pickItem,triggerTrap,solvePuzzle,talkNpc,parseRewardItems,rewardItemsText,open,close,install,renderEditor,addEnemy,addChest,addTrap,addPuzzle,addItem,addNpc,remove};','ROOT.DungeonZoneContent167824={VERSION,APP_VERSION,CONTENT_KEY,normalizeContent,scrubLegacyEnemyHp,getZoneContent,saveZoneContent,applyCurrentZone,openChest,pickItem,triggerTrap,solvePuzzle,talkNpc,puzzleTargetCell,blockingPuzzleAt,cleanLegacyChestCards,parseRewardItems,rewardItemsText,open,close,install,renderEditor,addEnemy,addChest,addTrap,addPuzzle,addItem,addNpc,remove};','zone API exports')
          save(path,s)

          # 2) Visual zone editor: no HP override; explicit per-zone edits break template linkage; puzzle target is selected by object.
          path='assets/dungeon/dungeon-room-visual-config-167826.js'; s=load(path)
          s=rep(s,'const VERSION="1.1.0",APP_VERSION="16.78.26";','const VERSION="1.2.0",APP_VERSION="16.78.44",TEMPLATE_DUNGEON_ID="__room_template__";','visual version')
          s=rep(s,'const content=clone(getContent(dungeonId,nodeId));if(content.mode==="inherit")content.mode="fixed";','const content=clone(getContent(dungeonId,nodeId));if(content.mode==="inherit")content.mode="fixed";if(String(dungeonId)!==TEMPLATE_DUNGEON_ID){content.templateRoomId=String(roomId||"");content.templateLinked=false}','visual explicit override marker')
          s=rep(s,'hasKey:!!data?.hasKey,hp:Number(data?.hp)>0?Number(data.hp):null','hasKey:!!data?.hasKey','visual remove HP')
          s=rep(s,'targetType:String(data?.targetType||"cell"),label:String(data?.label||"")','targetType:String(data?.targetType||"cell"),targetIndex:Number.isFinite(Number(data?.targetIndex))?Math.max(0,Math.trunc(Number(data.targetIndex))):idx,label:String(data?.label||"")','visual puzzle target index')
          s=rep(s,'function removeElement(dungeonId,nodeId,cell,obj){const content=clone(getContent(dungeonId,nodeId)),idx=Number(cell),next=','function removeElement(dungeonId,nodeId,cell,obj){const content=clone(getContent(dungeonId,nodeId));if(String(dungeonId)!==TEMPLATE_DUNGEON_ID){content.templateLinked=false}const idx=Number(cell),next=','visual remove marks override')
          s=rep(s,'function setMode(mode){const c=currentContext();if(!c)return false;const content=clone(getContent(c.dungeonId,c.nodeId));content.mode=','function setMode(mode){const c=currentContext();if(!c)return false;const content=clone(getContent(c.dungeonId,c.nodeId));content.templateLinked=false;content.mode=','visual mode marks override')
          target_helpers='''function puzzleTargetChoices(room,type){const out=[],t=String(type||"cell");let chestNo=0;for(let i=0;i<(room?.cells||[]).length;i++){const c=room.cells[i];if(c?.terrain==="wall")continue;if(t==="cell")out.push({index:i,label:"Case "+(i+1)});else if(t==="door"&&(c?.object==="entry"||c?.object==="exit"))out.push({index:i,label:c.object==="entry"?"Porte d’entrée":"Porte de sortie"});else if(t==="chest"&&c?.object==="chest")out.push({index:i,label:"Coffre "+(++chestNo)})}return out}\nfunction refreshPuzzleTargets(room,value){const type=String(DOC?.getElementById("drv167826Target")?.value||"cell"),sel=DOC?.getElementById("drv167826TargetIndex");if(!sel)return;const list=puzzleTargetChoices(room,type);sel.innerHTML=list.length?list.map(x=>'<option value="'+x.index+'" '+(Number(value)===x.index?'selected':'')+'>'+esc(x.label)+'</option>').join(""):'<option value="">Aucune cible disponible</option>'}\n'''
          s=rep(s,'function openEditor(cell,obj){\n',target_helpers+'function openEditor(cell,obj){\n','visual target helpers')
          s=sub(s,r'if\(obj==="enemy"\|\|obj==="boss"\)body=.*?;\n  else if\(obj==="chest"\)', 'if(obj==="enemy"||obj==="boss")body=\'<label>Monstre<select id="drv167826Enemy">\'+enemyOptions(String(old?.enemyId||"dng_skeleton"))+\'</select></label><label>Quantité<input id="drv167826Qty" type="number" min="1" max="50" value="\'+Number(old?.qty||1)+\'"></label><label style="align-content:end"><span><input id="drv167826Key" type="checkbox" \'+(old?.hasKey?\'checked\':\'\')+\'> Porte la clé</span></label>\';\n  else if(obj==="chest")','visual enemy editor no HP')
          s=rep(s,'else if(obj==="puzzle")body=\'<label class="drv167826Full">Énigme existante<input id="drv167826PuzzleRef" value="\'+esc(old?.refId||\'\')+\'" placeholder="ID de l’énigme"></label><label>Cible<select id="drv167826Target"><option value="cell">Case</option><option value="door">Porte</option><option value="chest">Coffre</option></select></label><label>Nom / note<input id="drv167826PuzzleLabel" value="\'+esc(old?.label||\'\')+\'"></label>\';','else if(obj==="puzzle")body=\'<label class="drv167826Full">Énigme existante<input id="drv167826PuzzleRef" value="\'+esc(old?.refId||\'\')+\'" placeholder="ID de l’énigme"></label><label>Cible<select id="drv167826Target"><option value="cell">Case</option><option value="door">Porte</option><option value="chest">Coffre</option></select></label><label>Élément cible<select id="drv167826TargetIndex"></select></label><label>Nom / note<input id="drv167826PuzzleLabel" value="\'+esc(old?.label||\'\')+\'"></label>\';','visual puzzle target selector')
          s=rep(s,'if(obj==="chest")DOC.getElementById("drv167826Rarity").value=String(old?.rarity||"common");if(obj==="trap")DOC.getElementById("drv167826TrapType").value=String(old?.trapType||"damage");if(obj==="puzzle")DOC.getElementById("drv167826Target").value=String(old?.targetType||"cell");m.classList.add("open");return true;','if(obj==="chest")DOC.getElementById("drv167826Rarity").value=String(old?.rarity||"common");if(obj==="trap")DOC.getElementById("drv167826TrapType").value=String(old?.trapType||"damage");if(obj==="puzzle"){const target=DOC.getElementById("drv167826Target");target.value=String(old?.targetType||"cell");target.onchange=()=>refreshPuzzleTargets(room,null);refreshPuzzleTargets(room,old?.targetIndex??old?.cell)}m.classList.add("open");return true;','visual target init')
          s=rep(s,'data={enemyId:DOC.getElementById("drv167826Enemy")?.value,qty:DOC.getElementById("drv167826Qty")?.value,hp:DOC.getElementById("drv167826Hp")?.value,hasKey:!!DOC.getElementById("drv167826Key")?.checked};','data={enemyId:DOC.getElementById("drv167826Enemy")?.value,qty:DOC.getElementById("drv167826Qty")?.value,hasKey:!!DOC.getElementById("drv167826Key")?.checked};','visual save no HP')
          s=rep(s,'data={refId:DOC.getElementById("drv167826PuzzleRef")?.value,targetType:DOC.getElementById("drv167826Target")?.value,label:DOC.getElementById("drv167826PuzzleLabel")?.value};','data={refId:DOC.getElementById("drv167826PuzzleRef")?.value,targetType:DOC.getElementById("drv167826Target")?.value,targetIndex:DOC.getElementById("drv167826TargetIndex")?.value,label:DOC.getElementById("drv167826PuzzleLabel")?.value};','visual save target index')
          save(path,s)

          # 3) Reusable room template: keep linked instances synchronized and offer concrete door/chest targets.
          path='assets/dungeon/dungeon-room-template-content-167828.js'; s=load(path)
          s=rep(s,'const VERSION="1.2.0",APP_VERSION="16.78.29",TEMPLATE_DUNGEON_ID="__room_template__";','const VERSION="1.3.0",APP_VERSION="16.78.44",TEMPLATE_DUNGEON_ID="__room_template__";','template version')
          s=sub(s,r'function copyTemplateToZone\(dungeonId,nodeId,roomId,force\)\{.*?\n\}','''function copyTemplateToZone(dungeonId,nodeId,roomId,force){\n  const z=zoneApi();if(!z?.getZoneContent||!z?.saveZoneContent)return false;\n  const rid=String(roomId||""),tpl=z.getZoneContent(TEMPLATE_DUNGEON_ID,rid);if(!tpl||tpl.mode==="inherit")return false;\n  const current=z.getZoneContent(String(dungeonId||""),String(nodeId||""));if(!force&&current?.templateLinked===false)return false;\n  z.saveZoneContent(String(dungeonId||""),String(nodeId||""),{...clone(tpl),templateRoomId:rid,templateLinked:true});return true;\n}''','template linked copy')
          s=rep(s,'function openEditor(cell,obj){\n','''function puzzleTargetChoices(r,type){const out=[],t=String(type||"cell");let chestNo=0;for(let i=0;i<(r?.cells||[]).length;i++){const c=r.cells[i];if(c?.terrain==="wall")continue;if(t==="cell")out.push({index:i,label:"Case "+(i+1)});else if(t==="door"&&(c?.object==="entry"||c?.object==="exit"))out.push({index:i,label:c.object==="entry"?"Porte d’entrée":"Porte de sortie"});else if(t==="chest"&&c?.object==="chest")out.push({index:i,label:"Coffre "+(++chestNo)})}return out}\nfunction refreshPuzzleTargets(r,value){const type=String(DOC?.getElementById("drtTarget")?.value||"cell"),sel=DOC?.getElementById("drtTargetIndex");if(!sel)return;const list=puzzleTargetChoices(r,type);sel.innerHTML=list.length?list.map(x=>'<option value="'+x.index+'" '+(Number(value)===x.index?'selected':'')+'>'+esc(x.label)+'</option>').join(""):'<option value="">Aucune cible disponible</option>'}\nfunction openEditor(cell,obj){\n''','template target helpers')
          s=sub(s,r'if\(obj==="enemy"\|\|obj==="boss"\)body=.*?;\n  else if\(obj==="chest"\)', 'if(obj==="enemy"||obj==="boss")body=\'<label>Monstre<select id="drtEnemy">\'+enemyOptions(String(old?.enemyId||"dng_skeleton"))+\'</select></label><label>Quantité<input id="drtQty" type="number" min="1" max="50" value="\'+Number(old?.qty||1)+\'"></label><label style="align-content:end"><span><input id="drtKey" type="checkbox" \'+(old?.hasKey?\'checked\':\'\')+\'> Porte la clé</span></label>\';\n  else if(obj==="chest")','template enemy editor no HP')
          s=rep(s,'else if(obj==="puzzle")body=\'<label class="drtFull">Énigme existante<input id="drtPuzzleRef" value="\'+esc(old?.refId||\'\')+\'"></label><label>Cible<select id="drtTarget"><option value="cell">Case</option><option value="door">Porte</option><option value="chest">Coffre</option></select></label><label>Nom / note<input id="drtPuzzleLabel" value="\'+esc(old?.label||\'\')+\'"></label>\';','else if(obj==="puzzle")body=\'<label class="drtFull">Énigme existante<input id="drtPuzzleRef" value="\'+esc(old?.refId||\'\')+\'"></label><label>Cible<select id="drtTarget"><option value="cell">Case</option><option value="door">Porte</option><option value="chest">Coffre</option></select></label><label>Élément cible<select id="drtTargetIndex"></select></label><label>Nom / note<input id="drtPuzzleLabel" value="\'+esc(old?.label||\'\')+\'"></label>\';','template puzzle target selector')
          s=rep(s,'if(obj==="chest")DOC.getElementById("drtRarity").value=String(old?.rarity||"common");if(obj==="trap")DOC.getElementById("drtTrapType").value=String(old?.trapType||"damage");if(obj==="puzzle")DOC.getElementById("drtTarget").value=String(old?.targetType||"cell");m.classList.add("open");return true;','if(obj==="chest")DOC.getElementById("drtRarity").value=String(old?.rarity||"common");if(obj==="trap")DOC.getElementById("drtTrapType").value=String(old?.trapType||"damage");if(obj==="puzzle"){const target=DOC.getElementById("drtTarget");target.value=String(old?.targetType||"cell");target.onchange=()=>refreshPuzzleTargets(r,null);refreshPuzzleTargets(r,old?.targetIndex??old?.cell)}m.classList.add("open");return true;','template target init')
          s=rep(s,'data={enemyId:DOC.getElementById("drtEnemy")?.value,qty:DOC.getElementById("drtQty")?.value,hp:DOC.getElementById("drtHp")?.value,hasKey:!!DOC.getElementById("drtKey")?.checked};','data={enemyId:DOC.getElementById("drtEnemy")?.value,qty:DOC.getElementById("drtQty")?.value,hasKey:!!DOC.getElementById("drtKey")?.checked};','template save no HP')
          s=rep(s,'data={refId:DOC.getElementById("drtPuzzleRef")?.value,targetType:DOC.getElementById("drtTarget")?.value,label:DOC.getElementById("drtPuzzleLabel")?.value};','data={refId:DOC.getElementById("drtPuzzleRef")?.value,targetType:DOC.getElementById("drtTarget")?.value,targetIndex:DOC.getElementById("drtTargetIndex")?.value,label:DOC.getElementById("drtPuzzleLabel")?.value};','template save target index')
          save(path,s)

          # 4) Dedicated authored runtime: raw trap/puzzle markers never leak, linked template content stays authoritative, door puzzles gate travel.
          path='assets/dungeon/dungeon-authored-runtime-167839.js'; s=load(path)
          s=rep(s,'const VERSION="1.0.1",APP_VERSION="16.78.40";','const VERSION="1.1.0",APP_VERSION="16.78.44";','authored version')
          s=rep(s,'const width=Math.max(1,Number(room?.width)||1),height=Math.max(1,Number(room?.height)||1),total=width*height,cells=(room?.cells||[]).slice(0,total).map(c=>c?.terrain==="wall"?"wall":String(c?.object||"floor"));','const width=Math.max(1,Number(room?.width)||1),height=Math.max(1,Number(room?.height)||1),total=width*height,cells=(room?.cells||[]).slice(0,total).map(c=>{if(c?.terrain==="wall")return "wall";const obj=String(c?.object||"floor");return obj==="trap"||obj==="puzzle"?"floor":obj});','authored hidden raw markers')
