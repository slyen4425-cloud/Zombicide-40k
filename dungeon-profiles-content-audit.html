<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GenS RPG — Vérification des copies Dungeon</title>
<style>:root{color-scheme:dark}body{background:#11151a;color:#fff;font:16px system-ui;margin:18px auto;padding:0 12px;max-width:690px}h1{font-size:1.35rem}button{font:inherit;padding:12px 16px;border:0;border-radius:8px;background:#2b80b8;color:#fff}textarea{box-sizing:border-box;background:#1c222c;color:#fff;font:12px ui-monospace,monospace;width:100%;height:320px;border:1px solid #667;padding:12px;border-radius:8px}p{line-height:1.5}</style></head><body>
<h1>🧭 Vérification des copies Dungeon</h1>
<p><strong>Diagnostic en lecture seule.</strong> Aucune sauvegarde n'est modifiée ni transmise. Seuls le nombre de copies et les types de différences sont affichés, pas leurs valeurs.</p>
<p id="status">Analyse en cours…</p>
<button type="button" id="copy">Copier le rapport</button><p id="hint" aria-live="polite"></p>
<textarea id="report" readonly spellcheck="false"></textarea>
<script>
(function(){
  const KEY='gensrpg_game_profiles_v1';
  let report;
  try{
    const profiles=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(profiles))throw Error('Liste de profils invalide');
    function canon(x){
      if(Array.isArray(x))return '['+x.map(canon).join(',')+']';
      if(x&&typeof x==='object')return '{'+Object.keys(x).sort().map(k=>JSON.stringify(k)+':'+canon(x[k])).join(',')+'}';
      return JSON.stringify(x);
    }
    function paths(a,b,at='',out=[]){
      if(out.length>=100)return out;
      if(canon(a)===canon(b))return out;
      if(!a||!b||typeof a!=='object'||typeof b!=='object'||Array.isArray(a)!==Array.isArray(b)){
        out.push(at||'(racine)');return out;
      }
      if(Array.isArray(a)||Array.isArray(b)){
        if(a.length!==b.length)out.push(at+'[taille]');
        for(let i=0;i<Math.min(a.length,b.length)&&out.length<100;i++)paths(a[i],b[i],at+'['+i+']',out);
        return out;
      }
      for(const k of new Set([...Object.keys(a),...Object.keys(b)])){
        if(!(k in a)||!(k in b))out.push((at?at+'.':'')+k+' [présence]');
        else paths(a[k],b[k],(at?at+'.':'')+k,out);
        if(out.length>=100)break;
      }
      return out;
    }
    const dungeon=profiles.filter(p=>p?.id==='game_profile_dungeon_demo');
    const groups=[];
    dungeon.forEach((p,i)=>{
      const sig=canon(p);let g=groups.find(g=>g.signature===sig);
      if(!g){g={signature:sig,positions:[]};groups.push(g)}
      g.positions.push(i+1);
    });
    const base=dungeon[0];
    report={
      format:'gensrpg-dungeon-profile-content-audit-v1',
      totalProfils:profiles.length,dungeonCopies:dungeon.length,
      variantesDistinctes:groups.length,
      groupes:groups.map(g=>({nombre:g.positions.length,poidsCaracteres:g.signature.length})),
      ecartsParCopie:dungeon.slice(1).map((p,i)=>({copie:i+2,champDifferents:paths(base,p).slice(0,25)}))
    };
    document.getElementById('status').textContent='Dungeon : '+dungeon.length+' copies — '+groups.length+' variantes distinctes.';
  }catch(e){report={format:'gensrpg-dungeon-profile-content-audit-v1',erreur:String(e?.message||e)};document.getElementById('status').textContent='Lecture impossible';}
  document.getElementById('report').value=JSON.stringify(report,null,2);
  document.getElementById('copy').onclick=async()=>{
    const field=document.getElementById('report');
    try{await navigator.clipboard.writeText(field.value);document.getElementById('hint').textContent='Rapport copié';}
    catch(_){field.focus();field.select();document.getElementById('hint').textContent='Rapport sélectionné. Choisir Copier.';}
  };
})();
</script></body></html>
