name: Validate exact Dungeon traps
on:
  push:
    branches:
      - work/dungeon-exact-trap-fix-2026-09-05
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check assets/dungeon/dungeon-exact-trap-runtime-167845.js
          node --check assets/gensrpg/gens-ui-recovery-167843.js
      - name: Exact authored traps
        run: node tests/dungeon_exact_trap_runtime_v167845.test.cjs
      - name: Zone content
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Authored runtime
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: UI recovery
        run: node tests/gens_ui_recovery_v167843.test.cjs
      - name: Room template content
        run: node tests/dungeon_room_template_content_v167828.test.cjs
