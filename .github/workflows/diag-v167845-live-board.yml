name: Diagnose V16.78.45 live board
on:
  push:
    branches:
      - work/dungeon-v16.78.45-live-board-fix-2026-09-05
    paths:
      - .github/workflows/diag-v167845-live-board.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact board and scene renderer
        run: |
          echo '=== spatial renderer 39320-39420 ==='
          sed -n '39320,39420p' index.html
          echo '=== main render 39500-39545 ==='
          sed -n '39500,39545p' index.html
          echo '=== later scene cleanup 41255-41290 ==='
          sed -n '41255,41290p' index.html
          echo '=== art renderer 43320-43510 ==='
          sed -n '43320,43510p' index.html
          echo '=== zone content full ==='
          cat assets/dungeon/dungeon-zone-content-167824.js
