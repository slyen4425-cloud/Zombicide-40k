}

function removeDuplicateChestCards53(){
  const old=document.getElementById("dc02Scene");if(!old)return;
  old.querySelectorAll(".dc02Feature").forEach(card=>{
    const text=card.textContent||"";
    if(/coffre/i.test(text))card.classList.add("dc053DuplicateChest");
  });
}

<script id="dungeonCore061CombatItems">
(function(){
"use strict";

function itemData61(entry){
  try{return getItemFromEntry(entry)}catch(e){return null}
}
function combatItems61(heroId){
  try{
    const st=loadState(heroId),inv=Array.isArray(st.inventory)?st.inventory:[];
    return inv.map((entry,idx)=>({entry,idx,it:itemData61(entry)}))
      .filter(x=>x.it?.rpgUse && Math.max(1,Number(x.entry?.qty)||1)>0);
  }catch(e){return[]}
}
window.combatItems61=combatItems61;
function saveHero61(heroId,st){
  localStorage.setItem(key(heroId),JSON.stringify(st));
  if(String(current||"")===String(heroId))state=st;
}
function removeItem61(st,idx){
  if(!Array.isArray(st.inventory)||idx<0||idx>=st.inventory.length)return false;
  const e=st.inventory[idx];
  if(Number(e?.qty)>1)e.qty=Number(e.qty)-1;
  else{
    st.inventory.splice(idx,1);
    for(const k of ["rightHand","leftHand","equipment"]){
      if(st[k]===idx)st[k]=null;
      else if(Number.isInteger(st[k])&&st[k]>idx)st[k]--;
    }
    if(st.rpgGear&&typeof st.rpgGear==="object"){
      Object.keys(st.rpgGear).forEach(k=>{
        if(st.rpgGear[k]===idx)st.rpgGear[k]=null;
        else if(Number.isInteger(st.rpgGear[k])&&st.rpgGear[k]>idx)st.rpgGear[k]--;
      });
    }
  }
  return true;
}
function maxMana61(heroId){
  const oc=current,os=state;
  try{current=heroId;state=loadState(heroId);return Math.max(0,Number(dungeonMaxMana?.())||0)}
  finally{current=oc;state=os}
}
function magicBonus61(heroId){
  const oc=current,os=state;
  try{current=heroId;state=loadState(heroId);return Math.max(0,Number(dungeonMagicDamageBonus?.())||0)}
  finally{current=oc;state=os}
}
function manaGain61(){
  try{return Math.max(1,Number(loadDungeonRpgRules?.()?.manaGain)||10)}catch(e){return 10}
}

window.dungeonCombatUseItem061=function(heroId,idx,targetId){
  const st=loadState(heroId),entry=st.inventory?.[idx],it=itemData61(entry),u=it?.rpgUse;
  if(!entry||!it||!u)return;

  if(u.kind==="heal"){
    const before=Math.max(0,Number(st.wounds)||0),val=Math.max(1,Number(u.value)||1);
    if(before<=0){alert((CHARS[heroId]?.name||"Ce héros")+" n'a aucune blessure.");return}
    st.wounds=Math.max(0,before-val);
    removeItem61(st,idx);saveHero61(heroId,st);
    try{showEffectPopup("🧪",it.name,"Blessures : "+before+" → "+st.wounds+".","Objet consommé",true)}catch(e){}
    renderDungeonCombatRound();
    return;
  }

  if(u.kind==="mana"){
    const max=maxMana61(heroId),before=Math.max(0,Number(st.mana)||0);
    if(before>=max){alert("Le mana est déjà au maximum.");return}
    const gain=Math.max(1,Number(u.value)||1)*manaGain61();
    st.mana=Math.min(max,before+gain);
    if(st.skillCooldowns&&typeof st.skillCooldowns==="object")Object.keys(st.skillCooldowns).forEach(k=>st.skillCooldowns[k]=0);
    removeItem61(st,idx);saveHero61(heroId,st);
    try{showEffectPopup("💧",it.name,"Mana : "+before+" → "+st.mana+" / "+max+".","Objet consommé",true)}catch(e){}
    renderDungeonCombatRound();
    return;
  }

  if(u.kind==="damage"){
    const target=loadActiveEnemies().find(e=>String(e.id)===String(targetId)&&!e.defeated&&Number(e.hp)>0);
    if(!target){alert("Choisis un ennemi encore en vie.");return}
    const damage=Math.max(1,Number(u.value)||1)+magicBonus61(heroId);
    removeItem61(st,idx);saveHero61(heroId,st);
    applyDungeonDirectDamage(target.id,damage,it.name);
    /* applyDungeonDirectDamage ouvre déjà le résultat détaillé. Une seconde
       effectModal restait cachée sous le jet et pouvait bloquer la timeline. */
    renderDungeonCombatRound();
    return;
  }

  alert("Cet objet n'a pas encore d'effet de combat pris en charge.");
};

function addCombatItems61(){
  const hs=document.getElementById("combatHeroSide");
  if(!hs)return;
  const cards=[...hs.querySelectorAll(".combatantCard")];
  const heroIds=[...dungeonCombatSelection.heroes].sort((a,b)=>dungeonCombatHeroSnapshot(b).initiative-dungeonCombatHeroSnapshot(a).initiative);
  cards.forEach((card,pos)=>{
    const heroId=heroIds[pos];if(!heroId||card.querySelector(".dc061Items"))return;
    const items=combatItems61(heroId);if(!items.length)return;
    const target=card.querySelector(".dungeonCombatTargetSelect");
    const box=document.createElement("div");box.className="dc061Items";
    const title=document.createElement("strong");title.textContent="🎒 OBJETS UTILISABLES";box.appendChild(title);
    items.forEach(x=>{
      const u=x.it.rpgUse||{},b=document.createElement("button");
      b.type="button";b.className="dc061ItemBtn";
      const icon=u.kind==="heal"?"🧪":u.kind==="mana"?"💧":u.kind==="damage"?"🔥":"✨";
      const qty=Math.max(1,Number(x.entry?.qty)||1);
      b.textContent=icon+" "+x.it.name+(qty>1?" ×"+qty:"");
      b.onclick=()=>window.dungeonCombatUseItem061(heroId,x.idx,target?.value||"");
      box.appendChild(b);
    });
    card.appendChild(box);
  });
}

const oldRender61=window.renderDungeonCombatRound;
if(typeof oldRender61==="function"){
  window.renderDungeonCombatRound=function(){
    const r=oldRender61.apply(this,arguments);
    try{addCombatItems61()}catch(e){console.warn("Combat items 0.61",e)}
    return r;
  };
}

(function(){

  try{

    const t=String(c.environment||"stone").toLowerCase();
    return ["stone","forest","water","cave","ice","lava"].includes(t)?t:"stone";
  }catch(e){return "stone"}
}
function hash079(str){
  let h=2166136261; str=String(str||"");
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function room079(){
  try{return Number(loadDungeonState?.()?.room)||0}catch(e){return 0}

function floor079(t,r,i){
  const n=1+(hash079(t+"|"+r+"|"+i)%6);
  return 'assets/dungeon/creatures/dng_floor_'+t+'_'+String(n).padStart(2,"0")+'.png';
}

/* Les anciens "petits murs" deviennent des zones de terrain/couvert.
   On réutilise uniquement les sets déjà déposés : aucun nouvel asset requis. */
function cover079(t,r,i){
  const h=hash079("cover|"+t+"|"+r+"|"+i);
  let ct=t;
  if(t==="stone") ct=(h%4===0)?"water":"cave";       // roche majoritaire, rares zones humides
  else if(t==="cave") ct=(h%5===0)?"water":"cave";  // rocher / flaque
  else if(t==="forest") ct=(h%5===0)?"water":"forest";
  else if(t==="water") ct=(h%3===0)?"cave":"water"; // rocher émergent / eau
  else if(t==="ice") ct=(h%4===0)?"water":"ice";    // glace / eau froide
  else if(t==="lava") ct=(h%3===0)?"cave":"lava";  // rocher volcanique / lave
  return floor079(ct,r,i);
}

function polish079(){
  const t=theme079(),r=room079();
  const cells=[...document.querySelectorAll(".dc047Cell")];
  cells.forEach((cell,i)=>{
    // Sol : léger zoom pour supprimer les bordures intégrées des PNG.
    if(!cell.classList.contains("wall") && !cell.classList.contains("cover")){
      cell.style.backgroundImage='url("'+floor079(t,r,i)+'")';
    }

    // Les obstacles/couverts ne montrent plus dungeon_wall.png.
    if(cell.classList.contains("wall") || cell.classList.contains("cover")){
      cell.classList.add("dc079TerrainCover");
      cell.style.backgroundImage='url("'+cover079(t,r,i)+'")';
      cell.dataset.coverTheme=t;
    }
  });
}
window.applyDungeonMapPolish079=polish079;

// Réapplique après chaque reconstruction de salle.
let q=false;
const obs=new MutationObserver(()=>{
  if(q)return;q=true;
  requestAnimationFrame(()=>{q=false;try{polish079()}catch(e){}});
});
function boot(){
  try{polish079()}catch(e){console.warn("Core 0.79 map polish",e)}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();

<script id="dungeonCore083MovementBalance">
(function(){
"use strict";
function migrate083(){
  try{
    const profiles=loadGameProfiles?.();if(!Array.isArray(profiles))return;
    let changed=false;
    profiles.forEach(p=>{
      if(p?.gameStyle!=="dungeon"||!p.rpgUniverse)return;
      const mv=p.rpgUniverse.movement||(p.rpgUniverse.movement={});
      if(Number(mv.balanceVersion||0)>=2)return;
      const d=mv.defaults||(mv.defaults={});
      // Ancienne valeur usine = 5 partout. On migre uniquement ces valeurs par défaut.
      if(d.hero==null||Number(d.hero)===5)d.hero=3;
      if(d.creature==null||Number(d.creature)===5)d.creature=1;
      if(d.enemy==null||Number(d.enemy)===5)d.enemy=1;
      if(d.companion==null||Number(d.companion)===5)d.companion=3;
      mv.balanceVersion=2;changed=true;
    });
    if(changed){
      try{saveGameProfiles?.(profiles)}catch(e){
        try{localStorage.setItem(GAME_PROFILES_KEY,JSON.stringify(profiles))}catch(_){}
      }
    }
  }catch(e){console.warn("Core 0.83 movement migration",e)}
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",migrate083);
else migrate083();
})();
</script>

   - plus besoin de tuer systématiquement toute la salle

  try{saveDungeonState?.(x)}catch(e){}

  const d=ds102(),last=d?.last;

  const enemies=living102();
  if(!enemies.length){
    last.exitLocked=false;
    saveDs102(d);
    return false;
  }

  let locked=false;
  if(kind==="boss")locked=true;
  else if(kind==="enemy"||kind==="ambush")locked=Math.random()*100<LOCK_CHANCE;

  last.exitLocked=locked;
  if(locked){
    const carrier=enemies[Math.floor(Math.random()*enemies.length)];
    last.keyEnemyId=String(carrier?.id||"");
  }else{
    last.keyEnemyId="";

  return locked;

  const d=ds102(),last=d?.last;

/* ---------------------------------------------------------

--------------------------------------------------------- */
function nearestFreeCell104(){
  const d=ds104(),m=d?.last?.map;if(!m||!Array.isArray(m.cells))return -1;
  const size=Number(m.size)||Math.round(Math.sqrt(m.cells.length))||1;
  const hp=heroPos104();
  const bad=new Set(["wall","void","entry","exit","enemy","chest","cache","puzzle"]);
  const candidates=[];
  m.cells.forEach((v,i)=>{
    if(bad.has(String(v)))return;
    if(i===hp)return;
    const r=Math.floor(i/size),c=i%size;
    const hr=hp>=0?Math.floor(hp/size):0,hc=hp>=0?hp%size:0;
    candidates.push({i,d:Math.abs(r-hr)+Math.abs(c-hc)});
  });
  candidates.sort((a,b)=>a.d-b.d);
  return candidates[0]?.i??-1;
}
function gmChest104(rarity){
  const d=ds104(),map=d?.last?.map;
  if(!map||!Array.isArray(map.cells)){
    notice104("🎁 Coffre MJ","Aucune salle active : impossible de placer le coffre.");
    return false;
  }
  const idx=nearestFreeCell104();
  if(idx<0){
    notice104("🎁 Coffre MJ","Aucune case libre pour placer le coffre.");
    return false;
  }

  const cfg=loadDungeonConfig?.()||{};
  const trapped=Math.random()*100<Math.max(0,Math.min(100,Number(cfg.chestTrapChance)||0));
  const label=typeof dungeonRarityLabel==="function"?dungeonRarityLabel(rarity):rarity;
  const el=addDungeonSceneElement?.({
    kind:"chest",name:"Coffre "+label,rarity,trapped,room:room104(),
    cellIndex:idx,fromMap:true,gmAdded:true
  });
  map.cells[idx]="chest";
  d.last.map=map;saveDs104(d);

  try{
    const old=document.getElementById("dc01Modal");
    if(old){old.classList.remove("open");old.style.display="none"}
  }catch(e){}

  DungeonCore01?.render?.();
  notice104("🎁 Coffre ajouté","Le coffre <strong>"+esc104(label)+"</strong> a été placé sur une vraie case de la salle."+
    (trapped?"<br>⚠️ Il est piégé.":""));
  return el||true;
}

<script type="application/x-gensrpg-disabled" id="dungeonCore105MovementRenderFix">
(function(){
"use strict";

const MOVE_KEY="gensrpg_dungeon_tactical098_v1";
const CORE_KEY="gensrpg_dungeon_core02_v1";

function mv105(){
  try{return JSON.parse(localStorage.getItem(MOVE_KEY)||"{}")||{}}catch(e){return {}}
}
function core105(){
  try{return JSON.parse(localStorage.getItem(CORE_KEY)||"{}")||{}}catch(e){return {}}
}
function active105(){
  const c=core105(),p=Array.isArray(c.participants)?c.participants.map(String):[];
  const i=Math.max(0,Math.min(Number(c.index)||0,Math.max(0,p.length-1)));

function boardCells105(){
  return [...document.querySelectorAll("#dc047RoomBoard .dc047Grid > .dc047Cell")];
}

/* =========================================================
   1. RESTAURER LE RENDU IMMÉDIAT DU MOTEUR 0.98
   La 1.04 avait enveloppé dungeonMoveHero098 puis redécoré le board,
   ce qui pouvait laisser la position stockée mais pas repeinte avant
   le prochain render complet (ex. Fin du tour).
   ========================================================= */
const nativeMove105=window.dungeonMoveHero098;

function repaint105(){
  try{
    /* Important : le moteur 0.98 reste l'autorité de calcul/rendu. */
    if(typeof window.renderTacticalMovement098==="function"){
      window.renderTacticalMovement098();
    }

    /* Puis seulement les décorations finales. */
    if(typeof window.dc099Paint==="function")window.dc099Paint();
    if(typeof window.dc104RoomRule==="function")window.dc104RoomRule();
    if(typeof window.dc104SyncMain==="function")window.dc104SyncMain();
  }catch(e){
    console.warn("Core 1.05 repaint",e);
  }
}
window.dc105RepaintMovement=repaint105;

/* Remplace le wrapper 1.04 : déplacement -> rendu tactique immédiat. */
if(typeof nativeMove105==="function"){
  window.dungeonMoveHero098=function(index){
    const before=mv105();
    const hero=active105();
    const oldPos=Number(before?.positions?.[hero]);

    const r=nativeMove105.apply(this,arguments);

    const after=mv105();
    const newPos=Number(after?.positions?.[hero]);

    /* Si le moteur a accepté le déplacement, repeindre tout de suite. */
    if(Number.isInteger(newPos) && newPos!==oldPos){
      repaint105();
      requestAnimationFrame(repaint105);
    }else{
      /* Même sur clic invalide, restaurer les cases atteignables. */
      repaint105();
    }
    return r;
  };
}

/* =========================================================
   2. CLICK FINAL SUR CASE
   Capture-phase, après tous les anciens listeners.
   On ne laisse plus un clic être stocké sans repaint.
   ========================================================= */
document.addEventListener("click",function(ev){
  const cell=ev.target?.closest?.("#dc047RoomBoard .dc047Grid > .dc047Cell");
  if(!cell)return;

  let tactical=false;
  try{tactical=!!dungeonTacticalMovementEnabled098?.()}catch(e){}
  if(!tactical)return;

  const cells=boardCells105();
  const idx=cells.indexOf(cell);

  /* Si une UI de combat ou la victoire sûre est ouverte, ne pas déplacer. */
  const safe=document.getElementById("dc104SafeModal");
  const combat=document.getElementById("dungeonCombatModal");
  if(safe?.classList.contains("open"))return;
  if(combat && combat.style.display!=="none" && combat.offsetParent!==null)return;

  ev.preventDefault();
  ev.stopPropagation();
  ev.stopImmediatePropagation();

  try{
    window.dungeonMoveHero098?.(idx);

    console.error("Core 1.05 clic mouvement",e);

  }

/* =========================================================
   3. SURBRILLANCE VERTE DE SECOURS
   Si l'ancien renderer ne remet pas ses classes après un combat,
   on reconstruit visuellement les cases à partir de dc098Reach.
   ========================================================= */
function syncReachVisual105(){
  const cells=boardCells105();
  cells.forEach(c=>c.classList.remove("dc105Reachable","dc105Blocked"));

  cells.forEach(c=>{
    if(c.classList.contains("dc098Reach")||c.classList.contains("dc099Reachable")){

    }
  });

window.dc105SyncReachVisual=syncReachVisual105;

const oldRepaint105=window.dc105RepaintMovement;
window.dc105RepaintMovement=function(){
  oldRepaint105?.();
  syncReachVisual105();
};

/* =========================================================
   4. APRÈS VICTOIRE / CHANGEMENT DE SALLE
   Réinitialiser uniquement la couche visuelle du mouvement.
   Pas de modification des positions.
   ========================================================= */
const oldFinish105=window.dc104FinishVictory;
if(typeof oldFinish105==="function"){
  window.dc104FinishVictory=function(){
    const r=oldFinish105.apply(this,arguments);
    requestAnimationFrame(()=>{
      try{window.dc105RepaintMovement()}catch(e){}
    });
    setTimeout(()=>{
      try{window.dc105RepaintMovement()}catch(e){}
    },0);
    return r;
  };
  window.finishDungeonCombatVictory=window.dc104FinishVictory;
}

if(window.DungeonCore01&&typeof DungeonCore01.explore==="function"){
  const oldExplore105=DungeonCore01.explore;
  DungeonCore01.explore=function(){
    const r=oldExplore105.apply(this,arguments);
    requestAnimationFrame(()=>{
      try{window.dc105RepaintMovement()}catch(e){}
    });
    return r;
  };
}

if(window.DungeonCore01&&typeof DungeonCore01.render==="function"){
  const oldRender105=DungeonCore01.render;
  DungeonCore01.render=function(){
    const r=oldRender105.apply(this,arguments);
    requestAnimationFrame(()=>{
      try{window.dc105RepaintMovement()}catch(e){}
    });
    return r;
  };
}

/* =========================================================
   5. FIN DE TOUR
   On garde la logique 0.99, mais on force le repaint final pour
   éviter qu'un ancien rendu masque le mouvement courant.
   ========================================================= */
if(window.DungeonCore01&&typeof DungeonCore01.endTurn==="function"){
  const oldEnd105=DungeonCore01.endTurn;
  DungeonCore01.endTurn=function(){
    const r=oldEnd105.apply(this,arguments);
    requestAnimationFrame(()=>{
      try{window.dc105RepaintMovement()}catch(e){}
    });
    return r;
  };
}

/* Réparer immédiatement une partie déjà dans cet état. */
setTimeout(()=>{
  try{window.dc105RepaintMovement()}catch(e){}
},0);

window.dungeonDebug105=function(){
  const m=mv105(),id=active105();
  return {
    activeHero:id,
    position:m?.positions?.[id],
    remaining:m?.remaining?.[id],

  };
};

try{
  const b=document.querySelector(".dc01Badge");if(b)b.textContent="NOUVEAU MOTEUR · CORE 1.05";
  const f=document.querySelector(".dc01Footer");if(f)f.textContent="Dungeon Core 1.05 · rendu déplacement restauré après combat.";
}catch(e){}
})();
</script>

<script id="dungeonCore313SpatialModel">
(function(){
"use strict";

function clone313(value){
  return value==null?value:JSON.parse(JSON.stringify(value))
}
function active313(x){
  return String(x?.participants?.[Number(x?.index)||0]||"")
}
function roomKey313(room){
  return String(Math.max(0,Number(room)||0))
}
function ensure313(x){
  if(!x||typeof x!=="object")return x;
  x.positions=x.positions&&typeof x.positions==="object"?x.positions:{};
  x.remaining=x.remaining&&typeof x.remaining==="object"?x.remaining:{};
  x.heroRooms=x.heroRooms&&typeof x.heroRooms==="object"?x.heroRooms:{};
  x.roomStates=x.roomStates&&typeof x.roomStates==="object"?x.roomStates:{};
  x.heroBranchStates=x.heroBranchStates&&typeof x.heroBranchStates==="object"?x.heroBranchStates:{};
  const currentRoom=Math.max(0,Number(x.room)||0);
  (x.participants||[]).map(String).forEach(id=>{
    if(!Number.isFinite(Number(x.heroRooms[id])))x.heroRooms[id]=currentRoom
  });
  if(currentRoom>0&&x.last&&!x.roomStates[roomKey313(currentRoom)]){
    x.roomStates[roomKey313(currentRoom)]={
      last:clone313(x.last),enemyCells:clone313(x.enemyCells||{})
    }
  }
  x.spatialVersion=1;
  return x
}
function persist313(x){
  ensure313(x);if(!x)return x;
  const id=active313(x),room=Math.max(0,Number(x.room)||0);
  if(id)x.heroRooms[id]=room;
  if(x.branch?.active&&id){
    x.branch.heroId=String(x.branch.heroId||id);
    x.heroBranchStates[id]={
      room,last:clone313(x.last),enemyCells:clone313(x.enemyCells||{}),
      branch:clone313(x.branch),cell:Number(x.positions?.[id])
    }
  }else if(room>0&&x.last){
    x.roomStates[roomKey313(room)]={
      last:clone313(x.last),enemyCells:clone313(x.enemyCells||{})
    }
  }
  return x
}
function roomOf313(x,id){
  ensure313(x);
  const n=Number(x?.heroRooms?.[String(id)]);
  return Number.isFinite(n)?Math.max(0,n):0
}
function inBranch313(x,id){
  const b=x?.heroBranchStates?.[String(id)];
  return !!b?.branch?.active
}
function activate313(x,id){
  ensure313(x);id=String(id||"");if(!x||!id)return x;
  const branch=x.heroBranchStates?.[id];
  if(branch?.branch?.active){
    x.room=Math.max(0,Number(branch.room)||0);
    x.last=clone313(branch.last)||null;
    x.enemyCells=clone313(branch.enemyCells||{});
    x.branch=clone313(branch.branch);
    if(Number.isInteger(Number(branch.cell)))x.positions[id]=Number(branch.cell);
    return x
  }
  const room=roomOf313(x,id),saved=x.roomStates?.[roomKey313(room)];
  x.room=room;x.branch=null;
  if(room<=0){x.last=null;x.enemyCells={}}
  else if(saved){x.last=clone313(saved.last)||null;x.enemyCells=clone313(saved.enemyCells||{})}
  return x
}
function setRoom313(x,id,room){
  ensure313(x);id=String(id||"");if(!x||!id)return x;
  x.heroRooms[id]=Math.max(0,Number(room)||0);
  delete x.heroBranchStates[id];
  return x
}
function sameView313(x,id){
  ensure313(x);id=String(id||"");if(!x||!id)return false;
  const active=active313(x),activeBranch=!!x.branch?.active;
  if(roomOf313(x,id)!==Math.max(0,Number(x.room)||0))return false;
  if(activeBranch)return id===active||(
    inBranch313(x,id)&&
    String(x.heroBranchStates[id]?.branch?.sourceId||"")===String(x.branch?.sourceId||"")
  );
  return !inBranch313(x,id)
}
function heroesHere313(x){
  ensure313(x);
  return (x?.participants||[]).map(String).filter(id=>sameView313(x,id))
}
function participatingHeroes313(x,leader,maxRange,tactical=true){
  ensure313(x);leader=String(leader||active313(x));
  const here=heroesHere313(x);if(!tactical)return here;
  const map=x?.last?.map,cells=map?.cells,size=Number(map?.size)||Math.round(Math.sqrt(cells?.length||0))||1;
  const start=Number(x?.positions?.[leader]),range=Math.max(0,Number(maxRange)||0);
  if(!Array.isArray(cells)||!Number.isInteger(start)||start<0)return here.filter(id=>id===leader);
  const distances=new Map([[start,0]]),queue=[start],occupied=new Set(Object.values(x?.enemyCells||{}).map(Number));
  for(let qi=0;qi<queue.length;qi++){
    const cell=queue[qi],distance=distances.get(cell)||0;if(distance>=range)continue;
    const row=Math.floor(cell/size),col=cell%size,next=[];
    if(row>0)next.push(cell-size);if(row<size-1)next.push(cell+size);if(col>0)next.push(cell-1);if(col<size-1)next.push(cell+1);
    next.forEach(n=>{if(n<0||n>=cells.length||distances.has(n)||["wall","void"].includes(String(cells[n])))return;if(n!==start&&occupied.has(n))return;distances.set(n,distance+1);queue.push(n)})
  }
  return here.filter(id=>id===leader||distances.has(Number(x?.positions?.[id])))
}
function combatDefeatScope313(participants,combatants,living){
  const party=[...new Set((participants||[]).map(String).filter(Boolean))];
  const fight=[...new Set((combatants||[]).map(String).filter(Boolean))];
  const alive=new Set((living||[]).map(String).filter(Boolean));
  if(!fight.length||fight.some(id=>alive.has(id)))return "none";
  return party.length>0&&party.every(id=>!alive.has(id))?"global":"local"
}
function clearBranch313(x,id){
  ensure313(x);if(x&&id)delete x.heroBranchStates[String(id)];return x
}

window.DungeonSpatial313={
  ensure:ensure313,persist:persist313,activate:activate313,setRoom:setRoom313,
  roomOf:roomOf313,sameView:sameView313,heroesHere:heroesHere313,
  participatingHeroes:participatingHeroes313,
  combatDefeatScope:combatDefeatScope313,
  clearBranch:clearBranch313,clone:clone313,active:active313
};
})();
</script>

(function(){

function spawnIndex(m){if(!m||!Array.isArray(m.cells))return -1;for(const v of [m.heroIdx,m.entryIdx,m.cells.indexOf('hero'),m.cells.indexOf('entry')]){const n=Number(v);if(Number.isInteger(n)&&n>=0&&n<m.cells.length)return n}return m.cells.findIndex(v=>!['wall','void'].includes(String(v)))}

function neighbours(i,size,total){const r=Math.floor(i/size),c=i%size,a=[];if(r>0)a.push(i-size);if(r<size-1)a.push(i+size);if(c>0)a.push(i-1);if(c<size-1)a.push(i+1);return a.filter(n=>n>=0&&n<total)}
function distanceMap(from,m,max,x){const size=Number(m?.size)||Math.round(Math.sqrt(m?.cells?.length||0))||1,d=new Map([[from,0]]),q=[from];let qi=0;const occupied=new Set(Object.values(x?.enemyCells||{}).map(Number));while(qi<q.length){const cur=q[qi++],cd=d.get(cur)||0;if(cd>=max)continue;if(cur!==from&&occupied.has(cur))continue;for(const n of neighbours(cur,size,m.cells.length)){if(d.has(n)||blocked(m.cells[n]))continue;d.set(n,cd+1);q.push(n)}}return d}

function assignEnemyCells(x){
 const m=x?.last?.map;if(!m||!Array.isArray(m.cells))return;

  const live=visibleEnemies(),liveIds=new Set(live.map(e=>String(e.id)));x.enemyCells=x.enemyCells||{};

 const used=new Set(Object.values(x.enemyCells).map(Number));const markers=[];m.cells.forEach((v,i)=>{if(String(v)==='enemy')markers.push(i)});

 live.forEach(e=>{const n=Number(x.enemyCells[e.id]);if(Number.isInteger(n)&&n>=0&&n<m.cells.length){m.cells[n]='enemy';used.add(n)}});

}

function renderHeroes(x){const host=document.getElementById('dc01Heroes');if(!host)return;host.innerHTML='';const cur=activeHero(x),my=assigned();(x.participants||[]).forEach(id=>{const b=document.createElement('button');b.type='button';b.className='dc01Hero'+(id===cur?' active':'')+((role()!=='gm'&&my&&id!==my)?' locked':'');const c=CHARS?.[id]||findCustomHero?.(id)||{},heroRoom=Number(x.heroRooms?.[id])||0;const img=c.image||c.avatar||'';b.innerHTML=(img?'<img src="'+img+'" alt="">':'<div style="height:92px;display:grid;place-items:center;font-size:38px;background:#222;border-radius:8px">🧙</div>')+'<div class="dc01HeroName">'+esc(heroName(id))+'</div><div class="dc01HeroRole">'+esc(c.role||'Héros')+' · '+(heroRoom>0?'Salle '+heroRoom:'Entrée')+'</div>'+(id===cur?'<span class="dc01HeroTurn">ACTIF</span>':'');b.onclick=()=>openHero(id);host.appendChild(b)})}
function sceneForRoom(x){try{return (loadDungeonSceneElements?.()||[]).filter(e=>!Number(e.room||0)||Number(e.room||0)===Number(x.room||0))}catch(e){return []}}

function enemyName201(e){try{return activeEnemyDefinition?.(e?.enemyId)?.name||e?.name||"Ennemi"}catch(_){return e?.name||"Ennemi"}}

/* ---------------------------------------------------------
   ÉLÉMENTS : la carte est la source de vérité.
   Si un élément visuel existe encore sur la carte mais que son
   objet scène a disparu, on le reconstruit au lieu de le perdre.
---------------------------------------------------------- */
function repairFeatures201(){
  const x=rt201(),m=x?.last?.map;
  if(!x||!m||!Array.isArray(m.cells))return;
  let a=scene201(),changed=false;
  const inRoom=e=>Number(e.room||0)===Number(x.room||0) && (!!e.branch200===!!x.branch?.active);

  const chestIdx=[];
  const branchIdx=[];
  m.cells.forEach((v,i)=>{
    if(String(v)==="chest"||String(v)==="cache")chestIdx.push(i);
    if(["trapdoor","stairs_down","stairs_up"].includes(String(v)))branchIdx.push(i);
  });

  chestIdx.forEach(i=>{
    const ok=a.some(e=>inRoom(e)&&e.kind==="chest"&&Number(e.cellIndex)===i);
    if(!ok){
      const rarity=typeof dungeonPickChestRarity==="function"?dungeonPickChestRarity(cfg201()):"common";
      const created=addDungeonSceneElement?.({
        kind:"chest",name:"Coffre "+(dungeonRarityLabel?.(rarity)||rarity),
        rarity:rarity||"common",trapped:false,room:x.room,cellIndex:i,fromMap:true,branch200:!!x.branch?.active
      });
      if(created){a=scene201();changed=true}
    }
  });

  branchIdx.forEach(i=>{
    const ok=a.some(e=>inRoom(e)&&["trapdoor","stairs_down","stairs_up"].includes(e.kind)&&Number(e.cellIndex)===i);
    if(!ok){
      const created=addDungeonSceneElement?.({
        kind:"trapdoor",name:"Passage secret",room:x.room,cellIndex:i,
        branchType:"treasure",branch200:!!x.branch?.active
      });
      if(created){a=scene201();changed=true}
    }
  });

  if(changed)saveScene201(a);
}

/* ---------------------------------------------------------
   ENNEMIS : ne plus dépendre du type de case déjà peint.
   On garde une affectation stable et on dessine un vrai pion DOM.
---------------------------------------------------------- */
function repairEnemies201(){
  const x=rt201(),m=x?.last?.map;
  if(!x||!m||!Array.isArray(m.cells))return;
  const live=live201();
  x.enemyCells=x.enemyCells||{};
  const ids=new Set(live.map(e=>String(e.id)));

  Object.keys(x.enemyCells).forEach(id=>{
    if(!ids.has(String(id)))delete x.enemyCells[id];
  });

  const used=new Set(Object.values(x.enemyCells).map(Number).filter(Number.isInteger));
  const heroes=new Set((x.participants||[]).filter(id=>window.DungeonSpatial313?.sameView(x,id)!==false).map(id=>Number(x.positions?.[id])).filter(Number.isInteger));
  const forbidden=new Set(["wall","void","entry","exit","chest","cache","trap","puzzle","trapdoor","stairs_down","stairs_up"]);

  const candidates=[];
  m.cells.forEach((v,i)=>{
    if(!forbidden.has(String(v))&&!heroes.has(i)&&!used.has(i))candidates.push(i);
  });

  live.forEach(e=>{
    let n=Number(x.enemyCells[e.id]);
    if(!Number.isInteger(n)||n<0||n>=m.cells.length){
      n=m.cells.findIndex((v,i)=>String(v)==="enemy"&&!used.has(i)&&!heroes.has(i));
      if(n<0)n=candidates.shift();
      if(Number.isInteger(n)&&n>=0){x.enemyCells[e.id]=n;used.add(n)}
    }
    if(Number.isInteger(Number(x.enemyCells[e.id])))m.cells[Number(x.enemyCells[e.id])]="enemy";
  });
  save201(x);
}

function paintEnemies201(){
  const x=rt201();if(!x)return;
  const grid=document.querySelector("#dc047RoomBoard .dc047Grid");
  if(!grid)return;
  const cells=[...grid.querySelectorAll(":scope > .dc047Cell")];
  cells.forEach(c=>{c.classList.remove("dc201EnemyToken","dc201Key");delete c.dataset.dc201Enemy});
  const live=live201();
  live.forEach(e=>{
    const n=Number(x.enemyCells?.[e.id]);
    if(!Number.isInteger(n)||!cells[n])return;
    cells[n].classList.add("dc201EnemyToken");
    cells[n].dataset.dc201Enemy="👹";
    if(String(x.last?.keyEnemyId||"")===String(e.id))cells[n].classList.add("dc201Key");
    cells[n].title=enemyName201(e);
  });
}

/* ---------------------------------------------------------
   ÉNIGMES 2.01 : runtime natif, sans loadDungeonState ancien.
---------------------------------------------------------- */
let puzzleCtx201=null;
function norm201(v){return String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ")}
function puzzleSource201(kind,id){
  const x=rt201();
  if(kind==="chest"){
    const all=scene201(),el=all.find(e=>String(e.id)===String(id));
    return el?.challenge?{kind,id,ch:el.challenge,attempts:Number(el.challengeAttempts)||0}:null;
  }
  const obj=x?.last?.map?.objective;
  return obj?.type==="challenge"&&obj?.challenge?{kind:"door",id:"",ch:obj.challenge,attempts:Number(obj.challengeAttempts)||0}:null;
}
function modal201(title,html,onClose){
  if(typeof DungeonCore01?.modal==="function")DungeonCore01.modal(title,html,onClose);
}
function openPuzzle201(kind,id){
  const ctx=puzzleSource201(kind,id);if(!ctx)return modal201("🧩 Énigme","Aucune énigme active.");
  puzzleCtx201=ctx;
  const ch=ctx.ch;
  let body='<div class="dc201PuzzlePrompt">'+esc201(ch.prompt||"Résous ce défi.")+'</div>';
  if(ch.type==="choice"){
    const opts=String(ch.options||"").split(",").map(x=>x.trim()).filter(Boolean);
    body+='<div class="dc201PuzzleActions">'+opts.map((o,i)=>'<button class="dc01Btn" onclick="dc201PuzzleAnswer('+i+')">'+esc201(o)+'</button>').join("")+'</div>';
    puzzleCtx201.options=opts;
  }else if(ch.type==="stat"){
    let chance=50;
    try{
      const hero=activeHero201(),st=loadState?.(hero),stat=String(ch.stat||"intelligence");
      const val=Number(st?.dungeonStats?.[stat]??CHARS?.[hero]?.dungeonStats?.[stat]??10);
      chance=Math.max(5,Math.min(95,50+(val-10)*3));
    }catch(e){}
    puzzleCtx201.chance=chance;
    body+='<p>Test de <strong>'+esc201(ch.stat||"intelligence")+'</strong> · '+chance+'%.</p>'+
      '<button class="dc01Btn primary" style="width:100%" onclick="dc201PuzzleRoll()">🎲 LANCER LE D100</button>';
  }else{
    body+='<input id="dc201PuzzleInput" type="text" placeholder="Ta réponse…" style="width:100%;padding:11px;border-radius:9px;background:#0c0b09;color:#fff;border:1px solid #65503a">'+
      '<button class="dc01Btn primary" style="width:100%;margin-top:8px" onclick="dc201PuzzleText()">VALIDER</button>';
  }
  modal201((kind==="chest"?"🎁 Coffre":"🚪 Porte")+" — Énigme",body);
}
function finishPuzzle201(ok){
  const ctx=puzzleCtx201;if(!ctx)return;
  const x=rt201();
  if(ctx.kind==="chest"){
    const a=scene201(),el=a.find(e=>String(e.id)===String(ctx.id));
    if(!el)return;
    if(ok){el.challengeDone=true;el.challengeAttempts=0}
    else el.challengeAttempts=(Number(el.challengeAttempts)||0)+1;
    saveScene201(a);
  }else{
    const obj=x?.last?.map?.objective;
    if(!obj)return;
    if(ok){obj.status="done";obj.challengeAttempts=0}
    else obj.challengeAttempts=(Number(obj.challengeAttempts)||0)+1;
    x.last.objective=obj;
    save201(x);
  }

  if(ok){
    modal201("✅ Défi réussi",ctx.kind==="chest"?"Le coffre est déverrouillé.":"Le mécanisme se désactive.",()=>{DungeonCore01?.render?.()});
  }else{
    modal201("❌ Échec","Le défi n’est pas résolu. Tu peux réessayer.",()=>openPuzzle201(ctx.kind,ctx.id));
  }
}
window.dc201OpenPuzzle=openPuzzle201;
window.dc201PuzzleAnswer=function(i){
  const ctx=puzzleCtx201;if(!ctx)return;
  const ans=ctx.options?.[Number(i)]||"";
  finishPuzzle201(norm201(ans)===norm201(ctx.ch.solution));
};
window.dc201PuzzleText=function(){
  const v=document.getElementById("dc201PuzzleInput")?.value||"";
  finishPuzzle201(norm201(v)===norm201(puzzleCtx201?.ch?.solution));
};
window.dc201PuzzleRoll=function(){
  const chance=Math.max(5,Math.min(95,Number(puzzleCtx201?.chance)||50));
  const roll=1+Math.floor(Math.random()*100);
  const ok=roll<=chance;
  modal201("🎲 Test","D100 : <strong>"+roll+"</strong><br>"+(ok?"✅ Réussi":"❌ Échec"),()=>finishPuzzle201(ok));
};

/* Remplace l'appel ancien utilisé par le runtime 2.00. */
window.dc051OpenChallenge=function(kind,id){return openPuzzle201(kind,id)};

/* ---------------------------------------------------------
   COMBAT : rendre l'accès visible et fiable.
   Le bouton reste contextuel, mais les ennemis sont maintenant visibles.
   Ajoute aussi un bouton rencontre permanent quand il y a des ennemis.
---------------------------------------------------------- */
function encounterPanel201(){

    (!positional
      ?'<button type="button" class="dc01Btn primary" onclick=\'dc200StartCombat('+JSON.stringify(ids)+',"manual")\'>⚔️ ENGAGER LE COMBAT</button>'
      :(on?'<button type="button" class="dc01Btn primary" onclick="dc200StartCombat([\''+String(on.id).replace(/'/g,"")+'\'],\'cell\')">ATTAQUER</button>':'<span class="badge">Va sur une case ennemie</span>'))+
    '</div>';
}

/* ---------------------------------------------------------
   SCÈNE : si une carte spéciale existe dans la map, elle doit avoir

<script id="dungeonCore202ContentDensity">
(function(){
"use strict";
const RT_KEY="gensrpg_dungeon_runtime_v2";

function rt202(){try{return JSON.parse(localStorage.getItem(RT_KEY)||"null")}catch(e){return null}}
function save202(x){if(!x)return;localStorage.setItem(RT_KEY,JSON.stringify(x));try{saveDungeonState?.({room:x.room||0,last:x.last||null})}catch(e){}}
function cfg202(){try{return loadDungeonConfig?.()||{}}catch(e){return {}}}
function clone202(v){return JSON.parse(JSON.stringify(v))}
function esc202(v){try{return z40kEscHtml(String(v??""))}catch(e){return String(v??"")}}
function scene202(){try{return loadDungeonSceneElements?.()||[]}catch(e){return []}}
function live202(){
  const x=rt202(); if(!x)return [];
  try{
    const branch=!!x?.branch?.active,hero=String(x?.participants?.[Number(x?.index)||0]||"");
    return (loadActiveEnemies?.()||[]).filter(e=>!e.removed&&!e.defeated&&Number(e.hp)>0&&Number(e.dungeonRoom||0)===Number(x.room||0)&&!e.dc200Bypassed&&!e.dc200BypassedBy?.[hero]&&(branch?e.dc200Branch===true:e.dc200Branch!==true));
  }catch(e){return []}
}

/* ------------------------------------------------------------------
   DENSITÉ : éviter les séries de salles "vides".
   On ne change pas les réglages de l'éditeur : on ajoute seulement
   une sécurité de rythme dans le runtime.
------------------------------------------------------------------- */
function history202(x){
  x.dc202History=Array.isArray(x.dc202History)?x.dc202History:[];
  return x.dc202History;
}
function classify202(kind){
  if(["enemy","ambush","boss"].includes(kind))return "combat";
  if(kind==="trap")return "trap";
  if(kind==="chest")return "loot";
  if(kind==="merchant")return "merchant";
  if(kind==="rest")return "rest";
  return "calm";
}
function recordRoom202(x){
  const h=history202(x);
  if(!h.some(e=>Number(e.room)===Number(x.room))){
    h.push({room:Number(x.room)||0,kind:String(x.last?.kind||""),type:classify202(String(x.last?.kind||""))});
    if(h.length>30)h.splice(0,h.length-30);
    save202(x);
  }
}
function recentNoCombat202(x,n=2){
  const h=history202(x).filter(e=>Number(e.room)<Number(x.room)).slice(-n);
  return h.length>=n && h.every(e=>e.type!=="combat");
}
function recentNoPuzzle202(x,n=3){
  const h=history202(x).filter(e=>Number(e.room)<Number(x.room)).slice(-n);
  return h.length>=n && h.every(e=>!e.puzzle);
}

/* ------------------------------------------------------------------
   ENNEMIS : si une salle est déclarée combat mais aucun ennemi n'existe
   réellement après génération, recréer une rencontre immédiatement.
------------------------------------------------------------------- */
function ensureEncounter202(x){
  if(!x||!["enemy","ambush","boss"].includes(String(x.last?.kind||"")))return;
  if(live202().length)return;
  try{
    if(x.last.kind==="boss")dungeonBossRoom?.(x.room);
    else dungeonEncounter?.(x.room);
  }catch(e){console.warn("Core 2.02 encounter regeneration",e)}

  try{
    const all=loadActiveEnemies?.()||[];
    all.forEach(e=>{
      if(Number(e.dungeonRoom||0)===Number(x.room||0)&&e.dc200Branch===undefined)e.dc200Branch=!!x.branch?.active;
    });
    saveActiveEnemies?.(all);
  }catch(e){}
  try{window.dungeonEnsureEnemyCells201?.()}catch(e){}
}

/* ------------------------------------------------------------------
   PIÈGES : une vraie case dans la carte, pas seulement un texte.
------------------------------------------------------------------- */
function chooseFree202(x){
  const m=x?.last?.map;if(!m||!Array.isArray(m.cells))return -1;
  const bad=new Set(["wall","void","entry","exit","enemy","chest","cache","trapdoor","stairs_down","stairs_up","puzzle","trap"]);
  const hero=new Set((x.participants||[]).filter(id=>window.DungeonSpatial313?.sameView(x,id)!==false).map(id=>Number(x.positions?.[id])).filter(Number.isInteger));
  const arr=[];
  m.cells.forEach((v,i)=>{if(!bad.has(String(v))&&!hero.has(i))arr.push(i)});
  if(!arr.length)return -1;
  return arr[Math.floor(Math.random()*arr.length)];
}
function ensureTrap202(x){
  if(!x||String(x.last?.kind)!=="trap")return;
  const m=x.last?.map;if(!m||!Array.isArray(m.cells))return;
  let idx=m.cells.findIndex(v=>String(v)==="trap");
  if(idx<0){
    idx=chooseFree202(x);
    if(idx>=0)m.cells[idx]="trap";
  }
  if(idx<0)return;

  x.last.trapCell202=idx;
  save202(x);

  let all=scene202();
  if(!all.some(e=>Number(e.room||0)===Number(x.room||0)&&e.kind==="trap"&&Number(e.cellIndex)===idx)){
    try{
      addDungeonSceneElement?.({
        kind:"trap",name:"Piège",room:x.room,cellIndex:idx,
        trapId:x.last?.trapId||"trap",detected:false,dc202:true
      });
    }catch(e){}
  }
}
function paintTrap202(){
  const x=rt202();if(!x)return;
  const cells=[...document.querySelectorAll("#dc047RoomBoard .dc047Grid > .dc047Cell")];
  cells.forEach(c=>c.classList.remove("dc202TrapVisible"));
  const detected=(scene202()||[]).filter(e=>
    e.kind==="trap" &&
    Number(e.room||0)===Number(x.room||0) &&
    e.detected===true
  );
  detected.forEach(e=>{
    const idx=Number(e.cellIndex);
    if(Number.isInteger(idx)&&cells[idx])cells[idx].classList.add("dc202TrapVisible");
  });
}

/* ------------------------------------------------------------------
   ÉNIGMES : sécurité de fréquence.
   Si 3 salles se sont succédé sans énigme, la prochaine salle non-boss
   reçoit un défi de porte si une bibliothèque est sélectionnée.
------------------------------------------------------------------- */
function selectedChallenges202(){
  try{
    const c=cfg202(),raw=Array.isArray(c.challenges)?c.challenges:null;
    const lib=(typeof loadChallengeLibrary069==="function"?loadChallengeLibrary069():JSON.parse(localStorage.getItem("gensrpg_challenge_library_v1")||"[]"))||[];
    if(raw===null)return lib.map(clone202);
    if(!raw.length)return [];
    const objects=raw.filter(x=>x&&typeof x==="object"&&x.id);
    if(objects.length)return objects.map(clone202);
    const set=new Set(raw.map(x=>String(x?.id??x)));
    return lib.filter(ch=>set.has(String(ch.id))).map(clone202);
  }catch(e){return []}
}
function ensurePuzzle202(x){
  if(!x||!x.last?.map||x.last.kind==="boss"||x.last.exitLocked)return;
  const obj=x.last.map.objective;
  if(obj?.type==="challenge"){
    const h=history202(x);const row=h.find(e=>Number(e.room)===Number(x.room));if(row)row.puzzle=true;
    save202(x);return;
  }

  const pool=selectedChallenges202();
  if(!pool.length)return;

  const c=cfg202();
  const base=Math.max(0,Math.min(100,Number(c.challengeDoorChance)||22));
  const force=recentNoPuzzle202(x,3);
  const chance=Math.max(base,32);

  if(force || Math.random()*100<chance){
    const ch=clone202(pool[Math.floor(Math.random()*pool.length)]);
    x.last.map.objective={
      type:"challenge",status:"locked",title:"Défi de la porte",
      challenge:ch,text:"Un mécanisme bloque la sortie."
    };
    x.last.objective=x.last.map.objective;
    const h=history202(x);const row=h.find(e=>Number(e.room)===Number(x.room));if(row)row.puzzle=true;
    save202(x);
  }
}

/* ------------------------------------------------------------------
   RYTHME DE RENCONTRE :
   si deux salles précédentes sans combat, la salle suivante devient
   une rencontre normale, sauf boss explicite.
------------------------------------------------------------------- */
function maybeForceCombatRoom202(x){
  if(!x||x.room<=1||x.last?.kind==="boss")return false;
  if(!recentNoCombat202(x,2))return false;
  if(["enemy","ambush"].includes(String(x.last?.kind||"")))return false;

  x.last.kind="enemy";
  x.last.title="Rencontre";
  try{
    dungeonEncounter?.(x.room);
    const all=loadActiveEnemies?.()||[];
    all.forEach(e=>{
      if(Number(e.dungeonRoom||0)===Number(x.room||0)&&e.dc200Branch===undefined)e.dc200Branch=!!x.branch?.active;
    });
    saveActiveEnemies?.(all);
  }catch(e){console.warn("Core 2.02 forced encounter",e)}

  return true;
}

/* ------------------------------------------------------------------
   Panneau d'ambiance simple pour rendre la nature de la salle lisible.
------------------------------------------------------------------- */
function roomFlavor202(x){
  let host=document.getElementById("dc202RoomFlavor");
  const board=document.getElementById("dc047RoomBoard");
  if(!board)return;
  if(!host){
    host=document.createElement("div");
    host.id="dc202RoomFlavor";
    board.insertAdjacentElement("beforebegin",host);
  }
  const kind=String(x?.last?.kind||"");
  let text="";
  if(["enemy","ambush","boss"].includes(kind))text="⚔️ Présence hostile détectée.";

<script id="dungeonCore209TacticalSense">
(function(){
"use strict";
const RT="gensrpg_dungeon_runtime_v2";
function rt(){try{return JSON.parse(localStorage.getItem(RT)||"null")}catch(e){return null}}
function save(x){if(x)localStorage.setItem(RT,JSON.stringify(x))}
function activeId(x){return String(x?.participants?.[Number(x?.index)||0]||"")}
function initials(id){
  try{
    const n=CHARS?.[id]?.name||findCustomHero?.(id)?.name||String(id);
    return n.split(/\s+/).filter(Boolean).map(v=>v[0]).join("").slice(0,2).toUpperCase()
  }catch(e){return "H"}
}
function heroAgility(id){
  try{
    const st=loadState?.(id)||{};
    const v=st?.rpgAttributes?.agilite ?? st?.rpgAttributes?.agility ??
      CHARS?.[id]?.dungeonStats?.agilite ?? CHARS?.[id]?.dungeonStats?.agility ?? 10;
    return Math.max(0,Number(v)||0)
  }catch(e){return 10}
}
function heroSense(id){
  return Math.max(1,Math.min(4,1+Math.floor(heroAgility(id)/10)))
}
function enemyDef(e){try{return activeEnemyDefinition?.(e?.enemyId)||{}}catch(_){return {}}}
function enemySense(e){
  const d=enemyDef(e),r=d?.rule||{};
  const raw=r.detection ?? r.perception ?? r.vision ?? d.detection ?? d.perception ?? d.vision;
  return Math.max(1,Math.min(5,Number(raw)||2))
}
function cells(){return [...document.querySelectorAll("#dc047RoomBoard .dc047Grid > .dc047Cell")]}
function neigh(i,size,total){
  const r=Math.floor(i/size),c=i%size,a=[];
  if(r>0)a.push(i-size);if(r<size-1)a.push(i+size);if(c>0)a.push(i-1);if(c<size-1)a.push(i+1);
  return a.filter(n=>n>=0&&n<total)
}
function blocked(v){return ["wall","void"].includes(String(v))}
function range(from,rad,map){
  const out=new Map([[from,0]]),q=[from];let qi=0;
  while(qi<q.length){
    const cur=q[qi++],d=out.get(cur)||0;if(d>=rad)continue;
    for(const n of neigh(cur,Number(map?.size)||5,map?.cells?.length||0)){
      if(out.has(n)||blocked(map.cells[n]))continue;
      out.set(n,d+1);q.push(n)
    }
  }
  return out
}
function living(x){
  const branch=!!x?.branch?.active,hero=activeId(x);
  try{
    return (loadActiveEnemies?.()||[]).filter(e=>
      !e.removed&&!e.defeated&&Number(e.hp)>0 &&
      Number(e.dungeonRoom||0)===Number(x?.room||0) &&
      !e.dc200Bypassed && !e.dc200BypassedBy?.[hero] &&
      (branch?e.dc200Branch===true:e.dc200Branch!==true)
    )
  }catch(e){return []}
}
function scene(){try{return loadDungeonSceneElements?.()||[]}catch(e){return []}}
function saveScene(a){try{saveDungeonSceneElements?.(a)}catch(e){}}

function paintAllHeroes(x,dom){
  dom.forEach(c=>{
    c.classList.remove("dc209Ally","dc209HeroDetected");
    c.querySelectorAll(".dc209AllyToken").forEach(n=>n.remove())
  });
  const cur=activeId(x);
  (x.participants||[]).forEach(id=>{
    if(window.DungeonSpatial313?.sameView(x,id)===false)return;
    const pos=Number(x.positions?.[id]);
    if(!Number.isInteger(pos)||!dom[pos])return;
    if(String(id)===cur)return; // active hero remains Core 2.00 token
    dom[pos].classList.add("dc209Ally");
    const tok=document.createElement("span");
    tok.className="dc209AllyToken";tok.textContent=initials(id);
    tok.title=(CHARS?.[id]?.name||findCustomHero?.(id)?.name||String(id));
    dom[pos].appendChild(tok)
  })
}

function detectTraps(x,dom){
  dom.forEach(c=>c.classList.remove("dc209TrapDetected"));
  const a=scene();let count=0;
  a.forEach(e=>{
    if(e.kind!=="trap"||Number(e.room||0)!==Number(x?.room||0)||e.detected!==true)return;
    const n=Number(e.cellIndex);
    if(Number.isInteger(n)&&dom[n]){dom[n].classList.add("dc209TrapDetected");count++}
  });
  return count
}

function paintEnemySense(x,dom){
  dom.forEach(c=>c.classList.remove("dc209EnemySense"));
  const map=x?.last?.map;if(!map)return [];
  const result=[];
  living(x).forEach(e=>{
    const n=Number(x.enemyCells?.[e.id]);if(!Number.isInteger(n))return;
    const r=enemySense(e),z=range(n,r,map);
    z.forEach((_,i)=>{if(dom[i])dom[i].classList.add("dc209EnemySense")});
    result.push({e,cell:n,radius:r,zone:z})
  });
  return result
}

let triggering=false;
function resolveDetection(x,zones,dom){
  if(triggering||!x||Number(x.room||0)<=0)return;
  const hid=activeId(x),hp=Number(x.positions?.[hid]);
  if(!Number.isInteger(hp))return;
  const detectors=zones.filter(z=>z.zone.has(hp));
  if(!detectors.length)return;
  if(dom[hp])dom[hp].classList.add("dc209HeroDetected");

  x.dc209Detected=x.dc209Detected||{};
  const key=String(x.room)+"|"+hid+"|"+detectors.map(z=>z.e.id).sort().join(",");
  if(x.dc209Detected[key])return;
  x.dc209Detected[key]=Date.now();save(x);

  // A spotted hero is engaged by the monsters that can actually detect them.
  if(typeof dc200StartCombat==="function"){
    triggering=true;
    setTimeout(()=>{
      try{
        dc200StartCombat(detectors.map(z=>String(z.e.id)),"detection");
      }finally{setTimeout(()=>{triggering=false},250)}
    },80)
  }
}

let ambushStarting=false;
function resolveAmbush(x){
  if(ambushStarting||!x||x.last?.kind!=="ambush"||Number(x.room||0)<=0)return;
  const live=living(x);if(!live.length)return;
  x.dc209AmbushDone=x.dc209AmbushDone||{};
  if(x.dc209AmbushDone[x.room])return;
  x.dc209AmbushDone[x.room]=true;save(x);
  if(typeof dc200StartCombat==="function"){
    ambushStarting=true;
    setTimeout(()=>{
      try{dc200StartCombat(live.map(e=>String(e.id)),"ambush")}
      finally{setTimeout(()=>{ambushStarting=false},250)}
    },120)
  }
}

function panel(x,detectedTraps,zones){
  const board=document.getElementById("dc047RoomBoard");if(!board)return;
  let p=document.getElementById("dc209SensePanel");
  if(!p){p=document.createElement("div");p.id="dc209SensePanel";board.insertAdjacentElement("beforebegin",p)}
  if(Number(x?.room||0)<=0){p.innerHTML="";p.style.display="none";return}
  p.style.display="";
  const id=activeId(x),sense=heroSense(id);
  p.innerHTML="👁️ <strong>Détection "+sense+" case"+(sense>1?"s":"")+
    "</strong> · pièges repérés : "+detectedTraps+
    " · zones rouges = portée de détection ennemie."+
    (zones.length?"":" · Aucun ennemi actif.")
}

function decorate(){
  const x=rt();if(!x)return;
  const dom=cells();
  const positional=typeof window.dc305PositionalGameplay==="function"&&window.dc305PositionalGameplay();
  if(!positional){
    dom.forEach(c=>c.classList.remove("dc209Ally","dc209TrapDetected","dc209EnemySense","dc209HeroDetected"));
    const p=document.getElementById("dc209SensePanel");if(p)p.style.display="none";
    resolveAmbush(x);
    return;
  }
  if(Number(x.room||0)<=0){
    dom.forEach(c=>c.classList.remove("dc209Ally","dc209TrapDetected","dc209EnemySense","dc209HeroDetected"));
    const p=document.getElementById("dc209SensePanel");if(p)p.style.display="none";
    return
  }
  paintAllHeroes(x,dom);
  const traps=detectTraps(x,dom);
  const zones=paintEnemySense(x,dom);
  panel(x,traps,zones);
  resolveAmbush(x);
  if(x.last?.kind!=="ambush")resolveDetection(x,zones,dom)
}

<script id="dungeonCore211Consolidation">
(function(){
"use strict";
const RT="gensrpg_dungeon_runtime_v2";

function rt(){try{return JSON.parse(localStorage.getItem(RT)||"null")}catch(e){return null}}
function saveRt211(x){if(x)localStorage.setItem(RT,JSON.stringify(x))}
function profile(){
  try{
    const p=loadGameProfiles?.().find(x=>String(x.id)===String(activeGameProfileId?.()));
    return p?.rpgUniverse?.exploration||{}
  }catch(e){return {}}
}
function scene(){try{return loadDungeonSceneElements?.()||[]}catch(e){return []}}
function saveScene(a){try{saveDungeonSceneElements?.(a)}catch(e){}}
function activeHero211(x){return String(x?.participants?.[Number(x?.index)||0]||"")}
function heroName211(id){return CHARS?.[id]?.name||findCustomHero?.(id)?.name||String(id)}
function heroImg211(id){const c=CHARS?.[id]||findCustomHero?.(id)||{};return c.image||c.avatar||""}
function initials211(id){return heroName211(id).split(/\s+/).filter(Boolean).map(v=>v[0]).join("").slice(0,2).toUpperCase()}
function esc211(v){try{return z40kEscHtml(String(v??""))}catch(e){return String(v??"")}}
function heroStat211(id,stat){
  try{
    const st=loadState?.(id)||{},c=CHARS?.[id]||findCustomHero?.(id)||{};
    const aliases={
      agility:["agilite","agility"],agilite:["agilite","agility"],
      intelligence:["intelligence"],esprit:["esprit","spirit"],spirit:["esprit","spirit"],
      force:["force"],endurance:["endurance"],initiative:["initiative"]
    };
    for(const k of aliases[stat]||[stat]){
      if(st?.rpgAttributes?.[k]!=null)return Number(st.rpgAttributes[k])||0;
      if(c?.dungeonStats?.[k]!=null)return Number(c.dungeonStats[k])||0
    }
  }catch(e){}
  return 0
}
function heroAlive211(id){
  try{return Number(dungeonCombatHeroSnapshot?.(id)?.hp)>0}catch(e){
    try{
      const st=loadState?.(id)||{};
      return (st.campaignStatus||"available")!=="dead"
    }catch(_){return true}
  }
}
function livingEnemies211(x){
  const branch=!!x?.branch?.active,hero=activeHero211(x);
  try{return (loadActiveEnemies?.()||[]).filter(e=>
    !e.removed&&!e.defeated&&Number(e.hp)>0&&
    Number(e.dungeonRoom||0)===Number(x?.room||0)&&
    !e.dc200Bypassed&&!e.dc200BypassedBy?.[hero]&&(branch?e.dc200Branch===true:e.dc200Branch!==true)
  )}catch(e){return []}
}
function enemyDef211(e){try{return activeEnemyDefinition?.(e?.enemyId)||{}}catch(_){return {}}}
function enemyRadius211(e){
  const ex=profile(),d=enemyDef211(e),r=d?.rule||{};
  const own=Number(r.perception??r.detection??r.vision??d.perception??0);
  return Math.max(1,Math.min(20,own>0?own:(Number(ex.enemyDetectionRadius)||2)))
}
function neigh211(i,size,total){
  const r=Math.floor(i/size),c=i%size,a=[];
  if(r>0)a.push(i-size);if(r<size-1)a.push(i+size);if(c>0)a.push(i-1);if(c<size-1)a.push(i+1);
  return a.filter(n=>n>=0&&n<total)
}
function blocked211(v){return ["wall","void"].includes(String(v))}
function range211(from,rad,map){
  const out=new Map([[from,0]]),q=[from];let qi=0;
  while(qi<q.length){
    const cur=q[qi++],d=out.get(cur)||0;if(d>=rad)continue;
    for(const n of neigh211(cur,Number(map?.size)||5,map?.cells?.length||0)){
      if(out.has(n)||blocked211(map.cells[n]))continue;
      out.set(n,d+1);q.push(n)
    }
  }
  return out
}
function cells211(){return [...document.querySelectorAll("#dc047RoomBoard .dc047Grid > .dc047Cell")]}

function paintHeroes211(x,dom){
  dom.forEach(c=>c.querySelectorAll(".dc211HeroToken").forEach(n=>n.remove()));
  const active=activeHero211(x);
  (x?.participants||[]).forEach(id=>{
    if(window.DungeonSpatial313?.sameView(x,id)===false)return;
    const pos=Number(x.positions?.[id]);
    if(!Number.isInteger(pos)||!dom[pos])return;
    const t=document.createElement("span");t.className="dc211HeroToken"+(String(id)===active?" active":"");
    const img=heroImg211(id);
    if(img){
      const im=document.createElement("img");im.src=img;im.alt=heroName211(id);
      im.onerror=()=>{t.innerHTML=esc211(initials211(id))};
      t.appendChild(im)
    }else t.textContent=initials211(id);
    t.title=heroName211(id)+(String(id)===active?" · ACTIF":"");
    dom[pos].appendChild(t)
  })
}

function paintTraps211(x,dom){
  dom.forEach(c=>c.classList.remove("dc211Trap"));
  let n=0;
  scene().forEach(e=>{
    if(e.kind!=="trap"||Number(e.room||0)!==Number(x?.room||0)||e.detected!==true)return;
    const i=Number(e.cellIndex);if(Number.isInteger(i)&&dom[i]){dom[i].classList.add("dc211Trap");n++}
  });
  return n
}

function trapTestState211(x,id){
  x.dc211TrapTests=x.dc211TrapTests||{};
  return x.dc211TrapTests[String(x.room)+"|"+String(id)]||null
}
function setTrapTest211(x,id,data){
  x.dc211TrapTests=x.dc211TrapTests||{};
  x.dc211TrapTests[String(x.room)+"|"+String(id)]=data;saveRt211(x)
}
window.dc211TrapTest=function(){
  const x=rt();if(!x||Number(x.room||0)<=0)return;
  const ex=profile(),id=activeHero211(x);
  if(ex.trapDetection===false)return;
  if(ex.trapDetectionOnce!==false&&trapTestState211(x,id))return;
  const stat=String(ex.trapDetectionStat||"agilite");
  const val=heroStat211(id,stat);
  const base=Math.max(0,Math.min(100,Number(ex.trapDetectionBase)||50));
  const gain=Math.max(0,Number(ex.trapDetectionStatGain)||2);
  const chance=Math.max(0,Math.min(100,Math.round(base+val*gain)));
  const roll=1+Math.floor(Math.random()*100),ok=roll<=chance;
  const radius=Math.max(1,Number(ex.trapDetectionRadius)||2),pos=Number(x.positions?.[id]),map=x.last?.map;
  let found=0;
  if(ok&&map&&Number.isInteger(pos)){
    const z=range211(pos,radius,map),a=scene();let changed=false;
    a.forEach(e=>{
      if(e.kind!=="trap"||Number(e.room||0)!==Number(x.room||0))return;
      if(z.has(Number(e.cellIndex))){if(e.detected!==true){e.detected=true;changed=true}found++}
    });
    if(changed)saveScene(a)
  }
  setTrapTest211(x,id,{roll,chance,success:ok,found,at:Date.now()});
  try{
    DungeonCore01.modal(ok?"👁️ Détection réussie":"👁️ Détection échouée",
      "<strong>"+esc211(heroName211(id))+"</strong> · "+esc211(stat)+" "+val+
      "<br>D100 : <strong>"+roll+"</strong> · chance "+chance+"%"+
      (ok?("<br><br>"+(found?("✅ "+found+" piège"+(found>1?"s":"")+" repéré"+(found>1?"s":"")+"."):"✅ Aucun piège détecté dans la portée.")):
      "<br><br>❌ Le test est consommé pour cette salle."))
  }catch(e){}
  try{DungeonCore01.render?.()}catch(e){}
}

function paintEnemySense211(x,dom){
  dom.forEach(c=>c.classList.remove("dc211EnemySense","dc211HeroSpotted"));
  const ex=profile();if(ex.enemyDetection===false||!x?.last?.map)return [];
  const zones=[];
  livingEnemies211(x).forEach(e=>{
    const c=Number(x.enemyCells?.[e.id]);if(!Number.isInteger(c))return;
    const r=enemyRadius211(e),z=range211(c,r,x.last.map);
    if(ex.enemyDetectionShowZones!==false)z.forEach((_,i)=>dom[i]?.classList.add("dc211EnemySense"));
    zones.push({e,r,z})
  });
  return zones
}

let detectBusy211=false;
function resolveEnemyDetection211(x,zones,dom){
  const ex=profile();if(ex.enemyDetection===false||detectBusy211)return;
  const heroes=(x.participants||[]).filter(id=>window.DungeonSpatial313?.sameView(x,id)!==false).filter(heroAlive211);
  const spotted=[];
  heroes.forEach(id=>{
    const pos=Number(x.positions?.[id]);if(!Number.isInteger(pos))return;
    const by=zones.filter(z=>z.z.has(pos));
    if(by.length){dom[pos]?.classList.add("dc211HeroSpotted");spotted.push({id,by})}
  });
  if(!spotted.length)return;
  x.dc211EnemyDetection=x.dc211EnemyDetection||{};
  const sig=String(x.room)+"|"+spotted.map(s=>s.id+":"+s.by.map(z=>z.e.id).sort().join(",")).sort().join("|");
  if(x.dc211EnemyDetection[sig])return;
  x.dc211EnemyDetection[sig]=Date.now();saveRt211(x);
  if(ex.enemyDetectionAutoCombat!==false&&typeof dc200StartCombat==="function"){
    const ids=[...new Set(spotted.flatMap(s=>s.by.map(z=>String(z.e.id))))];
    detectBusy211=true;
    setTimeout(()=>{try{dc200StartCombat(ids,"detection")}finally{setTimeout(()=>detectBusy211=false,250)}},80)
  }
}

function sensePanel211(x,detected,zones){
  const board=document.getElementById("dc047RoomBoard");if(!board)return;
  let p=document.getElementById("dc211SensePanel");
  if(!p){p=document.createElement("div");p.id="dc211SensePanel";board.insertAdjacentElement("beforebegin",p)}
  if(Number(x?.room||0)<=0){p.style.display="none";return}
  p.style.display="";
  const ex=profile(),id=activeHero211(x),used=trapTestState211(x,id);
  const stat=String(ex.trapDetectionStat||"agilite"),val=heroStat211(id,stat);
  const chance=Math.max(0,Math.min(100,Math.round((Number(ex.trapDetectionBase)||50)+val*(Number(ex.trapDetectionStatGain)||2))));
  p.innerHTML='<div class="dc211SenseRow"><strong>👁️ DÉTECTION</strong><span>Pièges visibles : '+detected+' · Ennemis : '+zones.length+'</span></div>'+
    (ex.trapDetection===false?'<small>Détection de pièges désactivée dans l’éditeur.</small>':
      '<div class="dc211SenseRow"><span>Pièges · '+esc211(stat)+' '+val+' · '+chance+'% · rayon '+Math.max(1,Number(ex.trapDetectionRadius)||2)+' case(s)</span>'+
      (used?'<button disabled>TEST DÉJÀ UTILISÉ</button>':'<button type="button" onclick="dc211TrapTest()">🎲 TESTER LA DÉTECTION</button>')+'</div>')+
    (ex.enemyDetection===false?'<small>Détection ennemie désactivée.</small>':
      '<small>🔴 Zone rouge = portée de perception ennemie'+(ex.enemyDetectionAutoCombat!==false?' · repérage = combat.':'.')+'</small>')
}

function puzzleAction211(x){
  const board=document.getElementById("dc047RoomBoard");if(!board)return;
  let h=document.getElementById("dc211PuzzleAction");
  if(!h){h=document.createElement("div");h.id="dc211PuzzleAction";board.insertAdjacentElement("afterend",h)}
  const obj=x?.last?.map?.objective;
  if(!obj||obj.type!=="challenge"||obj.status!=="locked"||!obj.challenge){h.innerHTML="";return}
  h.innerHTML='<button class="dc01Btn primary" type="button" onclick="dc211OpenDoorPuzzle()">🧩 EXAMINER LE MÉCANISME</button>'
}
window.dc211OpenDoorPuzzle=function(){
  const x=rt(),obj=x?.last?.map?.objective;
  if(!obj||obj.type!=="challenge"||obj.status!=="locked"||!obj.challenge)return;
  if(typeof dc201OpenPuzzle==="function")return dc201OpenPuzzle("door","");
  if(typeof dc051OpenChallenge==="function")return dc051OpenChallenge("door","");
}

function distinguishScene211(){
  document.querySelectorAll("#dc200Scene .dc200SceneCard").forEach(c=>{
    c.classList.remove("dc211MerchantCard","dc211ChestCard");
    const t=(c.textContent||"").toLowerCase();
    if(t.includes("marchand"))c.classList.add("dc211MerchantCard");
    if(t.includes("coffre"))c.classList.add("dc211ChestCard")
  })
}

function decorate211(){
  const x=rt();if(!x)return;
  const dom=cells211();
  const positional=typeof window.dc305PositionalGameplay==="function"&&window.dc305PositionalGameplay();
  if(!positional){
    dom.forEach(c=>c.classList.remove("dc211EnemySense","dc211HeroSpotted","dc211Trap"));
    const p=document.getElementById("dc211SensePanel");if(p)p.style.display="none";
    puzzleAction211(x);
    distinguishScene211();
    return;
  }
  paintHeroes211(x,dom);
  if(Number(x.room||0)<=0)return;
  const traps=paintTraps211(x,dom),zones=paintEnemySense211(x,dom);
  sensePanel211(x,traps,zones);
  puzzleAction211(x);
  distinguishScene211();
  resolveEnemyDetection211(x,zones,dom)
}

/* Combat: mains nues + recharge spécifique au héros. */
window.dc211CombatUnequip=function(heroId){
  const st=loadState(heroId);st.rightHand=null;st.leftHand=null;
  localStorage.setItem(key(heroId),JSON.stringify(st));
  if(String(current||"")===String(heroId))state=st;

    x.enemyCells[e.id]=n;claimed.add(n);m.cells[n]="enemy"
  });

  const occupied=new Set(Object.values(x.enemyCells).map(Number));
  m.cells.forEach((v,i)=>{if(String(v)==="enemy"&&!occupied.has(i))m.cells[i]="floor"});

  try{
    const all=loadActiveEnemies?.()||[];
    all.forEach(e=>{if(x.enemyCells[e.id]!==undefined)e.dungeonCell200=Number(x.enemyCells[e.id])});
    saveActiveEnemies?.(all)
  }catch(e){}
  saveRt(x)
}

function stateFor(id){try{return loadState(id)}catch(e){return null}}
function itemOf(entry){try{return getItemFromEntry(entry)}catch(e){return null}}
function equippedWeapon(id){
  const st=stateFor(id);if(!st)return {st:null,idx:null,it:null,entry:null};
  const idx=[st.rightHand,st.leftHand].find(i=>Number.isInteger(i)&&itemOf(st.inventory?.[i])?.type==="Arme");
  return {st,idx,it:Number.isInteger(idx)?itemOf(st.inventory[idx]):null,entry:Number.isInteger(idx)?st.inventory[idx]:null}
}
window.dc213Unarmed=function(id){
  const st=stateFor(id);if(!st)return;

window.dc213Reload=function(id){
  const {st,idx,it,entry}=equippedWeapon(id);if(!st||!it||!Number(it.ammoCapacity))return;
  const kind=String(it.rpgAmmoKind||"");
  const ri=st.inventory.findIndex((r,j)=>{
    if(j===idx||j===st.rightHand||j===st.leftHand)return false;
    const q=itemOf(r);if(!q)return false;
    return kind?String(q.rpgReloadKind||"")===kind:Number(q.reloads)>0
  });
  if(ri<0){alert(kind==="arrows"?"Aucun carquois de flèches disponible.":"Aucune recharge compatible.");return}
  entry.ammo=Number(it.ammoCapacity);
  const r=st.inventory[ri],q=itemOf(r);
  if(Number(r.qty)>1)r.qty=Number(r.qty)-1;
  else if(Number(r.reloads??q.reloads)>1)r.reloads=Number(r.reloads??q.reloads)-1;
  else{
    st.inventory.splice(ri,1);
    ["rightHand","leftHand"].forEach(k=>{
      if(st[k]===ri)st[k]=null;else if(Number.isInteger(st[k])&&st[k]>ri)st[k]--
    })
  }
  localStorage.setItem(key(id),JSON.stringify(st));
  if(String(current||"")===String(id))state=st;
  try{renderDungeonCombatRound()}catch(e){}
};

function ensurePuzzle213(){
  const x=rt();if(!x||Number(x.room||0)<=0||!x.last?.map||x.last.kind==="boss")return;
  const cfg=loadDungeonConfig?.()||{};
  const pool=library();if(!pool.length)return;
  const obj=x.last.map.objective;
  if(obj?.type==="challenge"){
    x.dc213LastPuzzleRoom=Number(x.room);saveRt(x);return
  }

  /* Preserve editor choice: if door puzzles are explicitly 0%, no forced puzzle. */
  const chance=Math.max(0,Number(cfg.challengeDoorChance)||0);
  if(chance<=0)return;

  const last=Number(x.dc213LastPuzzleRoom)||0;
  const drought=Number(x.room)-last>=3;
  const roll=Math.random()*100<chance;
  if(!drought&&!roll)return;

  const ch=JSON.parse(JSON.stringify(pool[Math.floor(Math.random()*pool.length)]));
  x.last.map.objective={
    type:"challenge",status:"locked",title:"Défi de la porte",
    challenge:ch,text:"Un mécanisme bloque la sortie."

<script id="dungeonCore214SingleAuthority">
(function(){
"use strict";
const RT="gensrpg_dungeon_runtime_v2";
let combatRendering=false, defeatOpen=false;

function rt(){try{return JSON.parse(localStorage.getItem(RT)||"null")}catch(e){return null}}
function saveRt(x){if(x)localStorage.setItem(RT,JSON.stringify(x))}
function boardCells(){return [...document.querySelectorAll("#dc047RoomBoard .dc047Grid > .dc047Cell")]}
function heroDef(id){return CHARS?.[id]||findCustomHero?.(id)||{}}
function heroName(id){return heroDef(id).name||String(id)}
function heroArt(id){
  const c=heroDef(id);
  if(c.image||c.avatar)return c.image||c.avatar;
  const f={dungeon_aldren:"dng_aldren.png",dungeon_lyra:"dng_lyra.png",dungeon_brom:"dng_brom.png"}[String(id)];
  return f?"assets/dungeon/creatures/"+f:""
}
function initials(id){return heroName(id).split(/\s+/).filter(Boolean).map(v=>v[0]).join("").slice(0,2).toUpperCase()}
function live(x){
  const branch=!!x?.branch?.active;
  try{
    return (loadActiveEnemies?.()||[]).filter(e=>
      !e.removed&&!e.defeated&&Number(e.hp)>0 &&
      Number(e.dungeonRoom||0)===Number(x?.room||0) &&
      !e.dc200Bypassed &&
      (branch?e.dc200Branch===true:e.dc200Branch!==true)
    )
  }catch(e){return []}
}
function enemyName(e){try{return activeEnemyDefinition?.(e.enemyId)?.name||e.name||"Ennemi"}catch(_){return e?.name||"Ennemi"}}
function forbidden(v){return ["wall","void","entry","exit","chest","cache","trap","puzzle"].includes(String(v))}

function normalizeEnemyPositions(x){
  const m=x?.last?.map;if(!m||!Array.isArray(m.cells))return;
  const enemies=live(x), validIds=new Set(enemies.map(e=>String(e.id)));
  x.enemyCells=x.enemyCells||{};

  Object.keys(x.enemyCells).forEach(id=>{
    const n=Number(x.enemyCells[id]);
    if(!validIds.has(String(id))||!Number.isInteger(n)||n<0||n>=m.cells.length)delete x.enemyCells[id]
  });

  const heroes=new Set((x.participants||[]).filter(id=>window.DungeonSpatial313?.sameView(x,id)!==false).map(id=>Number(x.positions?.[id])).filter(Number.isInteger));
  const claimed=new Set();
  enemies.forEach(e=>{
    const n=Number(x.enemyCells[e.id]);
    if(!Number.isInteger(n)||heroes.has(n)||forbidden(m.cells[n])||claimed.has(n)){
      delete x.enemyCells[e.id]
    }else claimed.add(n)
  });

  const preferred=[],free=[];
  m.cells.forEach((v,i)=>{
    if(heroes.has(i)||claimed.has(i)||forbidden(v))return;
    if(String(v)==="enemy")preferred.push(i);else free.push(i)
  });

  enemies.forEach(e=>{
    if(Number.isInteger(Number(x.enemyCells[e.id])))return;
    let n=preferred.find(i=>!claimed.has(i));
    if(!Number.isInteger(n))n=free.find(i=>!claimed.has(i));
    if(!Number.isInteger(n))return;
    x.enemyCells[e.id]=n;claimed.add(n);m.cells[n]="enemy"
  });

  const occupied=new Set(Object.values(x.enemyCells).map(Number));
  m.cells.forEach((v,i)=>{if(String(v)==="enemy"&&!occupied.has(i))m.cells[i]="floor"});

  try{
    const all=loadActiveEnemies?.()||[];
    all.forEach(e=>{if(x.enemyCells[e.id]!==undefined)e.dungeonCell200=Number(x.enemyCells[e.id])});
    saveActiveEnemies?.(all)
  }catch(e){}
  saveRt(x)
}

function paintUnits(){
  const x=rt();if(!x||Number(x.room||0)<=0)return;
  normalizeEnemyPositions(x);
  const cells=boardCells();if(!cells.length)return;

  cells.forEach(c=>{
    c.querySelectorAll(".dc209AllyToken,.dc211HeroToken,.dc212HeroToken,.dc212EnemyToken,.dc213HeroToken,.dc213EnemyToken,.dc214Hero,.dc214Enemy").forEach(n=>n.remove())
  });

  const active=String(x.participants?.[Number(x.index)||0]||"");
  const byCell={};
  (x.participants||[]).forEach(id=>{

    if(j===q.i||j===q.s.rightHand||j===q.s.leftHand)return false;
    const it=item(r);if(!it)return false;

  });
  if(ri<0){alert(kind==="arrows"?"Aucun carquois de flèches disponible.":"Aucune recharge compatible.");return}
  q.e.ammo=Number(q.it.ammoCapacity);

  else if(Number(r.reloads??reload.reloads)>1)r.reloads=Number(r.reloads??reload.reloads)-1;
  else{
    q.s.inventory.splice(ri,1);
    ["rightHand","leftHand"].forEach(k=>{

function puzzlePool(){
  try{

    const lib=loadChallengeLibrary069?.()||[];
    if(raw===null||!raw.length)return lib;
    const objs=raw.filter(x=>x&&typeof x==="object"&&x.id);
    if(objs.length)return objs;
    const ids=new Set(raw.map(x=>String(x?.id??x)));
    return lib.filter(x=>ids.has(String(x.id)))
  }catch(e){return []}

function ensurePuzzle(){
  const x=rt();if(!x||Number(x.room||0)<=0||!x.last?.map||x.last.kind==="boss")return;
  const cfg=loadDungeonConfig?.()||{}, chance=Math.max(0,Number(cfg.challengeDoorChance)||0);
  if(chance<=0)return;
  if(x.last.map.objective?.type==="challenge"){
    x.dc214LastPuzzleRoom=Number(x.room);saveRt(x);return
  }
  const pool=puzzlePool();if(!pool.length)return;
  const last=Number(x.dc214LastPuzzleRoom)||0;
  const force=Number(x.room)>=3&&Number(x.room)-last>=3;
  if(!force&&Math.random()*100>=chance)return;
  const ch=JSON.parse(JSON.stringify(pool[Math.floor(Math.random()*pool.length)]));
  x.last.map.objective={type:"challenge",status:"locked",title:"Défi de la porte",challenge:ch,text:"Un mécanisme bloque la sortie."};
  x.last.objective=x.last.map.objective;x.dc214LastPuzzleRoom=Number(x.room);saveRt(x)
}

<script id="dungeonCore301Timeline" type="application/x-gensrpg-disabled">
(function(){
"use strict";

/* Core 3.01 = base 2.14 conservée.
   Cette couche ne touche ni aux pions, ni aux coffres, ni aux énigmes,
   ni au renderer visuel 2.14. Elle répare uniquement la timeline. */

let T={sig:"",order:[],index:0,aiBusy:false,pendingHero:false};

function sig(){
  return JSON.stringify({
    h:(dungeonCombatSelection?.heroes||[]).map(String).sort(),
    e:(dungeonCombatSelection?.enemies||[]).map(String).sort()
  });
}
function heroAlive(id){
  try{return Number(dungeonCombatHeroSnapshot?.(id)?.hp)>0}catch(e){return false}
}
function enemyAlive(id){
  try{
    const e=(loadActiveEnemies?.()||[]).find(x=>String(x.id)===String(id));
    return !!e&&!e.defeated&&Number(e.hp)>0
  }catch(e){return false}
}
function build(){
  const a=[];
  (dungeonCombatSelection?.heroes||[]).forEach(id=>{
    if(!heroAlive(id))return;
    const sn=dungeonCombatHeroSnapshot?.(id)||{};
    a.push({kind:"hero",id:String(id),name:CHARS?.[id]?.name||String(id),initiative:Number(sn.initiative)||0})
  });
  try{
    (loadActiveEnemies?.()||[])
      .filter(e=>(dungeonCombatSelection?.enemies||[]).map(String).includes(String(e.id))&&!e.defeated&&Number(e.hp)>0)
      .forEach(e=>{
        const d=activeEnemyDefinition?.(e.enemyId);
        const dr=dungeonEnemyDerivedForInstance?.(e)||dungeonEnemyDerived?.(d)||{};
        a.push({kind:"enemy",id:String(e.id),name:d?.name||e.name||"Ennemi",initiative:Number(dr.initiative)||0})
      });
  }catch(e){}
  a.sort((x,y)=>y.initiative-x.initiative||(x.kind==="hero"?-1:1));
  return a;
}
function init(force=false){
  const s=sig();
  if(!force&&T.sig===s&&T.order.length)return;
  T={sig:s,order:build(),index:0,aiBusy:false,pendingHero:false};
}
function current(){
  init();
  const alive=build(), keys=new Set(alive.map(a=>a.kind+":"+a.id));
  const old=T.order[T.index];
  T.order=T.order.filter(a=>keys.has(a.kind+":"+a.id));
  alive.forEach(a=>{if(!T.order.some(b=>b.kind===a.kind&&b.id===a.id))T.order.push(a)});
  if(!T.order.length)return null;
  if(old){
    const i=T.order.findIndex(a=>a.kind===old.kind&&a.id===old.id);
    if(i>=0)T.index=i;
  }
  if(T.index>=T.order.length)T.index=0;
  return T.order[T.index]||null;
}
function resultOpen(){
  const open=id=>{
    const e=document.getElementById(id);
    if(!e)return false;
    return e.classList.contains("open") || (e.style.display && e.style.display!=="none");
  };
  return open("attackDiceModal")||open("specialDiceModal")||open("effectModal");
}
function advance(){
  if(!T.order.length)return;
  T.index=(T.index+1)%T.order.length;
  T.aiBusy=false;
  T.pendingHero=false;
  render();
}
function timelineHtml(){
  const c=current();if(!c||!T.order.length)return "";
  const idx=T.order.findIndex(a=>a.kind===c.kind&&a.id===c.id);
  const arr=[...T.order.slice(idx),...T.order.slice(0,idx)].slice(0,8);
  return '<div id="dc301Timeline" class="dungeonTimeline156">'+arr.map((a,i)=>
    '<div class="dungeonTimelineNode156 '+a.kind+' '+(i===0?'now':'')+'">'+
    '<small>'+(i===0?'MAINTENANT':'PUIS')+'</small><b>'+String(a.name)+'</b><span>⚡ '+a.initiative+'</span></div>'
  ).join("")+'</div>';
}
function applyTurnUi(){
  const host=document.getElementById("dungeonCombatSetupView");if(!host)return;
  host.querySelector("#dc301Timeline")?.remove();

    });

}

function pickTarget(){
  const hs=(dungeonCombatSelection?.heroes||[])
    .map(id=>({id:String(id),s:dungeonCombatHeroSnapshot?.(id)}))
    .filter(x=>Number(x.s?.hp)>0);

function runAi(){
  const cur=current();
  if(!cur||cur.kind!=="enemy"||T.aiBusy||T.pendingHero||resultOpen())return;
  T.aiBusy=true;

  setTimeout(()=>{
    try{
      const inst=(loadActiveEnemies?.()||[]).find(e=>String(e.id)===String(cur.id));
      if(!inst||inst.defeated||Number(inst.hp)<=0){
        T.aiBusy=false;advance();return;
      }
      const def=activeEnemyDefinition?.(inst.enemyId);
      const skills=dungeonEnemyAttackSkills?.(def)||[];
      const skill=skills[Math.floor(Math.random()*skills.length)]||skills[0];

        }catch(e){}
        rollDungeonEnemyAttackSkill?.(inst.id,skill.id,target);
      }

    setTimeout(()=>{

  },350);
}

function render(){

/* Le runtime 2.00 doit appeler cette couche, mais on conserve __dc214RenderCombat intact. */

["dungeonCombatAttack","dungeonCombatBasicAttack","dungeonCombatUseActiveTalent"].forEach(name=>{
