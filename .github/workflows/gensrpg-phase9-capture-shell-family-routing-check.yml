name: GenSrpG Phase 9 Capture Shell family routing check

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-seed-dungeon-identity-preaudit-2026-10-04'
    paths:
      - '.github/workflows/gensrpg-phase9-capture-shell-family-routing-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify runtime
        run: |
          test "$(git hash-object index.html)" = "99d7784676669b629cae6070df8c02606d67002f"
          test "$(wc -c < index.html)" = "8167187"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run focused Shell routing sentinel
        run: node tests/gens_phase9_capture_seed_without_dungeon_style_browser_characterization_v1.test.cjs
