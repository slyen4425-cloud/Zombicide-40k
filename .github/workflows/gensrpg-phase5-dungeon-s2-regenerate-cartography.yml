name: GenSrpG Phase5 Dungeon S2 regenerate cartography

on:
  push:
    branches:
      - work/gensrpg-phase5-module-screen-return-dungeon-s2-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-dungeon-s2-regenerate-cartography.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-module-screen-return-dungeon-s2-2026-09-23
          fetch-depth: 0

      - name: Verify exact Dungeon S2 runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "7b586e9fb14b7a93a0edb069e115fd6d48cbda97"
          test "$(wc -c < index.html)" = "8172500"

      - name: Regenerate exact Phase 2 cartography fingerprints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const blob='7b586e9fb14b7a93a0edb069e115fd6d48cbda97';
          for(const file of [
            'docs/GENSRPG_PHASE2_INLINE_OWNERS.json',
            'docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json',
            'docs/GENSRPG_PHASE2_STORAGE_OWNERS.json',
            'docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json'
          ]){
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            data.sourceIndexBlob=blob;
            fs.writeFileSync(file,JSON.stringify(data,null,2)+'\n');
          }

          const source=fs.readFileSync('index.html','utf8');
          const disabled=new Set([
            'dungeonCore081TacticalMovementDisabled',
            'dungeonCore084MovementRuntimeFixDisabled',
            'dungeonCore086MovementStabilityDisabled',
            'dungeonCore087InteractionRulesDisabled',
            'dungeonCore087ChestGuardDisabled',
            'dungeonCore089TacticalInteractionsDisabled',
            'dungeonCore090MovementV2Disabled',
            'dungeonCore094EndTurnFinalDisabled',
            'dungeonCore095SoloTurnFinalDisabled',
            'dungeonCore097StabilityRollbackDisabled'
          ]);
          const blockRe=/<script\b[^>]*\bid=["']([^"']+)["'][^>]*>([\s\S]*?)<\/script>/gi;
          const assignmentRe=/\bwindow\.([A-Za-z_$][\w$]*)\s*=/g;
          const chains=new Map();
          for(const match of source.matchAll(blockRe)){
            const id=match[1];
            if(disabled.has(id))continue;
            for(const hit of match[2].matchAll(assignmentRe)){
              const name=hit[1];
              if(!chains.has(name))chains.set(name,[]);
              chains.get(name).push(id);
            }
          }
          const distinctGlobals=chains.size;
          const assignments=[...chains.values()].reduce((sum,chain)=>sum+chain.length,0);
          const multiOwnerGlobals=[...chains.values()].filter(chain=>chain.length>1).length;
          const table=[
            '# GenSrpG Phase 2 — inline global last owners',
            '# sourceIndexBlob='+blob,
            '# scope=explicit window.<name> assignments in 120 active inline blocks',
            '# distinctGlobals='+distinctGlobals+' assignments='+assignments+' multiOwnerGlobals='+multiOwnerGlobals,
            '# name\tassignmentCount\tlastOwner',
            ...[...chains.keys()].sort().map(name=>{
              const chain=chains.get(name);
              return name+'\t'+chain.length+'\t'+chain.at(-1);
            })
          ].join('\n')+'\n';
          fs.writeFileSync('docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv',table);
          console.log(JSON.stringify({distinctGlobals,assignments,multiOwnerGlobals,goMenu:chains.get('goMenu')||null}));
          NODE

      - name: Commit regenerated cartography
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GenSrpG Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/GENSRPG_PHASE2_INLINE_OWNERS.json \
                  docs/GENSRPG_PHASE2_LAYERED_RESPONSIBILITIES.json \
                  docs/GENSRPG_PHASE2_STORAGE_OWNERS.json \
                  docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json \
                  docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv
          git commit -m "docs: regenerate Phase 2 cartography for Dungeon S2"
          git push origin HEAD:work/gensrpg-phase5-module-screen-return-dungeon-s2-2026-09-23
