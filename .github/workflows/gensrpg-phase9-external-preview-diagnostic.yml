name: GenSrpG Phase 9 external preview diagnostic

on:
  push:
    branches:
      - 'work/gensrpg-phase9-capture-session-start-owner-transfer-2026-10-07'
    paths:
      - '.github/workflows/gensrpg-phase9-external-preview-diagnostic.yml'

permissions:
  contents: read

jobs:
  external-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Probe RawGitHack transport
        env:
          TARGET_URL: https://raw.githack.com/slyen4425-cloud/Zombicide-40k/bf4f0aac5492dcf3e53cf92987400747969540c1/preview.html
          INDEX_URL: https://raw.githack.com/slyen4425-cloud/Zombicide-40k/bf4f0aac5492dcf3e53cf92987400747969540c1/index.html
        run: |
          set -euxo pipefail
          curl -fL --retry 2 --retry-delay 1 -D /tmp/preview.headers -o /tmp/preview.html "$TARGET_URL"
          curl -fL --retry 2 --retry-delay 1 -D /tmp/index.headers -o /tmp/index.html "$INDEX_URL"
          echo "=== preview headers ==="
          cat /tmp/preview.headers
          echo "=== index headers ==="
          cat /tmp/index.headers
          wc -c /tmp/preview.html /tmp/index.html
          grep -q 'gensrpgPreviewReady' /tmp/preview.html

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Load exact public preview
        env:
          TARGET_URL: https://raw.githack.com/slyen4425-cloud/Zombicide-40k/bf4f0aac5492dcf3e53cf92987400747969540c1/preview.html
        run: |
          mkdir -p artifacts/gensrpg-external-preview
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage']});
            const context=await browser.newContext({
              viewport:{width:412,height:915},deviceScaleFactor:2.625,isMobile:true,hasTouch:true,
              locale:'fr-FR',serviceWorkers:'block'
            });
            await context.addInitScript(()=>{window.supabase={createClient:()=>({})}});
            const page=await context.newPage();
            const errors=[];
            const consoleErrors=[];
            const requests=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
            page.on('requestfailed',r=>requests.push({url:r.url(),error:r.failure()?.errorText||''}));
            page.on('dialog',d=>d.accept().catch(()=>{}));
            const response=await page.goto(process.env.TARGET_URL,{waitUntil:'domcontentloaded',timeout:60000});
            let ready=false;
            try{
              await page.waitForFunction(()=>document.documentElement?.dataset?.gensrpgPreviewReady==='1',null,{timeout:30000});
              ready=true;
            }catch(_){}
            const state=await page.evaluate(()=>({
              title:document.title,
              ready:document.documentElement?.dataset?.gensrpgPreviewReady||'',
              bodyText:(document.body?.innerText||'').slice(0,500),
              bodyHtmlLength:document.body?.innerHTML?.length||0,
              rootDisplay:document.getElementById('gensRootHome')?getComputedStyle(document.getElementById('gensRootHome')).display:'missing',
              status:document.getElementById('status')?.innerText||'',
              captureEntry:typeof window.GensCaptureV1,
              captureSessionOwner:typeof window.GensCaptureSessionStartV1
            }));
            console.log(JSON.stringify({
              httpStatus:response?.status()||null,
              url:page.url(),ready,state,errors,consoleErrors,requestFailures:requests.slice(0,30)
            },null,2));
            await page.screenshot({path:'artifacts/gensrpg-external-preview/mobile.png',fullPage:true});
            await context.close();await browser.close();
            if(!ready||errors.length||consoleErrors.length)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gensrpg-external-preview-diagnostic
          path: artifacts/gensrpg-external-preview/
          if-no-files-found: ignore
