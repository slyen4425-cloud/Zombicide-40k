name: Capture v2 clean ownership boundary
on:
  push:
    branches:
      - 'work/gensrpg-capture-clean-replacement-*'
  pull_request:
    paths:
      - 'assets/gensrpg/capture-v2/**'
      - 'index.html'
      - 'tests/gens_capture_v2_clean_boundary.test.cjs'
      - 'tests/gens_capture_v2_root_browser.test.cjs'
      - '.github/workflows/main.yml'
      - '.github/workflows/capture-v2-clean-base.yml'
permissions:
  contents: read
jobs:
  clean-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse the two new Capture-only modules
        run: |
          node --check assets/gensrpg/capture-v2/identity-v1.js
          node --check assets/gensrpg/capture-v2/shell-entry-v1.js
      - name: Verify real GenSrpg root and both official sources (TDD RED first)
        run: node --test tests/gens_capture_v2_clean_boundary.test.cjs

  root-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read official Combat from main at its certified SHA
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/GenSrpg_labo_combat_dynamique
          ref: 248f718ec924106d16999d59e5dc8310f8450180
          path: combat-lab
          sparse-checkout: |
            src
            data
            examples/dom-demo
      - name: Read official Exploration from main at its certified SHA
        uses: actions/checkout@v4
        with:
          repository: slyen4425-cloud/laboratoire_dynamique_exploration-
          ref: 474aa42674c9bd976a8a5a8af684d65cbe848b61
          path: exploration-lab
          sparse-checkout: |
            src
            assets
            index.html
            builder.html
            world-assembler.html
            sculpt-lab.html
      - name: Assemble original Lab modules without any GenSrpg engine copy
        run: |
          test "$(git -C combat-lab rev-parse HEAD)" = "248f718ec924106d16999d59e5dc8310f8450180"
          test "$(git -C exploration-lab rev-parse HEAD)" = "474aa42674c9bd976a8a5a8af684d65cbe848b61"
          mkdir -p _site/vendor/combat-lab _site/vendor/exploration-lab
          cp -a combat-lab/src combat-lab/data combat-lab/examples _site/vendor/combat-lab/
          cp -a exploration-lab/src exploration-lab/assets _site/vendor/exploration-lab/
          cp exploration-lab/index.html exploration-lab/builder.html exploration-lab/world-assembler.html exploration-lab/sculpt-lab.html _site/vendor/exploration-lab/
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium
      - name: Run real four-mode GenSrpg root in Chromium landscape
        run: node --test tests/gens_capture_v2_root_browser.test.cjs
