name: GenSrpG one-shot Core2 movement seam

on:
  push:
    branches:
      - work/gensrpg-dungeon-movement-events-2026-09-19
    paths:
      - .github/workflows/gensrpg-one-shot-index-seam-2026-09-19.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Core2 post-movement seam
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text()
          old="""} function moveTo(idx){const x=rt();if(!x||!tactical()||!canAct(x))return false;const id=activeHero(x),from=position(id,x),rem=Math.max(0,Number(x.remaining?.[id])||0),d=distanceMap(from,x.last.map,rem,x).get(Number(idx));if(!Number.isFinite(d)||d<=0||d>rem)return false;x.positions[id]=Number(idx);x.remaining[id]=rem-d;saveRt(x);render();handleCell(x,Number(idx));return true}"""
          new="""} function moveTo(idx){const x=rt();if(!x||!tactical()||!canAct(x))return false;const id=activeHero(x),from=position(id,x),rem=Math.max(0,Number(x.remaining?.[id])||0),d=distanceMap(from,x.last.map,rem,x).get(Number(idx));if(!Number.isFinite(d)||d<=0||d>rem)return false;x.positions[id]=Number(idx);x.remaining[id]=rem-d;saveRt(x);render();handleCell(x,Number(idx));try{window.DungeonAuthoredActionFix167857?.syncActions?.()}catch(e){console.warn('DC200 authored post-move actions',e)}try{window.GensRpgTacticalRuntimeAuthority1678113?.scanDetection?.(window,'movement-detection-v113',true)}catch(e){console.warn('DC200 post-move detection',e)}return true}"""
          count=s.count(old)
          if count != 1:
              raise SystemExit(f"Expected exactly one Core2 moveTo seam, found {count}")
          p.write_text(s.replace(old,new))
          PY
      - name: Commit patched index only
        shell: bash
        run: |
          git config user.name "gensrpg-ci"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: connect Core 2.00 post-movement consumers"
          git push origin "HEAD:${GITHUB_REF_NAME}"
