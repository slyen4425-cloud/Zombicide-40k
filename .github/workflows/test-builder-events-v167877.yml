name: Test Builder Events V16.78.96
on:
  push:
    branches:
      - main
      - work/v16.78.96-dynamic-hero-editor
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le module unique de stats V16.78.95
        run: node --check assets/gensrpg/gens-rpg-stats-clean-167874.js
      - name: Vérifier le bridge visuel V16.78.93
        run: node --check assets/gensrpg/gens-dungeon-hero-art-repair-167874.js
      - name: Vérifier l’éditeur héros dynamique V16.78.96
        run: node --check assets/gensrpg/gens-hero-editor-dynamic-167896.js
      - name: Tester le nettoyage de l’éditeur RPG
        run: node tests/gens_editor_cleanup_v167893.test.cjs
      - name: Tester l’autorité unique du moteur de stats
        run: node tests/gens_stat_engine_cleanup_v167894.test.cjs
      - name: Tester création, effets, sauvegarde et rechargement des stats
        run: node tests/gens_clean_stats_rebuild_v167890.test.cjs
      - name: Tester le raccordement des stats au renderer Dungeon existant
        run: node tests/gens_clean_stats_runtime_link_v167892.test.cjs
      - name: Tester les caractéristiques dynamiques existantes
        run: node tests/gens_clean_dynamic_stats_v167873.test.cjs
      - name: Tester Défense, Armure et Mouvement natifs
        run: node tests/gens_native_defense_armor_movement_v167895.test.cjs
      - name: Tester l’éditeur de héros entièrement dynamique
        run: node tests/gens_dynamic_hero_editor_v167896.test.cjs
      - name: Tester les cases événement configurables et leur surbrillance
        run: node tests/dungeon_authored_event_cells_v167877.test.cjs
      - name: Tester la sortie finale sans faux positif sur les caches secondaires
        run: node tests/dungeon_authored_final_exit_v167878.test.cjs
      - name: Tester la proximité Embuscade et Renforts
        run: node tests/dungeon_event_ambush_position_v167878.test.cjs
      - name: Tester le runtime Dungeon complet
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Tester le moteur authored et la vraie case de sortie finale
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Tester le contenu exact par zone
        run: node tests/dungeon_zone_content_v167824.test.cjs
      - name: Tester le créateur de pièces
        run: node tests/dungeon_room_creator_v1.test.cjs
