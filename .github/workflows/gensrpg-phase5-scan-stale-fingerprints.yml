name: GenSrpG Phase5 scan stale runtime fingerprints

on:
  push:
    branches:
      - work/gensrpg-phase5-module-screen-return-raccord-2026-09-23
    paths:
      - .github/workflows/gensrpg-phase5-scan-stale-fingerprints.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase5-module-screen-return-raccord-2026-09-23
          fetch-depth: 0
      - name: List stale exact runtime fingerprints
        shell: bash
        run: |
          set -euo pipefail
          echo "=== OLD BLOB REFERENCES ==="
          grep -RIl --exclude='index.html' '0c15b1dba66ce83f2b27ed99e371885fb1d0ed75' tests docs assets .github || true
          echo "=== OLD SIZE REFERENCES ==="
          grep -RIl --exclude='index.html' '8170961' tests docs assets .github || true
