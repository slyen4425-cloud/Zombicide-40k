name: GenSrpG one-shot Survival skill library fingerprint alignment

on:
  push:
    branches:
      - work/gensrpg-phase6-survival-skill-library-2026-09-25
    paths:
      - .github/workflows/gensrpg-phase6-survival-skill-library-fingerprint-one-shot.yml

permissions:
  contents: write

jobs:
  align-fingerprints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/gensrpg-phase6-survival-skill-library-2026-09-25
          fetch-depth: 0

      - name: Align exact runtime fingerprints only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          old_blob="afc271f9e038f77c5c78caa9f4445d0e49eaea5d"
          new_blob="9c762dcb8ad3549cf7175ba9413f925b11f5396c"
          old_size="8169047"
          new_size="8170815"

          changed=[]

          # Tests: only files that explicitly lock the previous exact blob.
          for p in sorted(Path("tests").glob("*.cjs")):
              text=p.read_text(encoding="utf-8")
              if old_blob not in text:
                  continue
              updated=text.replace(old_blob,new_blob)
              if old_size in updated:
                  updated=updated.replace(old_size,new_size)
              if updated==text:
                  raise SystemExit(f"{p}: expected fingerprint-only change")
              p.write_text(updated,encoding="utf-8")
              changed.append(str(p))

          # Descriptive/current-source cartographies only. Historical narrative docs are untouched.
          docs=[
            Path("docs/GENSRPG_PHASE2_INLINE_OWNERS.json"),
            Path("docs/GENSRPG_PHASE2_INLINE_GLOBAL_LAST_OWNERS.tsv"),
            Path("docs/GENSRPG_PHASE2_STORAGE_OWNERS.json"),
            Path("docs/GENSRPG_PHASE2_TIMER_CLASSIFICATION.json"),
          ]
          for p in docs:
              text=p.read_text(encoding="utf-8")
              if old_blob not in text:
                  continue
              updated=text.replace(old_blob,new_blob)
              if old_size in updated:
                  updated=updated.replace(old_size,new_size)
              p.write_text(updated,encoding="utf-8")
              changed.append(str(p))

          if not changed:
              raise SystemExit("No previous runtime fingerprints found to align")

          # Guard: do not mutate source/runtime in this alignment step.
          forbidden=[p for p in changed if not (p.startswith("tests/") or p.startswith("docs/"))]
          if forbidden:
              raise SystemExit(f"Unexpected non-test/doc changes: {forbidden}")

          print("Aligned fingerprint-only files:",len(changed))
          for p in changed: print(p)
          PY

      - name: Commit fingerprint alignment and remove one-shot
        shell: bash
        run: |
          rm .github/workflows/gensrpg-phase6-survival-skill-library-fingerprint-one-shot.yml
          git config user.name "gensrpg-architecture-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A tests docs .github/workflows/gensrpg-phase6-survival-skill-library-fingerprint-one-shot.yml
          git diff --cached --stat
          git commit -m "test: align fingerprints after Survival skill library fix"
          git push origin HEAD:work/gensrpg-phase6-survival-skill-library-2026-09-25
