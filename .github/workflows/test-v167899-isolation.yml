name: Test V16.78.99 RPG Stat Isolation

on:
  push:
    branches:
      - work/dungeon-v16.78.99-shared-stat-service

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared stat service and mode isolation
        run: node tests/gens_stat_service_v167899.test.cjs
      - name: Test stat grid integration
        run: node tests/gens_native_stat_grid_v167890.test.cjs
      - name: Test legacy effects compatibility
        run: node tests/gens_custom_stat_effects_v167881.test.cjs
      - name: Test final stat bridge
        run: node tests/gens_custom_stat_runtime_profile_v167889.test.cjs
      - name: Test Dungeon runtime regression
        run: node tests/dungeon_runtime_regression.test.cjs
      - name: Test authored Dungeon runtime separately
        run: node tests/dungeon_authored_runtime_v167839.test.cjs
      - name: Test UI recovery baseline
        run: node tests/gens_ui_recovery_v167843.test.cjs
      - name: Check stat modules do not own mode navigation
        run: |
          ! grep -Eq 'openCapture|startCapture|captureScreen|openHome|homeScreen|DungeonAuthoredRuntime[[:space:]]*=' assets/gensrpg/gens-stat-service-167899.js
          ! grep -Eq 'openCapture|startCapture|captureScreen|openHome|homeScreen' assets/gensrpg/gens-custom-stats-167881.js
          ! grep -Eq 'openCapture|startCapture|captureScreen|openHome|homeScreen' assets/gensrpg/gens-custom-stat-runtime-profile-167889.js

      - name: Build final page like production
        run: |
          rm -rf _site
          mkdir -p _site
          if [ -f "Z40K_GITHUB_PAGES_READY.zip" ]; then unzip -o Z40K_GITHUB_PAGES_READY.zip -d _site; fi
          cp -f index.html _site/index.html
          python3 tools/patch_generic_stat_grid_v167890.py _site/index.html
          [ ! -f manifest.webmanifest ] || cp -f manifest.webmanifest _site/manifest.webmanifest
          [ ! -f manifest.json ] || cp -f manifest.json _site/manifest.json
          [ ! -f service-worker.js ] || cp -f service-worker.js _site/service-worker.js
          if [ -d assets ]; then mkdir -p _site/assets; cp -R assets/. _site/assets/; fi

      - name: Inject production module order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index=Path('_site/index.html')
          modules=[
            (Path('_site/assets/dungeon/dungeon-core-318.js'),'<script src="assets/dungeon/dungeon-core-318.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-large-room-support-167834.js'),'<script src="assets/dungeon/dungeon-large-room-support-167834.js?v=167836"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-100.js'),'<script src="assets/dungeon/dungeon-room-creator-100.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-v2-167819.js'),'<script src="assets/dungeon/dungeon-room-creator-v2-167819.js?v=167819"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-creator-feedback-167821.js'),'<script src="assets/dungeon/dungeon-room-creator-feedback-167821.js?v=167821"></script>'),
            (Path('_site/assets/dungeon/dungeon-world-builder-167821.js'),'<script src="assets/dungeon/dungeon-world-builder-167821.js?v=167821"></script>'),
            (Path('_site/assets/dungeon/dungeon-room-runtime-167822.js'),'<script src="assets/dungeon/dungeon-room-runtime-167822.js?v=167822"></script>'),
            (Path('_site/assets/dungeon/dungeon-world-runtime-167823.js'),'<script src="assets/dungeon/dungeon-world-runtime-167823.js?v=167838"></script>'),
            (Path('_site/assets/dungeon/dungeon-zone-content-167824.js'),'<script src="assets/dungeon/dungeon-zone-content-167824.js?v=167824"></script>'),
            (Path('_site/assets/dungeon/dungeon-authored-runtime-167839.js'),'<script src="assets/dungeon/dungeon-authored-runtime-167839.js?v=167840"></script>'),
            (Path('_site/assets/dungeon/dungeon-authored-cache-visual-167852.js'),'<script src="assets/dungeon/dungeon-authored-cache-visual-167852.js?v=167870"></script>'),
            (Path('_site/assets/dungeon/dungeon-grid-flicker-guard-167876.js'),'<script src="assets/dungeon/dungeon-grid-flicker-guard-167876.js?v=167876"></script>'),
            (Path('_site/assets/dungeon/dungeon-enemy-target-randomizer-167878.js'),'<script src="assets/dungeon/dungeon-enemy-target-randomizer-167878.js?v=167878"></script>'),
            (Path('_site/assets/dungeon/dungeon-equipment-ui.js'),'<script src="assets/dungeon/dungeon-equipment-ui.js"></script>'),
            (Path('_site/assets/dungeon/dungeon-equipment-hotfix-167817.js'),'<script src="assets/dungeon/dungeon-equipment-hotfix-167817.js?v=167817"></script>'),
            (Path('_site/assets/dungeon/dungeon-set-editor-167818.js'),'<script src="assets/dungeon/dungeon-set-editor-167818.js?v=167818"></script>'),
            (Path('_site/assets/gensrpg/gens-world-summary-167820.js'),'<script src="assets/gensrpg/gens-world-summary-167820.js?v=167820"></script>'),
            (Path('_site/assets/gensrpg/gens-custom-stats-167881.js'),'<script src="assets/gensrpg/gens-custom-stats-167881.js?v=167881"></script>'),
            (Path('_site/assets/gensrpg/gens-stat-rules-help-167880.js'),'<script src="assets/gensrpg/gens-stat-rules-help-167880.js?v=167880"></script>'),
            (Path('_site/assets/gensrpg/gens-stat-help-extension-167881.js'),'<script src="assets/gensrpg/gens-stat-help-extension-167881.js?v=167881"></script>'),
            (Path('_site/assets/gensrpg/gens-custom-stat-runtime-profile-167889.js'),'<script src="assets/gensrpg/gens-custom-stat-runtime-profile-167889.js?v=167889"></script>'),
          ]
          html=index.read_text(encoding='utf-8')
          if '</body>' not in html: raise SystemExit('missing </body>')
          for module,tag in modules:
            if not module.exists(): raise SystemExit('missing '+str(module))
            if tag not in html: html=html.replace('</body>',tag+'\n</body>')
          index.write_text(html,encoding='utf-8')
          PY

      - name: Validate production-built page
        run: |
          node tests/gens_stat_service_v167899.test.cjs _site/index.html
          node tests/gens_native_stat_grid_v167890.test.cjs _site/index.html
          node tests/gens_custom_stat_effects_v167881.test.cjs _site/index.html
          node tests/gens_custom_stat_runtime_profile_v167889.test.cjs _site/index.html
          node tests/dungeon_final_load_regression.test.cjs _site/index.html
          node tests/dungeon_authored_runtime_v167839.test.cjs _site/index.html
          grep -q 'gens-stat-service-167899.js?v=167899' _site/index.html
          grep -q 'gens-custom-stats-167881.js?v=167881' _site/index.html
          grep -q 'gens-custom-stat-runtime-profile-167889.js?v=167889' _site/index.html
          grep -q 'gensUnifiedStatGridV167890' _site/index.html
          grep -q 'gensrpg-cache-16.78.99-shared-stat-service' _site/service-worker.js
