<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenSrpG diagnostic réseau</title><style>body{font-family:system-ui;background:#111;color:#eee;padding:20px}h1{font-size:20px}.row{padding:12px;margin:10px 0;border:1px solid #444;border-radius:10px}.wait{color:#f6c85f}.ok{color:#73d673}.bad{color:#ff7b7b}small{display:block;color:#aaa;margin-top:6px}</style></head><body><h1>GenSrpG — diagnostic réseau</h1><div id="jsd" class="row wait">jsDelivr : test en cours…</div><div id="unp" class="row wait">unpkg : test en cours…</div><div id="info" class="row">Cette page ne charge pas GenSrpG et ne touche à aucune sauvegarde.</div><script>
function test(id,url){const el=document.getElementById(id);const s=document.createElement('script');let done=false;const t=setTimeout(()=>finish(false,'timeout > 8 s'),8000);function finish(ok,msg){if(done)return;done=true;clearTimeout(t);el.className='row '+(ok?'ok':'bad');el.innerHTML=(ok?'✅ ':'❌ ')+(id==='jsd'?'jsDelivr':'unpkg')+' : '+msg+'<small>'+url+'</small>';try{s.remove()}catch(e){}}s.onload=()=>finish(true,'répond correctement');s.onerror=()=>finish(false,'échec de chargement');s.src=url+(url.includes('?')?'&':'?')+'diag='+Date.now();document.head.appendChild(s)}
test('jsd','https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js');test('unp','https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js');
</script></body></html>
